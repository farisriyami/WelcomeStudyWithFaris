<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>UTAS Course Quizzes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style id="page-css">
/* Layout: one centred column. A course home lists chapter cards; each chapter quiz is a ticket-style card with a perforated tear line before the feedback. */
:root {
  --bg: #edf2f3;
  --surface: #ffffff;
  --field: #f6f9f9;
  --ink: #13232a;
  --muted: #56686f;
  --line: #d2dcdf;
  --accent: #0c6a70;
  --accent-ink: #ffffff;
  --accent-soft: #dcefef;
  --good: #1d7741;
  --good-soft: #e1f2e7;
  --bad: #b2352b;
  --bad-soft: #f9e3e0;
  --warn: #9a6200;
  --shadow: 0 1px 2px rgba(19, 35, 42, .06), 0 8px 24px rgba(19, 35, 42, .06);
  --bar-shadow: 0 -6px 20px rgba(19, 35, 42, .08);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171b; --surface: #16232a; --field: #0f1b20; --ink: #e3edef; --muted: #92a6ac; --line: #2a3c43;
    --accent: #52b9b9; --accent-ink: #061a1c; --accent-soft: #15383b;
    --good: #5cc78b; --good-soft: #15301f; --bad: #f07e73; --bad-soft: #3b1d1a; --warn: #e2a845;
    --shadow: none; --bar-shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171b; --surface: #16232a; --field: #0f1b20; --ink: #e3edef; --muted: #92a6ac; --line: #2a3c43;
  --accent: #52b9b9; --accent-ink: #061a1c; --accent-soft: #15383b;
  --good: #5cc78b; --good-soft: #15301f; --bad: #f07e73; --bad-soft: #3b1d1a; --warn: #e2a845;
  --shadow: none; --bar-shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 32px calc(64px + var(--dock-h, 0px));
  -webkit-tap-highlight-color: transparent;
}
button, .pill, summary { touch-action: manipulation; }
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }
.top { display: grid; gap: 14px; min-width: 0; }
#app { display: grid; gap: 18px; min-width: 0; }
.muted { color: var(--muted); font-weight: 400; }

header { display: grid; gap: 6px; }
.eyebrow, .meta, .label, .mono, .cc-label {
  font-family: var(--font-mono);
  font-size: .72rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.6rem, 5vw, 2.25rem);
  line-height: 1.1;
  letter-spacing: -.01em;
  margin: 0;
  text-wrap: balance;
}
h1:focus { outline: none; }
.intro { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
.backlink {
  font: inherit; font-weight: 600; font-size: .95rem; color: var(--accent);
  background: none; border: 0; padding: 4px 0; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; width: fit-content;
}

/* Tabs (courses on the home screen, quiz/manage inside a chapter) */
.tabs {
  display: flex; gap: 4px; padding: 4px; width: fit-content; max-width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.tab {
  font: inherit; font-weight: 600; font-size: .95rem; color: var(--muted);
  background: transparent; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
}
@media (hover: hover) { .tab:hover { color: var(--ink); } }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tab .count {
  font-family: var(--font-mono); font-size: .72rem; padding: 1px 6px; border-radius: 5px;
  background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums;
}
.tab[aria-selected="true"] .count { background: var(--accent-ink); color: var(--accent); }

/* Course home */
.course-head { display: grid; gap: 2px; }
.course-head h2 { font-weight: 700; }
.course-head p { margin: 0; }
.chapters { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.chapter-card {
  width: 100%; text-align: left; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); padding: 16px 18px; cursor: pointer;
  display: flex; align-items: center; gap: 14px;
  transition: border-color .15s;
}
@media (hover: hover) { .chapter-card:hover { border-color: var(--accent); } }
.chapter-card:active { border-color: var(--accent); }
.cc-main { flex: 1; min-width: 0; display: grid; gap: 4px; }
.cc-label { color: var(--accent); }
.cc-name { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; line-height: 1.25; }
.cc-meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px;
  font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums;
}
.st {
  font-family: var(--font-mono); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor;
}
.st-good { color: var(--good); }
.st-warn { color: var(--warn); }
.st-bad { color: var(--bad); }
.st-prog { color: var(--accent); }
.st-none { color: var(--muted); }
.cc-arrow { flex: none; color: var(--accent); font-size: 1.25rem; }
.chapter-card.is-del .cc-name { text-decoration: line-through; opacity: .6; }
.addch { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 12px; }
.addch .field { flex: 1 1 240px; }
.danger-zone { display: flex; justify-content: flex-end; }

/* Progress strip */
.status { display: grid; gap: 10px; }
.ticks { display: grid; gap: 3px; }
.ticks span { height: 7px; border-radius: 2px; background: var(--line); }
.ticks .good { background: var(--good); }
.ticks .bad { background: var(--bad); }
.ticks .now { background: var(--accent); }
.status-row {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px;
  font-size: .95rem; color: var(--muted); font-variant-numeric: tabular-nums;
}
.status-row b { color: var(--ink); }
.status-right { display: flex; align-items: center; gap: 14px; }
.linkbtn {
  font: inherit; font-size: .9rem; color: var(--accent); background: none; border: 0; padding: 2px 0;
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}

/* Ticket card */
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
  min-width: 0;
}
.q-head { padding: 22px 24px 18px; display: grid; gap: 10px; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; }
.meta .topic { color: var(--accent); }
h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.2rem, 3.6vw, 1.45rem);
  line-height: 1.3;
  margin: 0;
  text-wrap: balance;
}
h2:focus { outline: none; }
.q-head p { margin: 0; }

.options { padding: 0 24px 24px; display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px;
  width: 100%; text-align: left;
  font: inherit; color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  cursor: pointer;
  transition: border-color .15s, background-color .15s;
}
@media (hover: hover) { .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); } }
.opt:active:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:focus-visible, .btn:focus-visible, .linkbtn:focus-visible, .tab:focus-visible, .backlink:focus-visible,
.chapter-card:focus-visible, summary:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
.key {
  flex: none;
  width: 30px; height: 30px; display: grid; place-items: center;
  font-family: var(--font-mono); font-size: .8rem;
  border: 1.5px solid var(--line); border-radius: 7px; color: var(--muted);
}
.txt { flex: 1; min-width: 0; }
.tag {
  display: block; width: fit-content; margin-top: 6px;
  font-family: var(--font-mono); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 7px; border-radius: 5px;
}
.opt:disabled { cursor: default; }
.opt.is-right { border-color: var(--good); background: var(--good-soft); }
.opt.is-right .key { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.is-right .tag { color: var(--good); border: 1px solid var(--good); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-wrong .key { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.is-wrong .tag { color: var(--bad); border: 1px solid var(--bad); }
.opt.is-dim { opacity: .55; }

/* Tear line with punched notches */
.tear { position: relative; border-top: 2px dashed var(--line); }
.tear::before, .tear::after {
  content: ""; position: absolute; top: -12px;
  width: 22px; height: 22px; border-radius: 50%; background: var(--bg);
}
.tear::before { left: -11px; }
.tear::after { right: -11px; }

.feedback { display: grid; gap: 14px; padding: 22px 24px 24px; }
.verdict {
  margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem;
  display: flex; align-items: center; gap: 10px;
}
.verdict .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.ok .verdict { color: var(--good); }
.ok .verdict .dot { background: var(--good); }
.no .verdict { color: var(--bad); }
.no .verdict .dot { background: var(--bad); }
.answer-line { margin: -6px 0 0; }
.def {
  background: var(--accent-soft);
  border-radius: 10px;
  padding: 14px 16px;
  display: grid; gap: 6px;
}
.def .label { color: var(--accent); }
.def p { margin: 0; max-width: 65ch; }

.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.btn {
  font: inherit; font-weight: 600; font-size: 1rem;
  border-radius: 10px; padding: 11px 20px; cursor: pointer;
  border: 1.5px solid var(--accent);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.secondary { background: transparent; color: var(--accent); }
.btn.small { font-size: .9rem; padding: 7px 14px; border-radius: 8px; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--line); }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--line); }
@media (hover: hover) {
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn.secondary:hover:not(:disabled) { background: var(--accent-soft); }
  .btn.danger:hover { border-color: var(--bad); background: var(--bad-soft); }
  .btn.ghost:hover { border-color: var(--accent); background: var(--accent-soft); }
}
.btn:disabled { opacity: .6; cursor: default; }
.hint { font-size: .88rem; color: var(--muted); }
.hint kbd {
  font-family: var(--font-mono); font-size: .75rem;
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
}
@media (hover: none) { .hint { display: none; } }

/* Results */
.score-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; }
.pct {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(3.6rem, 14vw, 5rem); line-height: 1; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}
.pct:focus { outline: none; }
.pct small { font-size: .45em; margin-left: 2px; }
.pct.band-good { color: var(--good); }
.pct.band-warn { color: var(--warn); }
.pct.band-bad { color: var(--bad); }
.score-text { display: grid; gap: 2px; min-width: 0; flex: 1 1 220px; }
.score-text p { margin: 0; }
.score-line { font-size: 1.15rem; }
.band-msg { color: var(--muted); }

.block { display: grid; gap: 12px; padding: 22px 24px 4px; }
h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
.topics { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.topics li {
  display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 3.2rem;
  align-items: center; gap: 12px; font-size: .95rem;
}
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 4px; }
.bar .good { background: var(--good); }
.bar .warn { background: var(--warn); }
.bar .bad { background: var(--bad); }
.frac { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

.misses { display: grid; gap: 8px; }
.miss { border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; }
.miss summary {
  cursor: pointer; padding: 12px 0; display: flex; gap: 10px; align-items: baseline;
  list-style: none;
}
.miss summary::-webkit-details-marker { display: none; }
.miss summary::before {
  content: "+"; font-family: var(--font-mono); color: var(--accent); flex: none; width: 1ch;
}
.miss[open] summary::before { content: "\2212"; }
.miss summary .mono { flex: none; }
.miss .body { display: grid; gap: 8px; padding: 0 0 14px; }
.miss dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; }
.miss dt { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.miss dd { margin: 0; font-weight: 600; }
.miss dd.bad-t { color: var(--bad); }
.miss dd.good-t { color: var(--good); }
.miss .body p { margin: 0; color: var(--muted); }
.perfect { margin: 0; color: var(--good); font-weight: 600; }
.results .actions { padding: 22px 24px 24px; }
.q-head .actions { padding: 6px 0 0; }

/* Manage questions */
.notice {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
  background: var(--accent-soft); border-radius: 12px; padding: 14px 16px;
}
.notice p { margin: 0; flex: 1 1 260px; min-width: 0; }
.form { padding: 0 24px 24px; display: grid; gap: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
fieldset.field { border: 0; padding: 0; margin: 0; }
.field legend { padding: 0; margin-bottom: 6px; }
.flabel { font-weight: 600; font-size: .95rem; }
input[type="text"], input[type="search"], input[type="password"], textarea {
  width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
  background: var(--field); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
textarea { resize: vertical; min-height: 3.2em; }
input[type="text"]:focus-visible, input[type="search"]:focus-visible, input[type="password"]:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
}
::placeholder { color: var(--muted); opacity: .8; }
.wrong-grid { display: grid; gap: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 14px;
  font-weight: 600; font-size: .95rem;
}
.pill input { accent-color: var(--accent); margin: 0; }
.pill:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.pill:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.form-msg { margin: 0; font-weight: 600; }
.form-msg:empty { display: none; }
.form-msg.is-error { color: var(--bad); }
.form-msg.is-ok { color: var(--good); }

.list-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.list-tools input { width: min(100%, 260px); }
.qlist { list-style: none; margin: 0; padding: 0 24px 10px; }
.qrow { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--line); }
.qrow-main { flex: 1; min-width: 0; display: grid; gap: 4px; }
.qrow-q { margin: 0; font-weight: 600; }
.qrow-a { margin: 0; font-size: .95rem; color: var(--muted); }
.qrow-a b { color: var(--good); }
.qrow-d {
  margin: 0; font-size: .9rem; color: var(--muted);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.qrow.is-del .qrow-q, .qrow.is-del .qrow-a, .qrow.is-del .qrow-d { text-decoration: line-through; opacity: .6; }
.qrow .btn { flex: none; }
.badge {
  font-family: var(--font-mono); font-size: .64rem; letter-spacing: .06em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 4px; border: 1px solid currentColor;
}
.badge.new { color: var(--accent); }
.badge.del { color: var(--bad); }
.qempty { padding: 18px 0; border-top: 1px solid var(--line); color: var(--muted); }

.why {
  background: var(--field); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; display: grid; gap: 6px;
}
.why .label { color: var(--ink); }
.why p { margin: 0; max-width: 65ch; }

/* Written practice */
.note-field { padding: 0 24px 22px; display: grid; gap: 8px; }
.note-field textarea { min-height: 7.5em; }
.model { background: var(--good-soft); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; }
.model .label { color: var(--good); }
.model p { margin: 0; max-width: 65ch; white-space: pre-line; }
.w-actions, .selfmark { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.btn.good { background: transparent; color: var(--good); border-color: var(--good); }
.btn.bad { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.good.is-on { background: var(--good); color: var(--surface); }
.btn.bad.is-on { background: var(--bad); color: var(--surface); }
.miss dd.note-dd { font-weight: 400; white-space: pre-line; }
.feedback .flabel { margin: 4px 0 0; }

/* Student name and admin dashboard */
a.backlink { text-decoration: none; }
.name-line { margin: 2px 0 0; font-size: .95rem; }
.site-foot { margin: 6px 0 0; text-align: center; font-size: .85rem; color: var(--muted); }
.site-foot a { color: var(--muted); }
.modal-back {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
  background: rgba(6, 16, 20, .55);
}
.modal {
  width: min(420px, 100%); display: grid; gap: 12px; padding: 22px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px;
}
.modal p { margin: 0; }
.small { font-size: .85rem; }
.admin-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.admin-tools select {
  font: inherit; font-size: .95rem; color: var(--ink); background: var(--field);
  border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px;
}
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; display: grid; gap: 2px;
}
.kpi b { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: .85rem; color: var(--muted); }
.table-wrap { overflow-x: auto; padding: 0 24px 20px; }
.admin-table { width: 100%; border-collapse: collapse; font-size: .92rem; font-variant-numeric: tabular-nums; }
.admin-table th {
  text-align: left; white-space: nowrap; padding: 8px 10px; border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
}
.admin-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.admin-table .nowrap { white-space: nowrap; }
.linkcell {
  font: inherit; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0;
  cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 3px;
}

}

.msg-del {

.chat-form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 14px 24px 20px; border-top: 1px solid var(--line); }

.chat-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }

}

<script type="application/json" id="bank">{"courses":[
{"id":"tot","name":"TOT Course","sub":"Tourism and hospitality","chapters":[
{"id":"tot-ch1","label":"Chapter 1","name":"Introduction to Tourism and Hospitality","questions":[
{"id":"c3-01","t":"Key concepts","q":"Which dimension of travel can distinguish a 'tourist' from an 'excursionist' (day-tripper)?","o":["The time spent travelling (journey length)","The distance travelled","The traveller's place of residence","The purpose of travel"],"d":"The slides say the time spent travelling, or journey length, may distinguish a 'tourist' from an 'excursionist' or 'day-tripper'. Place of residence separates domestic from international tourism, and distance is measured between the generating region and the host destination.","w":"Journey length tells you how long the person is away, which separates a tourist (24 hours or more) from an excursionist (less than 24 hours)."},
{"id":"c3-02","t":"Key concepts","q":"On the slides, the 'distance travelled' dimension of travel is the distance between:","o":["The generating region and the host destination","The traveller's home and the transit route","The departure airport and the first attraction visited","The host destination and the traveller's ultimate destination"],"d":"Distance travelled: the distance between the generating region and the host destination. It is one of the four dimensions of travel, along with purpose, time spent travelling and place of residence.","w":"Distance travelled is a dimension of the journey itself, so it is measured from where the traveller starts (generating region) to where they go (host destination)."},
{"id":"c3-03","t":"Key concepts","q":"Which statement matches the UNWTO definition of tourism?","o":["Activities of persons travelling to and staying in places outside their usual environment for not more than one consecutive year, for leisure, business and other purposes","Activities of persons staying outside their country of residence for at least 24 hours and not more than six months, for leisure only","Activities of persons travelling outside their usual environment for more than one year, for any purpose except paid work","Activities of persons moving from one place to another for any purpose, however long they stay"],"d":"UNWTO: tourism comprises the activities of persons traveling to and staying in places outside their usual environment for not more than one consecutive year for leisure, business and other purposes. The last option is closer to the definition of travel.","w":"Only this option keeps all three parts of the UNWTO definition: outside the usual environment, not more than one consecutive year, and leisure, business and other purposes."},
{"id":"c3-04","t":"Key concepts","tf":true,"ans":false,"q":"Under the UNWTO definition, someone who stays outside their usual environment for 13 consecutive months for leisure is still a tourist.","d":"The UNWTO definition covers stays of not more than one consecutive year. A 13-month stay is longer than that, so it falls outside the definition of tourism.","w":"The UNWTO limit is not more than one consecutive year; 13 months is longer, so the person is outside the definition."},
{"id":"c3-05","t":"Key concepts","q":"During free time, a student watches a film at a cinema in their own town. Using the slides' definitions, this is:","o":["Recreation away from home, but not tourism","Tourism, because it is a leisure activity","Home-based recreation","Leisure time, but not recreation"],"d":"Leisure time is discretionary time, and recreation is the activities undertaken in it. Watching entertainment is recreation away from home. It is not tourism, because tourism takes place outside the permanent place of residence.","w":"Watching a film is an activity in leisure time (recreation) away from home, but the student stays in their own town, so it is not tourism."},
{"id":"c3-06","t":"Key concepts","q":"Which activity appears in BOTH the home-based and the away-from-home recreation lists on the slides?","o":["Hobbies","Exercise","Playing games","Visiting attractions"],"d":"Home-based recreation: music, TV and videos, radio, reading, DIY, gardening, playing games, exercise, hobbies and leisure use of computers. Away from home: sports participation, watching entertainment, hobbies, visiting attractions, and eating and drinking. Only hobbies is on both lists.","w":"Hobbies is the only activity listed under both home-based and away-from-home recreation; exercise and games are home-based, visiting attractions is away from home."},
{"id":"c3-07","t":"Tourism purposes","q":"On the slides, 'health' is listed under which group(s) of tourism purposes?","o":["Both Leisure and Recreation and Other tourism purposes","Only Leisure and Recreation","Only Other tourism purposes","Only Business and Professional"],"d":"Leisure and Recreation: recreation, cultural events, health, sport and VFR. Business and Professional: mission and MICE. Other tourism purposes: study, health, transit and others. Health appears in two groups.","w":"The slides list health under Leisure and Recreation and again under Other tourism purposes, so it appears in two groups."},
{"id":"c3-08","t":"Tourism purposes","q":"A government delegation travels abroad on an official mission. Which group of tourism purposes does this belong to?","o":["Business and Professional","Leisure and Recreation","Other tourism purposes","None, because the trip is work-related"],"d":"Mission is one of the UNWTO tourism purposes. The slides group mission and MICE under Business and Professional. The UNWTO definition covers leisure, business and other purposes, so work-related trips like this are still tourism.","w":"Mission is listed with MICE under Business and Professional purposes, and the UNWTO definition includes business travel."},
{"id":"c3-09","t":"Types of travellers","q":"Which person is NOT a visitor under the slides' definition?","o":["Someone who moves to another country to take up a paid job for eight months","Someone who spends six months abroad studying","Someone who goes abroad for two weeks on a religious trip","Someone who attends a three-day conference in another country"],"d":"Visitor: any person who visits another country for any reason except travel for a paid job, for not more than one year. Study, religion and conferences all count. Taking up a paid job does not.","w":"A visitor travels for any reason EXCEPT a paid job, so moving abroad to take up a paid job does not count."},
{"id":"c3-10","t":"Types of travellers","q":"A traveller arrives in Salalah at 10:00 on Monday for sightseeing, stays one night, and leaves at 09:00 on Tuesday. Using the slides' definitions, this person is:","o":["An excursionist, because the stay was less than 24 hours","A tourist, because the stay included a night","A tourist, because the trip was for tourism purposes","Neither, because the stay was too short to count"],"d":"Tourist: stays in the host destination for not less than 24 hours. Excursionist: stays less than 24 hours. 10:00 Monday to 09:00 Tuesday is 23 hours, so under the slides' 24-hour rule this is an excursionist, even though they stayed overnight.","w":"10:00 Monday to 09:00 Tuesday is 23 hours. The slides use the 24-hour rule, so this is an excursionist even with an overnight stay."},
{"id":"c3-11","t":"Types of travellers","q":"A resident of Oman flies to Jordan on holiday. Which pair of labels is correct?","o":["Outbound traveller for Oman, inbound traveller for Jordan","Inbound traveller for Oman, outbound traveller for Jordan","Outbound traveller for both countries","Inbound traveller for both countries"],"d":"Outbound traveller: a resident of a given country who leaves that country to visit another one. Inbound traveller: a non-resident who travels to a given country. The same trip is outbound for Oman and inbound for Jordan.","w":"Outbound and inbound depend on residence: leaving Oman makes the person outbound for Oman, and arriving in Jordan as a non-resident makes them inbound for Jordan."},
{"id":"c3-12","t":"Types of travellers","q":"A foreign national who has lived and worked in Muscat for ten years flies to their home country to visit family. From Oman's point of view, this person is:","o":["An outbound traveller, because they are a resident of Oman","An inbound traveller, because they are going back to their own country","Not a traveller, because they are going home","A domestic tourist"],"d":"The slides define inbound and outbound travellers by residence, not nationality. Outbound traveller: a resident of a given country who leaves that country to visit another one. The purpose of this trip is VFR (visiting friends and relatives).","w":"The definitions use residence, not nationality. A resident of Oman leaving Oman is an outbound traveller."},
{"id":"c3-13","t":"Tourism classification","q":"According to the slides, why has domestic tourism received little attention?","o":["It is more difficult to measure than international tourism","It has more negative impacts on the environment","It involves currency, language and visa issues","It is a type of mass tourism"],"d":"Domestic tourism is travel by residents within their country of residence. There are rarely currency, language or visa implications, and it is more difficult to measure than international tourism. As a consequence, it has received little attention.","w":"It is harder to count people travelling within their own country, so domestic tourism has received little attention."},
{"id":"c3-14","t":"Tourism classification","q":"A traveller buys a flight-and-hotel package online for one price, then books a desert safari and restaurant meals separately after arriving. Which arrangement best describes the whole trip?","o":["Tailor-made travel","An inclusive tour","Independent travel","Mass tourism"],"d":"Inclusive tour: two or more components bought together for one price. Independent travel: each element bought separately. Tailor-made travel combines the two, and it is increasingly common because people buy travel on the Internet.","w":"The package is an inclusive tour and the extras were bought separately, so the whole trip combines both: tailor-made travel."},
{"id":"c3-15","t":"Tourism classification","tf":true,"ans":true,"q":"Tailor-made travel combines features of inclusive tours and independent travel, and it is becoming more common because of the Internet.","d":"Tailor-made travel is a combination of inclusive tours and independent travel arrangements. It is increasingly common because people use the Internet to buy travel.","w":"Tailor-made travel = inclusive + independent, and the Internet makes it easier to buy travel this way."},
{"id":"c3-16","t":"Tourism classification","q":"A trip's host destination is 2,900 km from the traveller's generating region. How is the trip classified by distance?","o":["Short- or medium-haul","Long-haul","Long-haul, because the return journey makes it 5,800 km in total","It cannot be classified without knowing if it is international"],"d":"Long-haul tourism generally means travel over a distance of at least 3,000 km. Shorter journeys are short- or medium-haul. Distance is measured between the generating region and the host destination, so 2,900 km is short- or medium-haul.","w":"Long-haul starts at 3,000 km between the generating region and the destination; 2,900 km is below that."},
{"id":"c3-17","t":"Tourism classification","q":"'Mass tourism' and 'alternative tourism' belong to which of the four bases of tourism classification?","o":["Tourists' activities","Type of travel arrangements purchased","Distance travelled","Geography (domestic or international)"],"d":"The four bases are: geography (domestic or international), type of travel arrangements purchased (inclusive, independent, tailor-made), distance travelled (long-haul or short/medium-haul), and tourists' activities (mass tourism or alternative tourism, including SIT).","w":"Mass and alternative tourism describe what tourists do and how they travel (groups or individuals), so they belong to tourists' activities."},
{"id":"c3-18","t":"Tourism classification","q":"Which statement about alternative tourism is correct according to the slides?","o":["Tourists travel individually or in small groups, with a neutral or positive impact on destinations","It includes all-inclusive holidays and cruise tourism","Tourists travel in big groups to experience many different activities","It is another name for domestic tourism"],"d":"Alternative tourism: tourists travel individually or in small groups, with a neutral or positive impact on destinations. Big groups, all-inclusive holidays and cruises describe mass tourism, which might have more negative impacts on the environment.","w":"Alternative tourism is the opposite of mass tourism: individuals or small groups with a neutral or positive impact."},
{"id":"c3-19","t":"Tourism classification","q":"Which of these is NOT listed on the slides as Special Interest Tourism (SIT)?","o":["Cruise tourism","Rural tourism","Heritage tourism","Spa and health tourism"],"d":"The SIT examples on the slides are cultural, heritage, eco, adventure, rural, scuba-diving, and spa and health tourism. Cruise tourism is given as an example of mass tourism.","w":"Cruise tourism is given as an example of mass tourism, not Special Interest Tourism."},
{"id":"c3-20","t":"Tourist experience","q":"In the three phases of the tourist experience, the flight home at the end of a holiday belongs to the:","o":["Realization phase","Recollection phase","Anticipation phase","Transit phase"],"d":"Realization phase: the destination experience is the goal of the trip and is combined with both the outward and return journeys as part of the total experience. Recollection comes after the trip. There is no 'transit phase'.","w":"The outward and return journeys are part of the total experience in the realization phase."},
{"id":"c3-21","t":"Tourist experience","tf":true,"ans":false,"q":"The recollection phase begins during the return journey.","d":"The outward and return journeys belong to the realization phase. The recollection phase comes after the trip, when how well the experience met expectations influences future travel decisions.","w":"The return journey is still part of the trip (realization); recollection only begins after the trip."},
{"id":"c3-22","t":"Tourism system","q":"A traveller from Muscat flies to London with a stopover in Doha. In Leiper's tourism system, Doha is part of the:","o":["Transit route region","Host region (tourist destination)","Generating region","Business element"],"d":"The geographic element has three parts: the traveller's generating country or region (Muscat), the host country or region, which is the tourist destination (London), and the transit route region(s) the traveller passes through (Doha).","w":"Doha is a stop between the generating region (Muscat) and the destination (London), so it is part of the transit route region."},
{"id":"c3-23","t":"Tourism system","tf":true,"ans":true,"q":"Residents of the generating region who become tourists are part of the human element, not the geographic element, of Leiper's model.","d":"Human element: residents of the generating region who become tourists, and residents of the host region (tourism personnel, labour and workforce). The geographic element covers the regions themselves: generating, transit route and host.","w":"The human element is about people; the geographic element is about places (regions)."},
{"id":"c3-24","t":"Tourism system","q":"Which list gives exactly the external environments that tourism, as an open system, affects and is affected by?","o":["Political, economic, socio-cultural, technological, physical","Political, economic, legal, technological, physical","Political, economic, socio-cultural, technological, religious","Economic, socio-cultural, technological, physical, psychological"],"d":"Tourism is an open system: it affects and is affected by the political, economic, socio-cultural, technological and physical environments.","w":"The five environments are political, economic, socio-cultural, technological and physical; each wrong option swaps one in."},
{"id":"c3-25","t":"Tourism system","tf":true,"ans":true,"q":"Leiper's model has three elements, and tourism is called an open system because it affects and is affected by external environments.","d":"Leiper's model has geographic, human and business elements. Tourism is an open system because it affects, and is affected by, the political, economic, socio-cultural, technological and physical environments.","w":"Both parts are correct: three elements (geographic, human, business) and an open system affected by external environments."},
{"id":"c3-26","t":"Industry structure","q":"A souvenir shop in Mutrah Souq that sells mainly to tourists is classified as:","o":["A direct provider outside the mainstream industry (ancillary services)","A direct provider in the attractions and activities sector","A support service","A developmental organisation"],"d":"Direct providers deal directly with tourists. Some work in the four mainstream sectors (transportation, accommodation, attractions and activities, sales distribution). Others, such as shops and restaurants, work outside it as ancillary service providers, also called visitor services.","w":"A souvenir shop deals directly with tourists but is outside the four main sectors, so it is an ancillary service."},
{"id":"c3-27","t":"Industry structure","q":"A currency exchange counter at the airport that serves arriving tourists is best classified as:","o":["An ancillary service provider (a direct provider)","A developmental organisation, because it is a finance firm","A support service","Part of the sales distribution sector"],"d":"Financial service providers that deal directly with tourists are ancillary service providers (visitor services), along with shopping outlets, tourist publications and information, and entertainment providers. Finance firms that fund tourism development are developmental organisations instead.","w":"A currency exchange serving tourists directly is a financial service provider, which the slides list as an ancillary service."},
{"id":"c3-28","t":"Industry structure","q":"A construction firm builds a new resort. In the structure of the tourism industry, the firm is a:","o":["Support service","Developmental organisation","Direct provider in the accommodation sector","Ancillary service provider"],"d":"Support services give support, aid and guidance to direct providers. People don't usually link them with tourism, and tourists have little involvement with them. Examples: petroleum distribution companies, construction firms and utility supply companies.","w":"Construction firms support the direct providers; tourists have little involvement with them, so they are support services."},
{"id":"c3-29","t":"Industry structure","q":"A bank lends money to investors to build a new hotel. In the structure of the tourism industry, the bank is acting as a:","o":["Developmental organisation","Support service","Ancillary service provider","Direct provider"],"d":"Developmental organisations are business firms, government agencies or individuals involved in tourism planning and development. Examples: national or regional planning and marketing organisations (which may be an NTO), industry training organisations, and finance or investment firms.","w":"Finance and investment firms are listed as developmental organisations because they fund tourism development."},
{"id":"c3-30","t":"Industry structure","tf":true,"ans":false,"q":"A national tourism organisation (NTO) involved in national planning and marketing is an example of a support service.","d":"Organisations involved in national or regional planning and marketing, which may be an NTO, are developmental organisations. Support services are businesses such as petroleum distribution, construction and utility supply companies.","w":"NTOs plan and market tourism, which makes them developmental organisations, not support services."},
{"id":"t1-w1","t":"Key concepts","wr":true,"q":"Define travel and tourism, and explain the difference between them.","a":"Travel: the physical movement of people from one place to another for any purpose.\nTourism (UNWTO): the activities of persons travelling to and staying in places outside their usual environment for not more than one consecutive year for leisure, business and other purposes.\nDifference: all tourism involves travel, but not all travel is tourism. Tourism needs a stay outside the usual environment, limited to one year, and excludes earning a profit or permanent stay.","d":"Travel: movement of people. Tourism: travel plus a stay outside the usual environment for up to one year.","w":"Give both definitions, then show what tourism adds to travel."},
{"id":"t1-w2","t":"Key concepts","wr":true,"q":"Differentiate between leisure, recreation and tourism.","a":"Leisure time: discretionary time left after working, commuting, sleeping and necessary chores, used in a chosen way.\nRecreation: activities undertaken in leisure time, either home-based (reading, gardening, games) or away from home (sports, entertainment, visiting attractions).\nTourism: one type of recreation that happens outside the permanent place of residence for any purpose except earning a profit or permanent stay.","d":"Leisure is time, recreation is activity in that time, and tourism is recreation away from home.","w":"The three terms build on each other: leisure contains recreation, and recreation contains tourism."},
{"id":"t1-w3","t":"Types of travellers","wr":true,"q":"Explain the terms traveller, visitor, tourist and excursionist.","a":"Traveller: any person who moves from and stays in a place outside their usual environment for any purpose.\nVisitor: any person who visits another country for any reason except a paid job, for not more than one year.\nTourist: travels for tourism purposes and stays in the host destination for not less than 24 hours.\nExcursionist: travels for tourism purposes and stays in the host destination for less than 24 hours.","d":"Classification of travellers: traveller, visitor, tourist, excursionist.","w":"The key test between tourist and excursionist is the 24-hour stay."},
{"id":"t1-w4","t":"Tourism classification","wr":true,"q":"Explain the four ways of classifying tourism.","a":"1. Geographically: domestic (residents within their own country) and international (outside the country of residence).\n2. Type of travel arrangements: inclusive tours (two or more components for one price), independent travel (bought separately), tailor-made (a combination).\n3. Distance travelled: long-haul (at least 3,000 km) and short- or medium-haul.\n4. Tourists' activities: mass tourism (big groups, e.g. cruises, all-inclusive) and alternative tourism (individuals or small groups), including Special Interest Tourism.","d":"Tourism classification: four bases relating to the nature of the trip.","w":"Name each basis and give its categories."},
{"id":"t1-w5","t":"Tourism system","wr":true,"q":"Explain Leiper's tourism system and why tourism is an open system.","a":"Leiper's model has three elements:\n1. Geographic: the traveller-generating region, the host (destination) region and the transit route region.\n2. Human: residents of the generating region who become tourists, and residents of the host region who work in tourism.\n3. Business: the tourism industry, all individuals and organisations that develop and deliver the tourism product.\nTourism is an open system because it affects, and is affected by, the political, economic, socio-cultural, technological and physical environments.","d":"Tourism system: Leiper's model of geographic, human and business elements.","w":"Describe the three elements, then explain the link with external environments."},
{"id":"t1-w6","t":"Industry structure","wr":true,"q":"Explain the three groups of providers in the tourism and hospitality industry.","a":"1. Direct providers: deal directly with tourists. Some are in the four main sectors (transportation, accommodation, attractions and activities, sales distribution); others are ancillary services such as shops, restaurants, financial services, tourist information and entertainment.\n2. Support services: support and guide direct providers; tourists have little involvement with them (e.g. petroleum distribution, construction, utility supply companies).\n3. Developmental organisations: involved in tourism planning and development (e.g. NTOs, industry training organisations, finance and investment firms).","d":"Tourism industry structure: direct providers, support services and developmental organisations.","w":"Group each example by how closely it deals with tourists."}
]},
{"id":"tot-ch2","label":"Chapter 2","name":"Tourism Supply and Demand","questions":[
{"id":"t2-01","t":"Supply and demand","q":"Tourism supply is:","o":["The quantity of tourism products that sellers are willing and able to sell","The quantity of tourism products that tourists are willing and able to buy","The number of tourists arriving at a destination","The money tourists spend in a destination"],"d":"Tourism supply: the quantity of tourism products that sellers (suppliers or providers) are willing and able to sell.","w":"Supply is about the sellers. The second option is the definition of demand."},
{"id":"t2-02","t":"Supply and demand","q":"How is tourism demand measured, according to the slides?","o":["By counting the number of visitors or tourists who come to the destination","By counting the number of hotels","By the number of airlines","By the size of the destination"],"d":"Tourism demand: the quantity of tourism products buyers (tourists) are willing and able to purchase; it needs both willingness and ability.","w":"Demand comes from tourists, so it is measured by how many of them arrive."},
{"id":"t2-03","t":"Tourism product","q":"The tourism product is described as composite because it includes:","o":["Everything the tourist purchases, sees, experiences and feels from leaving home until returning","Only the hotel room","Only the flight ticket","Only souvenirs bought at the destination"],"d":"Tourism product: composite in nature, covering everything the tourist purchases, sees, experiences and feels from leaving home until returning.","w":"It is a combination of many parts, not a single item."},
{"id":"t2-04","t":"Tourism product","q":"Which of these is NOT one of the 3 A's of the tourism product?","o":["Advertising","Attractions and activities","Amenities","Accessibility"],"d":"The 3 A's: attractions and activities, amenities, accessibility.","w":"Advertising helps sell the product but is not one of its components."},
{"id":"t2-05","t":"Tourism product","q":"Amenities are divided into:","o":["Infrastructure and superstructure","Natural and man-made","Direct and indirect","Inbound and outbound"],"d":"Amenities: the infrastructure and superstructure at the destination (e.g. roads, utilities, hotels).","w":"Natural and man-made describe attractions, not amenities."},
{"id":"t2-06","t":"Tourism product","q":"Accessibility of a destination is affected by:","o":["Geographical proximity, cost of transport and frequency of transport","The number of museums","The core values of the destination","The tourist's age"],"d":"Accessibility: affected by the destination's geographical proximity, the cost of transport to it and the frequency of transport.","w":"Accessibility is about how easy it is to get there."},
{"id":"t2-07","t":"Characteristics","q":"A hotel room left unsold tonight cannot be stored and sold tomorrow. Which characteristic is this?","o":["Perishability","Immovability","Heterogeneity","Rigidity of supply"],"d":"Perishability: services cannot be physically stored.","w":"Tonight's unsold room is lost forever, so the product perishes."},
{"id":"t2-08","t":"Characteristics","q":"A tourist must travel to the beach to enjoy it, because the beach cannot be brought to the tourist. Which characteristic is this?","o":["Immovability","Perishability","Service orientation","Heterogeneity"],"d":"Immovability: the tourism product cannot be taken to the consumer.","w":"The consumer has to come to the product."},
{"id":"t2-09","t":"Characteristics","q":"A city cannot quickly add hundreds of hotel rooms when demand jumps during a festival. Which characteristic is this?","o":["Rigidity of supply","Perishability","Immovability","Service orientation"],"d":"Rigidity of supply: some facilities cannot change quickly in the face of changes in demand.","w":"Building capacity takes time, so supply is rigid."},
{"id":"t2-10","t":"Characteristics","q":"The tourism product is made up of many diverse components. Which characteristic is this?","o":["Heterogeneity","Rigidity of supply","Perishability","Immovability"],"d":"Heterogeneity: the product is composed of many diverse components.","w":"Transport, accommodation, food and attractions together make one varied product."},
{"id":"t2-11","t":"Visitor attractions","q":"A visitor attraction is described as:","o":["The core component of the tourism product that attracts a person to visit the destination","Any hotel at the destination","The airline that carries tourists","A travel agency"],"d":"Visitor attraction: the core component of the tourism product at the host destination that attracts people to visit.","w":"Without an attraction there is little reason to travel to the destination."},
{"id":"t2-12","t":"Visitor attractions","q":"Rivers, lakes, beaches, caves, national parks and forests are:","o":["Natural attractions","Man-made attractions","Purpose-built attractions","Event attractions"],"d":"Natural attractions (Swarbrooke): rivers, lakes, beaches, caves, scenic features, flora and fauna, national parks, wilderness and forests.","w":"They are created by nature, not people."},
{"id":"t2-13","t":"Visitor attractions","q":"Historic houses, castles and forts that were NOT originally built to attract tourists are:","o":["Man-made attractions","Purpose-built attractions","Natural attractions","Event attractions"],"d":"Man-made attractions: not originally designed to attract tourists, e.g. historic houses, castles, heritage and archaeological sites.","w":"A fort was built for defence, not tourism, so it is man-made but not purpose-built."},
{"id":"t2-14","t":"Visitor attractions","q":"Museums, theme parks, aqua-parks, zoos and golf courses are:","o":["Man-made and purpose-built attractions","Natural attractions","Man-made attractions not designed for visitors","Event attractions"],"d":"Purpose-built attractions: created with the purpose of attracting visitors.","w":"These were built specifically for visitors."},
{"id":"t2-15","t":"Visitor attractions","q":"How do event attractions differ from other attractions?","o":["They occur only periodically and may change venues","They are always free","They never need investment","They are always natural"],"d":"Event attractions: from small festivals to hallmark events, occurring periodically and sometimes changing venues.","w":"Hallmark events (e.g. the Olympics) also need large investment in buildings and infrastructure."},
{"id":"t2-16","t":"Factors affecting supply","q":"Which of these is NOT a factor affecting tourism SUPPLY on the slides?","o":["Tourists' disposable income","Availability of a skilled workforce","Government policy","Host population acceptance of tourism"],"d":"Supply factors: natural resources, investment and capital, skilled workforce, government policy, impacts on the host community, host acceptance, accessibility, infrastructure and superstructure.","w":"Disposable income is a travel facilitator, which affects demand."},
{"id":"t2-17","t":"Factors affecting demand","q":"Tourism demand is a function of which three factors?","o":["Travel facilitators, resistance factors and travel motivators","Price, product and place","Attractions, amenities and accessibility","Income, employment and regional development"],"d":"Factors affecting demand: travel facilitators, resistance factors and travel motivators.","w":"The 3 A's describe the product (supply), not demand."},
{"id":"t2-18","t":"Factors affecting demand","q":"Which of these is a travel FACILITATOR?","o":["Discretionary leisure time","Perceived image of the destination","Lack of information on the destination","Political instability"],"d":"Travel facilitators: disposable income, discretionary leisure time, basic tourism services, political stability, accepted mediums of exchange, access to travel documents.","w":"The other three options are resistance factors."},
{"id":"t2-19","t":"Factors affecting demand","q":"Which of these is a RESISTANCE factor?","o":["Lack of amenities at the destination","Disposable income","Access to travel documentation","Accepted mediums of exchange"],"d":"Resistance factors: political instability, location, cost, health and safety, climate, perceived image, lack of amenities, lack of information.","w":"Resistance factors dissuade a person from travelling."},
{"id":"t2-20","t":"Factors affecting demand","q":"What is the difference between travel facilitators and travel motivators?","o":["Facilitators predict whether a person CAN travel; motivators explain WHY they travel","Facilitators explain why people travel; motivators predict whether they can","They are the same thing","Facilitators stop people travelling"],"d":"Travel facilitators: predictors of ability to travel. Travel motivators: the reasons for travel.","w":"Stopping people travelling is the role of resistance factors."},
{"id":"t2-21","t":"Motivation theories","q":"Ramumbo's PHYSICAL motivators relate to:","o":["Bodily health and reducing stress through physical activity","Learning about other cultures","Meeting new people","Gaining status and recognition"],"d":"Ramumbo's four motivators: physical, cultural, interpersonal, status and prestige.","w":"Physical motivators are about the body: health and stress relief, e.g. tramping."},
{"id":"t2-22","t":"Motivation theories","q":"Travelling to enhance one's reputation or self-worth is which Ramumbo motivator?","o":["Status and prestige","Interpersonal","Cultural","Physical"],"d":"Status and prestige motivators: the need for esteem and recognition.","w":"Reputation and self-worth are about esteem."},
{"id":"t2-23","t":"Motivation theories","q":"In Gray's theory, the desire to exchange the known for the unknown and explore new places is:","o":["Wanderlust","Sunlust","Interpersonal motivation","Status motivation"],"d":"Gray: the prime motivation is to escape routine, made of two forces: wanderlust and sunlust.","w":"Wandering and exploring is wanderlust."},
{"id":"t2-24","t":"Motivation theories","q":"A family travels to a destination mainly for better weather, sun and sand. In Gray's theory this is:","o":["Sunlust","Wanderlust","Cultural motivation","Physical motivation"],"d":"Sunlust: a lust for the sun, or for better physical conditions than in the generating market, e.g. 'sun and sand' tourism.","w":"The motive is better physical conditions, not exploring the unknown."},
{"id":"t2-25","t":"Factors affecting demand","tf":true,"ans":true,"q":"Travel motivations are often hidden and must be distinguished from the stated purpose of travel.","d":"Motivations tend to be covert (hidden) and differ from the stated purpose (e.g. holiday).","w":"Two people can both say 'holiday' but have very different reasons."},
{"id":"t2-26","t":"Factors affecting demand","tf":true,"ans":false,"q":"Two people with the same stated purpose of travel must have the same motivation.","d":"Same purpose, different reasons: one may escape work stress, the other may want to socialise.","w":"Purpose and motivation are different things."},
{"id":"t2-27","t":"Visitor attractions","tf":true,"ans":true,"q":"Natural attractions are usually in public ownership and need strict management to protect them.","d":"Natural attractions are usually publicly owned and demand strict management regimes to protect them from visitors' use.","w":"Heavy visitor use can damage fragile natural sites."},
{"id":"t2-28","t":"Visitor attractions","tf":true,"ans":true,"q":"Hallmark events need considerable investment in buildings, infrastructure, planning and organisation.","d":"Hallmark events: major events like the Football World Cup or Olympics, which promote the host destination.","w":"They also have to safeguard the health, safety and security of visitors."},
{"id":"t2-29","t":"Factors affecting demand","tf":true,"ans":true,"q":"Facilitators, motivators and resistance factors operate at a general level and a specific level.","d":"General level: whether to take a holiday at all. Specific level: which destination, hotel or product.","w":"Both decisions are influenced by the same three factors."},
{"id":"t2-30","t":"Motivation theories","tf":true,"ans":false,"q":"Cultural motivators relate to the need for esteem and recognition.","d":"Cultural motivators: learning about other countries, cultures, arts and traditions.","w":"Esteem and recognition are status and prestige motivators."},
{"id":"t2-w1","t":"Tourism product","wr":true,"q":"Define the tourism product and explain its components (the 3 A's).","a":"Tourism product: composite in nature; everything the tourist purchases, sees, experiences and feels from leaving home until returning.\n1. Attractions and activities: activities, site attractions and event attractions (e.g. natural and archaeological sites).\n2. Amenities: infrastructure and superstructure (e.g. roads, utilities, hotels).\n3. Accessibility: affected by geographical proximity, cost of transport and frequency of transport to the destination.","d":"The 3 A's: attractions and activities, amenities, accessibility.","w":"Define the product first, then explain each A with an example."},
{"id":"t2-w2","t":"Characteristics","wr":true,"q":"Explain the characteristics of the tourism product.","a":"1. Service orientation: depends on people; the link between the tourist and the service consumed.\n2. Perishability: services cannot be physically stored (an unsold room tonight is lost).\n3. Rigidity of supply: some facilities cannot change quickly when demand changes.\n4. Immovability: the product cannot be taken to the consumer; the tourist must travel to it.\n5. Heterogeneity: it is made of many diverse components.","d":"Like many services, the tourism product differs from tangible goods.","w":"Each characteristic shows a way tourism differs from a physical product you can store and ship."},
{"id":"t2-w3","t":"Visitor attractions","wr":true,"q":"Explain Swarbrooke's (2001) classification of visitor attractions, with examples.","a":"1. Natural attractions: rivers, beaches, caves, national parks, forests; usually publicly owned and strictly managed (e.g. Oman's wadis and beaches).\n2. Man-made attractions not built for tourists: historic houses, castles, forts, heritage and archaeological sites (e.g. a historic fort).\n3. Man-made, purpose-built attractions: museums, galleries, theme parks, zoos, golf courses, shopping venues (e.g. a national museum).\n4. Event attractions: from community festivals to hallmark events (e.g. Football World Cup, Olympics, Formula One); they occur periodically and need large investment.","d":"Visitor attraction: the core component of the tourism product that attracts people to a destination.","w":"The key difference between types 2 and 3 is whether the place was built to attract visitors."},
{"id":"t2-w4","t":"Factors affecting supply","wr":true,"q":"What are the factors affecting tourism supply?","a":"1. Natural resources and attractions at the destination.\n2. Levels of investment and availability of capital.\n3. Availability of a skilled workforce.\n4. Government policy and intervention in tourism.\n5. Potential impacts of tourism on the host community.\n6. Host population acceptance of tourism.\n7. Accessibility of the destination.\n8. Availability of complementary infrastructure and superstructure.","d":"Supply-side variables may constrain or foster tourism development, even though supply should be demand-driven.","w":"List the factors from the slides and explain one or two briefly."},
{"id":"t2-w5","t":"Factors affecting demand","wr":true,"q":"Differentiate between travel facilitators and resistance factors, giving examples.","a":"Travel facilitators predict whether a person is able to travel: disposable income, discretionary leisure time, basic tourism services and facilities, political stability, accepted mediums of exchange, access to travel documents.\nResistance factors dissuade a person from travelling: political instability and safety, the destination's location, cost of travel, health and safety issues, climate, perceived image, lack of amenities, lack of information.","d":"Factors affecting demand: facilitators, resistance factors and motivators.","w":"Facilitators make travel possible; resistance factors push people away."},
{"id":"t2-w6","t":"Motivation theories","wr":true,"q":"Explain the travel motivators given by Ramumbo and by Gray.","a":"Ramumbo's four motivators:\n1. Physical: bodily health and stress relief through physical activity.\n2. Cultural: learning about other countries, cultures, arts and traditions.\n3. Interpersonal: meeting new people, socialising or escaping reality.\n4. Status and prestige: esteem, recognition and self-worth.\nGray: the main motive is to escape everyday routine, made of two forces:\n- Wanderlust: exchanging the known for the unknown and exploring new places.\n- Sunlust: seeking better physical conditions, e.g. sun and sand.","d":"Travel motivation: the reasons why people travel when there is often no need to do so.","w":"Present both theories separately and give an example for each motivator."}
]},
{"id":"tot-ch3","label":"Chapter 3","name":"Hospitality","questions":[
{"id":"t3-01","t":"Meaning of hospitality","q":"The word 'hospitality' comes from the French word 'hospice', meaning:","o":["To provide care or shelter for travellers","To sell food and drink","To build hotels","To manage tourism"],"d":"Hospitality: from the French 'hospice', meaning to provide care or shelter for travellers (also from the Latin 'hospes', visitor or stranger).","w":"The root meaning is caring for people away from home."},
{"id":"t3-02","t":"Meaning of hospitality","q":"The hospitality industry includes organisations that provide:","o":["Food and/or drink and/or accommodation to people away from home","Only airline tickets","Only entertainment","Only souvenirs"],"d":"Hospitality industry: companies or organisations providing food, drink and/or accommodation to people away from home.","w":"Accommodation and F&B together make up the largest segment of the industry."},
{"id":"t3-03","t":"Domains","q":"Lashley and Morrison's COMMERCIAL domain of hospitality refers to:","o":["Services provided for profit, where the host-guest relationship is commoditised","Hosting strangers as an act of generosity","Fulfilling needs within the private home","Government tourism policy"],"d":"Domains of hospitality (Lashley and Morrison, 2000): private, commercial and social.","w":"'Commercial' means for profit."},
{"id":"t3-04","t":"Domains","q":"The PRIVATE domain of hospitality relates to:","o":["The host-guest relationship and fulfilling physiological and psychological needs","Services provided only for profit","Hospitality for strangers in public spaces","Hotel chains"],"d":"Private domain: the host/guest relationship, meeting physiological and psychological needs.","w":"Think of hospitality offered at home."},
{"id":"t3-05","t":"Domains","q":"Providing hospitality to strangers as an act of generosity belongs to the:","o":["Social domain","Commercial domain","Private domain","Franchise domain"],"d":"Social domain: hospitality for strangers as an act of generosity, and the social space where it happens.","w":"Generosity, not profit, defines the social domain."},
{"id":"t3-06","t":"Accommodation","q":"Under a star grading system, a 5-star property offers:","o":["The highest level of luxury and service","The most basic quality","Self-catering only","No food service"],"d":"Star grading: 1 star is the most basic quality; 5 stars is the highest level of luxury and service.","w":"More stars mean higher quality."},
{"id":"t3-07","t":"Accommodation","q":"A group of hotels following standard operating procedures in marketing, reservations, service, F&B, housekeeping and accounting is a:","o":["Hotel chain","Independent hotel","Contract feeding operation","Owner-operated B&B"],"d":"Hotel chain: hotels that follow standard operating procedures (e.g. Hilton brands such as Hampton Inns and Embassy Suites).","w":"Standardised procedures across many hotels define a chain."},
{"id":"t3-08","t":"Accommodation","q":"Which describes an INDEPENDENT hotel?","o":["Not associated with a franchise; often the owner is the manager, with warmth and individuality","Must follow a chain's standard procedures","Always run under a management contract","Always larger than chain hotels"],"d":"Independent hotel: not associated with a franchise; owner-manager, room rates similar to chains, individually decorated rooms, inviting dining rooms.","w":"Independence gives it more individuality than a chain property."},
{"id":"t3-09","t":"Ownership and management","q":"When an individual or company both owns and runs the accommodation, it is:","o":["Owner-operated","A management contract","A franchise","Outsourcing"],"d":"Owner-operated: the owner operates the facility; most are smaller (motels, camping grounds, B&Bs, hostels).","w":"Ownership and operation are in the same hands."},
{"id":"t3-10","t":"Ownership and management","q":"The owner employs a company such as Hyatt or Marriott to run the hotel, which carries the company's name. This is:","o":["A management contract","A franchise","Owner-operated","Self-grading"],"d":"Management contract: the owner employs an individual or company to operate the facility; the hotel usually bears the management company's name.","w":"The owner buys management expertise."},
{"id":"t3-11","t":"Ownership and management","q":"The owner pays for the right to use an established chain's name and joins its shared reservations and promotions. This is:","o":["A franchise","A management contract","Owner-operated","An independent hotel"],"d":"Franchise: the owner pays to use the name of, and become part of, an established chain (e.g. Best Western).","w":"Paying for the name and system is franchising."},
{"id":"t3-12","t":"Sales indicators","q":"The percentage of rooms sold compared with the total rooms available is the:","o":["Occupancy percentage","Average daily rate","RevPAR","Yield"],"d":"Occupancy percentage = rooms sold ÷ rooms available × 100. It shows staff success in attracting guests.","w":"It compares rooms sold to rooms available."},
{"id":"t3-13","t":"Sales indicators","q":"The average room price per day is the:","o":["Average daily rate (ADR)","Occupancy percentage","Yield","Rack rate"],"d":"ADR = room revenue ÷ rooms sold. It measures staff efforts in selling room rates.","w":"It is an average price, not a percentage."},
{"id":"t3-14","t":"Sales indicators","q":"The average revenue generated by each room in the hotel, sold or unsold, is the:","o":["Revenue per available room (RevPAR)","Average daily rate","Occupancy percentage","Rack rate"],"d":"RevPAR = room revenue ÷ rooms available. It shows how much income each room produces.","w":"ADR divides by rooms SOLD; RevPAR divides by rooms AVAILABLE."},
{"id":"t3-15","t":"Sales indicators","q":"Yield is calculated as:","o":["Revenue realised ÷ revenue potential","Rooms sold ÷ rooms available","Room revenue ÷ rooms sold","Rack rate × rooms sold"],"d":"Yield: the percentage of income secured compared with selling 100% of rooms at full rack rate.","w":"Revenue realised = rooms sold × ADR; revenue potential = rooms available × rack rate."},
{"id":"t3-16","t":"Sales indicators","q":"A hotel has 200 rooms and sells 150 tonight. What is its occupancy percentage?","o":["75%","133%","25%","150%"],"d":"Occupancy % = rooms sold ÷ rooms available × 100.","w":"150 ÷ 200 × 100 = 75%."},
{"id":"t3-17","t":"Sales indicators","q":"The same hotel earns OMR 9,000 room revenue from its 150 sold rooms. What is the ADR?","o":["OMR 60","OMR 45","OMR 75","OMR 150"],"d":"ADR = room revenue ÷ rooms sold.","w":"9,000 ÷ 150 = OMR 60."},
{"id":"t3-18","t":"Sales indicators","q":"The same hotel (200 rooms, OMR 9,000 room revenue). What is the RevPAR?","o":["OMR 45","OMR 60","OMR 75","OMR 90"],"d":"RevPAR = room revenue ÷ rooms available.","w":"9,000 ÷ 200 = OMR 45 (also 75% occupancy × OMR 60 ADR)."},
{"id":"t3-19","t":"Sales indicators","q":"The same hotel's rack rate is OMR 80. What is its yield?","o":["56.25%","75%","45%","112.5%"],"d":"Yield = revenue realised ÷ revenue potential; revenue potential = rooms available × rack rate.","w":"Potential = 200 × 80 = 16,000. Yield = 9,000 ÷ 16,000 = 56.25%."},
{"id":"t3-20","t":"Food and beverage","q":"Which of these is NOT one of the three food service market segments?","o":["Room service market","Restaurant market","Travel and lodging market","Contract feeding market"],"d":"F&B market segments: restaurant market, travel and lodging market, contract feeding market.","w":"Room service is part of hotel F&B, not a separate segment on the slides."},
{"id":"t3-21","t":"Food and beverage","q":"F&B outlets in hotels, airports and bus stations serve a captive market. This is the:","o":["Travel and lodging market","Restaurant market","Contract feeding market","Fast food market"],"d":"Travel and lodging market: patrons cannot eat at home and have a narrower choice of restaurants.","w":"Captive customers define this segment."},
{"id":"t3-22","t":"Food and beverage","q":"Limited menu, fast self-service, very low average check and mainly chain or franchise describe:","o":["Fast food","Coffee shops","Contract feeding","Fine dining"],"d":"Fast food (e.g. Pizza Hut, KFC, McDonald's): limited menu, fast service, limited seating, very low average check, chain or franchise.","w":"Coffee shops have longer hours and low-to-moderate checks."},
{"id":"t3-23","t":"Food and beverage","q":"Hospitals, schools, prisons, the armed forces and airlines are customers of the:","o":["Contract feeding and vending market","Restaurant market","Fast food market","Coffee shop market"],"d":"Contract feeding (subsidised or welfare F&B): profit is not the primary concern.","w":"These are institutional, not commercial, customers."},
{"id":"t3-24","t":"Food and beverage","q":"A hotel lets a branded coffee chain operate from a space inside the hotel. This is:","o":["Outsourcing","Self-operation","Owner-operated accommodation","Hotel grading"],"d":"Outsourcing: hotels partner with a restaurant, coffee or bar brand that operates in the hotel, because hotel-run outlets can be unprofitable.","w":"The hotel hands the outlet to an outside brand."},
{"id":"t3-25","t":"Food and beverage","tf":true,"ans":true,"q":"Coffee shops usually have longer operating hours and low to moderate average checks.","d":"Coffee shops (e.g. Starbucks): inexpensive menus, convenience food, limited counter service, low to moderate checks, longer hours.","w":"This matches the slides' description."},
{"id":"t3-26","t":"Food and beverage","tf":true,"ans":false,"q":"In contract feeding, making a profit is the outlet's primary concern.","d":"In contract feeding and vending, making profit is not the primary concern.","w":"These are subsidised or welfare operations."},
{"id":"t3-27","t":"Accommodation","tf":true,"ans":true,"q":"Independent hotels usually have room rates similar to those of chain properties.","d":"Independent hotel characteristics include room rates similar to chain properties.","w":"The difference is in individuality, not price."},
{"id":"t3-28","t":"Ownership and management","tf":true,"ans":false,"q":"Under a management contract, the hotel usually carries the owner's name.","d":"Under a management contract, the hotel usually bears the management company's name.","w":"That is why many owners' hotels are called Hilton or Marriott."},
{"id":"t3-29","t":"Ownership and management","tf":true,"ans":true,"q":"In an F&B franchise, the franchisee must maintain the franchisor's business and quality standards.","d":"F&B franchise: the franchisee pays fees for the name, design and methods and must keep the franchisor's standards.","w":"Standards protect the brand."},
{"id":"t3-30","t":"Accommodation","tf":true,"ans":true,"q":"In some countries grading is compulsory and carried out by the government, while in others operators grade themselves.","d":"Accommodation grading can be compulsory (by government) or self-grading by operators.","w":"Grading systems differ between countries."},
{"id":"t3-w1","t":"Meaning of hospitality","wr":true,"q":"Define hospitality and explain its three domains.","a":"Hospitality: the cordial and generous reception and entertainment of guests, socially or commercially (from the French 'hospice', to provide care or shelter for travellers; and the Latin 'hospes', visitor or stranger).\nDomains (Lashley and Morrison, 2000):\n1. Private: the host-guest relationship, fulfilling physiological and psychological needs.\n2. Commercial: services provided for profit; the host-guest relationship is commoditised.\n3. Social: hospitality for strangers as an act of generosity, and the social space where it happens.","d":"Hospitality: generous, friendly treatment of visitors and guests.","w":"Give the definition, then explain each domain."},
{"id":"t3-w2","t":"Scope","wr":true,"q":"Describe the scope and structure of the hospitality industry.","a":"The hospitality industry combines the accommodation and food and beverage groupings, which together form the largest segment of the industry. It includes many professions:\n- Hotels and resorts\n- Restaurants and catering\n- Night clubs and bars\n- Travel and transportation\n- Spas and wellness\n- Cruise liners and bus tours\n- Events (private, business, cultural and sports)","d":"Hospitality industry: organisations providing food, drink and/or accommodation to people away from home.","w":"Accommodation and F&B are the core; the other sectors extend the industry."},
{"id":"t3-w3","t":"Accommodation","wr":true,"q":"Compare hotel chains and independent hotels.","a":"Hotel chain:\n- A group of hotels following standard operating procedures in marketing, reservations, service quality, F&B, housekeeping and accounting.\n- Example: Hilton brands (Hampton Inns, Embassy Suites, Homewood Suites).\nIndependent hotel:\n- Not associated with a franchise; gives more warmth and individuality.\n- The owner often functions as manager.\n- Room rates similar to chain properties; rooms decorated in different styles; inviting dining rooms.","d":"Business affiliation: whether a hotel belongs to a chain or is independent.","w":"The main contrast is standardisation (chain) versus individuality (independent)."},
{"id":"t3-w4","t":"Ownership and management","wr":true,"q":"Explain the three ways accommodation can be owned and operated, with examples.","a":"1. Owner-operated: the individual or company owns and runs the facility. Most are smaller (motels, camping grounds, B&Bs, hostels), though some large chains are owner-operated.\n2. Management contract: the owner employs a company to operate it, e.g. Sheraton, Hyatt, Marriott, Hilton; the hotel usually carries the management company's name.\n3. Franchise: the owner pays to use an established chain's name, joining its promotions and reservations, e.g. Best Western; examples in Oman given on the slides are Sheraton and Hyatt.","d":"Ownership and management: owner-operated, management contract, franchise.","w":"The difference is who owns, who runs, and whose name is on the hotel."},
{"id":"t3-w5","t":"Sales indicators","wr":true,"q":"Hotel ABC has 120 rooms. Tonight it sells 96 rooms for a total room revenue of OMR 7,200. Its rack rate is OMR 90. Calculate the occupancy percentage, ADR, RevPAR and yield.","a":"Occupancy % = 96 ÷ 120 × 100 = 80%\nADR = 7,200 ÷ 96 = OMR 75\nRevPAR = 7,200 ÷ 120 = OMR 60 (check: 80% × 75 = 60)\nRevenue potential = 120 × 90 = OMR 10,800\nYield = 7,200 ÷ 10,800 = 66.67%","d":"Occupancy = sold ÷ available; ADR = revenue ÷ sold; RevPAR = revenue ÷ available; Yield = revenue realised ÷ revenue potential.","w":"Use rooms SOLD for ADR and rooms AVAILABLE for RevPAR."},
{"id":"t3-w6","t":"Food and beverage","wr":true,"q":"Explain the three F&B market segments and the ways F&B operations can be owned and managed.","a":"Market segments:\n1. Restaurant market: fast food (limited menu, self-service, very low check, chains) and coffee shops (inexpensive menus, longer hours).\n2. Travel and lodging market: captive customers in hotels, airports, bus stations and clubs.\n3. Contract feeding and vending: subsidised or welfare catering for airlines, hospitals, schools, prisons and the armed forces, where profit is not the main concern.\nOwnership and management:\n- Self-operated: the owner runs the operation.\n- Franchise: the franchisee pays to use the franchisor's name, design and methods and keeps its standards.\n- Management contracting: a specialist company manages all or part of the operation.\n- Outsourcing: a branded restaurant or coffee chain operates inside the hotel.","d":"Food and beverage sector: three market segments and four management options.","w":"Organise the answer in two parts: markets, then ownership."}
]},
{"id":"tot-ch4","label":"Chapter 4","name":"Transport","questions":[
{"id":"t4-01","t":"Modes","q":"Why is transport a key sector of the tourism industry?","o":["All tourists need some form of transport; tourism cannot exist without it","Only business tourists use transport","Transport is the cheapest part of a trip","It replaces accommodation"],"d":"Transportation is a key sector because all tourists require some form of transport.","w":"Travel is part of every tourism trip."},
{"id":"t4-02","t":"Modes","q":"Which of these is NOT one of the three modes of transportation in tourism?","o":["Pipeline transport","Water transport","Land transport","Air transport"],"d":"Modes of transportation in tourism: water, land and air.","w":"Pipelines carry goods like oil, not tourists."},
{"id":"t4-03","t":"Water transport","q":"Ferry services and inland water transport are examples of:","o":["Short sea routes","Long-haul routes","Air routes","Rail routes"],"d":"Water transport: short sea routes (ferries, inland transport) and long-haul routes (cruise ships).","w":"Ferries cover short distances."},
{"id":"t4-04","t":"Water transport","q":"A cruise ship provides:","o":["Both transportation and accommodation","Only transportation","Only accommodation","Only food"],"d":"Cruise ship: provides transportation and accommodation services.","w":"Passengers travel and sleep on the same ship."},
