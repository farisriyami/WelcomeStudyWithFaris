{"id":"fn7-22","t":"Future of finance","q":"Decentralised finance (DeFi) provides financial services:","o":["Without traditional intermediaries, using blockchain technology","Only through central banks","Using paper records","Only to large corporations"],"d":"DeFi: a financial system built on blockchain that provides services without traditional financial intermediaries.","w":"It could improve financial inclusion for people excluded by high fees or limited access."},
{"id":"fn7-23","t":"Changes in finance","q":"Advances in technology let investors invest in foreign markets and companies raise capital globally. This change is:","o":["Globalisation","Regulatory reform","Sustainability","Remote work"],"d":"Globalisation: the world of finance has become increasingly global, increasing competition and market volatility.","w":"Cross-border investing and fundraising are signs of globalisation."},
{"id":"fn7-24","t":"Modern finance","tf":true,"ans":true,"q":"Modern finance tends to emphasise growth, innovation and risk-taking over stability.","d":"Modern finance: innovative methods using new technologies, emphasising growth, innovation and risk-taking.","w":"This is the opposite emphasis to traditional finance."},
{"id":"fn7-25","t":"Recent trends","tf":true,"ans":false,"q":"Remote work in finance accelerated mainly because of the 2008 financial crisis.","d":"Remote work: the COVID-19 pandemic accelerated work-from-home in the finance industry.","w":"The 2008 crisis led to regulatory reforms, not remote work."},
{"id":"fn7-w1","t":"Traditional vs modern","wr":true,"q":"Explain five differences between traditional finance and modern finance.","a":"1. Philosophy: traditional is conservative (stability, preserving capital); modern is dynamic (growth, taking risks).\n2. Investment strategies: traditional uses stocks, bonds and mutual funds; modern adds private equity, venture capital and hedge funds.\n3. Technology: modern rapidly adopts blockchain, robo-advisors and mobile banking; traditional relies on established systems.\n4. Risk management: traditional focuses on diversification and minimising risk; modern takes more risk and manages it with innovative instruments.\n5. Globalisation: modern is global (cross-border, international diversification); traditional focuses on local or regional markets.","d":"Traditional finance: stability-focused conventional practices. Modern finance: innovation- and growth-focused practices using new technology.","w":"Compare the two side by side on the same five points."},
{"id":"fn7-w2","t":"Changes in finance","wr":true,"q":"Explain four significant changes in the world of finance.","a":"1. Rise and growth of fintech: technology-based services (online banking, mobile payments, robo-advisors) that are faster, cheaper and more convenient; this increased competition for traditional banks.\n2. Focus on sustainability and social responsibility: growth of sustainable investing in companies with positive environmental and social impact.\n3. Regulatory reforms: after the 2008 crisis, e.g. the US Dodd-Frank Act and the EU's MiFID II (2018), to reduce risk, increase transparency and protect investors.\n4. Globalisation: easier investment in foreign markets and global capital raising, with more competition and volatility.","d":"Changes in finance: driven by technology, changing consumer behaviour and regulatory reform.","w":"Give each change a short example to show you understand it."},
{"id":"fn7-w3","t":"Benefits","wr":true,"q":"State and explain the benefits of recent trends in finance.","a":"1. Increased access to financial services (online banking, mobile payments, P2P lending), even in remote areas.\n2. Cost savings: lower fees and commissions than traditional institutions.\n3. Improved customer experience: convenient, personalised services such as robo-advisors.\n4. Better risk management: regulations require more capital and transparency.\n5. Increased investment opportunities: globalisation opens foreign markets, e.g. emerging market funds.\n6. Greater focus on sustainability: investors align money with values, encouraging sustainable businesses.","d":"Recent trends in finance: fintech, cryptocurrencies, sustainable finance, AI, online banking, digital payments, remote work.","w":"Link each benefit to the trend that causes it."},
{"id":"fn7-w4","t":"Challenges","wr":true,"q":"Explain the challenges created by recent trends in finance.","a":"1. Cybersecurity: more online transactions increase the risk of cyber attacks.\n2. Regulatory compliance: data privacy, AML and KYC rules are costly and time-consuming.\n3. Financial inclusion: low-income groups or those without technology may be excluded.\n4. Consumer protection: complex products (e.g. cryptocurrencies) can confuse and exploit consumers.\n5. Financial stability: global interconnectedness can spread crises (contagion, systemic risk).\n6. Ethical concerns: high-frequency trading, short selling and leveraged products.","d":"Challenges: the risks and difficulties that come with new financial trends.","w":"Each challenge is the downside of a trend: fintech brings cyber risk, globalisation brings contagion, and so on."},
{"id":"fn7-w5","t":"Innovative tools","wr":true,"q":"Explain five innovative tools in finance.","a":"1. Robo-advisors: algorithm-based platforms giving low-cost personalised investment advice.\n2. Blockchain: a decentralised, secure and transparent digital ledger used for digital currencies, smart contracts and identity verification.\n3. Crowdfunding: raising small contributions from many people online, also useful to test market demand.\n4. Digital wallets: store digital currencies and make fast, secure payments.\n5. Big data and analytics: analyse large data sets for better decisions, fraud detection and customer segmentation.\n(Others: chatbots for 24/7 support; mobile banking apps.)","d":"Innovative tools: new technologies that make financial management more efficient, cheaper and accessible.","w":"Name the tool, say what it does, and give one benefit."},
{"id":"fn7-w6","t":"Future of finance","wr":true,"q":"Describe the trends likely to shape the future of finance.","a":"1. Fintech: blockchain, AI and machine learning making services more efficient and secure.\n2. Digital currencies: Bitcoin, Ethereum and possible government digital currencies, reducing use of cash.\n3. Sustainable investing: becoming mainstream as investors align money with values.\n4. Big data and analytics: better risk management and tailored products.\n5. Decentralised finance (DeFi): blockchain-based services without intermediaries, improving inclusion.\n6. Regulatory changes: new rules on data privacy, AML, KYC and sustainable investing.","d":"Future of finance: greater efficiency, accuracy, security, financial inclusion and sustainability.","w":"These six trends are listed in the notes; institutions that adapt will be best placed to succeed."}
]},
{"id":"fn-ch8","label":"Chapter 8","name":"MS Excel for Finance Functions","questions":[
{"id":"fn8-01","t":"Uses of Excel","q":"Building complex models to analyse investment opportunities or a company's financial health is called:","o":["Financial modelling","Financial reporting","Data analysis","Loan amortisation"],"d":"Financial modelling: creating financial models to analyse investments or evaluate a company's financial health, identify trends, forecast performance and assess risk.","w":"Reporting produces statements; modelling builds forward-looking analysis."},
{"id":"fn8-02","t":"Uses of Excel","q":"A table showing each loan payment broken into interest, principal and remaining balance is a:","o":["Loan amortisation schedule","Budget","Balance sheet","Cash flow statement"],"d":"Amortisation schedule: shows the payment schedule of a loan over time, with payment, interest, principal and remaining balance.","w":"It helps borrowers understand how interest affects their loan."},
{"id":"fn8-03","t":"Interest and values","q":"With principal in B1, rate in B2 and years in B3, which formula gives simple interest?","o":["=B1*B2*B3","=B1*(1+B2)^B3","=B1/(1+B2)^B3","=FV(B2,B3,0,-B1)"],"d":"Simple interest in Excel: =Principal*Rate*Time (no built-in function).","w":"For RO 10,000 at 5% for 3 years this gives RO 1,500. The other formulas compute compound amounts or present values."},
{"id":"fn8-04","t":"Interest and values","q":"What does the formula =B1/(1+B2)^B3 calculate (B1 = future value, B2 = rate, B3 = years)?","o":["Present value","Future value","Simple interest","Monthly payment"],"d":"Present value = Future value ÷ (1 + rate)^years.","w":"Dividing a future amount by the growth factor brings it back to today's value."},
{"id":"fn8-05","t":"Interest and values","q":"Using =B1/(1+B2)^B3, what is the present value of RO 5,000 received in 5 years at 7%?","o":["RO 3,564.931","RO 7,012.759","RO 3,703.704","RO 3,500.000"],"d":"Present value = FV ÷ (1 + r)^n.","w":"5,000 ÷ 1.07^5 = 5,000 ÷ 1.402552 = RO 3,564.931."},
{"id":"fn8-06","t":"Interest and values","q":"What does =FV(5%, 5, 0, -10000) return?","o":["RO 12,762.816","RO 12,500.000","RO 10,000.000","RO 7,835.262"],"d":"FV function: =FV(rate, nper, pmt, [pv], [type]).","w":"It grows RO 10,000 at 5% for 5 years: 10,000 × 1.05^5 = RO 12,762.816."},
{"id":"fn8-07","t":"Interest and values","q":"In =FV(5%, 5, 0, -10000), what does the 0 represent?","o":["The payment per period (there are no regular payments)","The interest rate","The number of years","Payments due at the beginning"],"d":"FV arguments: rate, nper (number of periods), pmt (payment per period), pv (present value), type.","w":"The third argument is pmt. It is 0 because this is a single lump-sum investment."},
{"id":"fn8-08","t":"Interest and values","q":"Using =B1*(1+B2)^B3, what does RO 1,000 grow to at 5% compounded annually for 10 years?","o":["RO 1,628.895","RO 1,500.000","RO 1,050.000","RO 2,250.000"],"d":"Compound value in Excel: =Principal*(1+Rate)^Years.","w":"1,000 × 1.05^10 = RO 1,628.895, matching the growth table in the notes."},
{"id":"fn8-09","t":"Annuities","q":"What does =PV(5%, 5, -1000) return?","o":["RO 4,329.477","RO 5,000.000","RO 5,525.631","RO 4,000.000"],"d":"PV of an ordinary annuity = PMT × [1 − (1 + r)^(−n)] ÷ r; Excel: =PV(rate, nper, pmt, [fv], [type]).","w":"1,000 × [1 − 1.05^(−5)] ÷ 0.05 = RO 4,329.477. You would invest this today to receive RO 1,000 a year for 5 years."},
{"id":"fn8-10","t":"Annuities","q":"What does =FV(8%, 10, -1000, 0) return?","o":["RO 14,486.562","RO 10,000.000","RO 21,589.250","RO 10,800.000"],"d":"FV of an ordinary annuity = PMT × [(1 + r)^n − 1] ÷ r.","w":"1,000 × [(1.08)^10 − 1] ÷ 0.08 = 1,000 × 14.486562 = RO 14,486.562."},
{"id":"fn8-11","t":"Loan functions","q":"A loan has four components; if you know three you can calculate the fourth. Which is NOT one of them?","o":["The borrower's credit score","The loan amount","The interest rate","The number of payment periods"],"d":"Loan components: loan amount, interest rate, number of payment periods, periodic payment amount.","w":"Excel functions (PMT, RATE, NPER, PV) each solve for one of these four."},
{"id":"fn8-12","t":"Loan functions","q":"The PMT function returns:","o":["The loan payment (principal plus interest) per period","The principal part of one payment","The interest part of one payment","The number of periods"],"d":"PMT: loan payment per period assuming constant payments and a fixed rate. Syntax =PMT(rate, nper, pv, fv, type).","w":"PPMT gives the principal part and IPMT the interest part."},
{"id":"fn8-13","t":"Loan functions","q":"The PPMT function returns:","o":["The principal part of a loan payment for a given period","The interest part of a payment","The total payment","The interest rate"],"d":"PPMT: principal part of a loan payment for a given period. Syntax =PPMT(rate, per, nper, pv, fv, type).","w":"The extra 'P' stands for principal."},
{"id":"fn8-14","t":"Loan functions","q":"Which function returns the number of payment periods for a loan?","o":["NPER","RATE","PV","PMT"],"d":"NPER: number of payment periods given the loan amount, interest rate and periodic payment.","w":"N-PER = number of periods."},
{"id":"fn8-15","t":"Loan functions","q":"Which function returns the original loan amount, given the rate, number of periods and payment?","o":["PV","FV","NPER","IPMT"],"d":"PV: the present value (original loan amount) given rate, number of periods and payment.","w":"The amount borrowed today is a present value."},
{"id":"fn8-16","t":"Loan functions","q":"For a monthly loan at 6% per annum, the rate argument in PMT should be:","o":["6%/12","6%","6%*12","12/6%"],"d":"rate: the interest rate per period. For monthly payments, rate per period = annual rate ÷ 12.","w":"The rate must match the payment period; monthly payments need a monthly rate."},
{"id":"fn8-17","t":"Loan functions","q":"What is the monthly payment on a RO 18,500 loan at 7.25% for 3 years?","o":["RO 573.343","RO 513.889","RO 551.146","RO 633.959"],"d":"PMT = P × r ÷ [1 − (1 + r)^(−n)], with r = 7.25% ÷ 12 and n = 36.","w":"=PMT(7.25%/12, 36, -18500) = RO 573.343."},
{"id":"fn8-18","t":"Loan functions","q":"A RO 5,000 loan at 6% is repaid with monthly payments of RO 346.82 at the end of each month. What does NPER return?","o":["15 months","12 months","14.4 months","24 months"],"d":"NPER(rate, pmt, pv): number of periods to repay.","w":"=NPER(6%/12, -346.82, 5000) = 15. Check: the PMT for RO 5,000 at 0.5% a month over 15 months is RO 346.82."},
{"id":"fn8-19","t":"Loan functions","q":"A loan at 6% is repaid over 15 months with payments of RO 346.82 at the end of each month. What does PV return?","o":["RO 4,999.974","RO 5,202.300","RO 5,300.000","RO 4,500.000"],"d":"PV(rate, nper, pmt): the original loan amount.","w":"=PV(6%/12, 15, -346.82) = RO 4,999.974, about RO 5,000. It is less than 15 × 346.82 because part of each payment is interest."},
{"id":"fn8-20","t":"Amortisation","q":"In an amortisation schedule for a monthly loan at 5%, the interest in each row is:","o":["The remaining balance × 5%/12","The loan amount × 5%","The payment × 5%","The principal paid × 12"],"d":"Interest paid each period = remaining balance × (annual rate ÷ payment frequency).","w":"Interest is charged only on what is still owed, for one month."},
{"id":"fn8-21","t":"Amortisation","q":"In an amortisation schedule, each row's remaining balance equals:","o":["Previous remaining balance − principal paid in the row","Previous balance − the full payment","Loan amount − interest paid","Payment − interest"],"d":"Remaining balance: subtract the principal paid from the previous remaining balance.","w":"Only the principal part reduces the debt; the interest part is the cost of borrowing."},
{"id":"fn8-22","t":"Amortisation","q":"In Excel's PV, FV and PMT functions, type = 0 means:","o":["Payments are due at the end of each period (the default)","Payments are due at the beginning of each period","No interest is charged","The loan has no future value"],"d":"type: 0 = end of period (default); 1 = beginning of period.","w":"Most loans are paid at the end of each month, so 0 is the default."},
{"id":"fn8-23","t":"Interest and values","tf":true,"ans":false,"q":"Excel has a built-in function for simple interest.","d":"Simple interest in Excel: use the formula =Principal*Rate*Time.","w":"There is no inbuilt simple interest function; you create the equation yourself."},
{"id":"fn8-24","t":"Interest and values","tf":true,"ans":true,"q":"In the growth table, RO 1,000 invested at 5% compounded annually is worth RO 1,276.29 after 5 years.","d":"Compound value = Principal × (1 + rate)^years.","w":"1,000 × 1.05^5 = 1,276.28, shown as RO 1,276.29 in the table after rounding each year."},
{"id":"fn8-25","t":"Loan functions","tf":true,"ans":true,"q":"IPMT returns the interest part of a loan payment for a given period.","d":"IPMT syntax: =IPMT(rate, per, nper, pv, fv, type).","w":"'I' is for interest; 'per' tells Excel which payment period you want."},
{"id":"fn8-w1","t":"Interest and values","wr":true,"q":"Describe the steps to calculate simple interest in Excel on RO 10,000 at 5% for 3 years. What is the result?","a":"1. Open a new workbook.\n2. A1: 'Principal Amount', B1: 10000.\n3. A2: 'Interest Rate', B2: 5%.\n4. A3: 'Time in Years', B3: 3.\n5. A4: 'Simple Interest', B4: =B1*B2*B3.\n6. Press Enter. Result = RO 1,500.","d":"Simple interest = Principal × Rate × Time.","w":"Excel has no simple interest function, so the formula multiplies the three input cells."},
{"id":"fn8-w2","t":"Interest and values","wr":true,"q":"Show how to calculate in Excel the present value of RO 5,000 received in 5 years at 7%, both with a formula and with the PV function.","a":"Formula method: B1 = 5000 (future value), B2 = 7%, B3 = 5. B4: =B1/(1+B2)^B3 → RO 3,564.931\nFunction method: =PV(7%, 5, 0, -5000) → RO 3,564.931","d":"Present value = Future value ÷ (1 + rate)^years.","w":"Both methods discount the RO 5,000 back 5 years at 7%."},
{"id":"fn8-w3","t":"Loan functions","wr":true,"q":"Explain the PMT, PPMT and IPMT functions with their syntax.","a":"PMT: returns the total loan payment (principal + interest) per period, assuming constant payments and a fixed rate. =PMT(rate, nper, pv, fv, type)\nPPMT: returns the principal part of a payment for a given period. =PPMT(rate, per, nper, pv, fv, type)\nIPMT: returns the interest part of a payment for a given period. =IPMT(rate, per, nper, pv, fv, type)\nFor any period, PPMT + IPMT = PMT.","d":"rate = rate per period; per = the period number; nper = total periods; pv = loan amount; fv and type are optional.","w":"PMT gives the whole payment; PPMT and IPMT split it into its two parts."},
{"id":"fn8-w4","t":"Amortisation","wr":true,"q":"List the steps to create a loan amortisation schedule in Excel.","a":"1. Set up the table: Payment Number, Payment Amount, Interest Paid, Principal Paid, Remaining Balance.\n2. Enter the inputs: loan amount, interest rate, loan term and payment frequency.\n3. Calculate the payment with PMT.\n4. Remaining balance: first row = loan amount; each next row = previous balance − principal paid.\n5. Interest paid = remaining balance × rate ÷ payment frequency (e.g. =B2*(5%/12)).\n6. Principal paid = payment − interest paid.\n7. Copy the formulas down to the end of the loan term.\n8. Format amounts as currency.","d":"Amortisation schedule: a table showing each payment's interest, principal and remaining balance.","w":"The last remaining balance should be zero, which confirms the schedule is correct."},
{"id":"fn8-w5","t":"Amortisation","wr":true,"q":"A person borrows RO 15,000 repayable in equal monthly instalments at the end of each month for 48 months at 6%. Find the monthly payment and the first two rows of the amortisation schedule.","a":"Payment: =PMT(6%/12, 48, -15000) = RO 352.275\nMonth 1: interest = 15,000 × 0.005 = RO 75.000; principal = RO 277.275; balance = RO 14,722.725\nMonth 2: interest = RO 73.614; principal = RO 278.662; balance = RO 14,444.063","d":"PMT = P × r ÷ [1 − (1 + r)^(−n)] with r = 0.06/12 = 0.005.","w":"Interest is charged on the falling balance, so the principal part grows each month."},
{"id":"fn8-w6","t":"Loan functions","wr":true,"q":"A company borrows RO 5,000 at 6%, repayable by equal monthly payments of RO 346.82 at the end of each month. Using Excel, find (a) the number of payments and (b) the loan amount if the term were given as 15 months.","a":"(a) =NPER(6%/12, -346.82, 5000) = 15 monthly payments\n(b) =PV(6%/12, 15, -346.82) = RO 4,999.974 ≈ RO 5,000","d":"NPER returns the number of periods; PV returns the original loan amount.","w":"The two answers check each other: 15 payments of RO 346.82 at 0.5% a month repay exactly RO 5,000."}
]}
]},
{"id":"management","name":"Management","sub":"Principles of Management (BSMG1209)","chapters":[
{"id":"mg-ch1","label":"Chapter 1","name":"Management: An Overview","questions":[
{"id":"mg1-01","t":"Definitions","q":"Mary Parker defined management as:","o":["The art of getting things done through people","Deciding in advance what is to be done","Making adjustments to predetermined plans and standards","A body of knowledge developed through experiments"],"d":"Management (Mary Parker): the art of getting things done through people.","w":"Deciding in advance is planning, adjusting to plans is controlling, and a body of knowledge is the definition of science."},
{"id":"mg1-02","t":"Definitions","q":"Koontz and Weihrich describe management as the process of maintaining an environment in which:","o":["Individuals working together in groups efficiently accomplish selected aims","Managers make every decision alone","Employees work without any goals","Only top managers set and achieve objectives"],"d":"Management (Koontz & Weihrich): the process of designing and maintaining an environment in which individuals, working together in groups, efficiently accomplish selected aims.","w":"The key ideas are people working in groups and achieving chosen aims efficiently."},
{"id":"mg1-03","t":"Science or art","q":"Which is a reason management is considered a SCIENCE?","o":["Managers' conclusions are drawn from data analysis","It gets things done through other people","It depends on conscious effort and practice","It adapts plans to environmental change"],"d":"Science: a body of knowledge developed systematically, based on observation, measurement, experimentation and inferences from data.","w":"Management works through input-output systems, builds knowledge through observation and measurement, and draws conclusions from data. The other options describe management as an art."},
{"id":"mg1-04","t":"Science or art","q":"Why is management also considered an ART?","o":["It gets things done through people and adapts plans to environmental changes","It is based only on laboratory experiments","It never changes over time","It uses only mathematical formulas"],"d":"Art: understanding how a particular activity can be done by conscious effort and practice.","w":"Managing people and responding to a changing environment needs personal skill and practice, which is what makes it an art."},
{"id":"mg1-05","t":"Science or art","q":"Management is best described as:","o":["Both an art and a science","Only an art","Only a science","Neither an art nor a science"],"d":"Management uses systematic knowledge (science) and personal skill in applying it (art).","w":"It meets the characteristics of a science, and it also requires practice and judgement, so it is both."},
{"id":"mg1-06","t":"Functions","q":"Which of these is NOT one of the management functions on the slides?","o":["Co-operation","Planning","Staffing","Controlling"],"d":"Management functions: planning, organizing, staffing, directing and controlling.","w":"Co-operation is a good outcome, but it is not one of the five functions."},
{"id":"mg1-07","t":"Functions","q":"'Deciding in advance what to do, when to do it, how to do it and who will do it' describes:","o":["Planning","Organizing","Directing","Controlling"],"d":"Planning: courses of action to achieve organizational objectives; deciding in advance. The mission is the basis for planning.","w":"Planning involves decision-making about the future, before any work is done."},
{"id":"mg1-08","t":"Functions","q":"Saving money in case of emergency needs is an example of:","o":["Contingency planning","Staffing","Directing","Liaison"],"d":"Contingency planning: planning needed because future environmental conditions are difficult to predict.","w":"The slides give 'savings in case of emergency needs' as the example of contingency planning."},
{"id":"mg1-09","t":"Functions","q":"What is the FIRST step in the organizing process?","o":["Identification of work","Grouping of work into smaller groups","Assigning work to every individual","Defining authority and responsibility"],"d":"Organizing process: 1 identify work, 2 group work, 3 assign work, 4 define authority and responsibility, 5 establish relationships towards goals.","w":"You must know what work exists before you can group it or assign it."},
{"id":"mg1-10","t":"Functions","q":"Employees' development needs are identified through:","o":["Performance appraisal","Contingency planning","Organizational charts","Ratio analysis"],"d":"Staffing (human resource management): job analysis, recruitment, selection, induction, placement, training and development.","w":"Performance appraisal shows where an employee needs development; training then uses on-the-job and off-the-job methods."},
{"id":"mg1-11","t":"Functions","q":"Motivation, leadership and communication are part of which management function?","o":["Directing","Planning","Organizing","Controlling"],"d":"Directing: motivating, commanding, leading and activating people to secure their contribution.","w":"These three activities influence people to work towards objectives, which is directing."},
{"id":"mg1-12","t":"Functions","q":"What is the correct order of the controlling process?","o":["Set a standard → measure actual performance → compare with standards → identify deviations → correct deviations","Measure performance → set a standard → correct deviations → compare","Identify deviations → set a standard → measure → correct","Correct deviations → measure → compare → set a standard"],"d":"Controlling: making adjustments to predetermined plans and standards.","w":"You need a standard before you can measure against it, and you must find the gap before you can correct it."},
{"id":"mg1-13","t":"Managerial roles","q":"Who developed the framework of managerial roles?","o":["Henry Mintzberg","Mary Parker","Harold Koontz","Pearce and Robinson"],"d":"Managerial roles: organized sets of behaviours identified with a position, developed by Henry Mintzberg.","w":"Mintzberg grouped them into interpersonal, informational and decisional roles."},
{"id":"mg1-14","t":"Managerial roles","q":"Ms. Ameena welcomes guests and visitors and acts as a representative of the company. Which role is this?","o":["Figurehead","Leader","Liaison","Spokesperson"],"d":"Figurehead role (interpersonal): ceremonial duties as head, symbolising the organization.","w":"Welcoming visitors and representing the company are ceremonial, symbolic duties."},
{"id":"mg1-15","t":"Managerial roles","q":"Mr. Saif is active in connecting with people outside the organization and always attends conferences to network. Which role is this?","o":["Liaison","Figurehead","Monitor","Negotiator"],"d":"Liaison role (interpersonal): maintaining a network of contacts and information sources outside the top management.","w":"Networking with outsiders at meetings and conferences is liaison."},
{"id":"mg1-16","t":"Managerial roles","q":"Ms. Amal, head of engineering, has authority to form committees and set project deadlines for her department. Which role is this?","o":["Leader","Liaison","Disseminator","Entrepreneur"],"d":"Leader role (interpersonal): coordinates and guides subordinates, with formal authority to get things done.","w":"She uses formal authority over her own team, which is the leader role."},
{"id":"mg1-17","t":"Managerial roles","q":"Mr. Saif visits employees' offices, joins informal chats, then tells top management about any work issues he heard. Which role is this?","o":["Monitor","Spokesperson","Negotiator","Resource allocator"],"d":"Monitor role (informational): getting information by scanning the environment, including gossip and the grapevine.","w":"He is gathering information through informal channels, which is monitoring."},
{"id":"mg1-18","t":"Managerial roles","q":"Ms. Latifa regularly informs customers and employees about the company's new offers and programmes. Which role is this?","o":["Spokesperson","Monitor","Figurehead","Disturbance handler"],"d":"Spokesperson role (informational): transmitting information to key groups, including outsiders such as customers, shareholders and government.","w":"Passing company information to customers is speaking for the organization."},
{"id":"mg1-19","t":"Managerial roles","q":"A manager meets a key supplier to agree a contract with favourable prices and delivery dates. Which role is this?","o":["Negotiator","Entrepreneur","Liaison","Resource allocator"],"d":"Negotiator role (decisional): representing the organization in negotiating important agreements.","w":"Agreeing contract terms on the company's behalf is negotiation."},
{"id":"mg1-20","t":"Managerial roles","q":"During a sudden drop in sales, a manager reorganises teams, resolves conflicts and takes corrective action. Which role is this?","o":["Disturbance handler","Entrepreneur","Monitor","Figurehead"],"d":"Disturbance handler role (decisional): taking corrective action in times of disturbance or crisis.","w":"A sudden crisis requiring corrective action is the trigger for this role."},
{"id":"mg1-21","t":"Managerial roles","q":"A manager hears employees' suggestions, approves budgets for promising projects and decides how to distribute resources. Which role is this?","o":["Resource allocator","Negotiator","Spokesperson","Liaison"],"d":"Resource allocator role (decisional): allocating resources by making or approving decisions, often with an open-door policy.","w":"Approving budgets and distributing resources is resource allocation."},
{"id":"mg1-22","t":"Levels and skills","q":"Formulating objectives, policies and corporate-level strategies is the responsibility of:","o":["Top-level managers","Middle-level managers","First-line supervisors","Operating employees"],"d":"Top-level managers: MD/President, vice-presidents and general managers, responsible for the overall management of the company.","w":"Corporate strategy covers the whole company, so it belongs to top management."},
{"id":"mg1-23","t":"Levels and skills","q":"Managers of the production, marketing, finance, HR and R&D departments are:","o":["Middle-level managers","Top-level managers","Lower-level managers","Staff specialists only"],"d":"Middle-level managers: department managers responsible for their department's success, who lead lower-level managers.","w":"They set departmental goals based on the organization's goals."},
{"id":"mg1-24","t":"Levels and skills","q":"The ability to see the organization as a 'big picture' and how its parts affect each other is:","o":["Conceptual skill","Technical skill","Human skill","Negotiation skill"],"d":"Conceptual skills: seeing the big picture and how parts can be organized; the foundation for strategizing. Most important for top management.","w":"Top managers make decisions for the whole organization, so they need the big picture most."},
{"id":"mg1-25","t":"Levels and skills","tf":true,"ans":true,"q":"Technical skills are more important for frontline (lower-level) managers than for top managers.","d":"Technical skills: specialised knowledge and expertise to perform specific methods, processes or techniques.","w":"Frontline managers supervise day-to-day operations directly and need practical knowledge to guide employees."},
{"id":"mg1-26","t":"Levels and skills","tf":true,"ans":false,"q":"Human skills are important only for middle managers.","d":"Human skills: the ability to communicate, persuade, manage conflict, motivate, coach, negotiate and lead.","w":"Human skills are equally important at ALL levels, because managers at every level must get people to work together towards common goals."},
{"id":"mg1-27","t":"Levels and skills","tf":true,"ans":true,"q":"Lower-level managers are also called first-line managers or supervisors.","d":"Lower-level managers: responsible for the operating staff; called first-line, first-level or junior managers, or supervisors.","w":"They directly supervise operating employees while they work."},
{"id":"mg1-28","t":"Managerial roles","tf":true,"ans":false,"q":"Figurehead is one of Mintzberg's decisional roles.","d":"Interpersonal roles: figurehead, leader, liaison. Informational: monitor, disseminator, spokesman. Decisional: entrepreneur, disturbance handler, resource allocator, negotiator.","w":"Figurehead is an interpersonal role."},
{"id":"mg1-29","t":"Functions","tf":true,"ans":true,"q":"Controlling makes sure the organization is moving towards its mission and objectives.","d":"Controlling: ensuring the organization moves towards its mission and objectives by adjusting to plans and standards.","w":"It closes the loop with planning by comparing results against the plan."},
{"id":"mg1-30","t":"Functions","tf":true,"ans":true,"q":"The mission is the basis for planning.","d":"Planning: the mission is the basis for planning; it means deciding in advance the means to achieve goals.","w":"Plans are made to fulfil the organization's mission."},
{"id":"mg1-w1","t":"Functions","wr":true,"q":"Explain the five functions of management.","a":"1. Planning: deciding in advance what to do, when, how and by whom; setting courses of action to achieve objectives (long-term, short-term and contingency plans).\n2. Organizing: establishing relationships among people, tasks and activities: identifying work, grouping it, assigning it, defining authority and responsibility, and establishing relationships.\n3. Staffing: human resource management: job analysis, recruitment, selection, induction, placement, training and development.\n4. Directing: motivating, commanding, leading and communicating with people to secure their contribution.\n5. Controlling: setting standards, measuring performance, comparing, identifying deviations and correcting them.","d":"Management functions: planning, organizing, staffing, directing and controlling.","w":"Each function builds on the one before it: plan the work, organize it, staff it, direct people, then control results against the plan."},
{"id":"mg1-w2","t":"Science or art","wr":true,"q":"Explain why management is considered both a science and an art.","a":"Science: a body of knowledge developed systematically through observation, measurement and experimentation. Management is a science because it works through input-output systems, its knowledge is developed through observation and experimentation, and managers draw conclusions from data analysis.\nArt: understanding how an activity can be done by conscious effort and practice. Management is an art because it means getting things done through other people, and it analyses the environment to form plans and strategies that fit environmental changes.\nSo management is both an art and a science.","d":"Science: systematic knowledge based on data. Art: skill developed through conscious effort and practice.","w":"A full answer defines both terms and gives a reason for each side."},
{"id":"mg1-w3","t":"Managerial roles","wr":true,"q":"Explain Mintzberg's three categories of managerial roles and the roles in each.","a":"1. Interpersonal roles: figurehead (ceremonial duties, symbol of the organization), leader (guides and coordinates subordinates with formal authority), liaison (network of contacts outside top management).\n2. Informational roles: monitor (gathers information from the environment, including the grapevine), disseminator (passes information to the management team and key people), spokesman (transmits information to insiders and outsiders such as shareholders, customers and government).\n3. Decisional roles: entrepreneur (looks for projects to improve products and processes), disturbance handler (corrective action in crises), resource allocator (allocates resources by making or approving decisions), negotiator (represents the organization in important agreements).","d":"Managerial roles: organized sets of behaviours identified with a manager's position (Henry Mintzberg).","w":"There are 10 roles in total: 3 interpersonal, 3 informational and 4 decisional."},
{"id":"mg1-w4","t":"Levels and skills","wr":true,"q":"Describe the three levels of management.","a":"1. Top level: MD/President, vice-presidents, general managers. Responsible for overall performance; formulate objectives, policies and corporate strategies; lead and coordinate middle managers.\n2. Middle level: managers of production, marketing, finance, HR and R&D departments. Responsible for their department's success; set departmental goals and strategies; lead and coordinate lower-level managers.\n3. Lower level (first-line, junior managers or supervisors): responsible for the operating staff; direct, lead, motivate and supervise operating employees in their daily work.","d":"Management levels: top, middle and lower (first-line) management.","w":"Each level's scope narrows: the whole company, then one department, then one team of operating employees."},
{"id":"mg1-w5","t":"Levels and skills","wr":true,"q":"Explain the three managerial skills and how they relate to the levels of management.","a":"1. Conceptual skills: seeing the organization as a big picture and how its parts affect each other; the foundation for strategizing. Needed at all levels but most important for top management.\n2. Technical skills: specialised knowledge and expertise in methods, processes or techniques (e.g. using equipment, following audit procedures). More important for frontline managers, who supervise day-to-day operations.\n3. Human skills: communicating, persuading, managing conflict, motivating, coaching, negotiating and leading. Equally important at all levels, because every manager must get people to work together.","d":"Managerial skills: conceptual, technical and human skills.","w":"As you move up the levels, conceptual skills matter more and technical skills matter less; human skills stay important throughout."},
{"id":"mg1-w6","t":"Functions","wr":true,"q":"You have a financial problem in your small business. Explain the steps of the controlling process you would follow.","a":"1. Set a standard: e.g. a monthly budget and target profit.\n2. Measure actual performance: record actual sales, costs and profit.\n3. Compare actual performance with the plans and standards (e.g. using financial statements, ratio analysis and budgets).\n4. Identify the deviations (gaps): e.g. costs 20% above budget.\n5. Correct the deviations: e.g. reduce unnecessary spending or adjust prices, then keep monitoring.","d":"Controlling: making adjustments to predetermined plans and standards.","w":"The slides give financial control through financial statements, ratio analysis and budgets as an example of controlling."}
]},
{"id":"mg-ch2","label":"Chapter 2","name":"Planning and Decision Making","questions":[
{"id":"mg2-01","t":"Meaning of planning","q":"According to Koontz and O'Donnell, a plan bridges the gap between:","o":["Where we are and where we want to go","Managers and employees","Income and expenses","The past and the present"],"d":"Planning (Koontz & O'Donnell): deciding in advance what is to be done in future.","w":"A plan connects the current position to the desired future position."},
{"id":"mg2-02","t":"Need for planning","q":"Which is a reason organizations need planning, according to the slides?","o":["To facilitate control by establishing a standard for later activity","To remove all future uncertainty permanently","To avoid setting objectives","To replace decision-making"],"d":"Need for planning: to offset uncertainty and change, focus activity on objectives, provide a coordinated road map, increase economic efficiency, and facilitate control.","w":"Planning reduces (offsets) uncertainty but cannot remove it. It also sets the standards that controlling measures against."},
{"id":"mg2-03","t":"Types of plans","q":"Long-range plans typically look:","o":["Three or more years into the future","One year or less into the future","One month ahead","Only at the past year"],"d":"Long-range plans: three or more years ahead. Short-range plans: one year or less.","w":"This is the classification of plans on the basis of time."},
{"id":"mg2-04","t":"Types of plans","q":"Strategic plans are:","o":["Broad, long-term plans for the whole organization, made by top management","Narrow, short-term plans made by lower management","Functional plans made by middle management","Plans used only once for a single problem"],"d":"Strategic plans: broad, comprehensive, longer-term directions for the entire organization; made by top management; include the vision.","w":"Narrow short-term plans are operational; functional plans are tactical."},
{"id":"mg2-05","t":"Types of plans","q":"Production, marketing, HR and financial plans that help implement the strategy are:","o":["Tactical plans","Strategic plans","Operational plans","Contingency plans"],"d":"Tactical plans: help implement all or parts of the strategic plan; functional plans made by middle management.","w":"They translate the overall strategy into plans for each function."},
{"id":"mg2-06","t":"Types of plans","q":"Short-term, specific plans made by lower management for a particular area are:","o":["Operational plans","Strategic plans","Tactical plans","Long-range plans"],"d":"Operational plans: identify short-term activities to implement strategic plans; narrow, specific and usually standing; made by lower management.","w":"They are the most detailed level of the planning hierarchy."},
{"id":"mg2-07","t":"Types of plans","q":"Projects, budgets and programmes for non-recurring problems are examples of:","o":["Single-use plans","Standing plans","Policies","Rules"],"d":"Single-use (specific) plans: made for non-recurring, unique problems and cannot be used again.","w":"Once the project or programme is finished, the plan is not reused."},
{"id":"mg2-08","t":"Types of plans","q":"Objectives, policies, procedures, methods, rules and strategies used again and again are:","o":["Standing plans","Single-use plans","Projects","Budgets"],"d":"Standing (repeated-use) plans: guide decisions and actions on recurring problems at various levels.","w":"They are designed to be used repeatedly for situations that keep coming back."},
{"id":"mg2-09","t":"Hierarchy of plans","q":"General statements or understandings that guide thinking and action in decision-making are:","o":["Policies","Rules","Procedures","Budgets"],"d":"Policies: general statements that guide or direct thinking and action in decision-making.","w":"Policies leave room for judgement; rules and procedures are more specific."},
{"id":"mg2-10","t":"Hierarchy of plans","q":"Plans that spell out a specific required action or non-action, allowing NO discretion, are:","o":["Rules","Policies","Strategies","Objectives"],"d":"Rules: spell out specific required action or non-action, allowing no discretion or choice.","w":"Unlike policies, rules leave no room for personal judgement."},
{"id":"mg2-11","t":"Hierarchy of plans","q":"Plans that detail the exact manner in which an activity must be done (a standardised way of performing a task) are:","o":["Procedures","Policies","Strategies","Objectives"],"d":"Procedures: establish a desired method of handling future activities; guides to action rather than thinking.","w":"They describe the exact sequence of steps to follow."},
{"id":"mg2-12","t":"Hierarchy of plans","q":"A statement of expected results in numbers, sometimes called a 'numerical programme', is a:","o":["Budget","Policy","Rule","Strategy"],"d":"Budget: a statement of expected results in numerical terms, e.g. cash, sales or capital expenditure budgets.","w":"The key word is 'numbers'."},
{"id":"mg2-13","t":"Hierarchy of plans","q":"Determining the basic long-term objectives of an enterprise and the courses of action and resources needed to achieve them is:","o":["Strategy","Procedure","Rule","Programme"],"d":"Strategy: determining basic long-term objectives and adopting courses of action and allocating resources to achieve them.","w":"Strategy is about long-term direction and resource allocation, not detailed steps."},
{"id":"mg2-14","t":"Steps in planning","q":"Analysing internal strengths and weaknesses and external technological, economic and political factors is which planning step?","o":["Being aware of opportunities and strengths","Developing premises","Selecting a course","Budgeting"],"d":"Step 1 of planning: being aware of opportunities and strengths through internal and external environmental analysis.","w":"Planning starts by understanding where the organization stands."},
{"id":"mg2-15","t":"Steps in planning","q":"A new competitor entering your home market is a:","o":["Threat","Weakness","Strength","Opportunity"],"d":"SWOT: strengths and weaknesses are internal; opportunities and threats are external.","w":"A competitor is outside the organization and can harm it, so it is a threat."},
{"id":"mg2-16","t":"Steps in planning","q":"Poor quality of a company's goods and services is a:","o":["Weakness","Threat","Opportunity","Strength"],"d":"Weakness: an internal factor that limits the organization.","w":"Product quality is inside the company's control, and poor quality is negative, so it is a weakness."},
{"id":"mg2-17","t":"Steps in planning","q":"Making assumptions about the future environment, e.g. what new markets or technologies will emerge, is called:","o":["Developing premises","Establishing objectives","Formulating derivative plans","Evaluating alternatives"],"d":"Premises: assumptions about the environment (forecasts, policies, guidelines) that all planning managers should share.","w":"The slides' MCQ also calls this 'setting planning premises'."},
{"id":"mg2-18","t":"Steps in planning","q":"Policies, procedures, rules, programmes and schedules prepared as secondary plans are:","o":["Derivative plans","Planning premises","Alternative courses","Strategic plans"],"d":"Formulating derivative plans (step 7): sub-plans or secondary plans that support the main plan.","w":"They are derived from the selected course of action."},
{"id":"mg2-19","t":"Decision-making","q":"Koontz and Weihrich describe decision-making as:","o":["The selection of a course of action from among alternatives, and the core of planning","Following rules without choice","Measuring actual performance","Grouping work into departments"],"d":"Decision-making: the process of choosing the best from among alternative solutions under a given set of circumstances.","w":"Without alternatives there is no decision, and every plan requires decisions."},
{"id":"mg2-20","t":"Types of decisions","q":"Diversification or introducing a new product is a:","o":["Strategic decision","Operational decision","Minor decision","Programmed decision"],"d":"Strategic decisions: unified, integrated and comprehensive issues affecting the whole organization; require trade-offs.","w":"A new product or diversification changes the organization's direction."},
{"id":"mg2-21","t":"Types of decisions","q":"Refunding a customer, based on company policy, when a product does not meet their specifications is a:","o":["Programmed decision","Non-programmed decision","Strategic decision","Complex decision"],"d":"Programmed decisions: based on company policy and procedures, for routine and repetitive situations.","w":"The policy already says what to do, so no new analysis is needed."},
{"id":"mg2-22","t":"Types of decisions","q":"Downsizing employees or closing a regional office is a:","o":["Non-programmed decision","Programmed decision","Minor decision","Simple decision"],"d":"Non-programmed decisions: non-repetitive, complex, novel and unstructured problems needing creative problem-solving.","w":"There is no ready-made rule for such unusual, important decisions."},
{"id":"mg2-23","t":"Types of decisions","q":"A wage increase affected by productivity, trade union influence, government policy and company profitability is a:","o":["Complex decision","Simple decision","Minor decision","Individual decision"],"d":"Complex decisions: many variables affect the decision. Simple decisions: few variables.","w":"Several variables are involved here, which makes it complex."},
{"id":"mg2-24","t":"Decision process","q":"Ranking alternative solutions by their strengths, weaknesses, opportunities and threats happens in which step of decision-making?","o":["Evaluation of alternative solutions","Problem awareness","Problem diagnosis","Implementation"],"d":"Decision process: 1 problem awareness, 2 problem diagnosis, 3 develop alternatives, 4 evaluate alternatives, 5 select the best solution, 6 implement.","w":"Evaluation weighs each alternative using SWOT before the best one is selected."},
{"id":"mg2-25","t":"Types of plans","tf":true,"ans":false,"q":"Single-use plans can be used again and again.","d":"Single-use plans handle non-recurring problems and cannot be used again; standing plans are for repeated use.","w":"The name 'single-use' tells you they are used once."},
{"id":"mg2-26","t":"Types of plans","tf":true,"ans":true,"q":"Short-range plans typically cover one year or less.","d":"Short-range plans: one year or less. Long-range: three or more years.","w":"This is the time-based classification of plans."},
{"id":"mg2-27","t":"Types of decisions","tf":true,"ans":true,"q":"Group decisions usually include strategic, non-programmed, complex and major decisions.","d":"Group decisions are made by a group of people (teams, committees). Individual decisions are mostly routine, simple and programmed.","w":"Important, complex decisions benefit from many people's input."},
{"id":"mg2-28","t":"Types of decisions","tf":true,"ans":false,"q":"Minor decisions affect the whole company and most of its functional areas.","d":"Major decisions affect the company's policies and most functional areas. Minor decisions affect only one functional area and are mostly made at lower levels.","w":"The statement describes major decisions, not minor ones."},
{"id":"mg2-29","t":"Types of decisions","tf":true,"ans":false,"q":"Operational decisions change the organization's direction.","d":"Operational decisions relate to routine operational activities, need less analysis and do not change the organization's direction.","w":"Changing direction is a feature of strategic decisions."},
{"id":"mg2-30","t":"Decision process","tf":true,"ans":true,"q":"Problem awareness mostly occurs at the lower level, such as among salespeople.","d":"Step 1, problem awareness: individuals feel something is wrong; this mostly occurs at the lower level.","w":"People closest to daily operations notice problems first."},
{"id":"mg2-w1","t":"Need for planning","wr":true,"q":"Explain why organizations need planning.","a":"1. To offset uncertainty and change: managers foresee problems and prepare for them.\n2. To focus organizational activity on a set of objectives.\n3. To provide a coordinated, systematic road map for future activities.\n4. To increase economic efficiency.\n5. To facilitate control by establishing a standard for later activity.\nPlanning also helps organizations approach their environment systematically and adjust goals to unforeseen conditions.","d":"Planning: deciding in advance what is to be done in future; bridging the gap between where we are and where we want to go.","w":"Five needs are listed on the slides; each should be named and briefly explained."},
{"id":"mg2-w2","t":"Types of plans","wr":true,"q":"Explain the classification of plans on the basis of time, hierarchy and use.","a":"Time:\n- Long-range plans: three or more years ahead.\n- Short-range plans: one year or less.\nHierarchy:\n- Strategic plans: broad, long-term, for the whole organization, by top management; include the vision.\n- Tactical plans: functional plans (production, marketing, HR, finance) by middle management to implement the strategy.\n- Operational plans: narrow, short-term, specific plans by lower management.\nUse:\n- Single-use plans: for non-recurring problems (projects, budgets, programmes).\n- Standing plans: for recurring problems (objectives, policies, procedures, methods, rules, strategies).","d":"Classification of plans: by time, by hierarchy and by use.","w":"Organise your answer under the three bases so each type is clearly placed."},
{"id":"mg2-w3","t":"Steps in planning","wr":true,"q":"Explain the eight steps in planning.","a":"1. Being aware of opportunities and strengths: internal (strengths, weaknesses) and external analysis.\n2. Establishing objectives and goals: the ends towards which activity is aimed.\n3. Developing premises: assumptions about the future environment.\n4. Determining alternative courses: e.g. expansion, diversification, joint ventures, mergers.\n5. Evaluating alternative courses: using SWOT analysis.\n6. Selecting a course: ranking alternatives; the best has the highest strengths and opportunities and lowest threats and weaknesses.\n7. Formulating derivative plans: policies, procedures, rules, programmes, schedules.\n8. Budgeting: expressing plans in numerical terms.","d":"Planning process: eight steps from environmental awareness to budgeting.","w":"The steps move from analysis, to choosing a course, to detailed supporting plans and budgets."},
{"id":"mg2-w4","t":"Types of decisions","wr":true,"q":"Differentiate between programmed and non-programmed decisions, with examples.","a":"Programmed decisions:\n- Made in response to routine and repetitive situations.\n- Based on company policies, procedures, budgets, rules and regulations.\n- Examples: payment of DA, product delivery, handling customer grievances, refunding a customer when a product does not meet specifications.\nNon-programmed decisions:\n- Novel, complex, non-routine and unstructured problems.\n- Need creative problem-solving.\n- Examples: new product introduction, downsizing, mergers and expansion, closing a regional office.","d":"Programmed decisions are routine and rule-based; non-programmed decisions are new and need creativity.","w":"The key difference is whether a ready-made rule or procedure already exists."},
{"id":"mg2-w5","t":"Decision process","wr":true,"q":"Explain the six steps of the decision-making process.","a":"1. Problem awareness: individuals feel something is wrong (often at lower levels).\n2. Problem diagnosis: managers gather information and define the problem.\n3. Development of alternative solutions: through memory, passive search, past experience, discussions and brainstorming.\n4. Evaluation of alternative solutions: by strengths, weaknesses, opportunities and threats (SWOT), then ranking.\n5. Selection of the best solution: using managerial judgement and consultation.\n6. Implementation: secure top management support and a detailed action programme (what, who, when, resources, how and coordination).","d":"Decision-making: choosing the best from among alternative solutions under a given set of circumstances.","w":"Each step depends on the previous one; you cannot evaluate alternatives you have not developed."},
{"id":"mg2-w6","t":"Types of plans","wr":true,"q":"Compare strategic, tactical and operational plans.","a":"Strategic plans:\n- Broad, comprehensive, long-term and directional.\n- For the entire organization; made by top management; include the vision.\nTactical plans:\n- Help implement all or part of the strategic plan.\n- Functional plans (production, marketing, HR, finance, logistics); made by middle management.\nOperational plans:\n- Narrow, short-term, specific and usually standing.\n- For a particular area; made by lower management to carry out daily activities.","d":"Planning hierarchy: strategic (top), tactical (middle), operational (lower).","w":"Moving down the hierarchy, plans become narrower, shorter-term and more specific."}
]},
{"id":"mg-ch3","label":"Chapter 3","name":"Organizational Structure","questions":[
{"id":"mg3-01","t":"Organizing","q":"According to Robbins and Coulter, organizing means determining:","o":["What tasks are done, who does them, how they are grouped, who reports to whom and where decisions are made","Only how much each employee is paid","Only the company's long-term strategy","How to advertise products"],"d":"Organizing (Robbins & Coulter): determining tasks, who does them, how they are grouped, reporting relationships and where decisions are made.","w":"Organizing is about arranging work and authority, not pay, strategy or advertising."},
{"id":"mg3-02","t":"Organizing","q":"L.A. Allen's definition of organizing includes identifying and grouping work and:","o":["Defining and delegating responsibility and authority, and establishing relationships","Recruiting and training employees","Setting prices for products","Measuring actual performance"],"d":"Organizing (L.A. Allen): identifying and grouping work, defining and delegating responsibility and authority, and establishing relationships so people work effectively together.","w":"Recruiting is staffing and measuring performance is controlling."},
{"id":"mg3-03","t":"Organization structure","q":"Organization structure is best described as:","o":["The outcome of the organizing process and a framework of decision-making authority","A list of the company's customers","The company's annual budget","A marketing plan"],"d":"Organization structure: the outcome of organizing; a framework of decision-making authority and a system of relationships governing people's activities.","w":"It shows how authority and relationships are arranged to achieve goals."},
{"id":"mg3-04","t":"Organization structure","q":"What is the FIRST step in developing an organization structure?","o":["Clear definition of objectives","Determining the structure","Revising the system based on personnel and funds","Grouping activities"],"d":"Steps: 1 define objectives clearly, 2 identify and group activities, 3 determine the structure, 4 revise based on personnel and funds.","w":"Objectives determine the type and basic characteristics of the organization, so they come first."},
{"id":"mg3-05","t":"Organization structure","q":"The span of supervision (span of control) is:","o":["The number of subordinates a manager can effectively manage","The number of departments in a company","The length of the chain of command","The company's geographic area"],"d":"Span of control: the number of subordinates a manager can effectively manage; it decides whether the organization is flat or tall.","w":"A wide span gives a flat structure; a narrow span gives a tall one."},
{"id":"mg3-06","t":"Departmentation","q":"Departmentation is:","o":["The process of grouping activities into units for administration at all levels","Hiring staff for new departments","Closing unprofitable departments","Moving departments to new locations"],"d":"Departmentation: grouping activities into units for administration, dividing personnel and functions into separate units.","w":"It is the 'grouping' part of organizing."},
{"id":"mg3-07","t":"Departmentation","q":"Putting similar and related activities under one department is which factor in departmentation?","o":["Specialization","Balance","Reduction of cost","Facilitating control"],"d":"Factors in departmentation: specialization, facilitating control, facilitating coordination, balance, reduction of cost.","w":"Grouping similar activities builds specialised knowledge, which is specialization."},
{"id":"mg3-08","t":"Departmentation","q":"Grouping activities to avoid repetition and cut financial cost is which factor?","o":["Reduction of cost","Specialization","Balance","Facilitating coordination"],"d":"Reduction of cost: activities grouped to best achieve objectives at lower cost, e.g. by avoiding repetition.","w":"Avoiding duplication saves money."},
{"id":"mg3-09","t":"Functional structure","q":"The most widely used form of departmentation is by:","o":["Functions","Products","Projects","Customers"],"d":"Functional structure: groups activities into major functional departments; the most widely used.","w":"Basic functions are production, selling and financing, plus buying, accounting, personnel and research."},
{"id":"mg3-10","t":"Functional structure","q":"The basic functions in a functional structure are usually classified into:","o":["Production, selling and financing","Planning, organizing and controlling","Top, middle and lower management","Products, regions and customers"],"d":"Functional structure: basic functions are production, selling and financing.","w":"Planning, organizing and controlling are management functions, not departments."},
{"id":"mg3-11","t":"Functional structure","q":"Which is an ADVANTAGE of a functional structure?","o":["It ensures specialization and coordination within each function","It is a good training ground for all-round managers","It speeds up all decisions through decentralization","It removes the need for coordination"],"d":"Functional advantages: specialization, coordination within the function, adequate attention to basic activities; a time-proved method.","w":"A functional company is NOT a good training ground for all-round managers, and it tends to centralize decisions."},
{"id":"mg3-12","t":"Functional structure","q":"Which is a DISADVANTAGE of a functional structure?","o":["Excessive centralization delays decisions and the flow of information","Too much product knowledge","Two chains of command","High administrative cost from project teams"],"d":"Functional disadvantages: excessive centralization causing delay, executives focused narrowly on their own function, poor training for all-round managers.","w":"Two chains of command and high administrative costs belong to the matrix structure."},
{"id":"mg3-13","t":"Divisional structure","q":"In a divisional (product) structure:","o":["One executive is in charge of all activities for a product or product line","Each employee serves only one specialist function","Every employee has two bosses","All decisions are made by the CEO"],"d":"Divisional structure: activities for each product or product line are combined into integrated units, each led by an executive with extensive authority.","w":"The location of the product unit is irrelevant in this structure."},
{"id":"mg3-14","t":"Divisional structure","q":"Which is an ADVANTAGE of a divisional structure?","o":["Product lines can be compared, so unprofitable ones can be dropped and profitable ones expanded","It has no coordination problems at all","It always reduces costs","It gives every employee two chains of command"],"d":"Divisional advantages: specialised product knowledge, motivated product managers, comparison of product lines, better coordination and customer service.","w":"Each product's results are separate, which makes comparison easy."},
{"id":"mg3-15","t":"Divisional structure","q":"Which is a DISADVANTAGE of a divisional structure?","o":["Top management may find it hard to monitor and control the various product departments","Too much centralization in functional departments","It cannot compare product lines","Product managers have no authority"],"d":"Divisional disadvantages: coordination difficulties, control problems for top management, and reluctance to delegate decisions to departmental heads.","w":"Many semi-independent divisions are harder for top management to monitor."},
{"id":"mg3-16","t":"Matrix structure","q":"A matrix structure is a combination of:","o":["Functional and divisional structures, with vertical and horizontal chains of command","Line and staff only","Centralization and decentralization only","Top and middle management"],"d":"Matrix structure: imposes horizontal divisional reporting on a hierarchical functional structure; two chains of command.","w":"Employees report both to a functional manager (vertical) and a project or product manager (horizontal)."},
{"id":"mg3-17","t":"Matrix structure","q":"The matrix structure is also known as:","o":["Grid organization or project/product management organization","Line organization","Tall organization","Functional organization"],"d":"Matrix structure: also known as grid organization or project or product management organization.","w":"The grid shape comes from its two crossing lines of authority."},
{"id":"mg3-18","t":"Matrix structure","q":"Which is an ADVANTAGE of a matrix structure?","o":["Flexible use of manpower and other resources","Low administrative costs","Clear single line of authority","No interpersonal conflicts"],"d":"Matrix advantages: decentralised decisions, better project coordination, better response to change, flexible use of resources.","w":"Matrix structures actually have high administrative costs and confusion over authority."},
{"id":"mg3-19","t":"Matrix structure","q":"Which is a DISADVANTAGE of a matrix structure?","o":["Confusion over authority and conflict about who reports to whom","Excessive centralization","No product coordination","Too little group decision-making"],"d":"Matrix disadvantages: high administrative costs, confusion over authority and responsibility, interpersonal conflict, overemphasis on group decision-making.","w":"Two bosses can give conflicting instructions, causing power struggles."},
{"id":"mg3-20","t":"Centralization","q":"In a centralized organization, major decisions are made:","o":["At the top by the CEO and carried out by everyone below","By every employee individually","By customers","By managers at all levels for daily operations"],"d":"Centralization: major decisions are made at the top. Decentralization: day-to-day decisions are made by managers at various levels.","w":"The essential difference between the two is where decisions are made."},
{"id":"mg3-21","t":"Centralization","q":"Which is a reason organizations need decentralization?","o":["To reduce the burden on top executives","To keep all power with the CEO","To slow down decision-making","To reduce managers' morale"],"d":"Need for decentralization: reduce top executives' burden, diversify product lines, focus on product markets, develop future managers, raise morale, keep pace with technology.","w":"Sharing decisions frees top executives to focus on major issues."},
{"id":"mg3-22","t":"Line and staff","q":"Line functions are those that:","o":["Have direct responsibility for accomplishing the organization's objectives","Only give advice to other managers","Handle only office cleaning and security","Exist only in matrix structures"],"d":"Line functions: direct responsibility for objectives. Staff: help the line work more effectively.","w":"For example, production and sales are line; legal advice or HR support are staff."},
{"id":"mg3-23","t":"Line and staff","q":"Which describes a STAFF manager?","o":["Assists others and provides specialised guidance and ideas to the line","Has veto power over decisions","Has final responsibility for achieving objectives","Takes operating decisions"],"d":"Staff managers assist, investigate problems, solve special problems, make plans and provide ideas and specialised guidance.","w":"Veto power, final responsibility and operating decisions belong to line managers."},
{"id":"mg3-24","t":"Line and staff","q":"Which describes a LINE manager?","o":["A generalist who directs others and has final responsibility for achieving objectives","A specialist who only investigates problems","Someone who only supports others","Someone with no authority"],"d":"Line managers: generalists who direct others, delegate authority, use sanctions, have veto power and final responsibility.","w":"The line has direct authority; staff supports it."},
{"id":"mg3-25","t":"Matrix structure","tf":true,"ans":false,"q":"A matrix structure has only one chain of command.","d":"Matrix structure: two chains of command, vertical (functional) and horizontal (divisional/project).","w":"Having two bosses is what makes the matrix structure different."},
{"id":"mg3-26","t":"Functional structure","tf":true,"ans":false,"q":"A functionally organized company is a good training ground for all-round promotable managers.","d":"A disadvantage of functional structure: it does not offer a good training ground for all-round managers.","w":"Managers specialise in one function, so they do not learn the whole business."},
{"id":"mg3-27","t":"Divisional structure","tf":true,"ans":true,"q":"In a divisional (product) structure, the place or location of the product unit is irrelevant.","d":"Divisional by product: activities are grouped by product; place or location is irrelevant.","w":"The grouping is based on products, not geography."},
{"id":"mg3-28","t":"Matrix structure","tf":true,"ans":true,"q":"Matrix structures require high administrative costs.","d":"Matrix disadvantages include high administrative costs.","w":"Running two lines of authority needs more managers and coordination."},
{"id":"mg3-29","t":"Centralization","tf":true,"ans":true,"q":"In decentralization, the CEO sets guidelines, but day-to-day decisions are made by managers at various levels.","d":"Decentralization: the CEO sets the tone and guidelines; managers at different levels make day-to-day decisions.","w":"This spreads decision-making down the organization."},
{"id":"mg3-30","t":"Organization structure","tf":true,"ans":true,"q":"Revising the system based on an assessment of personnel and funds is a step in developing an organization structure.","d":"Step 4: revise the system based on the capacities of available people and other resources.","w":"A structure must fit the people and money actually available."},
{"id":"mg3-w1","t":"Organizing","wr":true,"q":"Define organizing and organization structure.","a":"Organizing (Robbins & Coulter): determining what tasks are to be done, who is to do them, how the tasks are grouped, who reports to whom, and where decisions are made.\nOrganizing (L.A. Allen): identifying and grouping work, defining and delegating responsibility and authority, and establishing relationships so people work effectively together.\nOrganization structure: the outcome of the organizing process; a framework of decision-making authority and a system of relationships that governs people's activities to achieve goals. Key executives determine it.","d":"Organizing is the process; organization structure is its outcome.","w":"Give a definition of each term and show how they are linked."},
{"id":"mg3-w2","t":"Organization structure","wr":true,"q":"Explain the four steps in developing an organization structure.","a":"1. Clear definition of objectives: they determine the type and basic characteristics of the organization.\n2. Identifying the activities and grouping them: list the activities needed to achieve objectives, group them systematically and assign them to personnel.\n3. Determining the structure: decide the span of control (flat or tall), type of organization, basis of departmentation and pattern of authority.\n4. Revising the system: assess the capacities of the people available and other resources (funds) and adjust.","d":"Organization structure: a framework of authority and relationships.","w":"The steps move from purpose (objectives) to work, then to structure, then to fitting it to resources."},
{"id":"mg3-w3","t":"Functional structure","wr":true,"q":"Explain the advantages and disadvantages of a functional structure.","a":"Functional structure: groups activities into major functional departments (production, selling, financing, plus buying, accounting, personnel, research). It is the most widely used.\nAdvantages:\n- Ensures specialization and specialised knowledge and skill.\n- Facilitates coordination within each function.\n- Gives adequate attention to the basic activities.\n- A time-proved method that management can justify.\nDisadvantages:\n- Excessive centralization delays decisions and information flow.\n- Executives become too focused on their own functional areas.\n- Not a good training ground for all-round promotable managers.","d":"Functional structure: departmentation by functions, where each employee serves a specialist role.","w":"Strength and weakness come from the same source: deep specialization within functions."},
{"id":"mg3-w4","t":"Divisional structure","wr":true,"q":"Explain the divisional structure and its advantages and disadvantages.","a":"Divisional structure: activities for each product or product line are combined into integrated units, each led by an executive with authority over production, sales, development and service. Location is irrelevant.\nAdvantages:\n- Specialised product knowledge and coordination of product activities.\n- Product managers are motivated to expand and improve their product.\n- Product lines can be compared (drop unprofitable, expand profitable).\n- Better coordination, customer service and control of resources.\nDisadvantages:\n- Coordination difficulties.\n- Control problems for top management monitoring many product departments.\n- Top management may be unwilling to delegate decision-making to departmental heads.","d":"Divisional structure: departmentation by product or service.","w":"Each division works like a small business, which helps focus but makes central control harder."},
{"id":"mg3-w5","t":"Matrix structure","wr":true,"q":"Explain the matrix structure with its advantages and disadvantages.","a":"Matrix structure: a combination of functional and divisional structures. It imposes horizontal divisional reporting on a vertical functional hierarchy, so employees have two chains of command. Also called grid, project or product management organization.\nAdvantages:\n- Decentralised decision-making.\n- Better project or product coordination.\n- Better monitoring of, and response to, environmental change.\n- Flexible use of manpower and other resources.\nDisadvantages:\n- High administrative costs.\n- Confusion over authority and responsibility (power struggles).\n- More interpersonal conflict (who reports to whom?).\n- Overemphasis on group decision-making.","d":"Matrix structure: two chains of command, vertical and horizontal.","w":"The double reporting line gives flexibility but also creates confusion and conflict."},
{"id":"mg3-w6","t":"Line and staff","wr":true,"q":"Distinguish between line and staff managers.","a":"Line functions have direct responsibility for accomplishing objectives; staff help the line work more effectively.\nLine managers:\n- Generalists who direct others and delegate authority.\n- Train subordinates, use sanctions and exert control.\n- Have veto power and take operating decisions.\n- Have final responsibility for achieving objectives.\nStaff managers:\n- Specialists who assist others and serve authority.\n- Investigate and solve special problems and make plans.\n- Support the line and provide ideas.\n- Provide specialised guidance to achieve objectives.","d":"Line authority: direct command. Staff authority: advisory and supportive.","w":"Line managers decide and command; staff managers advise and support."}
]},
{"id":"mg-ch4","label":"Chapter 4","name":"Understanding Organisational Culture in Business","questions":[
{"id":"mg4-01","t":"Meaning of culture","q":"Hofstede describes culture as:","o":["A set of shared attitudes, values, goals, practices and social norms that characterize a group","The formal chart of who reports to whom","A company's annual budget","The physical design of an office"],"d":"Culture (Hofstede): shared attitudes, values, goals, practices and social norms, learned and passed down, shaping how people interact.","w":"Culture is about shared values and behaviour, not structure, money or buildings."},
{"id":"mg4-02","t":"Meaning of culture","q":"Edgar Schein describes organisational culture as a pattern of basic assumptions that:","o":["A group developed to cope with external adaptation and internal integration, and teaches to new members","Each employee invents alone on the first day","Are written only in the company's legal documents","Never change once created"],"d":"Organisational culture (Schein): basic assumptions a group developed while solving its problems, considered valuable and taught to new members as the correct way to perceive, think and feel.","w":"The key ideas are 'shared', 'learned from experience' and 'taught to new members'."},
{"id":"mg4-03","t":"Characteristics","q":"Which is a characteristic of organisational culture?","o":["It is not inborn; it is invented and developed over time","It is the same in every organization","It is fixed at birth","It is only shaped by external factors"],"d":"Characteristics: not inborn but developed over time; a framework for performance; shaped by internal and external factors; promotes work culture.","w":"Culture is learned and built, not something people are born with."},
{"id":"mg4-04","t":"Characteristics","q":"How does organisational culture reduce role conflicts among employees?","o":["By promoting standardization in systems and sub-systems","By removing all communication","By making everyone work alone","By eliminating rules"],"d":"Characteristics: culture promotes standardization in systems and sub-systems, which reduces role conflicts.","w":"When everyone follows shared standards, there is less confusion about roles."},
{"id":"mg4-05","t":"Functions of culture","q":"Starbucks values employees, builds close bonds and encourages inclusion, creating a feeling of togetherness. Which function of culture is this?","o":["It gives members an organisational identity","It provides a boundary","It promotes systems stability","It enforces conformity"],"d":"Function 1: culture gives members an organisational identity, a sense of togetherness and common purpose.","w":"The slides use Starbucks to show a unified organisational identity."},
{"id":"mg4-06","t":"Functions of culture","q":"Zappos gives employees autonomy and hires for cultural fit. Which function of culture does this show?","o":["It facilitates collective commitment and shared culture","It provides a boundary","It shapes behaviour through sense-making","It enforces secrecy"],"d":"Function 2: culture stimulates strong commitment from all who accept it and gives a shared pattern of feelings.","w":"Empowering staff and hiring for fit builds collective commitment to shared values."},
{"id":"mg4-07","t":"Functions of culture","q":"Google's collaboration value and '20% time' policy keep employees engaged and aligned for long-term success. Which function of culture is this?","o":["It promotes systems stability","It provides a boundary","It gives an organisational identity","It ensures conformity through secrecy"],"d":"Function 3: a shared identity and commitment encourage lasting cooperation and hold members together with appropriate standards.","w":"The slides use Google to illustrate systems stability."},
{"id":"mg4-08","t":"Functions of culture","q":"Oman Air helps employees understand its values of hospitality, diversity and safety so they align their actions. Which function of culture is this?","o":["It shapes behaviour by helping members make sense of their surroundings","It provides a boundary","It promotes systems stability","It ensures conformity through secrecy"],"d":"Function 4: culture is a source of shared meaning that explains why things happen as they do; it is felt rather than fully visible.","w":"Understanding the company's values helps employees navigate their roles."},
{"id":"mg4-09","t":"Functions of culture","q":"Bank Muscat's values distinguish it from other banks and build trust with customers. Which function of culture is this?","o":["It provides a boundary","It promotes systems stability","It enforces conformity","It gives collective commitment"],"d":"Function 5: culture creates a distinction between one organization and another, and acts as a control mechanism.","w":"Differentiating Bank Muscat from other banks is the boundary function."},
{"id":"mg4-10","t":"Functions of culture","q":"Apple's culture of secrecy makes engineers focus only on their own tasks. Which function of culture does this show?","o":["Conformity and an expected mode of behaviour","Organisational identity","A boundary between organizations","Systems stability"],"d":"Function 6: culture helps members stick to conformity (consistency) and the expected mode of behaviour.","w":"Everyone behaves in the prescribed way, which is conformity."},
