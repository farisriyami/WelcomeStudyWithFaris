{"id":"t4-05","t":"Water transport","q":"How many cruise tourists visited Oman in 2019?","o":["383,488","1.5 million","15,230","75,000"],"d":"Cruises in Oman: 383,488 cruise tourists in 2019, a 49.5% increase on 2018.","w":"1.5 million is the number of vehicles; 15,230 km is the road network."},
{"id":"t4-06","t":"Water transport","q":"Which is one of Oman's famous cruise ports listed on the slides?","o":["Khasab Port","Duqm Airport","Ras Al-Hadd Airport","Sohar Airport"],"d":"Famous cruise ports in Oman: Sultan Qaboos Port, Khasab Port and Salalah Port.","w":"The other options are airports."},
{"id":"t4-07","t":"Water transport","q":"Which is an advantage of water transport?","o":["It uses relatively little power and can carry large numbers of vehicles","It is faster than air travel","It needs no terminals","It is unaffected by weather"],"d":"Water transport advantages: little power, much larger vessels, high comfort (cruise ships), large vehicle capacity.","w":"Water transport is slow compared with air."},
{"id":"t4-08","t":"Land transport","q":"Which is the most common form of tourism transport for domestic travel and short international trips?","o":["Land transport","Air transport","Water transport","Cruise ships"],"d":"Land transport: by far the most common form for domestic travel and short international trips.","w":"Cars and buses dominate short trips."},
{"id":"t4-09","t":"Land transport","q":"Package tours, day tours, airport transfers and inter-city travel commonly use:","o":["Buses","Cruise ships","Ferries","Private jets"],"d":"Bus: used for package tours, day tours, airport transfers and inter-city travel.","w":"These are the listed bus uses."},
{"id":"t4-10","t":"Land transport","q":"Which land transport, like a cruise ship, combines transportation and accommodation?","o":["Caravans (campervans)","Taxis","Buses","Limousines"],"d":"Caravan: campervans combine transportation and accommodation.","w":"You can drive and sleep in a campervan."},
{"id":"t4-11","t":"Land transport","q":"Which is an ADVANTAGE of land transport by car?","o":["Door-to-door service with flexible timing","It never causes congestion","It is always the fastest mode","It needs no roads"],"d":"Land transport advantages: comfort, privacy, flexibility in timing, choice of itineraries, door-to-door service. Disadvantage: congestion.","w":"Congestion is its listed disadvantage."},
{"id":"t4-12","t":"Land transport","q":"According to the slides, Oman's road network in 2018 extended to about:","o":["15,230 km","1,523 km","152,300 km","383,488 km"],"d":"Land transport in Oman: more than 1.5 million vehicles (2020); road network of 15,230 km (2018).","w":"383,488 is the number of cruise tourists."},
{"id":"t4-13","t":"Air transport","q":"Since 1950, which mode has had the most impact on international tourism?","o":["Air transport","Water transport","Rail transport","Bus transport"],"d":"Air transport has had the most impact on international tourism and the structure of the travel industry since 1950.","w":"Few places are now more than 24 hours' flying time apart."},
{"id":"t4-14","t":"Air transport","q":"Which is NOT a reason the airline industry is heavily regulated?","o":["To make every flight free for tourists","Passenger safety","Social and environmental concerns","Protection of national economic interests"],"d":"Reasons for regulation: passenger safety, social and environmental concerns, protection of national economic interests.","w":"The primary aim of aviation policy is to enhance and protect national interests."},
{"id":"t4-15","t":"Air transport","q":"Which is one of the regulatory forms used to control the airline industry?","o":["Licensing of airlines","Grading hotels with stars","Franchising restaurants","Selling cruise tickets"],"d":"Regulatory forms: licensing of airlines, regulation of international operations, regulation of domestic operations.","w":"Star grading relates to accommodation."},
{"id":"t4-16","t":"Air transport","q":"Which is an ADVANTAGE of air transport?","o":["A direct line of flight not blocked by mountains, oceans or deserts","It is cheap","It has no environmental impact","It needs only a small terminal"],"d":"Air advantages: direct flight path unimpeded by natural barriers, superior speed, high passenger capacity.","w":"The other options are the opposite of its disadvantages."},
{"id":"t4-17","t":"Air transport","q":"Which is a DISADVANTAGE of air transport?","o":["It is vulnerable to terrorism and fluctuating oil prices","It is slow","It has low passenger capacity","It cannot cross oceans"],"d":"Air disadvantages: needs a large terminal area, relatively expensive, negative environmental impacts, vulnerable to terrorism and oil prices.","w":"Speed and capacity are advantages of air transport."},
{"id":"t4-18","t":"Air transport","q":"Which of these is NOT one of Oman's five operational civil airports?","o":["Nizwa Airport","Muscat International Airport","Duqm Airport","Ras Al-Hadd Airport"],"d":"Oman's airports: Muscat International, Salalah, Duqm, Sohar and Ras Al-Hadd.","w":"Nizwa is not on the list."},
{"id":"t4-19","t":"Air transport","q":"Oman Airports is:","o":["A government-owned company that manages and operates Oman's civil airports","A private airline","A ferry company","A tour operator"],"d":"Oman Airports: government-owned; integrated airport operations and infrastructure (terminals, cargo, runways, parking).","w":"It runs airports, not flights."},
{"id":"t4-20","t":"Transport system","q":"In Faulks' elements of a transport system, roads, railways, airspace and water are:","o":["The way","The terminal","The carrying unit","Motive power"],"d":"Faulks (1990): the way, the terminal, the carrying unit and motive power.","w":"The way is the path the vehicle travels on."},
{"id":"t4-21","t":"Transport system","q":"Hubs and gateways are examples of which element of a transport system?","o":["The terminal","The way","The carrying unit","Motive power"],"d":"Terminal: terminals, hubs and gateways where journeys start, end or connect.","w":"Hubs are terminals."},
{"id":"t4-22","t":"Transport system","q":"Aircraft, boats, cars and buses are which element of a transport system?","o":["The carrying unit","The way","The terminal","Motive power"],"d":"Carrying unit: the vehicle that carries passengers.","w":"The vehicle itself is the carrying unit."},
{"id":"t4-23","t":"Transport system","q":"Oil, hydrogen, bio-fuels and electricity are which element of a transport system?","o":["Motive power","The way","The terminal","The carrying unit"],"d":"Motive power: the energy that moves the carrying unit.","w":"Fuel and energy provide the power."},
{"id":"t4-24","t":"Water transport","q":"By the late 1960s, most of the long-haul market on the North Atlantic routes had been lost by water transport to:","o":["The airlines","Railways","Buses","Ferries"],"d":"Water transport is slow compared with air travel.","w":"Faster air travel took over long-haul routes."},
{"id":"t4-25","t":"Water transport","tf":true,"ans":false,"q":"Water transport is fast compared with air travel.","d":"Water transport is slow compared with air travel.","w":"That is why airlines took over long-haul routes."},
{"id":"t4-26","t":"Air transport","tf":true,"ans":true,"q":"Few parts of the world are now more than 24 hours' flying time from any other part.","d":"Air transport has made almost every part of the world reachable within 24 hours.","w":"This is why air transport changed international tourism."},
{"id":"t4-27","t":"Air transport","tf":true,"ans":false,"q":"The airline industry is lightly regulated and simple to operate.","d":"The airline industry is heavily regulated and controlled, which makes it complex.","w":"Safety, environmental and national interests all require regulation."},
{"id":"t4-28","t":"Land transport","tf":true,"ans":true,"q":"Land transport can lead to congestion.","d":"Congestion is the listed disadvantage of land transport.","w":"Many private vehicles crowd the roads."},
{"id":"t4-29","t":"Water transport","tf":true,"ans":true,"q":"Cruise tourists to Oman in 2019 increased by 49.5% compared with 2018.","d":"Cruises in Oman: 383,488 cruise tourists in 2019, a 49.5% increase.","w":"This shows the growth of cruise tourism in Oman."},
{"id":"t4-30","t":"Air transport","tf":true,"ans":true,"q":"Air transport has significant negative environmental impacts.","d":"Air disadvantages include significant negative environmental impacts and high energy needs.","w":"Social and environmental concerns are also a reason for regulation."},
{"id":"t4-w1","t":"Modes","wr":true,"q":"Explain the three modes of transportation in tourism and their forms.","a":"1. Water transport: short sea routes (ferries, inland transport) and long-haul routes (cruise ships, which also provide accommodation).\n2. Land transport: the most common for domestic and short international trips; cars (private, rented, taxis, limousines), buses (package tours, day tours, transfers, inter-city), rail (some journeys are attractions) and caravans (transport plus accommodation).\n3. Air transport: the mode with the most impact on international tourism since 1950; heavily regulated.","d":"Modes of transportation: water, land and air.","w":"Give the forms of each mode and one key fact about it."},
{"id":"t4-w2","t":"Air transport","wr":true,"q":"Identify the advantages and disadvantages of air transport.","a":"Advantages:\n- Direct line of flight not blocked by natural barriers (mountains, oceans, deserts, jungles).\n- Superior speed.\n- High passenger capacity.\nDisadvantages:\n- Needs a large terminal area.\n- Relatively expensive (high energy needs and safety standards).\n- Significant negative environmental impacts.\n- Vulnerable to terrorism and fluctuating oil prices.","d":"Air transport: the mode with the greatest impact on international tourism.","w":"Present them as two lists from the slides' table."},
{"id":"t4-w3","t":"Air transport","wr":true,"q":"Explain why the airline industry is heavily regulated and the forms this regulation takes.","a":"Reasons:\n1. Passenger safety.\n2. Social and environmental concerns about airline operations.\n3. Protection of national economic interests; the primary objective of aviation policy is to enhance and protect national interests.\nRegulatory forms:\n1. Licensing of airlines.\n2. Regulation of international airline operations.\n3. Regulation of domestic airline operations.","d":"Regulation: rules and controls governments place on the airline industry.","w":"Explain the reasons first, then the forms."},
{"id":"t4-w4","t":"Transport system","wr":true,"q":"Explain Faulks' (1990) elements of a transport system, with examples.","a":"1. The way: the path travelled, e.g. roads, railways, tramways, cableways, airspace and water.\n2. The terminal: where journeys start, end or connect, e.g. terminals, hubs and gateways.\n3. The carrying unit: the vehicle, e.g. aircraft, boats, cars and buses.\n4. Motive power: the energy, e.g. coal, oil, hydrogen, bio-fuels and electricity.","d":"Transport system: the key elements every transport mode needs.","w":"Every journey needs all four: a path, a terminal, a vehicle and power."},
{"id":"t4-w5","t":"Water transport","wr":true,"q":"Describe water transport, including its routes, cruise tourism in Oman and its advantages.","a":"Water transport is slow compared with air; by the late 1960s airlines had taken most North Atlantic long-haul traffic.\nRoutes: short sea routes (ferries, inland transport) and long-haul routes (cruise ships).\nCruises in Oman: 383,488 cruise tourists in 2019 (49.5% more than 2018); main ports are Sultan Qaboos Port, Khasab Port and Salalah Port.\nAdvantages: uses relatively little power; can be built much larger than vehicles or aircraft; high comfort on cruise ships; carries large numbers of motor vehicles.","d":"Water transport: travel by sea and inland waterways.","w":"Include the Oman facts from the slides."},
{"id":"t4-w6","t":"Land transport","wr":true,"q":"Describe land transport, its advantages and disadvantages, and land transport in Oman.","a":"Land transport is the most common form for domestic travel and short international trips.\nForms: cars (private, rented, taxis, limousines), buses, rail and caravans.\nAdvantages: comfort, privacy, flexibility in timing, choice of itineraries, door-to-door service.\nDisadvantage: congestion.\nOman: more than 1.5 million vehicles in 2020; road network of 15,230 km in 2018.","d":"Land transport: travel by road and rail.","w":"Link the advantages to why land transport is so common."}
]},
{"id":"tot-ch5","label":"Chapter 5","name":"Tourism Distribution System","questions":[
{"id":"t5-01","t":"Distribution channels","q":"A distribution channel in tourism is:","o":["The method tourism providers use to get their products to customers","A type of tourist attraction","A government tourism policy","A hotel grading system"],"d":"Distribution channel: the method or channel through which a tourism product moves to reach the consumer.","w":"It connects the provider with the customer."},
{"id":"t5-02","t":"Distribution channels","q":"Choosing the right distribution channels affects a company's:","o":["Marketing strategy and business model","Only its building design","Only its staff uniforms","Nothing important"],"d":"Every tourism business, small or giant, needs a distribution strategy.","w":"The channel shapes how the business markets and earns money."},
{"id":"t5-03","t":"Distribution channels","q":"A provider selling directly to customers through its own website, phone or office, with no intermediaries, uses:","o":["Direct distribution","Indirect distribution","Dual distribution","Horizontal integration"],"d":"Direct distribution: providers sell directly to customers (physical location, phone, fax, email, website).","w":"No middleman is involved."},
{"id":"t5-04","t":"Distribution channels","q":"A provider that uses wholesalers and retailers to sell its product uses:","o":["Indirect distribution","Direct distribution","Level zero distribution","Vertical integration"],"d":"Indirect distribution: providers use wholesalers and retailers to make products available.","w":"Intermediaries sit between provider and customer."},
{"id":"t5-05","t":"Distribution channels","q":"A provider that uses BOTH direct and indirect channels uses:","o":["Dual distribution","Direct distribution","Indirect distribution","Level three distribution"],"d":"Dual distribution: providers use both direct and indirect channels.","w":"'Dual' means two channels at once."},
{"id":"t5-06","t":"Levels","q":"A level ZERO distribution channel is:","o":["A direct sale from the provider to the tourist with no intermediary","A sale through one retailer","A sale through a wholesaler and retailer","A sale through an agent or broker"],"d":"Level zero: the simplest channel; direct sale with no intermediary.","w":"Zero intermediaries = level zero."},
{"id":"t5-07","t":"Levels","q":"A level ONE channel has:","o":["One intermediary, such as a travel agent between an airline and passengers","No intermediaries","Two intermediaries","Three intermediaries"],"d":"Level one: one intermediary (a retailer) between producer and consumer.","w":"The retailer is usually a travel agent."},
{"id":"t5-08","t":"Levels","q":"A wholesaler selling to a retailer, who then sells to the consumer, is a:","o":["Level two channel","Level one channel","Level zero channel","Level three channel"],"d":"Level two: two intermediaries (wholesaler and retailer).","w":"Count the intermediaries: wholesaler + retailer = 2."},
{"id":"t5-09","t":"Levels","q":"In a level THREE channel, who is added?","o":["An agent or broker who works on behalf of companies and deals mainly with wholesalers","The government","A second customer","A hotel"],"d":"Level three: agent or broker → wholesaler → retailer → consumer.","w":"The agent/broker is the third intermediary."},
{"id":"t5-10","t":"Intermediaries","q":"In the tourism distribution chain, tour operators act as:","o":["Wholesalers","Retailers","Customers","Regulators"],"d":"Wholesalers = tour operators; retailers = travel agents.","w":"Tour operators assemble products and sell them on, usually through travel agents."},
{"id":"t5-11","t":"Intermediaries","q":"In the tourism distribution chain, travel agents act as:","o":["Retailers","Wholesalers","Brokers","Providers"],"d":"Retailers = travel agents, who sell to the final customer.","w":"They are the last link before the tourist."},
{"id":"t5-12","t":"Levels","q":"A tourist buys a ticket directly on an airline's own website. Which channel level is this?","o":["Level zero","Level one","Level two","Level three"],"d":"Level zero: direct sale, no intermediaries.","w":"The airline sells straight to the tourist."},
{"id":"t5-13","t":"Levels","q":"A tourist buys a holiday package from a travel agent; the package was put together by a tour operator. Which level is this?","o":["Level two","Level one","Level zero","Level three"],"d":"Level two: provider → tour operator (wholesaler) → travel agent (retailer) → customer.","w":"Two intermediaries are involved."},
{"id":"t5-14","t":"Internet","q":"How has the Internet affected tourism distribution?","o":["It became a communication hub linking stakeholders and increased competition","It removed all competition","It made distribution impossible","It only affects hotels"],"d":"Internet and distribution: a communication hub that changed distribution and increased competition among stakeholders.","w":"Online booking lets more players compete directly."},
{"id":"t5-15","t":"Integration","q":"Integration in the distribution channel is:","o":["Formal linking between organisations, where functions stay the same but participants decrease","Adding more participants to the channel","Closing all travel agencies","A type of tourist attraction"],"d":"Integration: an economic concept for formal linking arrangements between organisations; the number of participants falls while functions remain.","w":"Organisations join together, so there are fewer of them."},
{"id":"t5-16","t":"Integration","q":"Which is a BENEFIT of integration?","o":["Reducing distribution costs","Raising distribution costs","Losing control of how the product is represented","Increasing the number of intermediaries"],"d":"Benefits of integration: reduce distribution costs, control how the product is represented, match channels to market segments.","w":"Integration aims to make firms more efficient and competitive."},
{"id":"t5-17","t":"Integration","q":"Why is the Internet reducing some advantages of integration?","o":["It has reduced the number of links in the channel, so cost savings are lower","It increased the number of intermediaries","It banned mergers","It raised prices"],"d":"The Internet shortens the distribution chain on its own.","w":"With fewer links already, integration saves less."},
{"id":"t5-18","t":"Integration","q":"An airline merging with a tour operator or travel agency is:","o":["Vertical integration","Horizontal integration","Dual distribution","Level zero distribution"],"d":"Vertical integration: merging with organisations at DIFFERENT levels of the chain, or setting up your own business at another level.","w":"Airline (supplier) and tour operator (wholesaler) are at different levels."},
{"id":"t5-19","t":"Integration","q":"Two airlines merging, or an airline merging with a hotel, at the supplier level is:","o":["Horizontal integration","Vertical integration","Indirect distribution","Level three distribution"],"d":"Horizontal integration: merging at the SAME level (competitive products such as two airlines, or complementary products such as an airline and a hotel).","w":"Both are suppliers, so they are on the same level."},
{"id":"t5-20","t":"Integration","q":"Oman Air plans to open its own sales offices in Nizwa, Sohar and Sur. What type of integration is this?","o":["Vertical integration","Horizontal integration","No integration","Dual distribution"],"d":"Vertical integration includes setting up your own business at a different level of the chain.","w":"The airline (supplier) is creating its own retail outlets."},
{"id":"t5-21","t":"Integration","q":"Hotels in Nizwa develop one shared website for online bookings. What type of integration is this?","o":["Horizontal integration","Vertical integration","Level zero distribution","Indirect distribution"],"d":"Horizontal integration: organisations at the same level linking together.","w":"All the hotels are suppliers at the same level."},
{"id":"t5-22","t":"Integration","q":"Oman Air offers one free night at a Crowne Plaza hotel with every ticket to Salalah in Khareef season. What type of integration is this?","o":["Horizontal integration","Vertical integration","Level three distribution","No integration"],"d":"Horizontal integration at the supplier level can link complementary products, such as an airline and a hotel.","w":"Airline and hotel are both suppliers."},
{"id":"t5-23","t":"Integration","q":"A Hajj company sets up its own bus company instead of renting buses. What type of integration is this?","o":["Vertical integration","Horizontal integration","Dual distribution","Level one distribution"],"d":"Vertical integration: setting up your own business at a different level of the chain.","w":"The Hajj company (an operator) takes over its own transport supply."},
{"id":"t5-24","t":"Intermediaries","q":"A tour operator in Oman that organises trips for foreign tourists coming INTO Oman is a:","o":["Inbound tour operator","Outbound tour operator","Domestic tour operator","Home-based travel agent"],"d":"Tour operator types: inbound (visitors coming into the country), outbound (residents travelling abroad), domestic (residents travelling within their own country).","w":"'Inbound' follows the Chapter 1 meaning: non-residents travelling to a country."},
{"id":"t5-25","t":"Distribution channels","tf":true,"ans":true,"q":"Every tourism business, small or giant, needs a distribution strategy.","d":"Whether small-scale or a giant producer, a tourism business needs a distribution strategy.","w":"Products must reach customers somehow."},
{"id":"t5-26","t":"Levels","tf":true,"ans":false,"q":"A level three channel has no intermediaries.","d":"Level zero has no intermediaries; level three has three (agent/broker, wholesaler, retailer).","w":"The level number counts the intermediaries."},
{"id":"t5-27","t":"Integration","tf":true,"ans":false,"q":"Integration increases the number of participants in the distribution process.","d":"Integration reduces the number of participants while the functions stay the same.","w":"Organisations combine, so there are fewer of them."},
{"id":"t5-28","t":"Levels","tf":true,"ans":true,"q":"Agents or brokers work on behalf of companies and deal primarily with wholesalers.","d":"Level three: agents work on behalf of companies and deal primarily with wholesalers.","w":"That is how the third intermediary enters the chain."},
{"id":"t5-29","t":"Integration","tf":true,"ans":false,"q":"Horizontal integration happens between organisations at different levels of the chain.","d":"Horizontal integration: the SAME level. Vertical integration: DIFFERENT levels.","w":"The statement describes vertical integration."},
{"id":"t5-30","t":"Integration","tf":true,"ans":true,"q":"Integration helps enterprises control how their product is represented.","d":"Benefits of integration include control over how the product is represented.","w":"Owning more of the chain means more control over selling."},
{"id":"t5-w1","t":"Distribution channels","wr":true,"q":"Define a distribution channel and explain the three types of distribution based on the use of intermediaries.","a":"Distribution channel: the method tourism providers use to get their products to customers; the channel through which a product moves to reach the consumer.\n1. Direct distribution: providers sell directly to customers with no intermediaries (physical location, phone, fax, email, website).\n2. Indirect distribution: providers use wholesalers and retailers.\n3. Dual distribution: providers use both direct and indirect channels.","d":"Sales distribution: how tourism products reach tourists.","w":"Define the term, then explain each type with an example."},
{"id":"t5-w2","t":"Levels","wr":true,"q":"Explain the four levels of distribution channels with examples.","a":"Level zero: direct sale from provider to tourist (e.g. booking on an airline's website).\nLevel one: one intermediary, a retailer (travel agent) between provider and customer.\nLevel two: two intermediaries, a wholesaler (tour operator) selling to a retailer (travel agent), who sells to the customer.\nLevel three: an agent or broker works on behalf of companies, dealing with wholesalers, who sell to retailers, who sell to customers.","d":"Levels of distribution: counted by the number of intermediaries.","w":"The level number equals the number of intermediaries."},
{"id":"t5-w3","t":"Integration","wr":true,"q":"Explain the meaning and benefits of integration in the distribution channel.","a":"Meaning: an economic concept describing formal linking arrangements between organisations; the industry consolidates so the number of functions stays the same but the number of participants decreases.\nBenefits:\n1. Reduces distribution costs.\n2. Lets enterprises control how their product is represented.\n3. Matches distribution channels more closely to particular market segments.\nNote: the Internet reduces some advantages, because it has already cut the number of links in the channel.","d":"Integration: linking organisations in the distribution chain.","w":"Integration is a way to be more efficient and competitive."},
{"id":"t5-w4","t":"Integration","wr":true,"q":"Differentiate between vertical and horizontal integration, with examples.","a":"Vertical integration: organisations merge with others at DIFFERENT levels of the chain, or set up their own business at a different level. Example: an airline integrating with a tour operator or travel agency.\nHorizontal integration: organisations merge with others at the SAME level (supplier with supplier, wholesaler with wholesaler, retailer with retailer). Examples: two airlines (competitive products) or an airline and a hotel (complementary products).","d":"Types of integration: vertical and horizontal.","w":"Ask: are the two organisations at the same level of the chain or different levels?"},
{"id":"t5-w5","t":"Integration","wr":true,"q":"Determine the type of integration in each case: (a) Oman Air opens sales offices in Nizwa, Sohar and Sur; (b) hotels in Nizwa develop one booking website; (c) Oman Air gives a free night at Crowne Plaza with every Khareef ticket to Salalah; (d) a Hajj company sets up its own bus company.","a":"(a) Vertical: the airline (supplier) sets up its own retail outlets at a different level.\n(b) Horizontal: hotels at the same level link together.\n(c) Horizontal: airline and hotel are both suppliers offering complementary products.\n(d) Vertical: the Hajj company sets up its own transport supplier at a different level.","d":"Vertical = different levels; horizontal = same level.","w":"Place each organisation on the chain (supplier, wholesaler, retailer) before deciding."},
{"id":"t5-w6","t":"Internet","wr":true,"q":"Explain how the Internet has changed tourism distribution.","a":"1. The Internet has become the communication hub linking all stakeholders.\n2. It has changed the way of distribution, letting providers sell directly to customers.\n3. It has increased competition among stakeholders in the distribution chain.\n4. It has reduced the number of links in the channel, so the cost savings from integration are now lower.","d":"Internet and distribution: technology reshaping how tourism products are sold.","w":"Link the Internet's effect to both competition and integration."}
]},
{"id":"tot-ch6","label":"Chapter 6","name":"Benefits of Tourism and Hospitality","questions":[
{"id":"t6-01","t":"Overview","q":"The benefits of tourism to a host destination are grouped into:","o":["Economic, social, cultural and environmental benefits","Income, profit, tax and loans","Air, land, water and rail","Planning, organising, directing and controlling"],"d":"Benefits of tourism: economic, social, cultural and environmental.","w":"The other options are lists from other topics."},
{"id":"t6-02","t":"Economic benefits","q":"In economic terms, inbound tourism to a country is considered:","o":["An export industry","An import industry","A non-economic activity","A cost only"],"d":"Inbound tourism = export industry; outbound tourism = import industry.","w":"Foreign visitors bring money into the country, like exports."},
{"id":"t6-03","t":"Economic benefits","q":"Economic impacts of tourism focus on which three areas?","o":["Income, employment and regional development","Culture, heritage and religion","Transport, accommodation and food","Planning, policy and control"],"d":"Economic benefits: income, employment and regional development.","w":"These are the three areas listed on the slides."},
{"id":"t6-04","t":"Economic benefits","q":"Tourists' spending on accommodation, food, transport, visas, taxes and souvenirs is:","o":["Direct spending","Indirect spending","Regional development","Outbound spending"],"d":"Direct spending: money spent by tourists themselves.","w":"The tourist pays directly."},
{"id":"t6-05","t":"Economic benefits","q":"A hotel spending on maintenance, marketing research and expansion projects is:","o":["Indirect spending","Direct spending","Cultural exchange","Segregation"],"d":"Indirect spending: money spent by tourism businesses on operations, marketing, expansion, taxes and imports.","w":"The business, not the tourist, is spending."},
{"id":"t6-06","t":"Economic benefits","q":"Tourism accounts for approximately what share of global trade in services?","o":["40%","6%","10%","3.2%"],"d":"World: about 40% of global trade in services, 6% of total world trade, over 10% of world GDP.","w":"6% is total world trade; 10% is GDP."},
{"id":"t6-07","t":"Economic benefits","q":"How much did tourism generate in Oman in 2016?","o":["OMR 841.3 million (3.2% of GDP)","OMR 1,631.6 million (3.9% of GDP)","OMR 75 million","OMR 106 million"],"d":"Oman: OMR 841.3 mn in 2016 (3.2% of GDP), expected to reach OMR 1,631.6 mn in 2027 (3.9%).","w":"1,631.6 mn is the 2027 forecast."},
{"id":"t6-08","t":"Economic benefits","q":"Globally, roughly how many people are employed in the tourism industry?","o":["About 77 million","About 157 million","About 75,000","About 10 million"],"d":"World: about 77 million employed in the industry, plus about 157 million additional jobs created outside it.","w":"157 million are jobs outside the industry."},
{"id":"t6-09","t":"Economic benefits","q":"How many jobs did tourism provide in Oman in 2016?","o":["75,000 (3.4% of total employment)","106,000 (4.5%)","77 million","841,300"],"d":"Oman: 75,000 jobs in 2016 (3.4%), expected 106,000 in 2027 (4.5%).","w":"106,000 is the 2027 forecast."},
{"id":"t6-10","t":"Economic benefits","q":"Compared with sectors such as oil production, tourism can generate:","o":["Twice as many jobs","Half as many jobs","No jobs","Only highly skilled jobs"],"d":"Employment: tourism is a major job creator, with many jobs not needing high levels of training.","w":"Tourism is labour-intensive."},
{"id":"t6-11","t":"Economic benefits","q":"Tourism's role in regional development is especially important in:","o":["Mountainous areas or small islands where other economic activity is difficult","Large industrial cities only","Oil fields","Areas with no visitors"],"d":"Regional development: tourism supports areas where other activity is difficult.","w":"Few other industries can thrive in such places."},
{"id":"t6-12","t":"Social benefits","q":"Which is a SOCIAL benefit of tourism?","o":["A higher standard of living as more jobs are created for local people","Rebirth of traditional crafts","Conservation of national parks","Imports of wine"],"d":"Social benefits: higher standard of living, revitalisation through redistribution of wealth, improved facilities, reduced poverty.","w":"Crafts are cultural; national parks are environmental."},
{"id":"t6-13","t":"Social benefits","q":"Revitalising poor societies through redistribution of wealth between rich and poor regions is a:","o":["Social benefit","Cultural benefit","Environmental benefit","Resistance factor"],"d":"Social benefits include revitalising poor societies through redistribution of wealth.","w":"It improves people's living conditions."},
{"id":"t6-14","t":"Cultural benefits","q":"The rebirth of local arts, crafts and traditional activities is a:","o":["Cultural benefit","Social benefit","Economic benefit","Environmental benefit"],"d":"Cultural benefits: rebirth of arts and crafts, restoration of architecture, promotion of areas with cultural value.","w":"Arts and traditions are culture."},
{"id":"t6-15","t":"Cultural benefits","q":"Cultural exchange is:","o":["Sharing ideas, traditions and knowledge with someone from a different background","Buying foreign currency","Exporting goods","A type of transport"],"d":"Cultural exchange: sharing different ideas, traditions and knowledge across backgrounds.","w":"Tourism creates contact between visitors and locals."},
{"id":"t6-16","t":"Cultural benefits","q":"Tourists and locals coexist in a 'live and let live' way. This outcome is:","o":["Accommodation (toleration)","Segregation","Opposition","Diffusion"],"d":"Outcomes of cultural interaction: accommodation, segregation, opposition, diffusion.","w":"'Live and let live' is toleration."},
{"id":"t6-17","t":"Cultural benefits","q":"Tourists remain confined to special tourist areas and keep a social distance from locals. This is:","o":["Segregation","Diffusion","Accommodation","Opposition"],"d":"Segregation: social distance by avoidance or by confining tourists to special areas.","w":"The groups are kept apart."},
{"id":"t6-18","t":"Cultural benefits","q":"Tourists, locals or both borrow or adapt cultural traits from each other. This is:","o":["Diffusion","Segregation","Opposition","Accommodation"],"d":"Diffusion: borrowing or adapting cultural traits or elements of the other.","w":"Culture spreads from one group to another."},
{"id":"t6-19","t":"Cultural benefits","q":"Locals rejecting tourists, or tourists rejecting locals, is:","o":["Opposition","Diffusion","Accommodation","Segregation"],"d":"Opposition: tourists are rejected by locals or locals by tourists.","w":"Rejection means opposition."},
{"id":"t6-20","t":"Environmental benefits","q":"National parks, marine reserves and monuments benefiting economically from tourism, and tourism encouraging good planning, is:","o":["Conservation","Segregation","Indirect spending","Opposition"],"d":"Environmental benefits: conservation, environmental education and the built environment.","w":"Tourism income helps protect these sites."},
{"id":"t6-21","t":"Environmental benefits","q":"Visitors learning about a destination through museums, trails, guides and technology, and then helping protect it, is:","o":["Environmental education","Diffusion","Regional development","Direct spending"],"d":"Environmental education: raising awareness of environmental values through interpretation.","w":"Gössling (2002) says tourism changed human-environment relations in knowledge, attitudes and behaviour."},
{"id":"t6-22","t":"Environmental benefits","q":"Coastal resorts and historic landscaped gardens leaving a legacy of architecture and landscapes is a benefit to:","o":["The built environment","Cultural opposition","Outbound tourism","Contract feeding"],"d":"The built environment: tourism leaves a valuable legacy in architecture, landscapes and urban detailing, and supports mixed developments.","w":"Resorts and gardens are built environments."},
{"id":"t6-23","t":"Factors","q":"The ratio of visitors to residents is called:","o":["Tourism density","Seasonality","Length of stay","Tourist profile"],"d":"Factors affecting benefits include the scale of tourism and tourism density (ratio of visitors to residents).","w":"Density compares visitors with residents."},
{"id":"t6-24","t":"Factors","q":"Which of these is a factor affecting the benefits of tourism on host destinations?","o":["Seasonality","The number of airlines worldwide","The colour of hotel buildings","The language of the slides"],"d":"Factors: development level, scale and density, tourists' profile and length of stay, activities and behaviour, seasonality, economic and socio-cultural characteristics of tourists versus residents.","w":"Seasonality changes how many tourists come and when."},
{"id":"t6-25","t":"Overview","tf":true,"ans":true,"q":"Tourism is one of the world's largest industries and the largest service industry.","d":"Introduction: tourism is one of the world's largest industries and the largest service industry.","w":"This is why its benefits matter so much."},
{"id":"t6-26","t":"Economic benefits","tf":true,"ans":false,"q":"Economic impacts of tourism on a host destination are generally negative.","d":"Economic impacts are generally positive, and they are the main reason countries encourage tourism.","w":"Income, jobs and regional development are positive impacts."},
{"id":"t6-27","t":"Economic benefits","tf":true,"ans":false,"q":"Tourism jobs always require high levels of training.","d":"Tourism is a major job creator with jobs that do not require high levels of training.","w":"That is why it creates so many jobs."},
{"id":"t6-28","t":"Cultural benefits","tf":true,"ans":true,"q":"Tourists' interest in local culture can increase locals' awareness of, and pride in, their culture.","d":"Cultural benefits: tourists' interest can regenerate awareness, interest and pride among locals.","w":"Seeing visitors value their culture encourages locals to value it too."},
{"id":"t6-29","t":"Economic benefits","tf":true,"ans":false,"q":"Outbound tourism is considered an export industry.","d":"Inbound tourism is an export industry; outbound tourism is an import industry.","w":"Outbound residents spend money abroad, like imports."},
{"id":"t6-30","t":"Factors","tf":true,"ans":true,"q":"The extent and nature of tourism impacts differ from one destination to another.","d":"Factors affecting benefits make impacts differ between destinations.","w":"Development level, density and seasonality vary by place."},
{"id":"t6-w1","t":"Economic benefits","wr":true,"q":"Explain the economic benefits of tourism, with world and Oman figures.","a":"1. Income: tourism injects fresh money. Direct spending by tourists (accommodation, F&B, transport, visas, taxes, souvenirs) and indirect spending by businesses (operations, marketing, expansion, taxes, imports). World: about 40% of global trade in services, 6% of world trade, over 10% of world GDP. Oman: OMR 841.3 mn in 2016 (3.2% of GDP), expected OMR 1,631.6 mn in 2027 (3.9%).\n2. Employment: a major job creator; can generate twice as many jobs as oil production. World: about 77 million employed plus 157 million jobs outside the industry. Oman: 75,000 jobs in 2016 (3.4%), expected 106,000 in 2027 (4.5%).\n3. Regional development: especially in mountainous areas or small islands.\nInbound tourism is an export industry.","d":"Economic benefits: income, employment and regional development.","w":"Use the slides' figures to support each point."},
{"id":"t6-w2","t":"Social benefits","wr":true,"q":"Discuss the social benefits of tourism to local societies.","a":"1. A higher standard of living as more jobs are created for local people.\n2. Revitalisation of poor societies through redistribution of wealth between rich and poor nations or regions.\n3. Improved lifestyles as more and better facilities become available.\n4. Jobs and business opportunities that help reduce or eliminate poverty.","d":"Social benefits: improvements to the lives of the host community.","w":"Each benefit affects local people's daily lives."},
{"id":"t6-w3","t":"Cultural benefits","wr":true,"q":"Discuss the cultural benefits of tourism and define cultural exchange.","a":"Cultural benefits:\n1. Rebirth of local arts, crafts and traditional activities.\n2. Renewal and restoration of architecture and other cultural elements.\n3. Promotion of areas with aesthetic and cultural value.\n4. Regenerated awareness, interest and pride in local culture.\n5. Cultural exchange and understanding between tourists and locals.\nCultural exchange: sharing different ideas, traditions and knowledge with someone from a completely different background.","d":"Cultural benefits: positive impacts of tourism on local culture.","w":"End with the definition of cultural exchange."},
{"id":"t6-w4","t":"Cultural benefits","wr":true,"q":"Explain the possible outcomes when two or more cultures interact.","a":"1. Accommodation or toleration: tourists and locals coexist in a 'live and let live' way.\n2. Segregation: tourists and locals keep a social distance, by avoidance or by tourists staying in special tourist areas.\n3. Opposition: tourists are rejected by locals, or locals by tourists.\n4. Diffusion: tourists, locals or both borrow or adapt cultural traits of the other.","d":"Cultural interaction: what happens when tourists' and locals' cultures meet.","w":"The four outcomes range from rejection (opposition) to mixing (diffusion)."},
{"id":"t6-w5","t":"Environmental benefits","wr":true,"q":"Discuss the environmental benefits of tourism.","a":"1. Conservation: national parks, marine reserves, monuments and archaeological sites benefit economically; tourism encourages good planning and management and motivates rehabilitation of built and natural environments.\n2. Environmental education: interpretation through museums, trails, guides and technology raises awareness, and visitors may help protect the destination; Gössling (2002) notes changes in knowledge, attitudes and behaviour.\n3. The built environment: a legacy of architecture, landscapes and urban detailing (e.g. coastal resorts, historic gardens) and support for mixed developments.","d":"Environmental benefits: positive impacts of tourism on natural and built environments.","w":"Three benefits are listed on the slides; explain each."},
{"id":"t6-w6","t":"Factors","wr":true,"q":"What factors affect the benefits of tourism on host destinations?","a":"1. Level of economic and tourism development at the destination.\n2. Scale of tourism (number of tourists) and tourism density (ratio of visitors to residents).\n3. Tourists' profile and length of stay.\n4. Tourists' activities and behaviour.\n5. Seasonality.\n6. Economic characteristics of tourists compared with local residents.\n7. Social and cultural characteristics of tourists compared with local residents.","d":"The extent and nature of tourism impacts differ from one destination to another.","w":"These factors explain why the same number of tourists affects places differently."}
]},
{"id":"tot-ch7","label":"Chapter 7","name":"Government and Tourism","questions":[
{"id":"t7-01","t":"Organisations","q":"An international tourism organisation is one that:","o":["Draws its membership from more than one country","Serves only one country","Is always privately owned","Only operates hotels"],"d":"International organisations draw membership from more than one country; national organisations serve only one country.","w":"'International' means more than one nation."},
{"id":"t7-02","t":"Organisations","q":"The UNWTO is best classified as:","o":["Inter-governmental, global, with a general interest in tourism","Non-governmental, regional, with a partial interest","A national public-sector body","A private airline association"],"d":"UNWTO: inter-governmental (created by treaties), global scope, general interest in tourism.","w":"It covers all aspects of tourism worldwide."},
{"id":"t7-03","t":"Organisations","q":"IATA (International Air Transport Association) is:","o":["Non-governmental, with a specific interest in tourism","Inter-governmental, with a general interest","A national tourism organisation","A partial-interest health body"],"d":"Non-governmental bodies draw members from individuals or organisations, not governments. Specific interest: one sector of the industry.","w":"IATA focuses on air transport only."},
{"id":"t7-04","t":"Organisations","q":"The WHO is an example of an organisation with a:","o":["Partial interest in tourism","General interest in tourism","Specific interest in tourism","Purely commercial interest"],"d":"Partial interest: not a tourism organisation, but some operations link to tourism.","w":"Health affects travel, but tourism is not the WHO's main purpose."},
{"id":"t7-05","t":"Organisations","q":"PATA, the GCC and the League of Arab States are international organisations concerned with:","o":["Specific regions of the world","Global tourism","A single city","Only hotels"],"d":"Geographical scope: global (e.g. UNWTO) or specific regions (e.g. PATA, GCC, League of Arab States).","w":"Each covers one region."},
{"id":"t7-06","t":"Organisations","q":"Public sector tourism organisations are:","o":["Government owned, funded and/or controlled","Owned by commercial businesses","Always international","Run by tourists"],"d":"Ownership: public sector (government) or private sector (commercial enterprises).","w":"'Public' means government."},
{"id":"t7-07","t":"Organisations","q":"A tourism organisation whose operations cover a specific city or town is a:","o":["Local Tourism Organisation (LTO)","National Tourism Organisation (NTO)","Regional Tourism Organisation (RTO)","International organisation"],"d":"Geographical scope (national): NTO covers the whole country, RTO a region, LTO a specific location such as a city or town.","w":"A city is a local level."},
{"id":"t7-08","t":"Organisations","q":"Oman's Ministry of Heritage and Tourism is a national organisation with a:","o":["General interest in tourism","Specific interest in tourism","Partial interest in tourism","No interest in tourism"],"d":"General interest: concerned with all aspects of tourism.","w":"The ministry covers the whole tourism sector."},
{"id":"t7-09","t":"Organisations","q":"OMRAN and Oman Airports Management Company are national organisations with a:","o":["Specific interest in tourism","General interest in tourism","Partial interest in tourism","Global interest"],"d":"Specific interest: concerned with one aspect or sector of the industry.","w":"Each handles one part (development or airports)."},
{"id":"t7-10","t":"Organisations","q":"The Royal Oman Police, Ministry of Health and banks have a:","o":["Partial interest in tourism","General interest in tourism","Specific interest in tourism","Inter-governmental interest"],"d":"Partial interest: not tourism organisations, but some operations are linked to tourism.","w":"Their main work is something else."},
{"id":"t7-11","t":"Government involvement","q":"The extent of government involvement in tourism varies according to a country's:","o":["Economic and political structures","Climate only","Number of hotels only","Population size only"],"d":"The more important tourism is to the economy, the greater the government involvement; political structures shape its nature.","w":"Involvement ranges from simple policy-making to owning tourism facilities."},
{"id":"t7-12","t":"Government involvement","q":"Which is NOT a reason for government involvement in tourism listed on the slides?","o":["To raise the world price of oil","To maximise tourism benefits","To protect natural resources","Education and training"],"d":"Reasons: maximise benefits, protect resources, economic stability, employment, welfare of citizens, market regulation and promotion, statistics, planning and control, education and training.","w":"Oil prices are not on the list."},
{"id":"t7-13","t":"NTOs","q":"Which is NOT one of the standard functions of an NTO?","o":["Selling airline tickets to tourists","Planning","Promotion","Control"],"d":"NTO functions: planning, organising, development, promotion and control.","w":"Selling tickets is the job of airlines and travel agents."},
{"id":"t7-14","t":"NTOs","q":"The Ministry of Heritage and Tourism (MOHT) in Oman is responsible for:","o":["Promoting and preserving Omani heritage and tourism","Running Oman's airports","Managing Oman's banks","Building roads"],"d":"MOHT: the governmental body responsible for promoting and preserving Omani heritage and tourism.","w":"Airports are run by Oman Airports."},
{"id":"t7-15","t":"NTOs","q":"Which of these is NOT a directorate of Oman's Ministry of Heritage and Tourism?","o":["Directorate General of Civil Aviation","Directorate General of Tourism Promotion","Directorate General of Antiquities","Directorate General of Museums"],"d":"MOHT directorates: Tourism Development, Tourism Promotion, Antiquities, Museums, Admin & Finance, Planning, Heritage & Tourism in Dhofar, Heritage & Tourism in Governorates.","w":"Civil aviation is not one of its directorates."},
{"id":"t7-16","t":"Oman 2040","q":"Oman's tourism vision is to become, by 2040, a top-of-mind destination for vacations, discovery and meetings, attracting more than:","o":["11 million international and local tourists","1 million tourists","500,000 tourists","100 million tourists"],"d":"Vision: by 2040, a top-of-mind destination for vacations, discovery and meetings, attracting 11 million international and local tourists.","w":"11 million is the target number."},
{"id":"t7-17","t":"Oman 2040","q":"Oman's tourism mission is:","o":["To diversify the economy and create jobs by offering enriching tourism experiences with Omani personality","To replace all other industries with tourism","To reduce the number of tourists","To build only luxury hotels"],"d":"Mission: to diversify our economy and to create jobs by offering the world enriching tourism experiences with Omani personality.","w":"The mission explains why tourism should grow in Oman."},
{"id":"t7-18","t":"Oman 2040","q":"Which of these is NOT one of the core values of Oman Tourism Strategy 2040?","o":["Luxury","Friendliness","Pride in our identity","Generosity"],"d":"Core values: friendliness, kindness, respect, pride in our identity, honesty, generosity.","w":"Luxury is not listed."},
{"id":"t7-19","t":"Oman 2040","q":"Which are the REGIONAL target markets in Oman's 2040 strategy?","o":["UAE and Saudi Arabia","Germany and France","India and the United Kingdom","China and Japan"],"d":"Target markets: international (Germany, France, India, UK) and regional (UAE, Saudi Arabia).","w":"Germany, France, India and the UK are the international markets."},
{"id":"t7-20","t":"Tourism policy","q":"Controlling access through visas and immigration policy is a tool for:","o":["Managing tourism demand","Managing tourism supply","Hotel grading","Cultural exchange"],"d":"Demand tools: marketing and promotion, information, pricing, visas and immigration, security and safety.","w":"Visas control how many visitors can come, which is demand."},
{"id":"t7-21","t":"Tourism policy","q":"Land-use planning, taxation, investment incentives and ownership of tourism plant are tools for:","o":["Managing tourism supply","Managing tourism demand","Distribution channels","Travel motivation"],"d":"Supply tools: land-use planning and building regulations, market regulation, research and planning, taxation, education and training, ownership of plant, investment incentives.","w":"These tools shape what facilities exist."},
{"id":"t7-22","t":"Tourism planning","q":"Tourism planning is:","o":["The process of setting objectives and then deciding how they will be achieved","Selling tours to tourists","Building one hotel","Grading hotels"],"d":"Tourism planning: setting objectives and determining the means to achieve them.","w":"Planning starts with objectives."},
{"id":"t7-23","t":"Tourism planning","q":"What is the FIRST step in any planning process?","o":["Establish a goal or objective","Monitor performance","Develop action plans","Identify aids and barriers"],"d":"Planning steps: establish a goal → define the present situation → identify aids and barriers → develop action plans → monitor performance.","w":"You need a goal before anything else."},
{"id":"t7-24","t":"Tourism planning","q":"Planning for a whole country or a region within it is called:","o":["Destination planning (the geographical level)","Business-level planning","Franchise planning","Demand management"],"d":"Scope of planning: geographical level (destination planning) and business level (individual projects).","w":"A country or region is a destination."},
{"id":"t7-25","t":"Organisations","tf":true,"ans":true,"q":"Inter-governmental bodies are created by treaties between sovereign states.","d":"Inter-governmental bodies (e.g. UNWTO) are created by treaties entered into by sovereign states.","w":"Their members are governments."},
{"id":"t7-26","t":"Organisations","tf":true,"ans":false,"q":"Private sector tourism organisations are owned by the government.","d":"Private sector organisations are owned and operated by commercial enterprises, not the government.","w":"Government-owned bodies are public sector."},
{"id":"t7-27","t":"Tourism policy","tf":true,"ans":false,"q":"Determining tourism policy is a one-time process.","d":"Determining tourism policy is continuous, with constant revisions and iterations.","w":"Policy must adapt as conditions change."},
{"id":"t7-28","t":"Tourism planning","tf":true,"ans":true,"q":"Planning the construction of a single hotel or theme park is planning at the business level.","d":"Business level: developing individual tourism projects, such as a hotel or theme park.","w":"It concerns one project, not a whole destination."},
{"id":"t7-29","t":"Oman 2040","tf":true,"ans":true,"q":"Oman's tourism strategy supports economic diversification away from an oil-based economy.","d":"Oman Tourism Strategy 2040: Oman is committed to economic diversification away from oil.","w":"Tourism creates income and jobs outside oil."},
{"id":"t7-30","t":"Tourism policy","tf":true,"ans":false,"q":"Taxation is a policy tool for managing tourism demand.","d":"Taxation is listed as a tool for managing tourism SUPPLY.","w":"Demand tools include marketing, pricing, visas and safety."},
{"id":"t7-w1","t":"Organisations","wr":true,"q":"Discuss the classification of international tourism organisations, with examples.","a":"International organisations draw membership from more than one country. Three criteria:\n1. Membership: inter-governmental (created by treaties between states, e.g. UNWTO) or non-governmental (members are individuals or organisations, e.g. IATA).\n2. Geographical scope: global (e.g. UNWTO) or regional (e.g. PATA, GCC, League of Arab States).\n3. Level of interest: general (all aspects, e.g. UNWTO), specific (one sector, e.g. IATA) or partial (some operations linked to tourism, e.g. WHO).","d":"International tourism organisations: classified by membership, geographical scope and level of interest.","w":"Use one example per category."},
{"id":"t7-w2","t":"Organisations","wr":true,"q":"Discuss the classification of national tourism organisations, with Omani examples.","a":"National organisations serve one country. Three criteria:\n1. Ownership: public sector (government owned, funded or controlled) or private sector (commercial businesses).\n2. Geographical scope: NTO (whole country), RTO (a region), LTO (a city or town).\n3. Level of interest: general (e.g. Ministry of Heritage and Tourism), specific (e.g. OMRAN, Oman Airports Management Company), partial (e.g. Royal Oman Police, Ministry of Health, banks).","d":"National tourism organisations: classified by ownership, geographical scope and level of interest.","w":"The slides give Omani examples for the level of interest."},
{"id":"t7-w3","t":"Government involvement","wr":true,"q":"Explain why governments get involved in tourism and what affects the extent of their involvement.","a":"Reasons: maximise tourism benefits; protect natural resources; economic stability; employment; welfare of citizens; market regulation and promotion; statistics and information; planning and control; education and training.\nExtent and nature vary with:\n- Economic structures: the more important tourism is to the economy, the greater the involvement.\n- Political structures: involvement ranges from simple policy-making to owning tourism infrastructure and superstructure.","d":"Government involvement: the role of the state in the tourism industry.","w":"Give the reasons, then explain what makes involvement greater or smaller."},
{"id":"t7-w4","t":"NTOs","wr":true,"q":"Explain the role of an NTO and describe Oman's Ministry of Heritage and Tourism.","a":"NTO: established by a country to serve national goals and carry out public policy; its role is to ensure the appropriate development and promotion of the country as a destination. Standard functions: planning, organising, development, promotion, control.\nMOHT: the governmental body responsible for promoting and preserving Omani heritage and tourism. Directorates: Tourism Development, Tourism Promotion, Antiquities, Museums, Admin & Finance, Planning, Heritage & Tourism in Dhofar, Heritage & Tourism in Governorates.","d":"NTO: National Tourism Organisation.","w":"Explain the general NTO role first, then Oman's example."},
{"id":"t7-w5","t":"Tourism policy","wr":true,"q":"Define tourism policy and explain the two types of policy instruments governments use.","a":"UNWTO: tourism policy is all the actions carried out under the coordination of public administrations to achieve defined aims in the analysis, attraction, reception and evaluation of the impacts of tourism flows. It is a continuous process.\n1. Managing demand: marketing and promotion; information and networks for incoming tourists; pricing intervention; controlling access (visas, immigration); security and safety.\n2. Managing supply: land-use planning, building regulations and environmental control; market regulation; market research and planning; taxation; education and training; ownership of tourism plant; investment incentives.","d":"Tourism policy: coordinated public actions to achieve tourism aims.","w":"Demand tools affect visitors; supply tools affect facilities and businesses."},
{"id":"t7-w6","t":"Oman 2040","wr":true,"q":"Explain the vision, mission, core values and target markets of Oman Tourism Strategy 2040.","a":"Vision: by 2040, a top-of-mind destination for vacations, discovery and meetings, attracting more than 11 million international and local tourists.\nMission: to diversify the economy and create jobs by offering the world enriching tourism experiences with Omani personality.\nCore values: friendliness, kindness, respect, pride in our identity, honesty, generosity.\nTarget markets: international (Germany, France, India, UK) and regional (UAE, Saudi Arabia).\nThe strategy supports economic diversification away from oil and identifies 9 target business sectors.","d":"Oman Tourism Strategy 2040: the national plan for tourism development.","w":"The vision says what Oman wants to become; the mission says why tourism should grow."}
]},
{"id":"tot-ch8","label":"Chapter 8","name":"Tourism Education and Jobs","questions":[
{"id":"t8-01","t":"Education","q":"Which of these is listed as a tourism and hospitality higher education institution in Oman?","o":["Oman Tourism College (OTC)","Royal Oman Police","Oman Airports","Ministry of Health"],"d":"T&H education in Oman: SQU, Oman Tourism College, Majan University College, University of Nizwa, National Hospitality Institute, Muscat Hospitality Academy.","w":"The other options are employers, not colleges."},
{"id":"t8-02","t":"Education","q":"Which institution is NOT on the slides' list of T&H education providers in Oman?","o":["Oman Medical College","Sultan Qaboos University","National Hospitality Institute","Muscat Hospitality Academy"],"d":"The slides list six T&H education providers in Oman.","w":"A medical college does not offer tourism and hospitality degrees."},
{"id":"t8-03","t":"Employment","q":"Under Oman's Tanfeedh plan, which sectors are targeted for development alongside tourism?","o":["Industrial and logistics","Oil and gas only","Banking only","Agriculture only"],"d":"Tourism, industrial and logistics sectors are targeted under Tanfeedh for economic diversification.","w":"The government wants new jobs in these sectors prioritised for Omanis."},
{"id":"t8-04","t":"Employment","q":"How many jobs are predicted to be created by Oman Tourism Strategy 2016–2040?","o":["More than 500,000","About 75,000","About 50,000","About 11 million"],"d":"Job opportunities: more than 500,000 jobs predicted from the strategy.","w":"11 million is the tourist target, not jobs."},
{"id":"t8-05","t":"Employment","q":"About how many DIRECT tourism jobs are forecast by 2040?","o":["321,863","500,000","73,224","137,000"],"d":"Direct jobs by 2040: about 321,863.","w":"73,224 is the hospitality share; 137,000 is diploma-to-bachelor jobs."},
{"id":"t8-06","t":"Employment","q":"What share of direct tourism jobs in 2040 will be in the hospitality sector?","o":["22.75% (73,224 jobs)","77.25% (248,639 jobs)","70%","90%"],"d":"Hospitality: 22.75% (73,224); other tourism-related sectors: 77.25% (248,639).","w":"Most direct jobs are outside hospitality."},
{"id":"t8-07","t":"Employment","q":"Overall Omanization in tourism jobs by 2040 is expected to be around:","o":["70% (almost 222,815 jobs)","90%","22.75%","37%"],"d":"Omanization: around 70% overall; around 90% in managerial and middle-management positions.","w":"90% applies to managerial positions only."},
{"id":"t8-08","t":"Employment","q":"Omanization in managerial and middle-management tourism positions is expected to be around:","o":["90%","70%","61%","22.75%"],"d":"Managerial and middle-management Omanization: about 90%.","w":"The overall figure is 70%."},
{"id":"t8-09","t":"Employment","q":"Jobs requiring a diploma, advanced diploma or bachelor's degree are expected to be about:","o":["137,000 (about 61% of jobs)","321,863","73,224","500,000"],"d":"Diploma, advanced diploma and bachelor jobs: around 137,000, about 61% of total jobs.","w":"This shows the value of tourism education."},
{"id":"t8-10","t":"Employment","q":"Most of the new tourism jobs will be in the:","o":["Private sector","Public sector","Military","Oil sector"],"d":"Job opportunities: most jobs will be in the private sector.","w":"Hotels, transport and tour companies are mostly private businesses."},
{"id":"t8-11","t":"Job levels","q":"Directors and managers who lead and supervise an area, programme or project are at the:","o":["Superior level","Medium technical level","Basic level","Entry level"],"d":"Job levels (2040): superior (directors, managers), medium technical (specialised and skilled), basic (wage-earning manual work).","w":"Leadership positions are superior level."},
{"id":"t8-12","t":"Job levels","q":"Positions needing theoretical and conceptual knowledge of a specialisation, plus technical or skilled support roles, are at the:","o":["Medium technical level","Superior level","Basic level","Volunteer level"],"d":"Medium technical level: specialised knowledge and support, operational, technical, skilled or semi-skilled positions.","w":"It sits between managers and manual work."},
{"id":"t8-13","t":"Job levels","q":"Wage-earning jobs, especially manual-labour and industrial work, are at the:","o":["Basic level","Superior level","Medium technical level","Executive level"],"d":"Basic level: positions employed for wages, mainly manual and skilled labour.","w":"Manual work is basic level."},
{"id":"t8-14","t":"Where to work","q":"Working for a travel agent or tour operator is employment in the:","o":["Sales distribution sector","Accommodation sector","Attractions sector","Events sector"],"d":"Tourism suppliers: transportation, accommodation, F&B, attractions, sales distribution (travel agents, tour operators), events.","w":"Travel agents and tour operators sell tourism products."},
{"id":"t8-15","t":"Where to work","q":"Forts, museums, the opera house and protected areas offer jobs in the:","o":["Attractions sector","Transportation sector","Sales distribution sector","F&B sector"],"d":"Attractions: forts, museums, opera house, protected areas.","w":"These are places tourists visit."},
{"id":"t8-16","t":"Where to work","q":"Starting your own tourism or hospitality business is called:","o":["Tourism entrepreneurship","Omanization","Franchising","Self-assessment"],"d":"Tourism entrepreneurship: establishing a business in the tourism and hospitality industry.","w":"Creating your own business is entrepreneurship."},
{"id":"t8-17","t":"Careers","q":"Which of these is an example of a HOSPITALITY career on the slides?","o":["Front office manager","Tour guide","Airline ground staff","Museum manager"],"d":"Hospitality careers: hotel/resort, restaurant, front office, housekeeping, F&B, banquet, events, guest relations managers, etc.","w":"The other options are listed as tourism careers."},
{"id":"t8-18","t":"Careers","q":"Which of these is an example of a TOURISM career on the slides?","o":["Tour guide","Housekeeping manager","Banquet supervisor","Food and beverage manager"],"d":"Tourism careers: tour guide, tour manager, tourism officer, travel agency manager, ticketing manager, airline ground staff, travel consultant, museum manager, etc.","w":"The other options are hospitality careers."},
{"id":"t8-19","t":"Skills","q":"Which of these is NOT one of the soft skills listed for working in tourism and hospitality?","o":["Computer programming","Patience","Multitasking","Adaptability and flexibility"],"d":"Soft skills: patience, communication, customer service, outgoing and enthusiastic, multitasking, problem-solving, teamwork, adaptability, stress and time management, professionalism.","w":"Programming is a technical skill, not a listed soft skill."},
{"id":"t8-20","t":"Working in T&H","q":"Which is a POSITIVE side of working in tourism and hospitality?","o":["No two days are the same, and you meet new people","Long hours in the peak season","Night shifts","High staff turnover"],"d":"Positive sides: largest and fastest-growing industry, many jobs, easy entry, wide variety, faster promotion, good work environment, no two days the same, meeting people, work anywhere, part-time jobs.","w":"The other options are negative sides."},
{"id":"t8-21","t":"Working in T&H","q":"Which is a NEGATIVE side of working in tourism and hospitality?","o":["Many jobs are seasonal and informal","Employees can be promoted faster","You can work anywhere in the world","Part-time jobs are easy to find"],"d":"Negative sides: long hours, 24/365 operations, working holidays and nights, high turnover, negative public perception, part-time and casual work, low entry pay, seasonal jobs.","w":"The other options are positive sides."},
{"id":"t8-22","t":"Working in T&H","q":"Tourism and hospitality create about how many of all jobs?","o":["About 1 in every 10 jobs (almost 10%)","About 1 in every 2 jobs","About 1 in every 100 jobs","Almost no jobs"],"d":"Positive sides: tourism creates many jobs, about one job in ten.","w":"That is almost 10% of all jobs."},
{"id":"t8-23","t":"Career planning","q":"What is the FIRST step in career planning in tourism and hospitality?","o":["Conduct a self-assessment and know yourself","Engage in networking","Gain work experience","Visit organisations"],"d":"Career planning steps: self-assessment → learn about careers → explore organisations → understand required skills → network → gain work experience.","w":"You must know yourself before choosing a career."},
{"id":"t8-24","t":"Career planning","q":"Internships, training, student clubs and volunteering belong to which career planning step?","o":["Work experience","Self-assessment","Networking","Learning about careers"],"d":"Work experience: internship, training, students' clubs, volunteering.","w":"These give practical experience."},
{"id":"t8-25","t":"Working in T&H","tf":true,"ans":true,"q":"Tourism and hospitality jobs generally have easy entry requirements.","d":"Positive side: easy entry requirements and jobs for all age groups, even without experience.","w":"This makes the sector accessible."},
{"id":"t8-26","t":"Working in T&H","tf":true,"ans":true,"q":"Some hospitality businesses, such as hotels, must open 24 hours a day, 365 days a year.","d":"Negative side: some businesses like hotels must open 24/365.","w":"This leads to night shifts and holiday work."},
{"id":"t8-27","t":"Working in T&H","tf":true,"ans":false,"q":"Tourism and hospitality jobs are always perceived positively by the public.","d":"Negative side: the sector is sometimes negatively perceived by the public.","w":"This is listed among the negatives."},
{"id":"t8-28","t":"Working in T&H","tf":true,"ans":true,"q":"Small firms are likely to employ more part-time workers than large firms.","d":"Negative side: evidence suggests small firms employ more part-time workers.","w":"Part-time work can mean less job security."},
{"id":"t8-29","t":"Working in T&H","tf":true,"ans":false,"q":"Entry-level jobs in tourism and hospitality always pay high salaries.","d":"Negative side: low salaries for entry-level jobs; good salaries mainly for top positions.","w":"High pay comes with promotion to top roles."},
{"id":"t8-30","t":"Career planning","tf":true,"ans":true,"q":"Engaging in networking is one of the steps of career planning.","d":"Career planning steps include engaging in networking.","w":"Contacts help you find opportunities."},
{"id":"t8-w1","t":"Education","wr":true,"q":"Which organisations offer degree and vocational qualifications in tourism and hospitality in Oman?","a":"1. Sultan Qaboos University (SQU)\n2. Oman Tourism College (OTC)\n3. Majan University College\n4. University of Nizwa\n5. National Hospitality Institute (NHI)\n6. Muscat Hospitality Academy (MHA)\n(UTAS also offers the Bachelor of Tourism and Hospitality Management.)","d":"Tourism education: institutions preparing people for tourism and hospitality careers.","w":"List all six institutions from the slides."},
{"id":"t8-w2","t":"Employment","wr":true,"q":"Discuss the job opportunities expected from Oman Tourism Strategy 2040.","a":"- More than 500,000 jobs created by the strategy (2016–2040).\n- About 321,863 direct tourism jobs by 2040.\n- Hospitality: 22.75% (73,224); other tourism sectors: 77.25% (248,639).\n- Omanization about 70% (almost 222,815 jobs), and about 90% in managerial and middle-management positions.\n- Diploma, advanced diploma and bachelor jobs about 137,000 (around 61%).\n- Most jobs in the private sector.\nTourism is targeted under the Tanfeedh plan, with jobs prioritised for Omanis.","d":"Employment in tourism: jobs created by tourism development in Oman.","w":"Quote the slides' figures accurately."},
{"id":"t8-w3","t":"Where to work","wr":true,"q":"Outline the sectors and organisations that offer jobs to tourism and hospitality graduates.","a":"1. National Tourism Organisations: Oman Ministry of Heritage and Tourism.\n2. Tourism suppliers: transportation (airports, airlines, car rentals, ports, bus companies); accommodation (hotels, motels, apartments, camps, heritage inns); F&B (restaurants, coffee shops); attractions (forts, museums, opera house, protected areas); sales distribution (travel agents, tour operators); events (Oman Convention and Exhibition Centre, festivals).\n3. Other government organisations: OMRAN, Oman Airports Management Company, Royal Oman Police, Royal Court, ministries, embassies.\n4. International organisations: GCC, Arab Tourism Organisation, UNWTO.\n5. Tourism entrepreneurship: your own business.","d":"Where to work: the employers available to tourism and hospitality graduates.","w":"Group the employers into these five categories."},
{"id":"t8-w4","t":"Skills","wr":true,"q":"What soft skills are needed to work in tourism and hospitality?","a":"1. Patience\n2. Communication skills\n3. Customer service skills\n4. Outgoing personality and enthusiasm\n5. Multitasking skills\n6. Problem-solving\n7. Teamwork\n8. Adaptability and flexibility\n9. Stress and time management\n10. Professionalism","d":"Soft skills: personal and interpersonal skills needed to work with people.","w":"The slides list ten skills; name all ten."},
{"id":"t8-w5","t":"Working in T&H","wr":true,"q":"Discuss the positive and negative sides of working in tourism and hospitality.","a":"Positive:\n- One of the largest and fastest-growing industries; about 1 in 10 jobs.\n- Many tourism projects in Oman, so more job opportunities.\n- Easy entry; jobs for all ages, even without experience.\n- Transferable skills, so you can work anywhere; faster promotion.\n- Excellent work environment (hotels, resorts, airports); no two days the same; meeting new people.\n- Easy part-time work; good salaries for top positions.\nNegative:\n- Long hours, especially in peak season; 24/365 operations; working holidays and night shifts.\n- High turnover; negative public perception.\n- More part-time and casual workers; low entry-level pay.\n- Seasonal and informal jobs; competition from unskilled labour; labour moving between sectors.","d":"Working in tourism and hospitality has both advantages and challenges.","w":"Balance the answer with several points on each side."},
{"id":"t8-w6","t":"Career planning","wr":true,"q":"Outline the main steps for career planning in tourism and hospitality.","a":"1. Conduct a self-assessment and know yourself.\n2. Learn about the careers that suit you.\n3. Explore and visit the organisations you would like to work in.\n4. Understand the attributes, skills and knowledge required.\n5. Engage in networking.\n6. Gain work experience (internships, training, students' clubs, volunteering).","d":"Career planning: a step-by-step process for choosing and preparing for a career.","w":"The steps move from knowing yourself to gaining real experience."}
]}
]},
{"id":"fin","name":"Supply Chain","sub":"Principles of Supply Chain and Logistics Management (BSSL1208)","chapters":[
{"id":"fin-ch1","label":"Chapter 1","name":"An Overview of Supply Chain and Logistics Management","questions":[
{"id":"f1-01","t":"SCM basics","q":"In the Li & Fung jacket example, which pairing of country and contribution is correct?","o":["Japan – the zipper teeth (stainless steel)","China – the snap fasteners","Germany – the shell and fleece","Taiwan – the liner (cotton)"],"d":"Li & Fung sourced one jacket from five countries and had it stitched in Thailand. China made the liner (cotton), Thailand ringed the hood with imitation fur, Japan put the teeth in the zipper (stainless steel), Germany sent the snaps, and Taiwan produced the shell and fleece."},
{"id":"f1-02","t":"SCM basics","q":"According to the slides' definition, supply chain management works to control, manage and improve the flow of:","o":["Material and information, from the suppliers to the end users","Cash only, from customers back to suppliers","Finished goods only, from factories to retailers","People and equipment between a company's departments"],"d":"SCM unifies a network of connected but interdependent organisations, working together to control, manage and improve the flow of material and information from the suppliers to the end users, while increasing value to the end users at less cost as a whole."},
{"id":"f1-03","t":"SCM basics","q":"Purchasing, production, inventory, transportation and sales are best described as:","o":["Activities that have to be managed across the supply chain, not the supply chain itself","The supply chain itself","Activities each department should manage separately","Activities that matter to logistics but not to SCM"],"d":"SCM coordinates the many activities involved in creating and delivering a product. These activities are not themselves 'the supply chain'; they are activities that have to be managed across the supply chain."},
{"id":"f1-04","t":"Evolution of SCM","q":"Which period do the slides link to the development of MRP and MRPII?","o":["1960s–1970s","1950s–1960s","1980s–1990s","2000s and beyond"],"d":"1960s–1970s: new computer technologies led to Materials Requirements Planning (MRP) and Manufacturing Resource Planning (MRPII), used to coordinate inventory management and improve internal communications."},
{"id":"f1-05","t":"Evolution of SCM","q":"In the 1950s–1960s, U.S. manufacturers' main strategy for cutting costs and improving productivity was:","o":["Mass production techniques","Just-in-time inventory","Third-party logistics providers","Total quality management"],"d":"1950s–1960s: U.S. manufacturers focused on mass production techniques as their principal cost reduction and productivity improvement strategies."},
{"id":"f1-06","t":"Evolution of SCM","q":"Which approach aligns raw-material orders from suppliers directly with production schedules?","o":["Just-in-time (JIT)","Total quality management (TQM)","Business process reengineering (BPR)","Customer relationship management (CRM)"],"d":"JIT is an inventory management strategy that aligns raw-material orders from suppliers directly with production schedules. It is one of the 1980s–1990s developments, along with TQM, BPR and CRM."},
{"id":"f1-07","t":"Evolution of SCM","q":"Business process reengineering (BPR) aimed to help organisations:","o":["Fundamentally rethink how they do their work to improve service, cut costs and become world-class competitors","Continually detect and reduce errors in manufacturing","Manage and analyse interactions with past, current and potential customers","Match raw-material orders to production schedules"],"d":"BPR aimed to help organisations fundamentally rethink how they do their work to improve customer service, cut operational costs and become world-class competitors. Continual error reduction is TQM, and managing customer interactions is CRM."},
{"id":"f1-08","t":"Evolution of SCM","q":"Which group of initiatives do the slides place in '2000s and beyond'?","o":["Third-party service providers (3PLs), integrating logistics, and client/server ERP software","MRP and MRPII","JIT, TQM, BPR and CRM","Mass production techniques"],"d":"2000s and beyond focused on improving supply chain capabilities through third-party service providers (3PLs), integrating logistics, and client/server SCM software such as Enterprise Resource Planning."},
{"id":"f1-09","t":"Evolution of SCM","q":"The 'triple bottom line' means taking care of:","o":["People, planet and profits","Price, product and place","Suppliers, manufacturers and customers","Cost, quality and speed"],"d":"Today the emphasis is on the environmental and social impacts of supply chains. The triple bottom line means taking care of people, planet and profits."},
{"id":"f1-10","t":"Logistics","q":"According to the CLM definition, logistics management plans, implements and controls:","o":["The efficient, effective forward and reverse flow and storage of goods, services and related information between origin and consumption","Only the forward flow of finished goods to customers","The financial flows between supply chain partners","The design of new products together with suppliers"],"d":"Logistics management is the part of SCM that plans, implements and controls the efficient, effective forward and reverse flow and storage of goods, services and related information between the point of origin and the point of consumption to meet customers' requirements."},
