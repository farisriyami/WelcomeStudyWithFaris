{"id":"fn1-w6","t":"Decisions in finance","wr":true,"q":"Explain the four types of decisions in finance.","a":"1. Financing decisions: identifying current and potential sources of funds.\n2. Investing decisions: choosing opportunities or assets for effective investment.\n3. Liquidity decisions: deciding the timing and method for converting investments into cash.\n4. Dividend decisions: deciding whether to distribute profits to shareholders or retain them.\nThese decisions differ by level (personal, organisational, national, international) and by time period (short, medium, long term).","d":"Decisions in finance: financing, investing, liquidity and dividend decisions.","w":"Each decision answers a different question: where the money comes from, where it goes, when it becomes cash, and what happens to profits."}
]},
{"id":"fn-ch2","label":"Chapter 2","name":"Time Value of Money: Simple and Compound Interest","questions":[
{"id":"fn2-01","t":"Interest basics","q":"How do banks make a profit margin on interest?","o":["By paying lower interest on deposits than they charge on loans","By paying higher interest on deposits than on loans","By charging interest only on deposits","By lending only their own money"],"d":"Interest rate margin: banks pay lower interest on deposits and charge higher interest on loans.","w":"The difference between the two rates is the bank's profit margin. In Oman, deposit rates are about 0.5% to 5% p.a. and lending rates about 1.50% to 7% p.a."},
{"id":"fn2-02","t":"Interest basics","q":"According to the notes, deposit interest rates in Oman range from about:","o":["0.5% to 5% per annum","1.50% to 7% per annum","5% to 10% per annum","0% to 0.5% per annum"],"d":"Interest rates in Oman: deposit rates 0.5% to 5% p.a.; lending rates 1.50% to 7% p.a., depending on the product.","w":"1.50% to 7% is the lending range. Deposit rates are lower, which creates the bank's margin."},
{"id":"fn2-03","t":"Simple interest","q":"Simple interest is calculated on:","o":["The principal only","The principal plus interest from previous periods","The interest only","The final amount"],"d":"Simple interest: interest calculated only on the principal deposited or borrowed. I = P × r × t.","w":"Interest on accumulated interest is compound interest. Simple interest always uses the original principal."},
{"id":"fn2-04","t":"Simple interest","q":"How much interest does RO 1,000 earn at 4% simple interest for 15 months?","o":["RO 50.000","RO 40.000","RO 600.000","RO 48.000"],"d":"Simple interest: I = P × r × t, where t must be in years.","w":"15 months = 15 ÷ 12 = 1.25 years. I = 1,000 × 0.04 × 1.25 = RO 50. Using 15 as years would give RO 600, which is wrong."},
{"id":"fn2-05","t":"Simple interest","q":"A deposit of RO 4,000 earned RO 360 simple interest in 3 years. What is the rate?","o":["3%","9%","4%","12%"],"d":"Rate from simple interest: r = I ÷ (P × t).","w":"r = 360 ÷ (4,000 × 3) = 360 ÷ 12,000 = 0.03 = 3%. Forgetting the 3 years gives 9%."},
{"id":"fn2-06","t":"Simple interest","q":"What principal earns RO 250 simple interest in 5 years at 5%?","o":["RO 1,000.000","RO 5,000.000","RO 1,250.000","RO 12.500"],"d":"Principal from simple interest: P = I ÷ (r × t).","w":"P = 250 ÷ (0.05 × 5) = 250 ÷ 0.25 = RO 1,000."},
{"id":"fn2-07","t":"Simple interest","q":"How long must RO 2,500 be deposited at 4% simple interest to earn RO 500?","o":["5 years","2 years","4 years","20 years"],"d":"Time from simple interest: t = I ÷ (P × r).","w":"t = 500 ÷ (2,500 × 0.04) = 500 ÷ 100 = 5 years. (For RO 5,000 at 5% it would be 2 years.)"},
{"id":"fn2-08","t":"Compound interest","q":"If interest is compounded quarterly, the compounding factor n is:","o":["4","3","12","2"],"d":"Compounding factor n: annually 1, semi-annually 2, quarterly 4, monthly 12, daily 365 or 366.","w":"There are four quarters in a year, so interest is added 4 times."},
{"id":"fn2-09","t":"Compound interest","q":"Which formula gives the compound INTEREST (not the final amount)?","o":["P(1 + r/n)^(nt) − P","P(1 + r/n)^(nt)","P × r × t","P(1 + rt)"],"d":"Compound interest: I = P(1 + r/n)^(nt) − P.","w":"P(1 + r/n)^(nt) is the total amount (future value). Subtracting P leaves only the interest. P × r × t is simple interest."},
{"id":"fn2-10","t":"Compound interest","q":"How much interest does RO 500 earn at 12% for 2 years, compounded annually?","o":["RO 127.200","RO 120.000","RO 627.200","RO 134.867"],"d":"Compound interest: I = P(1 + r/n)^(nt) − P.","w":"I = 500 × (1 + 0.12)^2 − 500 = 500 × 1.2544 − 500 = RO 127.200. RO 120 is simple interest; RO 627.200 is the total amount."},
{"id":"fn2-11","t":"Compound interest","q":"RO 500 is invested at 12% for 2 years. Which compounding frequency earns the MOST interest?","o":["Monthly","Quarterly","Semi-annually","Annually"],"d":"More frequent compounding means interest is added and starts earning interest sooner.","w":"Annually RO 127.200, semi-annually RO 131.238, quarterly RO 133.385, monthly RO 134.867. Monthly is highest."},
{"id":"fn2-12","t":"SI vs CI","q":"For a 5-year deposit, which is better: 12% compounded monthly or 12.5% compounded annually?","o":["12% compounded monthly","12.5% compounded annually","They are exactly equal","It depends on the principal"],"d":"Compare schemes by their growth factor (1 + r/n)^(nt) over the same period.","w":"12% monthly: (1.01)^60 = 1.8167. 12.5% annually: (1.125)^5 = 1.8020. The monthly scheme grows more, whatever the principal."},
{"id":"fn2-13","t":"SI vs CI","q":"For a 4-year deposit, which is better: 5% compounded monthly or 5.25% simple interest?","o":["5% compounded monthly","5.25% simple interest","They are exactly equal","It depends on the principal"],"d":"Simple interest grows by r × t; compound interest grows by (1 + r/n)^(nt) − 1.","w":"Compound: (1 + 0.05/12)^48 − 1 = 22.09% total. Simple: 5.25% × 4 = 21% total. Compound gives more."},
{"id":"fn2-14","t":"Compound interest","q":"RO 420 interest was earned in 2 years at 10% compounded annually. What was the principal?","o":["RO 2,000.000","RO 2,100.000","RO 4,200.000","RO 1,735.537"],"d":"Principal from compound interest: P = I ÷ [(1 + r/n)^(nt) − 1].","w":"(1.10)^2 − 1 = 0.21. P = 420 ÷ 0.21 = RO 2,000."},
{"id":"fn2-15","t":"SI vs CI","q":"Ali borrows RO 1,000 for 4 years at 5% simple interest and invests it at 6% compounded quarterly for 4 years. What is his net benefit?","o":["RO 68.986","RO 268.986","RO 40.000","RO 200.000"],"d":"Benefit = interest earned on the investment − interest paid on the loan.","w":"Interest paid = 1,000 × 0.05 × 4 = RO 200. Interest earned = 1,000 × (1.015)^16 − 1,000 = RO 268.986. Benefit = RO 268.986 − 200 = RO 68.986."},
{"id":"fn2-16","t":"Compound interest","q":"Sameer deposits RO 2,000 at 10% compounded quarterly. How much does he receive after 9 months?","o":["RO 2,153.781","RO 2,150.000","RO 2,148.199","RO 153.781"],"d":"Future amount: A = P(1 + r/n)^(nt).","w":"9 months = 0.75 years, so nt = 4 × 0.75 = 3 quarters. A = 2,000 × (1.025)^3 = RO 2,153.781, so interest = RO 153.781."},
{"id":"fn2-17","t":"Rule of 72","q":"Using the Rule of 72, how long does money take to double at 9% per annum?","o":["8 years","9 years","6.5 years","12 years"],"d":"Rule of 72: years to double ≈ 72 ÷ interest rate (compounded annually).","w":"72 ÷ 9 = 8 years."},
{"id":"fn2-18","t":"Rule of 72","q":"You want your investment to double in 6 years. Using the Rule of 72, what rate do you need?","o":["12%","6%","8%","18%"],"d":"Rule of 72 rearranged: rate ≈ 72 ÷ years to double.","w":"72 ÷ 6 = 12%."},
{"id":"fn2-19","t":"Rule of 72","q":"At 12% for 18 years, how many times will an investment DOUBLE, using the Rule of 72?","o":["3 times","2 times","6 times","8 times"],"d":"Rule of 72: doubling time = 72 ÷ rate. Number of doublings = total years ÷ doubling time.","w":"Doubling time = 72 ÷ 12 = 6 years. 18 ÷ 6 = 3 doublings, so the money grows 2 × 2 × 2 = 8 times its original value."},
{"id":"fn2-20","t":"Rule of 72","q":"The Rule of 72 has a high estimation error when:","o":["Interest rates are very low or very high","Interest is compounded annually","The investment is in a bank","The amount is large"],"d":"Rule of 72: a quick estimate of doubling time, assuming annual compounding.","w":"It is only an approximation. The notes warn the error is high at very low or very high interest rates."},
{"id":"fn2-21","t":"Excel","q":"How do you calculate simple interest in Excel?","o":["Type a formula such as =Principal*Rate*Time; there is no built-in function","Use the =SI() function","Use the =INTEREST() function","Use =FV() with type 1"],"d":"Excel has no built-in simple interest function; you build the equation yourself.","w":"The slides say to calculate interest using =Principal*Rate*Time and press Enter."},
{"id":"fn2-22","t":"SI vs CI","tf":true,"ans":true,"q":"At the same rate, it is better to borrow at simple interest and invest at compound interest.","d":"Over the same period and rate, compound interest is higher than simple interest after the first year.","w":"Borrowing at simple interest means paying less; investing at compound interest means earning more."},
{"id":"fn2-23","t":"Compound interest","tf":true,"ans":false,"q":"For daily compounding, n = 52.","d":"Compounding factor for daily compounding: n = 365 or 366.","w":"52 is the number of weeks in a year, not days."},
{"id":"fn2-24","t":"SI vs CI","tf":true,"ans":true,"q":"At 7%, RO 1,000 earns RO 140 simple interest and RO 144.90 compound interest (annual) over 2 years.","d":"Simple: P × r × t. Compound: P(1 + r)^t − P.","w":"Simple: 1,000 × 0.07 × 2 = 140. Compound: 1,000 × 1.07^2 − 1,000 = 1,144.90 − 1,000 = 144.90."},
{"id":"fn2-25","t":"Compound interest","tf":true,"ans":true,"q":"Under compound interest, interest is also earned on the interest added in previous periods.","d":"Compound interest: interest is calculated on the outstanding principal and on the interest accumulated from previous periods.","w":"That is exactly what 'compounding' means."},
{"id":"fn2-w1","t":"Simple interest","wr":true,"q":"You deposit RO 5,000 in Bank Muscat at 5% simple interest and RO 2,500 in Bank Ahli at 4% simple interest. For each, how long will it take to earn RO 500 interest?","a":"t = I ÷ (P × r)\nBank Muscat: t = 500 ÷ (5,000 × 0.05) = 500 ÷ 250 = 2 years\nBank Ahli: t = 500 ÷ (2,500 × 0.04) = 500 ÷ 100 = 5 years","d":"Simple interest: I = P × r × t, so t = I ÷ (P × r).","w":"Bank Muscat reaches the target faster because both its principal and rate are higher, so it earns RO 250 a year against Bank Ahli's RO 100."},
{"id":"fn2-w2","t":"SI vs CI","wr":true,"q":"A bank offers a 5-year fixed deposit at (I) 12% compounded monthly or (II) 12.5% compounded annually. Which is better? Show the working for a deposit of RO 1,000.","a":"Scheme I: A = 1,000 × (1 + 0.12/12)^(12×5) = 1,000 × (1.01)^60 = RO 1,816.697\nScheme II: A = 1,000 × (1 + 0.125)^5 = RO 1,802.032\nScheme I is better by RO 14.664.","d":"Future amount with compound interest: A = P(1 + r/n)^(nt).","w":"Even with a lower stated rate, monthly compounding adds interest 60 times, and each addition earns interest. That beats one annual addition at 12.5%."},
{"id":"fn2-w3","t":"SI vs CI","wr":true,"q":"Ali borrowed RO 1,000 for 4 years at 5% simple interest and invested it at 6% compounded quarterly for 4 years. How much does he benefit?","a":"Interest paid on loan = 1,000 × 0.05 × 4 = RO 200.000\nAmount from investment = 1,000 × (1 + 0.06/4)^(4×4) = 1,000 × (1.015)^16 = RO 1,268.986\nInterest earned = RO 268.986\nBenefit = RO 268.986 − 200.000 = RO 68.986","d":"Benefit = interest earned − interest paid.","w":"He gains because he pays simple interest at 5% but earns compound interest at 6%."},
{"id":"fn2-w4","t":"Compound interest","wr":true,"q":"Zubin invested some money at 4% p.a. simple interest for 3 years and received RO 11,200 in total. He kept the interest aside and invested the same principal at 10% compound interest (annual) for 4 more years. Find the amount from the second investment and the total interest from both.","a":"First investment: A = P(1 + rt) → 11,200 = P × (1 + 0.04 × 3) = P × 1.12 → P = RO 10,000\nInterest from first = 11,200 − 10,000 = RO 1,200\nSecond investment: A = 10,000 × (1.10)^4 = RO 14,641.000\nInterest from second = RO 4,641.000\nTotal interest = 1,200 + 4,641 = RO 5,841.000","d":"Simple interest amount: A = P(1 + rt). Compound amount: A = P(1 + r)^t.","w":"Find the principal first from the simple interest total, then grow the same principal with compound interest."},
{"id":"fn2-w5","t":"Compound interest","wr":true,"q":"Find the interest on RO 20,000 invested for 4 years at 12% compounded (a) annually, (b) semi-annually, (c) quarterly, (d) monthly.","a":"(a) Annually: 20,000 × (1 + 0.12/1)^(1×4) − 20,000 = RO 11,470.387\n(b) Semi-annually: 20,000 × (1 + 0.12/2)^(2×4) − 20,000 = RO 11,876.961\n(c) Quarterly: 20,000 × (1 + 0.12/4)^(4×4) − 20,000 = RO 12,094.129\n(d) Monthly: 20,000 × (1 + 0.12/12)^(12×4) − 20,000 = RO 12,244.522","d":"Compound interest: I = P(1 + r/n)^(nt) − P.","w":"The more often interest is compounded, the higher the interest, because each addition starts earning interest sooner."},
{"id":"fn2-w6","t":"Rule of 72","wr":true,"q":"Rafael is 22 and invests RO 2,000 in Oman development bonds at 7.5%. Using the Rule of 72, how many times will his money double by age 70, and what will it grow to?","a":"Years invested = 70 − 22 = 48 years\nDoubling time = 72 ÷ 7.5 = 9.6 years\nNumber of doublings = 48 ÷ 9.6 = 5\nValue = 2,000 × 2^5 = 2,000 × 32 = RO 64,000","d":"Rule of 72: years to double ≈ 72 ÷ rate.","w":"Each doubling multiplies the money by 2, so 5 doublings multiply it by 32."}
]},
{"id":"fn-ch3","label":"Chapter 3","name":"Time Value of Money: Present Value, Future Value and Annuities","questions":[
{"id":"fn3-01","t":"Time value of money","q":"Which of these is NOT a reason for the time value (time preference) of money?","o":["Money always loses value because of taxes","The presence of risk and uncertainty","A preference to spend for today's needs","The availability of multiple investment options"],"d":"Time value of money: money today is worth more than the same sum in future because of risk and uncertainty, preference to spend now, and multiple options to invest.","w":"The three reasons on the slides are risk, present preference and investment options. Taxes are not listed."},
{"id":"fn3-02","t":"Time value of money","q":"Discounting means:","o":["Converting a future value back to its present value, reversing compounding","Growing a present sum into a future value","Reducing the price of a product","Paying interest in advance"],"d":"Discounting: converting a future value into its present value using a discounting rate. It reverses the effect of compounding.","w":"Compounding moves money forward in time; discounting moves it back to today."},
{"id":"fn3-03","t":"Future value","q":"Ali deposits RO 2,000 at 4% simple interest. How much does he receive after 18 months?","o":["RO 2,120.000","RO 2,240.000","RO 3,440.000","RO 2,080.000"],"d":"Future value with simple interest: Fv = Pv(1 + rt).","w":"18 months = 1.5 years. Fv = 2,000 × (1 + 0.04 × 1.5) = 2,000 × 1.06 = RO 2,120. RO 2,240 is 3 years."},
{"id":"fn3-04","t":"Future value","q":"Rahima deposits RO 5,000 on 1 April 2023 at 6% simple interest for 15 months. When and how much does she receive?","o":["1 July 2024, RO 5,375","1 April 2024, RO 5,300","1 July 2024, RO 5,450","1 June 2024, RO 5,375"],"d":"Future value with simple interest: Fv = Pv(1 + rt).","w":"15 months after 1 April 2023 is 1 July 2024. Fv = 5,000 × (1 + 0.06 × 1.25) = 5,000 × 1.075 = RO 5,375."},
{"id":"fn3-05","t":"Future value","q":"RO 2,000 is invested for 5 years at 12% compounded monthly. What is the future value?","o":["RO 3,633.393","RO 3,524.683","RO 3,200.000","RO 2,102.020"],"d":"Future value with compound interest: Fv = Pv(1 + r/n)^(nt).","w":"Fv = 2,000 × (1 + 0.12/12)^(12×5) = 2,000 × (1.01)^60 = RO 3,633.393. Annual compounding would give only RO 3,524.683."},
{"id":"fn3-06","t":"Future value","q":"For RO 5,000 over 5 years, which is better: 5.5% simple interest or 5% compounded annually?","o":["5% compounded annually","5.5% simple interest","They give the same amount","It cannot be compared"],"d":"Fv (simple) = Pv(1 + rt); Fv (compound) = Pv(1 + r)^t.","w":"Simple: 5,000 × (1 + 0.055 × 5) = RO 6,375.000. Compound: 5,000 × 1.05^5 = RO 6,381.408. Compound is slightly better."},
{"id":"fn3-07","t":"Future value","q":"RO 10,000 for one year: which gives the higher future value, 10% compounded quarterly or 10.10% compounded annually?","o":["10% compounded quarterly","10.10% compounded annually","They are exactly equal","Neither earns interest"],"d":"Fv = Pv(1 + r/n)^(nt).","w":"Quarterly: 10,000 × (1.025)^4 = RO 11,038.129. Annually: 10,000 × 1.101 = RO 11,010.000. Quarterly wins."},
{"id":"fn3-08","t":"Present value","q":"Ahmed needs RO 50,000 for a car in 5 years. How much must he deposit today at 5% simple interest?","o":["RO 40,000.000","RO 39,176.308","RO 47,500.000","RO 37,500.000"],"d":"Present value with simple interest: Pv = Fv ÷ (1 + rt).","w":"Pv = 50,000 ÷ (1 + 0.05 × 5) = 50,000 ÷ 1.25 = RO 40,000."},
{"id":"fn3-09","t":"Present value","q":"How much must be invested today at 15% compounded annually to have RO 2,000 in 3 years?","o":["RO 1,315.032","RO 1,379.310","RO 1,100.000","RO 1,739.130"],"d":"Present value with compound interest: Pv = Fv ÷ (1 + r/n)^(nt).","w":"Pv = 2,000 ÷ (1.15)^3 = 2,000 ÷ 1.520875 = RO 1,315.032."},
{"id":"fn3-10","t":"Present value","q":"Fatma needs RO 5,000 in 3 years. How much should she invest today at 7% compounded annually?","o":["RO 4,081.489","RO 4,132.231","RO 4,650.000","RO 4,672.897"],"d":"Pv = Fv ÷ (1 + r)^t.","w":"Pv = 5,000 ÷ (1.07)^3 = 5,000 ÷ 1.225043 = RO 4,081.489."},
{"id":"fn3-11","t":"Present value","q":"Ryle must pay RO 4,000 in 2 years and RO 2,000 in 4 years. At 10% compounded annually, how much must he invest today to cover both?","o":["RO 4,671.812","RO 4,098.081","RO 3,305.785","RO 4,958.678"],"d":"Present value of several future sums = sum of each sum's present value.","w":"4,000 ÷ 1.1^2 = RO 3,305.785; 2,000 ÷ 1.1^4 = RO 1,366.027. Total = RO 4,671.812. Each payment is discounted for its own number of years."},
{"id":"fn3-12","t":"Factors","q":"If the discounting rate increases, the present value of a fixed future amount:","o":["Decreases","Increases","Stays the same","Doubles"],"d":"Factors affecting PV: a higher discounting rate gives a lower present value, and vice versa.","w":"You divide by (1 + r)^t. A bigger r makes the divisor bigger, so the result is smaller."},
{"id":"fn3-13","t":"Factors","q":"Holding the rate constant, a longer time period gives:","o":["A higher future value and a lower present value","A lower future value and a higher present value","A higher future value and a higher present value","No change to either"],"d":"Factors: larger time period → higher future value; larger time period → lower present value.","w":"More years of compounding increase FV; more years of discounting reduce PV."},
{"id":"fn3-14","t":"Annuities","q":"An annuity whose payments are made at the BEGINNING of each period is:","o":["An annuity due","An ordinary annuity","A perpetual annuity","A contingent annuity"],"d":"Annuity due: payments at the beginning of each period. Ordinary annuity: payments at the end of each period.","w":"Timing of payment is what separates an annuity due from an ordinary annuity."},
{"id":"fn3-15","t":"Annuities","q":"A pension paid every month until the person dies is a:","o":["Life annuity","Certain annuity","Perpetual annuity","Contingent annuity"],"d":"Life annuity: payments for the lifetime of an individual, stopping at death (e.g. pensions).","w":"A certain annuity has a fixed period, a perpetual annuity never ends, and a contingent annuity depends on an event such as a marriage."},
{"id":"fn3-16","t":"Annuities","q":"Payments that continue only until a daughter's marriage form a:","o":["Contingent annuity","Life annuity","Certain annuity","Perpetual annuity"],"d":"Contingent annuity: payments depend on the occurrence of an event and stop afterwards.","w":"The end date is not fixed; it depends on an event happening, which makes it contingent."},
{"id":"fn3-17","t":"Annuities","q":"An annuity with payments of UNEQUAL amounts is:","o":["A variable annuity","A uniform annuity","An ordinary annuity","An annuity due"],"d":"Based on amount: uniform annuity (equal payments) or variable annuity (unequal payments).","w":"Ordinary and due describe timing, not amount."},
{"id":"fn3-18","t":"Annuities","q":"Alice deposits RO 5,000 at the end of each year for 10 years at 5%. What is the present value of this annuity?","o":["RO 38,608.675","RO 50,000.000","RO 62,889.463","RO 30,695.663"],"d":"Present value of an ordinary annuity = I × [1 − (1 + r/n)^(−nt)] ÷ (r/n).","w":"PV = 5,000 × [1 − 1.05^(−10)] ÷ 0.05 = 5,000 × 7.721735 = RO 38,608.675. RO 62,889.463 would be the future value."},
{"id":"fn3-19","t":"Annuities","q":"Muzna can save RO 1,200 at the end of each year, or RO 100 at the end of each month, for 5 years at 5% (compounded to match). Which gives more?","o":["RO 100 monthly","RO 1,200 yearly","They are equal","Neither earns interest"],"d":"Future value of an ordinary annuity = I × [(1 + r/n)^(nt) − 1] ÷ (r/n).","w":"Yearly: 1,200 × [(1.05)^5 − 1] ÷ 0.05 = RO 6,630.758. Monthly: 100 × [(1 + 0.05/12)^60 − 1] ÷ (0.05/12) = RO 6,800.608. Monthly saving earns interest sooner."},
{"id":"fn3-20","t":"Annuities","q":"Ameer needs RO 10,000 in 4 years. How much must he invest at the end of each year at 7%?","o":["RO 2,252.281","RO 2,500.000","RO 1,907.238","RO 700.000"],"d":"Annuity amount I = Future value ÷ {[(1 + r/n)^(nt) − 1] ÷ (r/n)}.","w":"Factor = [(1.07)^4 − 1] ÷ 0.07 = 4.439943. I = 10,000 ÷ 4.439943 = RO 2,252.281. Less than 2,500 because the deposits earn interest."},
{"id":"fn3-21","t":"Excel","q":"In =FV(rate, nper, pmt, [pv], [type]) for monthly compounding over t years, nper is:","o":["t × 12","t ÷ 12","12","t"],"d":"Excel FV/PV: rate = r ÷ n (rate per period); nper = t × n (total number of periods).","w":"With monthly compounding n = 12, so the number of periods is years × 12."},
{"id":"fn3-22","t":"Excel","q":"In Excel's PV and FV functions, type = 1 means:","o":["Payments are due at the beginning of each period","Payments are due at the end of each period","Interest is compounded once a year","The result is shown as a percentage"],"d":"type: 0 for end-of-period payments (ordinary annuity), 1 for beginning-of-period payments (annuity due).","w":"0 is the default (end of period). 1 switches to the beginning."},
{"id":"fn3-23","t":"Future value","tf":true,"ans":false,"q":"In practice, present and future values are mainly calculated using simple interest.","d":"Present and future value can be found with simple or compound interest, but in practice compound interest is mainly used.","w":"The notes say the concept is used mainly with compound interest."},
{"id":"fn3-24","t":"Factors","tf":true,"ans":true,"q":"A longer time period gives a lower present value.","d":"Factors affecting PV: the larger the time period, the lower the present value.","w":"Discounting over more years divides by a larger factor (1 + r)^t."},
{"id":"fn3-25","t":"Annuities","tf":true,"ans":true,"q":"An ordinary annuity has payments at the end of each period.","d":"Ordinary annuity: payments made at the end of each period.","w":"That is the definition; payments at the start would be an annuity due."},
{"id":"fn3-w1","t":"Future value","wr":true,"q":"Azim has RO 8,000 to deposit for 5 years. Option 1: 6% simple interest. Option 2: 6% compounded half-yearly. How much does each option give, and which is better?","a":"Option 1: Fv = 8,000 × (1 + 0.06 × 5) = 8,000 × 1.30 = RO 10,400.000\nOption 2: Fv = 8,000 × (1 + 0.06/2)^(2×5) = 8,000 × (1.03)^10 = RO 10,751.331\nOption 2 is better by RO 351.331.","d":"Fv (simple) = Pv(1 + rt). Fv (compound) = Pv(1 + r/n)^(nt).","w":"Option 2 is better because interest earned every half year is added to the balance and then earns interest itself."},
{"id":"fn3-w2","t":"Present value","wr":true,"q":"Ahmed must pay RO 5,000, RO 10,000 and RO 15,000 at the end of years 1, 2 and 3. If the market rate is 6% compounded annually, what lump sum settles all three today?","a":"Year 1: 5,000 ÷ 1.06 = RO 4,716.981\nYear 2: 10,000 ÷ 1.06^2 = RO 8,899.964\nYear 3: 15,000 ÷ 1.06^3 = RO 12,594.289\nTotal present value = RO 26,211.235","d":"Present value: Pv = Fv ÷ (1 + r)^t.","w":"Each payment is discounted for its own number of years, then the present values are added."},
{"id":"fn3-w3","t":"Annuities","wr":true,"q":"Khalid needs RO 2,500 for a trip in 3 years. He will save a fixed amount at the end of each month in a scheme paying 5% p.a. (compounded monthly). How much must he save each month?","a":"r/n = 0.05/12, nt = 12 × 3 = 36\nFactor = [(1 + 0.05/12)^36 − 1] ÷ (0.05/12) = 38.753336\nMonthly saving I = 2,500 ÷ 38.753336 = RO 64.511","d":"Annuity amount: I = Future value ÷ {[(1 + r/n)^(nt) − 1] ÷ (r/n)}.","w":"The target is a future amount, so use the future value of annuity formula and solve for the instalment."},
{"id":"fn3-w4","t":"Annuities","wr":true,"q":"You plan to save RO 600 at the end of each year for 4 years at 5%. Alternatively you save RO 50 at the end of each month for 4 years at 5% compounded monthly. Find both amounts and say which is better.","a":"Option 1: 600 × [(1.05)^4 − 1] ÷ 0.05 = RO 2,586.075\nOption 2: 50 × [(1 + 0.05/12)^48 − 1] ÷ (0.05/12) = RO 2,650.744\nOption 2 is better by RO 64.669.","d":"Future value of annuity = I × [(1 + r/n)^(nt) − 1] ÷ (r/n).","w":"Both options save RO 2,400 in total, but monthly deposits start earning interest earlier."},
{"id":"fn3-w5","t":"Annuities","wr":true,"q":"Find the present value of an annuity of RO 1,200 paid at the end of each year for 6 years at 10% p.a. compound interest.","a":"PV = 1,200 × [1 − (1.10)^(−6)] ÷ 0.10\n= 1,200 × 4.355261\n= RO 5,226.313","d":"Present value of ordinary annuity = I × [1 − (1 + r/n)^(−nt)] ÷ (r/n).","w":"Each future payment is worth less today; the formula adds up all six discounted payments in one step."},
{"id":"fn3-w6","t":"Annuities","wr":true,"q":"Explain the types of annuities based on amount, time of payment and duration, with an example of each.","a":"Based on amount:\n- Uniform annuity: equal payments (e.g. a fixed monthly saving).\n- Variable annuity: unequal payments.\nBased on time of payment:\n- Annuity due: payments at the beginning of each period.\n- Ordinary annuity: payments at the end of each period.\nBased on duration:\n- Certain annuity: fixed period (e.g. until a child turns 18).\n- Life annuity: for a person's lifetime (e.g. pensions).\n- Perpetual annuity: continues indefinitely (e.g. payments to royals).\n- Contingent annuity: depends on an event (e.g. until a daughter's marriage).","d":"Annuity: a financial product with a series of payments made at regular intervals over a period of time.","w":"The three bases answer three questions: how much is paid, when in the period it is paid, and for how long."}
]},
{"id":"fn-ch4","label":"Chapter 4","name":"Loans and Instalments","questions":[
{"id":"fn4-01","t":"Own vs borrowed funds","q":"Which is a DISADVANTAGE of using own funds?","o":["Limited capacity to raise large amounts, plus opportunity cost","They must be repaid with interest","There are legal consequences if you default","They need a loan agreement"],"d":"Own funds: capital from personal or internal sources (savings, asset sales, shares, retained profits). Advantage: no repayment or interest. Disadvantages: limited capacity, opportunity cost, less flexibility.","w":"Repayment with interest, default consequences and loan agreements all belong to borrowed funds."},
{"id":"fn4-02","t":"Own vs borrowed funds","q":"A medium-term loan lasts:","o":["Over one year up to five years","Up to one year","Over five years","Exactly ten years"],"d":"Loan term classification: short-term up to one year; medium-term over one year to five years; long-term over five years.","w":"Medium-term sits between short (≤1 year) and long (>5 years)."},
{"id":"fn4-03","t":"Loan process","q":"What is the first step when taking out a loan?","o":["Determine your creditworthiness by checking your credit score and history","Receive the funds","Choose a lender","Wait for approval"],"d":"Loan steps: determine creditworthiness → research loan options → choose a lender → complete the application → wait for approval → receive funds → review terms.","w":"Your credit score affects whether you qualify and what rate you get, so it comes first."},
{"id":"fn4-04","t":"Loan pros and cons","q":"Which is a DISADVANTAGE of financing through a loan?","o":["Collateral such as a house or car can be at risk if you cannot pay","Payments are predictable","Loans come in many types and terms","Loans give access to funds you would not otherwise have"],"d":"Disadvantages of loans: interest and fees, risk of default, potential for debt, collateral requirements.","w":"Predictable payments, flexibility and access to funds are advantages."},
{"id":"fn4-05","t":"Interest on loans","q":"Rashid borrows RO 4,000 for 5 years at 5% simple interest. What is the total amount he repays?","o":["RO 5,000.000","RO 1,000.000","RO 5,105.126","RO 4,200.000"],"d":"Amount paid = Principal + Interest = P(1 + rt).","w":"Interest = 4,000 × 0.05 × 5 = RO 1,000. Total = 4,000 + 1,000 = RO 5,000."},
{"id":"fn4-06","t":"Interest on loans","q":"The same RO 4,000 loan for 5 years is charged 5% compounded annually. How much interest does Rashid pay?","o":["RO 1,105.126","RO 1,000.000","RO 5,105.126","RO 200.000"],"d":"Compound interest on a loan: I = P(1 + r)^t − P.","w":"4,000 × 1.05^5 = RO 5,105.126, so interest = RO 1,105.126. It is more than the simple interest of RO 1,000."},
{"id":"fn4-07","t":"Interest on loans","q":"You need a RO 5,000 loan for 4 years. Most banks charge 5% compounded monthly; one bank charges 5.25% simple interest. Which is cheaper for YOU as the borrower?","o":["5.25% simple interest","5% compounded monthly","They cost exactly the same","It depends on the down payment"],"d":"As a borrower you want the option with the LOWER total interest.","w":"Compound: 5,000 × [(1 + 0.05/12)^48 − 1] = RO 1,104.477. Simple: 5,000 × 0.0525 × 4 = RO 1,050.000. The simple interest loan costs less."},
{"id":"fn4-08","t":"Interest on loans","q":"Sajid buys a RO 10,000 car, pays RO 2,000 down and borrows the rest for 12 months at 5% compounded monthly. What is the total he pays for the car?","o":["RO 10,409.295","RO 8,409.295","RO 10,500.000","RO 10,400.000"],"d":"Total paid = down payment + loan amount repaid (principal + interest).","w":"Loan = 8,000. Repaid = 8,000 × (1 + 0.05/12)^12 = RO 8,409.295 (interest RO 409.295). Total = 2,000 + RO 8,409.295 = RO 10,409.295."},
{"id":"fn4-09","t":"Interest on loans","q":"Ahmed borrows RO 5,000 at 6% simple interest for 10 months. How much interest does he pay?","o":["RO 250.000","RO 300.000","RO 3,000.000","RO 25.000"],"d":"Simple interest: I = P × r × t, with t in years.","w":"t = 10 ÷ 12. I = 5,000 × 0.06 × 10/12 = RO 250."},
{"id":"fn4-10","t":"Interest on loans","q":"Ashraf gets a RO 600 cash advance and must repay RO 645 fifteen days later. What simple interest rate is this (360-day year)?","o":["180%","7.5%","15%","45%"],"d":"Rate from simple interest: r = I ÷ (P × t).","w":"I = 645 − 600 = 45. t = 15 ÷ 360. r = 45 ÷ (600 × 15/360) = 45 ÷ 25 = 1.8 = 180%. Short-term advances can be very expensive."},
{"id":"fn4-11","t":"APR","q":"How is the APR different from the interest rate?","o":["APR includes all fees and charges, so it shows the true annual cost of borrowing","APR ignores fees and only counts interest","APR is always lower than the interest rate","APR applies only to deposits"],"d":"APR (annual percentage rate): the yearly cost of borrowing including interest and all fees and charges.","w":"The interest rate is only the cost of borrowing the money; the APR adds fees such as processing and closing costs."},
{"id":"fn4-12","t":"APR","q":"Aju borrows RO 4,000 at 5% simple interest for 2 years, with RO 200 closing costs. What is the APR?","o":["7.5%","5%","2.5%","15%"],"d":"APR = [(Total cost of credit ÷ Loan amount) ÷ Loan term] × 100.","w":"Interest = 4,000 × 0.05 × 2 = 400. Total cost = 400 + 200 = 600. APR = (600 ÷ 4,000) ÷ 2 × 100 = 7.5%."},
{"id":"fn4-13","t":"APR","q":"Raja takes a RO 100,000 mortgage for 60 months at 7% simple interest, with a 1.5% insurance fee and RO 500 processing cost. What is the APR?","o":["7.4%","7%","8.5%","37%"],"d":"APR = [(Total cost of credit ÷ Loan amount) ÷ Loan term] × 100.","w":"Interest = 100,000 × 0.07 × 5 = 35,000. Fees = 1,500 + 500 = 2,000. Total cost = 37,000. APR = (37,000 ÷ 100,000) ÷ 5 × 100 = 7.4%."},
{"id":"fn4-14","t":"Instalment terms","q":"Total finance charge equals:","o":["Total of all instalment payments − amount financed","Amount financed + down payment","Purchase price − down payment","Instalment amount × interest rate"],"d":"Total finance charge: total interest paid = (Instalment amount × number of instalments) − amount financed.","w":"Everything you pay in instalments above the amount borrowed is the cost of finance."},
{"id":"fn4-15","t":"Instalment terms","q":"Deferred payment price equals:","o":["Total of all instalment payments + down payment","Total of all instalment payments − amount financed","Purchase price − down payment","Amount financed × APR"],"d":"Deferred payment price: total of all instalment payments + down payment (or purchase price + total finance charge).","w":"It is the full price you end up paying when you buy now and pay later."},
{"id":"fn4-16","t":"Instalment terms","q":"Adil buys a RO 36,500 car, pays RO 12,000 down and RO 450 a month for 60 months. What is the total finance charge?","o":["RO 2,500.000","RO 24,500.000","RO 27,000.000","RO 39,000.000"],"d":"Total finance charge = total instalments − amount financed.","w":"Amount financed = 36,500 − 12,000 = 24,500. Instalments = 450 × 60 = 27,000. Finance charge = 27,000 − 24,500 = RO 2,500."},
{"id":"fn4-17","t":"Instalment terms","q":"For the same car (RO 36,500, RO 12,000 down, RO 450 × 60), what is the deferred payment price?","o":["RO 39,000.000","RO 36,500.000","RO 27,000.000","RO 41,500.000"],"d":"Deferred payment price = total instalments + down payment.","w":"27,000 + 12,000 = RO 39,000 (equal to 36,500 + finance charge 2,500)."},
{"id":"fn4-18","t":"EMI","q":"Ahmed borrows RO 10,000 at 12% for 2 years. What is the EMI using the FLAT interest rate method?","o":["RO 516.667","RO 470.735","RO 500.000","RO 416.667"],"d":"Flat rate EMI = P × (1 + rt) ÷ number of monthly instalments.","w":"EMI = 10,000 × (1 + 0.12 × 2) ÷ 24 = 12,400 ÷ 24 = RO 516.667 (about RO 517)."},
{"id":"fn4-19","t":"EMI","q":"Same loan (RO 10,000, 12%, 2 years). What is the EMI using the REDUCING BALANCE method?","o":["RO 470.735","RO 516.667","RO 500.000","RO 529.056"],"d":"Reducing balance EMI = P × R × (1 + R)^N ÷ [(1 + R)^N − 1], with R = annual rate ÷ 12 ÷ 100.","w":"R = 0.01, N = 24. EMI = 10,000 × 0.01 × 1.01^24 ÷ (1.01^24 − 1) = RO 470.735 (about RO 471). It is lower than the flat rate EMI."},
{"id":"fn4-20","t":"EMI","q":"Which EMI method charges interest on the FULL original principal for the whole loan term?","o":["Flat interest rate method","Reducing balance method","Both methods","Neither method"],"d":"Flat rate method: interest is calculated on the original principal for the entire term and divided equally among the instalments.","w":"The reducing balance method charges interest only on the outstanding (unpaid) principal, which shrinks each month."},
{"id":"fn4-21","t":"EMI","q":"Under the reducing balance method, as the loan goes on:","o":["The interest part falls and the principal part rises","The interest part rises and the principal part falls","Both parts stay the same","The EMI amount increases"],"d":"Reducing balance: each EMI = interest on the outstanding principal + repayment of principal. The EMI stays the same.","w":"As the outstanding balance falls, the interest on it falls, so more of the fixed EMI goes to principal."},
{"id":"fn4-22","t":"Excel","q":"Which Excel function gives the INTEREST part of a specific instalment?","o":["IPMT","PMT","PPMT","NPER"],"d":"PMT: total payment per period. IPMT: interest part for a given period. PPMT: principal part for a given period. NPER: number of periods.","w":"The 'I' in IPMT stands for interest."},
{"id":"fn4-23","t":"Excel","q":"Excel's RATE function returns a MONTHLY rate for a monthly loan. How do you get the annual rate?","o":["Multiply the monthly rate by 12","Divide the monthly rate by 12","Add 12 to the monthly rate","It is already annual"],"d":"RATE(nper, pmt, pv, [fv], [type]) returns the interest rate per period.","w":"With monthly instalments the period is a month, so annual rate = monthly rate × 12 (and × 100 for a percentage)."},
{"id":"fn4-24","t":"Loan pros and cons","tf":true,"ans":true,"q":"Secured loans require collateral such as a house or car.","d":"Secured loans require collateral; unsecured loans do not.","w":"Collateral is what makes the loan 'secured' for the lender."},
{"id":"fn4-25","t":"EMI","tf":true,"ans":false,"q":"When an EMI is rounded, it is rounded down and the difference is added to the first instalment.","d":"Rounding an EMI is only for convenience of payment.","w":"It is always rounded UP, and the excess is adjusted in the LAST instalment, which ends up slightly lower."},
{"id":"fn4-w1","t":"EMI","wr":true,"q":"Ali borrows RO 1,200 at 12% p.a. to repay in 4 months. Find the EMI by (a) the reducing balance method and (b) the flat interest rate method, and show the reducing balance amortisation table.","a":"(a) R = 0.12/12 = 0.01, N = 4\nEMI = 1,200 × 0.01 × 1.01^4 ÷ (1.01^4 − 1) = RO 307.537\n(b) Flat EMI = 1,200 × (1 + 0.12 × 4/12) ÷ 4 = 1,248 ÷ 4 = RO 312.000\n\nReducing balance table:\nMonth 1: interest RO 12.000, principal RO 295.537, balance RO 904.463\nMonth 2: interest RO 9.045, principal RO 298.493, balance RO 605.970\nMonth 3: interest RO 6.060, principal RO 301.478, balance RO 304.492\nMonth 4: interest RO 3.045, principal RO 304.492, balance RO 0.000","d":"EMI (equated monthly instalment): an equal monthly payment that covers interest and principal.","w":"In the reducing balance method interest falls each month because it is charged only on the outstanding balance, so the total cost is lower than the flat method."},
{"id":"fn4-w2","t":"EMI","wr":true,"q":"Rahima buys furniture worth RO 15,000, pays 20% down, and repays the rest in 15 equal monthly instalments at 6%. Find the EMI by (a) reducing balance and (b) flat rate.","a":"Down payment = 20% × 15,000 = 3,000, so loan P = 12,000\n(a) R = 0.06/12 = 0.005, N = 15\nEMI = 12,000 × 0.005 × 1.005^15 ÷ (1.005^15 − 1) = RO 832.372\n(b) Flat EMI = 12,000 × (1 + 0.06 × 15/12) ÷ 15 = 12,000 × 1.075 ÷ 15 = RO 860.000","d":"Flat EMI = P(1 + rt) ÷ N. Reducing balance EMI = P × R × (1 + R)^N ÷ [(1 + R)^N − 1].","w":"Only the amount borrowed (after the down payment) is financed, so start by subtracting the 20% down payment."},
{"id":"fn4-w3","t":"Instalment terms","wr":true,"q":"A product costs RO 22,500. The buyer pays RO 6,000 down and 60 monthly payments of RO 310. Find the amount financed, total monthly payments, total finance charge, APR and deferred payment price.","a":"Amount financed = 22,500 − 6,000 = RO 16,500\nTotal monthly payments = 310 × 60 = RO 18,600\nTotal finance charge = 18,600 − 16,500 = RO 2,100\nAPR = (2,100 ÷ 16,500) ÷ 5 × 100 = 2.55%\nDeferred payment price = 18,600 + 6,000 = RO 24,600","d":"Amount financed = price − down payment. Finance charge = total instalments − amount financed. APR = (cost of credit ÷ loan) ÷ years × 100.","w":"The loan term is 60 months = 5 years, so divide by 5 in the APR formula."},
{"id":"fn4-w4","t":"Instalment terms","wr":true,"q":"Adil buys a Land Rover for RO 36,500, pays RO 12,000 down and RO 450 per month for 60 months. Find (a) amount financed, (b) total finance charge, (c) APR, (d) deferred payment price.","a":"(a) Amount financed = 36,500 − 12,000 = RO 24,500\n(b) Total instalments = 450 × 60 = 27,000; finance charge = 27,000 − 24,500 = RO 2,500\n(c) APR = (2,500 ÷ 24,500) ÷ 5 × 100 = 2.04%\n(d) Deferred payment price = 27,000 + 12,000 = RO 39,000","d":"Deferred payment price: total of all instalments + down payment.","w":"Check: 36,500 purchase price + 2,500 finance charge also gives 39,000."},
{"id":"fn4-w5","t":"EMI","wr":true,"q":"Explain the difference between the flat interest rate method and the reducing balance method for EMIs, using a RO 10,000 loan at 12% for 2 years.","a":"Flat rate: interest is charged on the full principal for the whole term. EMI = 10,000 × (1 + 0.12 × 2) ÷ 24 = RO 516.667 (≈ RO 517). Interest and principal parts stay the same every month.\nReducing balance: interest is charged only on the outstanding principal, compounded monthly. EMI = 10,000 × 0.01 × 1.01^24 ÷ (1.01^24 − 1) = RO 470.735 (≈ RO 471). Interest falls and principal repayment rises over time.\nThe reducing balance method is cheaper for the borrower and more accurate, and it is the most widely used.","d":"Reducing balance method: the most widely used EMI method; interest is calculated on the unpaid balance each month.","w":"The flat method keeps charging interest on money already repaid, so its EMI is higher."},
{"id":"fn4-w6","t":"EMI","wr":true,"q":"Find the EMI by the reducing balance method for RO 10,000 at 12% p.a. repaid in 4 equal monthly instalments, and show the amortisation table.","a":"R = 0.01, N = 4\nEMI = 10,000 × 0.01 × 1.01^4 ÷ (1.01^4 − 1) = RO 2,562.811\n\nMonth 1: interest RO 100.000, principal RO 2,462.811, balance RO 7,537.189\nMonth 2: interest RO 75.372, principal RO 2,487.439, balance RO 5,049.750\nMonth 3: interest RO 50.498, principal RO 2,512.313, balance RO 2,537.437\nMonth 4: interest RO 25.374, principal RO 2,537.437, balance RO 0.000","d":"Amortisation table: shows each payment split into interest and principal, and the remaining balance.","w":"Interest each month = outstanding balance × 1%. The rest of the EMI reduces the balance, which reaches zero after the 4th payment."}
]},
{"id":"fn-ch5","label":"Chapter 5","name":"Investment in Shares","questions":[
{"id":"fn5-01","t":"Shares vs deposits","q":"Compared with bank deposits, shares typically offer:","o":["Higher returns but higher risk, because share values fluctuate","Lower returns and lower risk","Guaranteed returns","Better liquidity than bank deposits"],"d":"Investing in shares: higher potential returns than deposits, but higher risk; deposits are more liquid.","w":"Share prices go up and down, so returns are not guaranteed. Bank deposits are easier to access than shares."},
{"id":"fn5-02","t":"Company types","q":"Which business form suits large enterprises that need substantial funds and is governed by company law?","o":["Joint stock company","Sole proprietor","Partnership","Limited liability company (LLC)"],"d":"Joint stock company: a large enterprise requiring substantial funds, governed by company law, which raises capital by issuing shares.","w":"Sole proprietors and partnerships are small; LLCs suit micro, small and medium enterprises."},
{"id":"fn5-03","t":"Share capital","q":"A capital of RO 5 million is divided into shares with a face value of 500 baisa. How many shares is that?","o":["10 million","5 million","2.5 million","500,000"],"d":"Shares: capital divided into units, each with a face (par or nominal) value.","w":"500 baisa = RO 0.500. 5,000,000 ÷ 0.500 = 10,000,000 shares."},
{"id":"fn5-04","t":"Types of shares","q":"Which shares usually pay a fixed dividend and have priority over equity shares, but often carry no voting rights?","o":["Preference shares","Equity (common) shares","Bonus shares","Right shares"],"d":"Preference shares: fixed dividends and priority in dividends and return of capital, but usually no voting rights except on specific issues.","w":"Equity shares carry voting rights and variable dividends."},
{"id":"fn5-05","t":"Types of shares","q":"In a liquidation, common shareholders are paid:","o":["After all debts and preferred shareholders","Before all creditors","Before preferred shareholders","Only if the company is profitable"],"d":"Common (ordinary) shares: voting rights and possible dividends, but paid last in bankruptcy or liquidation.","w":"Creditors come first, then preferred shareholders, and common shareholders last."},
{"id":"fn5-06","t":"Features of shares","q":"Limited liability means shareholders:","o":["Are not personally liable for company debts beyond their investment","Cannot sell their shares","Always receive dividends","Are liable for all company debts"],"d":"Limited liability: a shareholder's liability is limited to the amount they invested.","w":"If the company fails, you can lose your investment but not your personal assets."},
{"id":"fn5-07","t":"Issue of shares","q":"Selling a company's new shares to the general public for the first time is called:","o":["An Initial Public Offering (IPO)","A bonus issue","A rights issue","Dematerialisation"],"d":"IPO: a joint stock company raising capital by issuing new shares to institutional investors and the general public.","w":"Bonus and right shares go to existing shareholders, not the general public."},
{"id":"fn5-08","t":"Issue of shares","q":"What is the correct order of the share issue process?","o":["Issue of prospectus → receiving applications → allotment of shares","Allotment → prospectus → applications","Applications → allotment → prospectus","Prospectus → allotment → applications"],"d":"Issue process: 1 issue of prospectus (invitation to buy), 2 receiving applications, 3 allotment of shares.","w":"The public must first be invited, then apply, and only then can shares be allotted."},
{"id":"fn5-09","t":"Issue of shares","q":"Shares with a face value of RO 1 are issued at RO 1.200. They are issued:","o":["At a premium of RO 0.200","At par","At a discount of RO 0.200","As bonus shares"],"d":"At par: issue price = face value. At a premium: issue price = face value + premium.","w":"The issue price (1.200) is higher than the face value (1.000), so the 0.200 difference is a premium."},
{"id":"fn5-10","t":"Issue of shares","q":"Shares offered to EXISTING shareholders at a discounted price, before an IPO, are:","o":["Right shares","Bonus shares","Preference shares","Demat shares"],"d":"Right shares: issued at a discount to existing shareholders. Bonus shares: given free to existing shareholders.","w":"The key words are 'discounted price' (right shares), not 'free' (bonus shares)."},
{"id":"fn5-11","t":"Trading","q":"In Oman, brokerage for trades of up to 200,000 shares is typically:","o":["0.35% plus VAT (minimum RO 1.000)","0.175% plus VAT","1% flat","3 baisa per share"],"d":"Brokerage rates in Oman: 0.35% + VAT up to 200,000 shares; 0.175% + VAT beyond 200,000 shares.","w":"0.175% applies only to the shares beyond 200,000."},
{"id":"fn5-12","t":"Trading","q":"Shares held in electronic form by depository participants (MCD) are called:","o":["Dematerialised (demat) shares","Bonus shares","Off-market shares","Preference shares"],"d":"Dematerialisation: shares are in electronic format and held by depository participants (Muscat Clearing & Depository).","w":"'Demat' simply means the share certificates are electronic, not paper."},
{"id":"fn5-13","t":"Buying and selling","q":"Rashid buys 500 shares at RO 1.250 each with 0.35% brokerage. How much does he pay?","o":["RO 627.188","RO 625.000","RO 622.812","RO 627.500"],"d":"Buying cost = number of shares × market price × (1 + brokerage rate). Brokerage is ADDED when buying.","w":"Value = 500 × 1.250 = 625. Brokerage = 625 × 0.0035 = RO 2.188. Total = RO 627.188."},
{"id":"fn5-14","t":"Buying and selling","q":"RML shares trade at RO 3.000. Brokerage is 3 baisa per rial. What do 1,000 shares cost?","o":["RO 3,009.000","RO 3,000.000","RO 2,991.000","RO 3,003.000"],"d":"Brokerage of 3 baisa per rial = 0.003 = 0.3% of the value.","w":"Value = 1,000 × 3 = 3,000. Brokerage = 3,000 × 0.003 = 9. Total = RO 3,009."},
{"id":"fn5-15","t":"Buying and selling","q":"Mohammed sells 400 shares (face value RO 0.500) at RO 2.250 each with 0.4% brokerage. How much does he receive?","o":["RO 896.400","RO 900.000","RO 903.600","RO 199.200"],"d":"Selling proceeds = number of shares × market price × (1 − brokerage rate). Brokerage is DEDUCTED when selling.","w":"Value = 400 × 2.250 = 900. Brokerage = 3.6. Received = RO 896.400. The face value does not matter for trading."},
{"id":"fn5-16","t":"Buying and selling","q":"Basma invests RO 4,518 in 100-baisa shares trading at 250 baisa, with 0.4% brokerage. How many shares does she buy?","o":["18,000","18,072","45,180","17,928"],"d":"Shares bought = amount invested ÷ cost per share including brokerage.","w":"Cost per share = 0.250 × 1.004 = 0.251. Shares = 4,518 ÷ 0.251 = 18,000."},
{"id":"fn5-17","t":"Buying and selling","q":"Asif sells shares at 800 baisa each and receives a net RO 1,992 after 0.4% brokerage. How many shares did he sell?","o":["2,500","2,490","2,510","1,992"],"d":"Shares sold = net amount ÷ net price per share after brokerage.","w":"Net per share = 0.800 × 0.996 = 0.7968. Shares = 1,992 ÷ 0.7968 = 2,500."},
{"id":"fn5-18","t":"Intraday trading","q":"Rafael buys 500 XYZ shares at RO 1.600 and sells them the same day at RO 2.200. Brokerage is 0.40% on the sale only. What is his capital gain?","o":["RO 295.600","RO 300.000","RO 304.400","RO 291.600"],"d":"Intraday trading: buying and selling the same shares on the same day to earn a capital gain.","w":"Cost = 500 × 1.6 = 800. Sale = 500 × 2.2 = 1,100, less 0.4% = 1,095.600. Gain = 1,095.6 − 800 = RO 295.600."},
{"id":"fn5-19","t":"Intraday trading","q":"An investor buys at RO 3.500 and sells the same day at RO 4.200, with 0.2% brokerage on the sale, gaining RO 414.960. How many shares were traded?","o":["600","593","700","414"],"d":"Gain per share = selling price × (1 − brokerage) − buying price.","w":"Gain per share = 4.2 × 0.998 − 3.5 = 4.1916 − 3.5 = 0.6916. Shares = 414.96 ÷ 0.6916 = 600."},
{"id":"fn5-20","t":"Dividends","q":"A dividend is always calculated as a percentage of the share's:","o":["Face value","Market value","Purchase price including brokerage","Selling price"],"d":"Dividend: the part of profits (after taxes and reserves) distributed to shareholders, expressed as a percentage of face (nominal) value.","w":"Even if you paid more than face value in the market, the dividend uses face value."},
{"id":"fn5-21","t":"Dividends","q":"An investor buys 10,000 shares (face value RO 1.000) at a market price of RO 2.500. The company declares a 40% dividend. How much dividend does the investor receive?","o":["RO 4,000.000","RO 10,000.000","RO 1,000.000","RO 25,000.000"],"d":"Dividend per share = dividend % × face value. Total = dividend per share × number of shares.","w":"Per share = 40% × 1.000 = 0.400. Total = 0.400 × 10,000 = RO 4,000. Using market value would wrongly give RO 10,000."},
{"id":"fn5-22","t":"Bonus shares","q":"ALC declares a 3:5 bonus. Ahmed holds 200 shares and the price after the bonus is RO 2.500. What is his holding worth?","o":["RO 800.000","RO 500.000","RO 300.000","RO 1,300.000"],"d":"Bonus shares: free extra shares in a ratio (3:5 = 3 new for every 5 held).","w":"Bonus = 200 × 3/5 = 120. Total = 320 shares. Worth = 320 × 2.500 = RO 800."},
{"id":"fn5-23","t":"Bonus shares","q":"Bonus shares are also called:","o":["Scrip dividends or capitalisation issues","Right shares","Preference shares","Demat shares"],"d":"Bonus shares: additional free shares to existing shareholders; also called scrip dividends or capitalisation issues.","w":"They capitalise the company's reserves into shares instead of paying cash."},
{"id":"fn5-24","t":"Trading","tf":true,"ans":true,"q":"There is no capital gains tax on profits from buying and selling shares in Oman.","d":"Capital gains tax in Oman: there is no tax on profits from buying and selling shares.","w":"The notes state this under both trading and intraday transactions."},
{"id":"fn5-25","t":"Bonus shares","tf":true,"ans":true,"q":"Bonus shares increase the number of shares a holder owns but keep their proportional ownership the same.","d":"Impact of bonus shares: more shares outstanding, but each shareholder's proportion is unchanged.","w":"Everyone receives bonus shares in the same ratio, so their percentage of the company does not change."},
{"id":"fn5-w1","t":"Buying and selling","wr":true,"q":"Ali buys 25,000 shares at a market value of RO 0.800 each with 0.5% brokerage. How much does he need, and what is the effective purchase price per share?","a":"Value = 25,000 × 0.800 = RO 20,000\nBrokerage = 20,000 × 0.005 = RO 100\nTotal needed = RO 20,100\nEffective price per share = 20,100 ÷ 25,000 = RO 0.804 (or 0.800 × 1.005)","d":"Buying cost = shares × price × (1 + brokerage rate).","w":"Brokerage is added when buying, which raises the effective price per share."},
{"id":"fn5-w2","t":"Buying and selling","wr":true,"q":"Maryam sells 2,500 shares (face value RO 3.000) at RO 5.000 each with 0.4% brokerage. How much does she receive, and what is the effective selling price per share?","a":"Value = 2,500 × 5.000 = RO 12,500\nBrokerage = 12,500 × 0.004 = RO 50\nAmount received = RO 12,450\nEffective selling price = 12,450 ÷ 2,500 = RO 4.980 (or 5.000 × 0.996)","d":"Selling proceeds = shares × price × (1 − brokerage rate).","w":"Brokerage is deducted when selling, which lowers the effective price. Face value is not used in trading."},
{"id":"fn5-w3","t":"Buying and selling","wr":true,"q":"An investor buys 2,000 shares (face value RO 0.100) at RO 0.250 and sells them a month later at RO 0.300, paying 0.2% brokerage on both purchase and sale. Find the gain or loss.","a":"Purchase cost = 2,000 × 0.250 × 1.002 = RO 501.000\nSale proceeds = 2,000 × 0.300 × 0.998 = RO 598.800\nGain = 598.800 − 501.000 = RO 97.800","d":"Gain = net sale proceeds − total purchase cost.","w":"Brokerage is paid twice, so it raises the cost and lowers the proceeds."},
{"id":"fn5-w4","t":"Buying and selling","wr":true,"q":"Abeer buys 4,000 shares (face value RO 1) at RO 1.200 and later sells all of them at RO 1.600. Brokerage is 0.4% on purchase and sale. Find her gain or loss.","a":"Purchase cost = 4,000 × 1.200 × 1.004 = RO 4,819.200\nSale proceeds = 4,000 × 1.600 × 0.996 = RO 6,374.400\nGain = 6,374.400 − 4,819.200 = RO 1,555.200","d":"Gain = net sale proceeds − total purchase cost.","w":"Without brokerage the gain would be 4,000 × 0.400 = 1,600; brokerage on both sides reduces it to 1,555.200."},
{"id":"fn5-w5","t":"Bonus shares","wr":true,"q":"Basil holds 550 LMN shares. LMN declares a 1:5 bonus. How many bonus shares does he get, and what is his holding worth at RO 1.250 per share?","a":"Bonus shares = 550 × 1/5 = 110\nTotal shares = 550 + 110 = 660\nNet worth = 660 × 1.250 = RO 825.000","d":"Bonus ratio 1:5 means 1 free share for every 5 shares held.","w":"Bonus shares are free, so the number of shares rises without any extra payment."},
{"id":"fn5-w6","t":"Types of shares","wr":true,"q":"Compare common (equity) shares and preferred (preference) shares.","a":"Common shares:\n- Also called ordinary shares; represent ownership.\n- Have voting rights (e.g. board elections).\n- May receive dividends, but these are not guaranteed.\n- Paid last in liquidation, after debts and preferred shareholders.\nPreferred shares:\n- Have priority over common shares for dividends and return of capital.\n- Usually pay a fixed dividend.\n- Usually no voting rights, except on specific issues.\n- May be callable (the company can buy them back at a set price and time).","d":"Equity shares: ownership with dividends and voting rights. Preference shares: fixed dividends and priority, usually without voting rights.","w":"The trade-off is control versus safety: common shareholders get votes, preferred shareholders get priority and fixed dividends."}
]},
{"id":"fn-ch6","label":"Chapter 6","name":"Investment in Mutual Funds","questions":[
{"id":"fn6-01","t":"Mutual fund basics","q":"A mutual fund is:","o":["A professionally managed vehicle that pools money from many investors to invest in stocks and securities","A bank deposit with a fixed interest rate","A loan given by investors to the government","A single company's shares"],"d":"Mutual fund: a financial vehicle managed by professionals that pools money from multiple investors to invest in stocks and securities.","w":"Its goal is to diversify investments, minimise unsystematic risk and maximise returns."},
{"id":"fn6-02","t":"Mutual fund basics","q":"Who regulates mutual funds in Oman?","o":["The Capital Market Authority (CMA)","The Central Bank of Oman","The Muscat Clearing & Depository","The fund manager"],"d":"Regulation: the CMA oversees mutual fund registration, operations and supervision in Oman.","w":"Units listed on the MSM must also be registered with the Muscat Clearing & Depository Company, but the regulator is the CMA."},
{"id":"fn6-03","t":"Benefits","q":"Which is a benefit of mutual funds over direct share trading?","o":["Lower transaction costs because of economies of scale","Guaranteed returns with no risk","No fees of any kind","The investor chooses every share personally"],"d":"Benefits of mutual funds: diversification, professional management, convenience, lower transaction costs.","w":"Mutual funds are NOT risk-free, and they charge entry and exit loads."},
{"id":"fn6-04","t":"Units and fund types","q":"The nominal value of a mutual fund unit in Oman is typically:","o":["RO 1.000","RO 0.100","RO 10.000","RO 100.000"],"d":"Mutual fund units: schemes are divided into equal units with a nominal value, typically RO 1.000 in Oman.","w":"Minimum investments usually start around RO 1,000 to RO 2,000."},
{"id":"fn6-05","t":"Units and fund types","q":"A fund that raises a fixed amount of capital for a set period and then returns the money is:","o":["A closed-ended fund","An open-ended fund","An index fund","A money market fund"],"d":"Closed-ended fund: fixed capital for a set period. Open-ended fund: no limit on units and no time limit.","w":"The fixed amount and fixed period define a closed-ended fund."},
{"id":"fn6-06","t":"Units and fund types","q":"Which fund invests in short-term debt such as treasury bills for liquidity and capital preservation?","o":["Money market fund","Equity fund","Sector fund","Alternative fund"],"d":"Money market fund: invests in short-term debt instruments like treasury bills, focusing on liquidity and preserving capital.","w":"Equity funds aim for long-term growth through stocks; sector and alternative funds take more risk."},
{"id":"fn6-07","t":"Units and fund types","q":"A passively managed fund that tracks a specific stock market index is:","o":["An index fund","A balanced fund","A sector fund","A fixed income fund"],"d":"Index fund: passively managed, tracking a specific stock market index.","w":"'Passive' means the fund copies an index instead of picking stocks actively."},
{"id":"fn6-08","t":"Classifications","q":"Classifying equity funds as large-cap, mid-cap or small-cap is based on:","o":["Market capitalisation","Load structure","Geographical focus","Expense ratio"],"d":"Market capitalisation: the size of the companies an equity fund invests in.","w":"'Cap' is short for capitalisation, the market value of a company."},
{"id":"fn6-09","t":"Classifications","q":"Classifying funds as actively managed or passively managed is based on:","o":["Investment style","Asset class","Sector focus","Expense ratio"],"d":"Investment style: funds are divided into actively managed and passively managed funds.","w":"Active versus passive describes HOW the fund is managed, which is its investment style."},
{"id":"fn6-10","t":"Classifications","q":"Classifying funds as front-end load or no-load is based on:","o":["Load structure","Risk profile","Investment style","Asset class"],"d":"Load structure: classification by the sales charge, such as front-end load or no-load funds.","w":"A 'load' is a sales charge, so this is the load structure."},
{"id":"fn6-11","t":"NAV and loads","q":"How is the Net Asset Value (NAV) per unit calculated?","o":["(Current value of all assets − current value of all liabilities) ÷ total units outstanding","Total assets × number of units","Face value + entry load","Total liabilities ÷ total assets"],"d":"NAV = (current value of all assets − current value of all liabilities) ÷ total number of units outstanding.","w":"It is the fund's net worth shared equally across all units. Every fund must declare its NAV daily."},
{"id":"fn6-12","t":"NAV and loads","q":"A fund has assets worth RO 12,500,000, liabilities of RO 500,000 and 8,000,000 units. What is its NAV per unit?","o":["RO 1.500","RO 1.562","RO 1.438","RO 12.000"],"d":"NAV = (assets − liabilities) ÷ units outstanding.","w":"(12,500,000 − 500,000) ÷ 8,000,000 = 12,000,000 ÷ 8,000,000 = RO 1.500."},
{"id":"fn6-13","t":"NAV and loads","q":"During a New Fund Offer (NFO), investors buy units at:","o":["Face (nominal) value","The NAV after one year","The redemption price","Market price plus exit load"],"d":"NFO: the initial offer when units are subscribed at face value. After that, units trade at the NAV.","w":"There is no performance history yet during the NFO, so units are sold at their nominal value."},
{"id":"fn6-14","t":"NAV and loads","q":"In Oman, the effective entry load (2% plus 5% VAT) is:","o":["2.1%","2%","7%","3.15%"],"d":"Entry load: 2% plus 5% VAT on the load = 2% × 1.05 = 2.1%. Exit load: 3% × 1.05 = 3.15%.","w":"VAT is 5% OF the 2% load, not an extra 5 percentage points."},
{"id":"fn6-15","t":"NAV and loads","q":"The 3.15% exit load in Oman applies when units are redeemed:","o":["Before 3 months","After 3 months","After 1 year only","At any time"],"d":"Exit load: 3.15% (3% + 5% VAT) if redeemed before 3 months; no exit load after 3 months.","w":"The exit load discourages very short-term investing."},
{"id":"fn6-16","t":"NAV and loads","q":"The price an investor receives when selling units (the redemption price) is:","o":["NAV − exit load","NAV + entry load","NAV + exit load","Face value − entry load"],"d":"Entry: price paid = NAV + entry load. Exit: amount received = NAV − exit load (redemption price).","w":"Loads are the fund's revenue: added when you buy and deducted when you sell."},
{"id":"fn6-17","t":"NAV and loads","q":"Ahmed invests RO 10,000 when the NAV is RO 2.500, with an entry load of 2% plus 5% VAT. How many units does he get?","o":["3,917.728 units","4,000.000 units","3,921.569 units","3,916.000 units"],"d":"Units = amount invested ÷ adjusted NAV, where adjusted NAV = NAV × (1 + effective entry load).","w":"Effective load = 2.1%. Adjusted NAV = 2.500 × 1.021 = 2.5525. Units = 10,000 ÷ 2.5525 = 3,917.728."},
{"id":"fn6-18","t":"NAV and loads","q":"Watiqa sells units at a NAV of RO 2.500 with an exit load of 3% plus 5% VAT and receives RO 4,842.500. How many units did she sell?","o":["2,000.000 units","2,100.000 units","1,996.907 units","1,937.000 units"],"d":"Units sold = amount received ÷ redemption price, where redemption price = NAV × (1 − effective exit load).","w":"Effective exit load = 3.15%. Redemption price = 2.500 × 0.9685 = 2.42125. Units = 4,842.5 ÷ 2.42125 = 2,000."},
{"id":"fn6-19","t":"Returns","q":"Raja invests RO 28,000 at an adjusted NAV of RO 1.400 and later sells all units at an adjusted NAV of RO 1.600. What is his return on investment?","o":["14.286%","16.000%","12.500%","4.000%"],"d":"Return on investment = Total gain ÷ Amount invested × 100.","w":"Units = 28,000 ÷ 1.400 = 20,000. Sale = 20,000 × 1.600 = 32,000. Gain = 4,000. ROI = 4,000 ÷ 28,000 × 100 = 14.286%."},
{"id":"fn6-20","t":"Returns","q":"Basil invests RO 900 when the NAV is RO 0.450 and sells when it reaches RO 1.650 (no loads). What is his rate of return?","o":["266.667%","366.667%","120.000%","73.333%"],"d":"ROI = Total gain ÷ Amount invested × 100.","w":"Units = 900 ÷ 0.450 = 2,000. Sale = 2,000 × 1.650 = 3,300. Gain = 2,400. ROI = 2,400 ÷ 900 × 100 = 266.667%."},
{"id":"fn6-21","t":"SIP","q":"Which statement describes a Systematic Investment Plan (SIP)?","o":["Investing a fixed amount at regular intervals, usually monthly, debited automatically","Investing one large lump sum when prices are lowest","Buying shares directly on the stock market each day","Withdrawing a fixed amount from a fund every month"],"d":"SIP: regular investment of a fixed amount (from as low as RO 50), usually monthly, automatically debited from the bank account.","w":"SIPs build discipline and remove the need to time the market."},
{"id":"fn6-22","t":"SIP","q":"Why is the average unit cost under a SIP lower than the average market price?","o":["A fixed amount buys more units when prices are low and fewer when prices are high","SIPs have no entry load","SIP units always rise in value","The fund manager chooses the lowest price each month"],"d":"SIP (Systematic Investment Plan): investing a fixed amount at regular intervals. It benefits from cost averaging.","w":"Average cost uses the harmonic mean, which is always lower than the arithmetic mean of the prices when prices vary."},
{"id":"fn6-23","t":"SIP","q":"An investor puts RO 75 a month into a SIP for 4 months at adjusted NAVs of RO 7.5, 6, 2.5 and 5. What is the average unit cost (harmonic mean)?","o":["RO 4.444","RO 5.250","RO 5.000","RO 4.000"],"d":"Average unit cost = total amount invested ÷ total units purchased.","w":"Units: 10, 12.5, 30, 15 = 67.5 units. Average cost = 300 ÷ 67.5 = RO 4.444, lower than the arithmetic mean price of RO 5.250."},
{"id":"fn6-24","t":"Mutual fund basics","tf":true,"ans":false,"q":"Mutual funds are risk-free because they are professionally managed.","d":"Despite professional management, mutual funds are not risk-free, similar to the stock market.","w":"Their NAV can fall when the underlying stocks and securities fall."},
{"id":"fn6-25","t":"NAV and loads","tf":true,"ans":true,"q":"Mutual fund units can be bought in fractions, such as a quarter or half unit.","d":"Mutual fund units can be purchased in fractions (e.g. 1/4 or 1/2 unit).","w":"That is why unit numbers in calculations often have decimals."},
{"id":"fn6-w1","t":"NAV and loads","wr":true,"q":"Ahmed invests RO 10,000 in a mutual fund with NAV RO 2.500 per unit. The entry load is 2% plus 5% VAT. Find (a) the effective entry load rate, (b) the adjusted NAV, (c) units acquired, (d) the entry load paid.","a":"(a) Effective entry load = 2% × 1.05 = 2.1%\n(b) Adjusted NAV = 2.500 × 1.021 = RO 2.5525\n(c) Units = 10,000 ÷ 2.5525 = 3,917.728 units\n(d) Entry load paid = 10,000 − (3,917.728 × 2.500) = RO 205.681","d":"Adjusted NAV (buying) = NAV × (1 + effective entry load).","w":"The investor pays the NAV plus the load on every unit, so fewer units are bought than 10,000 ÷ 2.5 = 4,000."},
{"id":"fn6-w2","t":"NAV and loads","wr":true,"q":"An investor invests RO 20,420 when the NAV is RO 1.250, with an entry load of 2% plus 5% VAT. Find the adjusted NAV, units acquired and entry load paid.","a":"Effective entry load = 2.1%\nAdjusted NAV = 1.250 × 1.021 = RO 1.27625\nUnits = 20,420 ÷ 1.27625 = 16,000.000 units\nEntry load paid = 16,000 × 1.250 × 0.021 = RO 420.000","d":"Entry load paid = units × NAV × effective entry load.","w":"Check: 16,000 × 1.250 = 20,000 at NAV, plus 420 load = 20,420 invested."},
{"id":"fn6-w3","t":"NAV and loads","wr":true,"q":"Watiqa sells units when the NAV is RO 2.500 with an exit load of 3% plus 5% VAT, and receives RO 4,842.500. Find (a) the effective exit load, (b) the redemption price, (c) units sold, (d) exit load paid.","a":"(a) Effective exit load = 3% × 1.05 = 3.15%\n(b) Redemption price = 2.500 × (1 − 0.0315) = RO 2.42125\n(c) Units sold = 4,842.5 ÷ 2.42125 = 2,000 units\n(d) Exit load paid = 2,000 × 2.500 × 0.0315 = RO 157.500","d":"Redemption price = NAV − exit load = NAV × (1 − effective exit load).","w":"The exit load is deducted from the NAV, so the investor receives less per unit than the NAV."},
{"id":"fn6-w4","t":"Returns","wr":true,"q":"Raja invests RO 28,000 when the adjusted NAV is RO 1.400. He later sells all units at an adjusted NAV of RO 1.600. Find (a) units bought, (b) sale proceeds, (c) capital gain, (d) return on investment.","a":"(a) Units = 28,000 ÷ 1.400 = 20,000 units\n(b) Sale proceeds = 20,000 × 1.600 = RO 32,000\n(c) Capital gain = 32,000 − 28,000 = RO 4,000\n(d) ROI = 4,000 ÷ 28,000 × 100 = 14.286%","d":"Return on investment = Total gain ÷ Amount invested × 100.","w":"The adjusted NAVs already include the loads, so use them directly."},
{"id":"fn6-w5","t":"SIP","wr":true,"q":"An investor puts RO 200 a month into a SIP for 4 months at adjusted NAVs of RO 4, 5, 6 and 3. Find the average unit cost and the arithmetic mean price, and comment on SIP benefits.","a":"Units: 200 ÷ 4 = 50; 200 ÷ 5 = 40; 200 ÷ 6 = 33.333; 200 ÷ 3 = 66.667\nTotal units = 190.000; total invested = RO 800\nAverage unit cost (harmonic) = 800 ÷ 190.000 = RO 4.211\nArithmetic mean price = (4 + 5 + 6 + 3) ÷ 4 = RO 4.500\nComment: the SIP's average cost is lower than the average market price, because the fixed RO 200 buys more units when the NAV is low.","d":"SIP cost averaging: average unit cost (harmonic mean) is lower than the arithmetic mean of prices.","w":"This shows why SIPs remove the need to time the market."},
{"id":"fn6-w6","t":"Benefits","wr":true,"q":"Explain four benefits of investing in mutual funds instead of trading shares directly.","a":"1. Diversification: the fund spreads money across many securities, reducing risk; doing this directly would need a large investment.\n2. Professional management: experts research and manage the portfolio, which helps novice investors.\n3. Convenience: units are easy to buy and sell, with low minimum investments and less time and effort.\n4. Lower transaction costs: the fund benefits from economies of scale.\nDirect share trading may suit knowledgeable investors who want to manage their own portfolio, but it carries higher risk and costs.","d":"Mutual fund: a professionally managed pool of investors' money invested in stocks and securities.","w":"Each benefit addresses a weakness of direct trading: risk, expertise, effort and cost."}
]},
{"id":"fn-ch7","label":"Chapter 7","name":"Recent Trends in Finance","questions":[
{"id":"fn7-01","t":"Traditional finance","q":"Traditional finance mainly emphasises:","o":["Stability, capital preservation and risk management","Growth, innovation and risk-taking","Cryptocurrency and DeFi","Robo-advisors and crowdfunding"],"d":"Traditional finance: conventional, long-established methods of managing money that emphasise stability, capital preservation and risk management over growth and innovation.","w":"Growth, innovation and risk-taking describe modern finance."},
{"id":"fn7-02","t":"Traditional finance","q":"Which is an example of TRADITIONAL finance?","o":["Insurance","Cryptocurrency","Robo-advisors","Peer-to-peer lending"],"d":"Traditional finance examples: banking, stocks and bonds, insurance, retirement planning, real estate.","w":"Cryptocurrency, robo-advisors and P2P lending are modern finance."},
{"id":"fn7-03","t":"Traditional finance","q":"Stocks represent ___, while bonds represent ___.","o":["Ownership in a company; a loan to a company or government","A loan to a company; ownership in a company","Insurance cover; a bank deposit","A digital asset; a savings account"],"d":"Stocks: ownership in a company. Bonds: a loan to a company or government entity.","w":"A shareholder owns part of the company; a bondholder has lent it money."},
{"id":"fn7-04","t":"Changes in finance","q":"Fintech means:","o":["Using technology to provide innovative financial services","Government regulation of banks","Traditional branch banking","Investing only in technology companies"],"d":"Fintech (financial technology): the use of technology to provide innovative financial services, often faster, cheaper and more convenient.","w":"Examples include online banking, mobile payment apps and robo-advisors."},
{"id":"fn7-05","t":"Changes in finance","q":"The Dodd-Frank Act was introduced:","o":["In the United States after the 2008 financial crisis, to reduce risk and increase transparency","In the European Union in 2018 to protect investors","In Oman to regulate mutual funds","To create Bitcoin"],"d":"Regulatory reforms: after the 2008 crisis, the US Dodd-Frank Act introduced new rules for banks to reduce risk and increase transparency.","w":"The EU's 2018 rule is MiFID II."},
{"id":"fn7-06","t":"Changes in finance","q":"MiFID II (2018) was introduced by:","o":["The European Union, to increase market transparency and protect investors","The United States after 2008","The Capital Market Authority of Oman","A cryptocurrency exchange"],"d":"MiFID II: the EU's Markets in Financial Instruments Directive, introduced in 2018.","w":"It aimed to increase transparency in financial markets and protect investors."},
{"id":"fn7-07","t":"Modern finance","q":"A computer program that uses algorithms to give investment advice and manage portfolios is a:","o":["Robo-advisor","Chatbot","Digital wallet","Crowdfunding platform"],"d":"Robo-advisors: computer programs that use algorithms to provide financial advice and investment management, usually at lower cost.","w":"Chatbots answer customer questions; robo-advisors manage investments."},
{"id":"fn7-08","t":"Modern finance","q":"Raising money from a large number of people through an online platform is:","o":["Crowdfunding","Peer-to-peer lending","Impact investing","An IPO"],"d":"Crowdfunding: raising money from many individuals through an online platform, for startups, real estate or charitable causes.","w":"P2P lending is borrowing and lending between individuals, with repayment."},
{"id":"fn7-09","t":"Modern finance","q":"Individuals lending and borrowing directly from each other without a bank is:","o":["Peer-to-peer (P2P) lending","Crowdfunding","Decentralised finance","Sustainable finance"],"d":"Peer-to-peer lending: platforms match borrowers and lenders directly, based on creditworthiness and needs.","w":"The key point is that no traditional financial institution sits in the middle."},
{"id":"fn7-10","t":"Modern finance","q":"Investing in companies that create positive social or environmental impact as well as financial return is:","o":["Impact investing","Crowdfunding","High-frequency trading","Short selling"],"d":"Impact investing: investing in organisations with positive social or environmental impact in addition to financial returns.","w":"It aligns financial goals with personal values."},
{"id":"fn7-11","t":"Modern finance","q":"Cryptocurrency has given rise to which new forms of finance?","o":["Decentralised finance (DeFi) and non-fungible tokens (NFTs)","Insurance and retirement planning","Banking and bonds","Mutual funds and SIPs"],"d":"Cryptocurrency: a digital asset using cryptography to secure transactions and control creation of new units.","w":"The notes say it gave rise to DeFi and NFTs."},
{"id":"fn7-12","t":"Traditional vs modern","q":"Private equity, venture capital and hedge funds are investment strategies of:","o":["Modern finance","Traditional finance","Public finance","Personal finance only"],"d":"Investment strategies: traditional finance uses stocks, bonds and mutual funds; modern finance introduced private equity, venture capital and hedge funds.","w":"These newer strategies reflect modern finance's focus on growth and risk-taking."},
{"id":"fn7-13","t":"Traditional vs modern","q":"Which statement about globalisation is correct?","o":["Modern finance is more global; traditional finance focuses more on local or regional markets","Traditional finance is more global than modern finance","Neither is affected by globalisation","Both focus only on local markets"],"d":"Globalisation: modern finance emphasises cross-border investment and international diversification.","w":"Traditional finance has tended to focus on local or regional markets."},
{"id":"fn7-14","t":"Recent trends","q":"Bitcoin, the first and best-known cryptocurrency, was created in:","o":["2009","2001","2015","2018"],"d":"Cryptocurrencies: decentralised digital assets. Bitcoin was created in 2009; others include Ethereum, Litecoin and Dogecoin.","w":"2018 is when MiFID II was introduced, not Bitcoin."},
{"id":"fn7-15","t":"Recent trends","q":"In sustainable finance, ESG stands for:","o":["Environmental, social and governance","Equity, savings and growth","Economic, sustainable and green","Exchange, stocks and gold"],"d":"Sustainable finance: incorporating ESG criteria (environmental, social and governance) into investment decisions.","w":"ESG factors include carbon footprint, diversity and inclusion policies, and labour practices."},
{"id":"fn7-16","t":"Recent trends","q":"Which is a sustainable finance solution?","o":["Green bonds","High-frequency trading","Leveraged products","Payday loans"],"d":"Sustainable finance solutions: ESG investing, impact investing and green bonds.","w":"High-frequency trading and leveraged products are listed under ethical concerns, not sustainability."},
{"id":"fn7-17","t":"Recent trends","q":"Which is an example of artificial intelligence (AI) in finance?","o":["Fraud detection algorithms","Paper cheques","Branch queues","Fixed deposits"],"d":"AI in finance: chatbots, fraud detection algorithms and robo-advisors; analysing large data to find patterns.","w":"AI raises concerns about privacy, ethics and job displacement."},
{"id":"fn7-18","t":"Benefits","q":"Banks being required to hold more capital and be more transparent leads to which benefit?","o":["Better risk management","Cost savings","Increased investment opportunities","Improved customer experience"],"d":"Better risk management: regulatory reforms require more capital and transparency, making the system more resilient.","w":"Cost savings and customer experience come mainly from fintech; investment opportunities from globalisation."},
{"id":"fn7-19","t":"Challenges","q":"Which challenge involves anti-money laundering (AML) and know-your-customer (KYC) rules?","o":["Regulatory compliance","Cybersecurity","Financial inclusion","Financial stability"],"d":"Regulatory compliance: reforms increase the compliance burden in data privacy, AML and KYC, which is costly and time-consuming.","w":"AML and KYC are regulations, so the challenge is complying with them."},
{"id":"fn7-20","t":"Challenges","q":"People with low incomes or limited access to technology missing out on fintech is a challenge of:","o":["Financial inclusion","Consumer protection","Ethical concerns","Regulatory compliance"],"d":"Financial inclusion challenge: barriers remain for some groups, who may rely on expensive and risky informal services.","w":"Being excluded from financial services is the opposite of inclusion."},
{"id":"fn7-21","t":"Innovative tools","q":"A decentralised digital ledger that records transactions securely and transparently is:","o":["Blockchain","A digital wallet","Big data","A chatbot"],"d":"Blockchain: a decentralised digital ledger, used for digital currencies, smart contracts and identity verification.","w":"Digital wallets store currencies and make payments; blockchain is the record-keeping technology."},
