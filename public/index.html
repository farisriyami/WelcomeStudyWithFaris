      setBarMsg("Your admin sign-in has ended. Open Admin at the bottom of the home page, sign in, then save again.", false);
    } else if (err && err.message === "too large") setBarMsg("That's too much to save at once. Save a few questions at a time.");
    else setBarMsg("Couldn't save your changes. Check your connection and try again.");
  }
}
function useShared() {
  lsDel(LOCAL_DATA_KEY);
  usingLocal = false;
  applyData(SHARED, false);
  setBarMsg("Switched to the shared questions.");
}

/* ---------- Rendering: top bar ---------- */
function renderTop() {
  if (!route.chapter) {
    const eff = effective();
    topEl.innerHTML = `
      <header>
        <span class="eyebrow">Study quizzes${usingLocal ? " · your copy" : ""}</span>
        <h1 id="page-h" tabindex="-1">UTAS Course Quizzes</h1>

const localNotice = () => `<div class="notice"><p>You're using a copy of the questions saved in this browser. Other people who open this page see the shared questions.</p><button class="btn secondary small" id="use-shared">Switch to the shared questions</button></div>`;

/* ---------- Rendering: course home ---------- */
function statusHTML(id) {
  const p = PROG[id], r = RESULTS[id];
  if (isObj(p) && p.phase === "quiz" && Array.isArray(p.order) && isObj(p.answers)) {
    const a = p.order.filter(q => p.answers[q] !== undefined).length;
    if (a > 0) return `<span class="st st-prog">In progress · ${a} of ${p.order.length}</span>${isObj(r) ? `<span>Last score ${r.pct}%</span>` : ""}`;
  }
  if (isObj(r) && typeof r.pct === "number") {
    const c = r.pct >= 75 ? "st-good" : r.pct >= 50 ? "st-warn" : "st-bad";
    return `<span class="st ${c}">Last score ${r.pct}%${r.secs != null ? " · " + fmtDur(r.secs) : ""}</span>`;
  }
  return `<span class="st st-none">Not started</span>`;
}
function chapterCard(r, eff) {
  const ch = r.ch, live = findChapter(eff, ch.id);
  const src = live ? live.chapter : ch;
  const n = quizQs(src).length, wn = writtenQs(src).length;
  const status = r.state === "new" ? `<span class="st st-prog">Not saved yet</span>`
    : r.state === "del" ? `<span class="st st-bad">Will be deleted</span>`
    : isAdmin() ? "" : statusHTML(ch.id);
  return `<li><button class="chapter-card${r.state ? " is-" + r.state : ""}" data-open="${esc(ch.id)}">
    <span class="cc-main">
      <span class="cc-label">${esc(ch.label || "Chapter")}</span>
      <span class="cc-name">${esc(ch.name)}</span>
      <span class="cc-meta"><span>${plural(n, "question")}${wn ? ` · ${wn} written` : ""}</span>${status}</span>
    </span>
    <span class="cc-arrow" aria-hidden="true">→</span>
  </button></li>`;
}
function renderHome() {
  const eff = effective();
  const course = findCourse(eff, route.course) || eff.courses[0] || null;
  if (!course) { app.innerHTML = `<p class="muted">There are no courses yet.</p>`; return; }
  route.course = course.id;
  const saved = findCourse(DATA, course.id);
  const rows = (saved ? saved.chapters : []).map(ch => ({ ch, state: isDeletingChapter(ch.id) ? "del" : "" }))
    .concat(OPS.filter(o => o.op === "addCh" && o.course === course.id).map(o => ({ ch: o.ch, state: "new" })));
  const tab = route.tab === "chat" ? "chat" : "chapters";
  const head = `
    ${usingLocal ? localNotice() : ""}

      <button class="tab" role="tab" data-tab="chapters" aria-selected="${tab === "chapters"}">Chapters <span class="count">${rows.length}</span></button>
      <button class="tab" role="tab" data-tab="chat" aria-selected="${tab === "chat"}">Chat</button>
    </div>`;
  const foot = `<p class="site-foot">${TRACK_URL ? "Your name, role, quiz scores, study time and activity are shared with the site owner. · " : ""}<a href="#admin">Admin</a></p>`;
  if (tab === "chat") {
    if (CHAT.course !== course.id) resetChat(course.id);
    app.innerHTML = head + chatHTML(course) + foot;
    CHAT.sig = "";
    updateChatView();
    const ta = document.getElementById("chat-text");
    if (ta) ta.value = CHAT.draft;
    if (!CHAT.timer && TRACK_URL) startChat();
    return;
  }
  app.innerHTML = `${head}
    ${rows.length ? `<ol class="chapters">${rows.map(r => chapterCard(r, eff)).join("")}</ol>` : `<p class="muted">No chapters yet.${canEdit() ? " Add the first one below." : ""}</p>`}
    ${canEdit() ? `<article class="card">
      <div class="q-head">
        <div class="meta"><span class="topic">Add a chapter</span><span>to ${esc(course.name)}</span></div>
        <form id="addch" class="addch" novalidate>
          <div class="field">
            <label class="flabel" for="ch-name">Chapter ${course.chapters.length + 1} name</label>
            <input type="text" id="ch-name" placeholder="e.g. Visitor Attractions and Events" autocomplete="off">
          </div>
          <button class="btn primary" type="submit">Add chapter</button>
        </form>
        <p class="form-msg" id="ch-msg" role="status"></p>

    </article>` : ""}

}

/* ---------- Rendering: chapter quiz ---------- */
function ticksHTML() {
  return `<div class="ticks" style="grid-template-columns:repeat(${S.order.length},1fr)" aria-hidden="true">` +
    S.order.map((id, k) => {
      let c = "";
      if (S.answers[id] !== undefined) c = isRight(id) ? "good" : "bad";
      else if (S.phase === "quiz" && k === S.idx) c = "now";
      return `<span class="${c}"></span>`;
    }).join("") + `</div>`;
}

function renderQuiz() {
  const n = S.order.length;
  const id = S.order[S.idx], q = byId.get(id);
  const picked = S.answers[id], done = picked !== undefined, right = correct(id);
  const answered = S.order.filter(i => S.answers[i] !== undefined);
  const got = answered.filter(isRight).length;
  const pct = answered.length ? Math.round(got / answered.length * 100) : 0;
  const last = S.idx === n - 1;

  const opts = S.opts[id].map((o, k) => {
    let cls = "opt", tag = "";
    if (done) {
      if (o === right) { cls += " is-right"; tag = o === picked ? "Your answer" : "Correct answer"; }
      else if (o === picked) { cls += " is-wrong"; tag = "Your answer"; }
      else cls += " is-dim";
    }
    return `<button class="${cls}" data-k="${k}" ${done ? "disabled" : ""}><span class="key">${LETTERS[k]}</span><span class="txt">${esc(o)}${tag ? `<span class="tag">${tag}</span>` : ""}</span></button>`;
  }).join("");

  const ok = done && picked === right;
  const feedback = !done ? "" : `
    <div class="tear"></div>
    <div class="feedback ${ok ? "ok" : "no"}" role="status">
      <p class="verdict"><span class="dot"></span>${ok ? "Correct" : "Not quite"}</p>
      ${ok ? "" : `<p class="answer-line">The correct answer is <strong>${esc(right)}</strong>.</p>`}
      <div class="def"><span class="label">Definition</span><p>${esc(q.d || "No definition was added for this question.")}</p></div>
      ${q.w ? `<div class="why"><span class="label">Why</span><p>${esc(q.w)}</p></div>` : ""}
      <div class="actions">
        <button class="btn primary" id="next">${last ? "See my score" : "Next question"}</button>
        <span class="hint">or press <kbd>Enter</kbd></span>
      </div>
    </div>`;

  app.innerHTML = `
    <div class="status">
      ${ticksHTML()}
      <div class="status-row">
        <span>Question <b>${S.idx + 1}</b> of ${n} · <span class="timer" id="q-timer" title="Time on this quiz">${fmtDur((S.ms || 0) / 1000)}</span></span>
        <span class="status-right">
          <span>Score <b>${got}</b> / ${answered.length}${answered.length ? ` · <b>${pct}%</b>` : ""}</span>
          ${answered.length ? `<button class="linkbtn" id="restart">${restartArmed ? "Click again to restart" : "Start over"}</button>` : ""}
        </span>
      </div>
    </div>
    <article class="card">
      <div class="q-head">
        <div class="meta"><span class="topic">Q${pad(numOf(id))} · ${esc(topicOf(q))}</span><span>${q.tf ? "True or false" : "Multiple choice"}</span></div>
        <h2 id="qtext" tabindex="-1">${esc(q.q)}</h2>
      </div>
      <div class="options" role="group" aria-labelledby="qtext">${opts}</div>
      ${feedback}
    </article>`;
}

function band(pct) {
  if (pct >= 90) return ["band-good", "Excellent. You know this chapter well."];
  if (pct >= 75) return ["band-good", "Good work. Go over the questions you missed below."];
  if (pct >= 50) return ["band-warn", "Getting there. Read the definitions for the questions you missed, then retry them."];
  return ["band-bad", "Keep studying. Re-read the chapter slides, then try the quiz again."];
}

function renderResults() {
  const n = S.order.length;
  const got = S.order.filter(isRight).length;
  const pct = Math.round(got / n * 100);
  const [bandCls, msg] = band(pct);
  const missed = S.order.filter(id => !isRight(id));

  const topicRows = topicList(quizQs(CH)).map(t => {
    const qs = S.order.filter(id => topicOf(byId.get(id)) === t);
    if (!qs.length) return "";
    const r = qs.filter(isRight).length, p = r / qs.length;
    const c = p >= .75 ? "good" : p >= .5 ? "warn" : "bad";
    return `<li><span>${esc(t)}</span><span class="bar" role="img" aria-label="${r} of ${qs.length} correct"><span class="${c}" style="width:${p * 100}%"></span></span><span class="frac">${r}/${qs.length}</span></li>`;
  }).join("");

  const missList = missed.map(id => `
    <details class="miss">
      <summary><span class="mono">Q${pad(numOf(id))}</span><span>${esc(byId.get(id).q)}</span></summary>
      <div class="body">
        <dl>
          <dt>Your answer</dt><dd class="bad-t">${esc(S.answers[id])}</dd>
          <dt>Correct</dt><dd class="good-t">${esc(correct(id))}</dd>
        </dl>
        <p>${esc(byId.get(id).d || "")}</p>
        ${byId.get(id).w ? `<p>${esc(byId.get(id).w)}</p>` : ""}
      </div>
    </details>`).join("");

  app.innerHTML = `
    <div class="status">
      ${ticksHTML()}
      <div class="status-row"><span>${esc(S.label)} · ${plural(n, "question")}</span><span>Finished</span></div>
    </div>
    <article class="card results">
      <div class="q-head">
        <div class="meta"><span class="topic">Your result</span><span>${got} right · ${n - got} wrong</span></div>
        <div class="score-row">
          <p class="pct ${bandCls}" id="qtext" tabindex="-1">${pct}<small>%</small></p>
          <div class="score-text">
            <p class="score-line">You got <b>${got}</b> of ${n} right in <b>${fmtDur((S.ms || 0) / 1000)}</b>.</p>
            <p class="band-msg">${msg}</p>
          </div>
        </div>
      </div>
      <div class="tear"></div>
      <section class="block">
        <h3>Score by topic</h3>
        <ul class="topics">${topicRows}</ul>
      </section>
      <section class="block">
        <h3>${missed.length ? `Questions you missed (${missed.length})` : "Questions you missed"}</h3>
        ${missed.length ? `<div class="misses">${missList}</div>` : `<p class="perfect">None. You answered every question correctly.</p>`}
      </section>
      <div class="actions">
        <button class="btn primary" id="retake-shuffle">Retake in a new order</button>
        <button class="btn secondary" id="retake">Retake in order</button>
        ${missed.length ? `<button class="btn secondary" id="retry">Retry the ${missed.length} I missed</button>` : ""}
      </div>
    </article>`;
}

function renderQuizView() {
  if (!S) {
    app.innerHTML = `
      <article class="card">
        <div class="q-head">
          <div class="meta"><span class="topic">No questions</span></div>
          <h2>This chapter has no quiz questions yet.</h2>
          ${canEdit() ? `<p class="muted">Add questions under Manage questions, save them, and they will show up here.</p>

        </div>
      </article>`;
    return;
  }
  if (S.phase === "results") renderResults(); else renderQuiz();
}

}

function renderManage() {
  const id = route.chapter;
  const isNew = isNewChapter(id), deleting = isDeletingChapter(id);
  app.innerHTML = `
    ${usingLocal ? localNotice() : ""}
    ${isNew ? `<div class="notice"><p>This chapter isn't saved yet. Add its questions, then save your changes.</p></div>` : ""}
    ${deleting ? `<div class="notice"><p>This chapter will be deleted when you save your changes.</p><button class="btn secondary small" id="undo-del-ch">Keep this chapter</button></div>` : ""}
    ${deleting ? "" : addFormHTML()}
    <article class="card">
      <div class="q-head">
        <div class="meta"><span class="topic">Question bank</span><span id="list-summary"></span></div>
        <div class="list-tools">
          <h2>All questions</h2>
          <input type="search" id="q-search" placeholder="Search questions" aria-label="Search questions" value="${esc(filterText)}">
        </div>
      </div>
      <ol class="qlist" id="qlist"></ol>
    </article>
    ${deleting ? "" : `<div class="danger-zone"><button class="btn danger" id="del-chapter">${delChArmed ? "Click again to delete this chapter" : "Delete this chapter"}</button></div>`}`;
  updateList();
}

function updateList() {
  const list = document.getElementById("qlist");
  if (!list) return;
  const id = route.chapter, deleting = isDeletingChapter(id);
  const savedQs = CH ? CH.questions : [];
  const dels = new Set(OPS.filter(o => o.op === "delQ" && o.ch === id).map(o => o.id));
  const adds = OPS.filter(o => o.op === "addQ" && o.ch === id).map(o => o.q);
  const summary = document.getElementById("list-summary");
  if (summary) summary.textContent = `${savedQs.length} saved${adds.length ? ` · ${adds.length} new` : ""}${dels.size ? ` · ${dels.size} to delete` : ""}`;
  let qn = 0, wn = 0;
  const rows = savedQs.map(q => ({ q, num: q.wr ? "W" + pad(++wn) : "Q" + pad(++qn), state: dels.has(q.id) ? "del" : "" }))
    .concat(adds.map(q => ({ q, num: "", state: "new" })));
  const f = filterText.trim().toLowerCase();
  const shown = f ? rows.filter(r => [r.q.q, topicOf(r.q), correctOf(r.q), r.q.d || ""].join(" ").toLowerCase().includes(f)) : rows;
  if (!rows.length) { list.innerHTML = `<li class="qempty">No questions yet. Add one above.</li>`; return; }
  if (!shown.length) { list.innerHTML = `<li class="qempty">No questions match "${esc(filterText.trim())}".</li>`; return; }
  list.innerHTML = shown.map(r => {
    const q = r.q, qid = esc(q.id);
    const badge = r.state === "new" ? `<span class="badge new">New</span>` : r.state === "del" ? `<span class="badge del">Will be deleted</span>` : "";
    const label = r.num || "Not saved";
    const btn = deleting ? ""
      : r.state === "new" ? `<button class="btn small ghost" data-remove="${qid}">Remove</button>`
      : r.state === "del" ? `<button class="btn small ghost" data-undo="${qid}">Undo</button>`
      : `<button class="btn small danger" data-del="${qid}" aria-label="Delete question ${r.num}">Delete</button>`;
    return `<li class="qrow${r.state ? " is-" + r.state : ""}">
      <div class="qrow-main">
        <div class="meta"><span>${label} · ${esc(topicOf(q))} · ${q.wr ? "Written" : q.tf ? "True or false" : "Multiple choice"}</span>${badge}</div>
        <p class="qrow-q">${esc(q.q)}</p>
        ${q.wr ? `<p class="qrow-d">${esc(q.a)}</p>` : `<p class="qrow-a">Answer: <b>${esc(correctOf(q))}</b></p>
        ${q.d ? `<p class="qrow-d">${esc(q.d)}</p>` : ""}`}
      </div>
      ${btn}
    </li>`;
  }).join("");
}

/* ---------- Rendering: bottom dock ---------- */
// Redraws the whole bottom dock: Next bar (phones) and save bar.
function renderSavebar() {
  drawSavebar();
  drawNextbar();
  syncDock();
}
function drawNextbar() {
  const nb = document.getElementById("nextbar");
  const id = S && S.order[S.idx];
  const show = phoneMQ.matches && !!route.chapter && route.view === "quiz" && !!CH && !!S && S.phase === "quiz" && S.answers[id] !== undefined;
  nb.hidden = !show;
  if (!show) { nb.innerHTML = ""; return; }
  const ok = isRight(id), last = S.idx === S.order.length - 1;
  nb.innerHTML = `<div class="nextbar-inner">
    <span class="nb-verdict ${ok ? "ok" : "no"}"><span class="dot"></span>${ok ? "Correct" : "Not quite"}</span>
    <button class="btn primary" id="next-m">${last ? "See my score" : "Next question"}</button>
  </div>`;
}
function setDockVar() {
  const dock = document.getElementById("dock");
  document.body.style.setProperty("--dock-h", (dock.hidden ? 0 : dock.offsetHeight) + "px");
}
function syncDock() {
  const dock = document.getElementById("dock");
  dock.hidden = document.getElementById("nextbar").hidden && document.getElementById("savebar").hidden;
  setDockVar();
}
function drawSavebar() {
  const bar = document.getElementById("savebar");
  const n = OPS.length;
  const show = n > 0 || !!barMsg;
  bar.hidden = !show;
  if (!show) { bar.innerHTML = ""; return; }
  const text = barMsg ? esc(barMsg)
    : `<b>${n}</b> unsaved ${n === 1 ? "change" : "changes"}${usingLocal ? " · saves to this browser" : ""}`;
  bar.innerHTML = `<div class="savebar-inner">
    <p class="bar-text" role="status">${text}</p>
    ${n ? `<div class="bar-actions">
      <button class="btn secondary small" id="discard" ${saving ? "disabled" : ""}>${discardArmed ? "Click again to discard" : "Discard"}</button>
      <button class="btn primary small" id="save" ${saving ? "disabled" : ""}>${saving ? "Saving…" : "Save changes"}</button>
    </div>` : ""}
  </div>`;
}
function setBarMsg(msg, autoClear = true) {
  barMsg = msg;
  clearTimeout(barTimer);
  if (autoClear) barTimer = setTimeout(() => { barMsg = ""; renderSavebar(); }, 7000);
  renderSavebar();
}

function renderAll() {
  if (adminMode) { stopChat(); renderAdmin(); return; }
  if (!me()) { stopChat(); renderLogin(); return; }
  if (route.view === "manage" && !canEdit()) route.view = "quiz";
  if (isAdmin() && route.chapter) route.view = "manage";
  if (route.chapter || route.tab !== "chat") stopChat();
  renderTop();
  if (!route.chapter) renderHome();
  else if (route.view === "manage") renderManage();
  else if (!CH) renderUnsavedQuiz();
  else if (route.view === "written" && W) renderWritten();
  else { if (route.view === "written") route.view = "quiz"; renderQuizView(); }
  renderSavebar();
  saveProgress();
  lsSet(ROUTE_KEY, JSON.stringify(route));
}

/* ---------- Navigation ---------- */
function focusHeading() { const h = document.getElementById("page-h"); if (h) h.focus({ preventScroll: true }); }
function focusQuestion() { const h = document.getElementById("qtext"); if (h) h.focus({ preventScroll: true }); }
function scrollToApp() {
  const top = app.getBoundingClientRect().top + window.scrollY - 16;
  if (window.scrollY > top) window.scrollTo({ top, behavior: reduceMotion ? "auto" : "smooth" });
}
function openChapter(id, view) {
  const f = chapterRef(id);
  if (!f) return;
  route.chapter = id;
  route.course = f.course.id;
  route.view = view || (findChapter(DATA, id) ? "quiz" : "manage");
  track("open_chapter", chapterInfo());
  restartArmed = false; delChArmed = false; filterText = "";
  bindChapter();
  renderAll();
  window.scrollTo(0, 0);
  focusHeading();
}
function goHome() {
  route.chapter = null;
  route.view = "quiz";
  restartArmed = false; delChArmed = false;
  bindChapter();
  renderAll();
  window.scrollTo(0, 0);
  focusHeading();
}
function setView(v) {
  if (v === route.view || (v === "manage" && !canEdit()) || (isAdmin() && v !== "manage")) return;
  route.view = v;
  delChArmed = false;
  renderAll();
}

/* ---------- Quiz actions ---------- */
function choose(k) {
  if (!S || S.phase !== "quiz") return;
  const id = S.order[S.idx];
  if (S.answers[id] !== undefined) return;
  S.answers[id] = S.opts[id][k];
  track("answer", Object.assign(chapterInfo(), { qid: id, correct: S.answers[id] === correct(id), secs: Math.round((S.qms || 0) / 1000) }));
  S.qms = 0;
  restartArmed = false;
  renderQuizView(); renderSavebar(); saveProgress();
  revealFeedback();
  const nb = ["next-m", "next"].map(i => document.getElementById(i)).find(b => b && b.getClientRects().length);
  if (nb) nb.focus({ preventScroll: true });
}
// Scroll just enough to show the definition (and the Next button on desktop),
// without pushing the question itself off the top of the screen.
function revealFeedback() {
  const fb = app.querySelector(".feedback"), head = app.querySelector(".q-head");
  if (!fb || !head) return;
  const dockH = parseFloat(document.body.style.getPropertyValue("--dock-h")) || 0;
  const target = phoneMQ.matches ? (fb.querySelector(".def") || fb) : fb;
  const want = target.getBoundingClientRect().bottom + window.scrollY - (window.innerHeight - dockH - 12);
  const cap = head.getBoundingClientRect().top + window.scrollY - 8;
  const top = Math.min(want, cap);
  if (top > window.scrollY) window.scrollTo({ top, behavior: reduceMotion ? "auto" : "smooth" });
}
function next() {
  if (!S || S.phase !== "quiz") return;
  if (S.idx < S.order.length - 1) S.idx++;
  else {
    S.phase = "results"; recordResult();
    const got = S.order.filter(isRight).length;
    track("quiz_finish", Object.assign(chapterInfo(), { got, total: S.order.length, pct: Math.round(got / S.order.length * 100), round: S.label, secs: Math.round((S.ms || 0) / 1000) }));
  }
  restartArmed = false;
  renderQuizView(); renderSavebar(); saveProgress();
  scrollToApp();
  focusQuestion();
}

/* ---------- Editing actions ---------- */
function afterDraftChange(focusSel) {
  discardArmed = false;
  saveDraft();
  updateList();
  renderSavebar();
  if (focusSel) { const el = app.querySelector(focusSel); if (el) el.focus(); }
}
const newId = prefix => prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function onAdd() {
  if (!canEdit()) return;
  const v = id => (document.getElementById(id)?.value || "").trim();
  const type = (app.querySelector('input[name="f-type"]:checked') || {}).value || "mc";
  const isTF = type === "tf";
  const topic = v("f-topic") || DEFAULT_TOPIC;
  const text = v("f-q"), def = v("f-def"), why = v("f-why");
  const errors = [];
  let firstBad = null;
  const bad = (fid, msg) => { errors.push(msg); if (!firstBad) firstBad = fid; };
  if (!text) bad("f-q", "Write the question.");
  const id = newId("u-");
  let item;
  if (type === "wr") {
    const ans = v("f-answer");
    if (!ans) bad("f-answer", "Write the model answer.");
    item = { id, t: topic, wr: true, q: text, a: ans, d: def };
  } else if (isTF) {
    const pick = app.querySelector('input[name="f-tf"]:checked');
    if (!pick) bad("f-tf-true", "Choose whether the statement is true or false.");
    item = { id, t: topic, tf: true, ans: !!pick && pick.value === "true", q: text, d: def };
  } else {
    const c = v("f-correct");
    const wrongs = ["f-wrong1", "f-wrong2", "f-wrong3"].map(v).filter(Boolean);
    if (!c) bad("f-correct", "Add the correct answer.");
    if (!wrongs.length) bad("f-wrong1", "Add at least one wrong answer.");
    const all = [c].concat(wrongs).filter(Boolean).map(s => s.toLowerCase());
    if (new Set(all).size !== all.length) bad("f-wrong1", "Each answer must be different.");
    item = { id, t: topic, q: text, o: [c].concat(wrongs), d: def };
  }
  if (!def) bad("f-def", "Write the definition to show after the answer.");
  if (item && why) item.w = why;
  const msgEl = document.getElementById("form-msg");
  if (errors.length) {
    msgEl.className = "form-msg is-error";
    msgEl.textContent = errors.join(" ");
    document.getElementById(firstBad)?.focus();
    return;
  }
  OPS.push({ op: "addQ", ch: route.chapter, q: item });
  lastTopic = topic === DEFAULT_TOPIC ? "" : topic;
  ["f-q", "f-correct", "f-wrong1", "f-wrong2", "f-wrong3", "f-answer", "f-def", "f-why"].forEach(fid => { const el = document.getElementById(fid); if (el) el.value = ""; });
  app.querySelectorAll('input[name="f-tf"]').forEach(r => { r.checked = false; });
  msgEl.className = "form-msg is-ok";
  msgEl.textContent = "Added to the list below. Save your changes to put it in the quiz.";
  afterDraftChange();
  document.getElementById("f-q").focus();
}

function onAddChapter() {
  if (!canEdit()) return;
  const input = document.getElementById("ch-name"), msg = document.getElementById("ch-msg");
  const name = (input.value || "").trim();
  if (!name) {
    msg.className = "form-msg is-error";
    msg.textContent = "Write the chapter name.";
    input.focus();
    return;
  }
  const course = findCourse(effective(), route.course);
  if (!course) return;
  const id = newId("u-ch-");
  OPS.push({ op: "addCh", course: course.id, ch: { id, label: "Chapter " + (course.chapters.length + 1), name, questions: [] } });
  saveDraft();
  openChapter(id, "manage");
}

function deleteChapter() {
  const id = route.chapter;
  if (isNewChapter(id)) {
    OPS = OPS.filter(o => !((o.op === "addCh" && o.ch.id === id) || (o.op === "addQ" && o.ch === id)));
    saveDraft();
    goHome();
    setBarMsg("Chapter removed.");
  } else {
    OPS = OPS.filter(o => !((o.op === "addQ" || o.op === "delQ") && o.ch === id));
    OPS.push({ op: "delCh", ch: id });
    saveDraft();
    goHome();
  }
}

function onClick(e) {
  const b = e.target.closest("button");
  if (!b || b.disabled) return;
  if (b.classList.contains("opt")) { choose(+b.dataset.k); return; }
  if (b.dataset.open) { openChapter(b.dataset.open); return; }
  if (b.dataset.go === "home") { goHome(); return; }
  if (b.dataset.course) { route.course = b.dataset.course; renderAll(); return; }
  if (b.dataset.role) { pickRole(b.dataset.role); return; }
  if (b.dataset.mode) { pickMode(b.dataset.mode); return; }
  if (b.dataset.pwfor) { ADMIN.pwFor = b.dataset.pwfor; ADMIN.pwMsg = ""; ADMIN.pwErr = ""; renderAdmin(); document.getElementById("pw-new")?.focus(); return; }
  if (b.dataset.tab) { route.tab = b.dataset.tab === "chat" ? "chat" : "chapters"; renderAll(); if (route.tab === "chat") document.getElementById("chat-text")?.focus({ preventScroll: true }); return; }
  if (b.dataset.msgdel) { onDeleteMessage(b); return; }
  if (b.dataset.view) { setView(b.dataset.view); return; }
  if (b.dataset.del) {
    const id = b.dataset.del;
    if (!OPS.some(o => o.op === "delQ" && o.id === id)) OPS.push({ op: "delQ", ch: route.chapter, id });
    afterDraftChange(`[data-undo="${id}"]`);
    return;
  }
  if (b.dataset.undo) { const id = b.dataset.undo; OPS = OPS.filter(o => !(o.op === "delQ" && o.id === id)); afterDraftChange(`[data-del="${id}"]`); return; }
  if (b.dataset.remove) { const id = b.dataset.remove; OPS = OPS.filter(o => !(o.op === "addQ" && o.q.id === id)); afterDraftChange("#q-search"); return; }
  if (b.dataset.student !== undefined) { ADMIN.student = b.dataset.student || null; renderAdmin(); window.scrollTo(0, 0); return; }
  switch (b.id) {
    case "next": case "next-m": next(); break;
    case "retake": newRound(allIds(), "Full quiz", { focus: true }); break;
    case "retake-shuffle": newRound(allIds(), "Shuffled quiz", { focus: true, shuffle: true }); break;
    case "retry": newRound(S.order.filter(id => !isRight(id)), "Retry round", { focus: true }); break;
    case "restart":
      if (restartArmed) { newRound(allIds(), "Full quiz", { focus: true }); break; }
      restartArmed = true; renderQuizView();
      document.getElementById("restart")?.focus();
      setTimeout(() => { if (restartArmed) { restartArmed = false; if (route.view === "quiz" && S && S.phase === "quiz") renderQuizView(); } }, 4000);
      break;
    case "del-chapter":
      if (delChArmed) { delChArmed = false; deleteChapter(); break; }
      delChArmed = true;
      b.textContent = "Click again to delete this chapter";
      setTimeout(() => { if (delChArmed) { delChArmed = false; const el = document.getElementById("del-chapter"); if (el) el.textContent = "Delete this chapter"; } }, 4000);
      break;
    case "undo-del-ch":
      OPS = OPS.filter(o => !(o.op === "delCh" && o.ch === route.chapter));
      saveDraft();
      renderAll();
      break;
    case "w-show": {
      W.shown[W.order[W.idx]] = true;
      renderWritten(); saveProgress();
      const m = app.querySelector(".model");
      if (m) m.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
      document.getElementById("w-got")?.focus({ preventScroll: true });
      break;
    }
    case "w-got": case "w-miss":
      W.marks[W.order[W.idx]] = b.id === "w-got";
      renderWritten(); saveProgress();
      document.getElementById("w-next")?.focus({ preventScroll: true });
      break;
    case "w-next":
      if (W.idx < W.order.length - 1) W.idx++;
      else {
        W.phase = "results";
        const wGot = W.order.filter(i => W.marks[i] === true).length;
        track("written_finish", Object.assign(chapterInfo(), { got: wGot, total: W.order.length, pct: Math.round(wGot / W.order.length * 100), secs: Math.round((W.ms || 0) / 1000) }));
      }
      renderWritten(); saveProgress();
      scrollToApp(); focusQuestion();
      break;
    case "w-again": W = newWritten(allWIds()); renderAll(); scrollToApp(); focusQuestion(); break;
    case "w-review": W = newWritten(W.order.filter(id => W.marks[id] !== true)); renderAll(); scrollToApp(); focusQuestion(); break;
    case "logout": logout(); break;
    case "pw-cancel": ADMIN.pwFor = ""; ADMIN.pwErr = ""; renderAdmin(); break;
    case "chat-share": shareScore(); break;
    case "admin-refresh": ADMIN.rows = null; loadAdmin(ADMIN.key); break;
    case "admin-logout": ADMIN.key = ""; ADMIN.rows = null; ADMIN.error = ""; ADMIN.student = null; ssDel("quizhub-admin-key"); OPS = []; LOGIN.role = null; renderAdmin(); break;
    case "admin-csv": downloadCSV(); break;
    case "use-shared": useShared(); break;
    case "save": saveChanges(); break;
    case "discard":
      if (discardArmed) {
        discardArmed = false; OPS = []; saveDraft();
        if (route.chapter && !findChapter(DATA, route.chapter)) goHome(); else renderAll();
        setBarMsg("Changes discarded.");
      } else {
        discardArmed = true; renderSavebar();
        document.getElementById("discard")?.focus();
        setTimeout(() => { if (discardArmed) { discardArmed = false; renderSavebar(); } }, 4000);
      }
      break;
  }
}

function onKey(e) {
  if (!route.chapter || route.view !== "quiz" || !CH || !S || S.phase !== "quiz" || e.altKey || e.ctrlKey || e.metaKey) return;
  const tg = e.target;
  if (tg && tg.closest && (tg.closest("input, textarea, select") || tg.isContentEditable)) return;
  const id = S.order[S.idx];
  if (S.answers[id] === undefined) {
    const key = e.key.toLowerCase();
    let k = "abcd".indexOf(key);
    if (k < 0) k = "1234".indexOf(key);
    if (k < 0 && byId.get(id).tf) k = "tf".indexOf(key);
    if (k >= 0 && k < S.opts[id].length) { e.preventDefault(); choose(k); }
  } else if ((e.key === "Enter" || e.key === "ArrowRight") && !(tg instanceof HTMLButtonElement)) {
    e.preventDefault(); next();
  }
}

/* ---------- Student tracking ---------- */
const ssGet = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} };
const ssDel = k => { try { sessionStorage.removeItem(k); } catch (e) {} };
let VID = lsGet("quizhub-visitor-id");
if (!VID) { VID = "v-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); lsSet("quizhub-visitor-id", VID); }
let adminMode = false;

function chapterInfo() {
  const f = route.chapter ? chapterRef(route.chapter) : null;
  return f ? { course: f.course.name, chapterId: f.chapter.id, chapter: (f.chapter.label ? f.chapter.label + ": " : "") + f.chapter.name } : {};
}
// Send one activity event to the tracking sheet. Fire-and-forget: the quiz never waits for it.
// The admin's own activity is not tracked.
function track(type, extra) {
  if (!TRACK_URL || !IDENT || isAdmin()) return;
  const ev = Object.assign({ action: "log", token: IDENT.token, vid: VID, type, device: phoneMQ.matches ? "phone" : "computer" }, extra || {});
  try {
    fetch(TRACK_URL, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(ev) }).catch(() => {});
  } catch (e) {}
}
function trackVisit() {
  if (!IDENT || isAdmin() || ssGet("quizhub-visit")) return;
  ssSet("quizhub-visit", "1");
  track("visit");
}

/* ---------- Study time: counts while the page is open and in use ---------- */
const IDLE_MS = 5 * 60 * 1000;   // stop counting after 5 minutes without a tap, click, key or scroll
let lastInput = Date.now(), unsentMs = 0;
["pointerdown", "keydown", "scroll", "touchstart", "input"].forEach(t => window.addEventListener(t, () => { lastInput = Date.now(); }, { passive: true, capture: true }));
function tick() {
  if (document.visibilityState !== "visible" || Date.now() - lastInput > IDLE_MS || adminMode || !me() || isAdmin()) return;
  unsentMs += 1000;
  if (route.chapter && CH) {
    if (route.view === "quiz" && S && S.phase === "quiz") {
      S.ms = (S.ms || 0) + 1000;
      if (S.answers[S.order[S.idx]] === undefined) S.qms = (S.qms || 0) + 1000;
      const el = document.getElementById("q-timer");
      if (el) el.textContent = fmtDur(S.ms / 1000);
    } else if (route.view === "written" && W && W.phase === "write") {
      W.ms = (W.ms || 0) + 1000;
      const el = document.getElementById("w-timer");
      if (el) el.textContent = fmtDur(W.ms / 1000);
    }
  }
  if (unsentMs >= IDLE_MS) flushTime();
}
// Report study time in chunks: when the page is hidden or closed, and every 5 minutes.
function flushTime() {
  if (unsentMs < 1000) return;
  track("time", { secs: Math.round(unsentMs / 1000) });
  unsentMs = 0;
}

/* ---------- Sign in: students and teachers use their own account, the admin uses the owner password ---------- */
const ACCOUNT_KEY = "quizhub-account-v1";
const ROLE_LABEL = { student: "Student", teacher: "Teacher", admin: "Admin" };
const tidyName = v => String(v || "").replace(/\s+/g, " ").trim();
// "" when the username is fine, otherwise what to fix. Letters from any alphabet, with spaces, hyphens, apostrophes and dots between.
function nameProblem(v) {
  const n = tidyName(v);
  if (!n) return "Write your username.";
  if (/\d/.test(n)) return "Usernames can't contain numbers.";
  if (!/^[\p{L}\p{M}]+(?:[ '’.-]+[\p{L}\p{M}]+)*\.?$/u.test(n)) return "Use letters only.";
  if (n.replace(/[^\p{L}]/gu, "").length < 2) return "Use at least 2 letters.";
  if (n.length > 40) return "Keep it under 40 characters.";
  return "";
}
let IDENT = (() => {

// Talk to the Google Apps Script server. Google sometimes drops or delays an answer,

async function adminPost(body, tries = 3) {

    const ctl = typeof AbortController === "function" ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), 25000) : 0;
    try {
      const res = await fetch(TRACK_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined });
      const d = await res.json();
      if (d && d.error === "retry") { last = new Error("retry"); continue; }
      return d;
    } catch (err) {
      last = err;
    } finally {

    }

}

    if (!data || !data.ok) throw new Error((data && data.error) || "error");

    ADMIN.key = key; ssSet("quizhub-admin-key", key);

  } catch (err) {

const avgOf = a => (a.length ? Math.round(a.reduce((s, x) => s + x, 0) / a.length) : null);
const pctText = v => (v == null ? "–" : v + "%");
// Student and teacher accounts. Only the admin can change a password.

async function setUserPassword() {
  const u = (ADMIN.users || []).find(x => x.key === ADMIN.pwFor);
  if (!u) return;
  const pw = document.getElementById("pw-new")?.value || "";
  if (pw.length < 6) { ADMIN.pwMsg = ""; ADMIN.pwErr = "Use at least 6 characters."; renderAdmin(); document.getElementById("pw-new")?.focus(); return; }
  ADMIN.pwBusy = true; ADMIN.pwErr = ""; ADMIN.pwMsg = "";
  renderAdmin();
  try {
    const d = await adminPost({ action: "setPassword", key: ADMIN.key, user: u.key, password: pw });
    if (!d || !d.ok) throw new Error((d && d.error) || "error");
    ADMIN.pwFor = "";
    ADMIN.pwMsg = `Password changed for ${u.name}. Tell them the new password. Their old sign-ins have ended.`;
  } catch (err) {
    ADMIN.pwErr = err && err.message === "wrong password" ? "Your admin sign-in has ended. Sign out and sign in again." : "Couldn't change the password. Try again.";
  }
  ADMIN.pwBusy = false;
  renderAdmin();
  document.getElementById("accounts")?.scrollIntoView({ block: "nearest" });
}
const kpiHTML = (v, label) => `<div class="kpi"><b>${esc(v)}</b><span>${esc(label)}</span></div>`;
function describeEvent(r) {
  const where = [r.course, r.chapter].filter(Boolean).join(" · ");
  const took = r.secs != null ? " in " + fmtDur(r.secs) : "";
  if (r.type === "visit") return "Visited the site";
  if (r.type === "set_name") return "Entered their name";
  if (r.type === "login") return `Signed in as ${r.role === "teacher" ? "a teacher" : "a student"}`;
  if (r.type === "time") return "Studied for " + fmtDur(r.secs);
  if (r.type === "open_chapter") return "Opened " + where;
  if (r.type === "quiz_finish") return `Finished the quiz in ${where}: ${pctText(r.pct)} (${r.got}/${r.total})${took}`;
  if (r.type === "written_finish") return `Finished written practice in ${where}: ${pctText(r.pct)} (${r.got}/${r.total})${took}`;
  if (r.type === "answer") return `Answered a question in ${where}: ${r.correct ? "correct" : "wrong"}${took}`;
  return r.type;
}
function downloadCSV() {
  if (!ADMIN.rows) return;
  const cell = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const head = ["time", "visitor", "name", "role", "action", "course", "chapter", "question", "correct", "score %", "got", "total", "round", "seconds", "minutes and seconds", "device"];
  const lines = [head.map(cell).join(",")].concat(ADMIN.rows.map(r => [
    isNaN(r.t) ? "" : r.t.toISOString(), r.vid, r.name, r.role, r.type, r.course, r.chapter, r.qid,
    r.correct == null ? "" : r.correct ? 1 : 0, r.pct, r.got, r.total, r.round, r.secs, r.secs == null ? "" : fmtDur(r.secs), r.device
  ].map(cell).join(",")));
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "student-activity-" + dayKey(new Date()) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function renderDashboard() {
  const all = ADMIN.rows;
  const vidName = {};

  const nameOf = r => r.name || vidName[r.vid] || "";
  const personKey = r => (nameOf(r) ? "n:" + r.role + ":" + nameOf(r).toLowerCase() : "v:" + r.vid);
  const inCourse = r => ADMIN.filter === "all" || r.course === ADMIN.filter;
  const general = r => r.type === "visit" || r.type === "set_name" || r.type === "login" || r.type === "time";
  const rows = all.filter(r => ADMIN.role === "all" || r.role === ADMIN.role);
  const avgTime = a => (a.length ? fmtDur(a.reduce((x, y) => x + y, 0) / a.length) : "–");

  const finishes = rows.filter(r => r.type === "quiz_finish" && r.pct != null && inCourse(r));
  const studySecs = rows.filter(r => r.type === "time" && r.secs != null).reduce((x, r) => x + r.secs, 0);
  const now = new Date(), today = dayKey(now);
  const people = new Map();
  rows.forEach(r => {
    const k = personKey(r);
    let p = people.get(k);
    if (!p) { p = { key: k, name: nameOf(r) || "Visitor without a name", role: r.role, first: r.t, last: r.t, devices: new Set(), visits: 0, secs: 0, chapters: new Set(), quiz: [], quizSecs: [], written: [] }; people.set(k, p); }
    if (nameOf(r)) p.name = nameOf(r);
    if (r.t > p.last) p.last = r.t;
    if (r.device) p.devices.add(r.device);
    if (r.type === "visit") p.visits++;
    if (r.type === "time" && r.secs != null) p.secs += r.secs;
    if (general(r) || !inCourse(r)) return;
    if (r.type === "open_chapter" && r.chId) p.chapters.add(r.chId);
    if (r.type === "quiz_finish" && r.pct != null) { p.quiz.push(r.pct); if (r.secs != null) p.quizSecs.push(r.secs); }
    if (r.type === "written_finish" && r.pct != null) p.written.push(r.pct);
  });
  const peopleList = [...people.values()].sort((a, b) => b.last - a.last);
  const countRole = role => peopleList.filter(p => p.key.startsWith("n:" + role + ":")).length;

  const days = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(now); d.setDate(d.getDate() - i); days.push(dayKey(d)); }
  const perDay = days.map(k => new Set(rows.filter(r => dayKey(r.t) === k).map(r => r.vid)).size);
  const maxDay = Math.max(1, ...perDay);

  const chMap = new Map();
  rows.filter(r => r.chId && !general(r) && inCourse(r)).forEach(r => {
    let c = chMap.get(r.chId);
    if (!c) { c = { course: r.course, chapter: r.chapter, opens: 0, people: new Set(), quiz: [], quizSecs: [], written: [] }; chMap.set(r.chId, c); }
    if (r.type === "open_chapter") { c.opens++; c.people.add(personKey(r)); }
    if (r.type === "quiz_finish" && r.pct != null) { c.quiz.push(r.pct); if (r.secs != null) c.quizSecs.push(r.secs); }
    if (r.type === "written_finish" && r.pct != null) c.written.push(r.pct);
  });
  const chList = [...chMap.values()].sort((a, b) => (a.course + a.chapter).localeCompare(b.course + b.chapter, undefined, { numeric: true }));

  const qText = {};
  DATA.courses.forEach(c => c.chapters.forEach(ch => ch.questions.forEach(q => { qText[q.id] = q.q; })));
  const qMap = new Map();
  rows.filter(r => r.type === "answer" && r.qid && inCourse(r)).forEach(r => {
    let q = qMap.get(r.qid);
    if (!q) { q = { id: r.qid, n: 0, right: 0, secs: [], where: [r.course, r.chapter].filter(Boolean).join(" · ") }; qMap.set(r.qid, q); }

  const hard = [...qMap.values()].filter(q => q.n >= 3).map(q => Object.assign(q, { rate: Math.round(q.right / q.n * 100) }))
    .sort((a, b) => a.rate - b.rate || b.n - a.n).slice(0, 10);

  const showInFeed = r => r.type !== "answer" && r.type !== "time" && (general(r) || inCourse(r));
  const feed = rows.filter(showInFeed).slice(-40).reverse();

  let detail = "";

          <tbody>${[...best].map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.best}%</td><td>${v.tries}</td><td>${v.fastest == null ? "–" : fmtDur(v.fastest)}</td><td>${v.last == null ? "–" : fmtDur(v.last)}</td></tr>`).join("")}</tbody>

        <div class="table-wrap"><table class="admin-table">
          <thead><tr><th>When</th><th>Action</th></tr></thead>
          <tbody>${evs.map(r => `<tr><td class="nowrap">${esc(fmtTime(r.t))}</td><td>${esc(describeEvent(r))}</td></tr>`).join("")}</tbody>
        </table></div>
      </article>`;
  }

  const courseOpts = `<option value="all">All courses</option>` +
    DATA.courses.map(c => `<option value="${esc(c.name)}"${ADMIN.filter === c.name ? " selected" : ""}>${esc(c.name)}</option>`).join("");

  const avgAll = avgOf(finishes.map(r => r.pct));

  app.innerHTML = `

      ${kpiHTML((ADMIN.users || []).length, "Accounts")}

      ${kpiHTML(new Set(rows.filter(r => dayKey(r.t) === today).map(r => r.vid)).size, "Visitors today")}
      ${kpiHTML(countRole("student"), "Students")}
      ${kpiHTML(countRole("teacher"), "Teachers")}
      ${kpiHTML(finishes.length, "Quizzes finished")}
      ${kpiHTML(avgAll == null ? "–" : avgAll + "%", "Average quiz score")}
      ${kpiHTML(fmtDur(studySecs), "Total study time")}
      ${kpiHTML(avgTime(finishes.filter(r => r.secs != null).map(r => r.secs)), "Average quiz time")}
    </div>
    ${detail}
    <article class="card">
      <div class="q-head"><div class="meta"><span class="topic">Visitors</span><span>Last 14 days</span></div><h2>Visitors per day</h2></div>
      <div class="bars" role="img" aria-label="Unique visitors per day for the last 14 days">
        ${perDay.map((v, i) => `<div class="col" title="${days[i]}: ${v} ${v === 1 ? "visitor" : "visitors"}"><span class="n">${v || ""}</span><span class="b" style="height:${v / maxDay * 85}%"></span></div>`).join("")}
      </div>
      <div class="bars-x" aria-hidden="true">${days.map(k => `<span>${k.slice(8)}/${k.slice(5, 7)}</span>`).join("")}</div>
    </article>
    <article class="card">

function init() {
  root = document.getElementById("root");
  root.innerHTML = `
    <div id="top" class="top"></div>
    <main id="app"></main>
    <div id="dock" class="dock" hidden>
      <div id="nextbar" class="nextbar" hidden></div>
      <div id="savebar" class="savebar" hidden></div>
    </div>`;
  topEl = document.getElementById("top");
  app = document.getElementById("app");

  root.addEventListener("click", onClick);
  root.addEventListener("submit", e => {
    if (e.target.id === "addform") { e.preventDefault(); onAdd(); }
    else if (e.target.id === "addch") { e.preventDefault(); onAddChapter(); }
    else if (e.target.id === "admin-login") { e.preventDefault(); const pw = document.getElementById("admin-pw").value; if (pw) loadAdmin(pw); }
    else if (e.target.id === "signin-form" || e.target.id === "signup-form") { e.preventDefault(); accountSubmit(e.target.id === "signup-form"); }
    else if (e.target.id === "pw-form") { e.preventDefault(); setUserPassword(); }
    else if (e.target.id === "login-admin") { e.preventDefault(); adminSignIn(document.getElementById("login-pw").value); }
    else if (e.target.id === "chat-form") { e.preventDefault(); sendChat(document.getElementById("chat-text").value, "text"); }
  });
  root.addEventListener("keydown", e => {
    // Enter sends a chat message on computers; Shift+Enter starts a new line.
    if (e.target.id === "chat-text" && e.key === "Enter" && !e.shiftKey && !e.isComposing && !phoneMQ.matches) {
      e.preventDefault(); sendChat(e.target.value, "text");
    }
  });
  root.addEventListener("change", e => {
    if (e.target.id === "admin-course") { ADMIN.filter = e.target.value; renderAdmin(); return; }
    if (e.target.id === "admin-role") { ADMIN.role = e.target.value; ADMIN.student = null; renderAdmin(); return; }
    if (e.target.name !== "f-type") return;
    const type = (app.querySelector('input[name="f-type"]:checked') || {}).value || "mc";
    app.querySelectorAll(".mc-only").forEach(el => { el.hidden = type !== "mc"; });
    app.querySelectorAll(".tf-only").forEach(el => { el.hidden = type !== "tf"; });
    app.querySelectorAll(".wr-only").forEach(el => { el.hidden = type !== "wr"; });
  });
  root.addEventListener("input", e => {
    if (e.target.id === "q-search") { filterText = e.target.value; updateList(); }
    else if (e.target.id === "chat-text") CHAT.draft = e.target.value;
    else if (e.target.id === "acc-name") {
      // Point out numbers as soon as they are typed.
      const m = document.getElementById("login-msg");
      const bad = /\d/.test(e.target.value);
      if (m && (bad || m.textContent === "Usernames can't contain numbers.")) { m.className = "form-msg" + (bad ? " is-error" : ""); m.textContent = bad ? "Usernames can't contain numbers." : ""; }
    }
    else if (e.target.id === "w-note" && W) { W.notes[W.order[W.idx]] = e.target.value; saveProgress(); }
  });
  document.addEventListener("keydown", onKey);
  if (phoneMQ.addEventListener) phoneMQ.addEventListener("change", renderSavebar);
  window.addEventListener("resize", setDockVar);
  if (window.ResizeObserver) new ResizeObserver(setDockVar).observe(document.getElementById("dock"));

  setRemote(lsJSON(REMOTE_KEY));
  if (!usingLocal) DATA = SHARED;
  loadUserData();
  OPS = canEdit() ? cleanOps(lsJSON(DRAFT_KEY)) : [];
  saveDraft();

  const saved = lsJSON(ROUTE_KEY);
  if (isObj(saved)) route = { course: str(saved.course) || null, chapter: str(saved.chapter) || null, view: saved.view === "manage" && canEdit() ? "manage" : "quiz", tab: saved.tab === "chat" ? "chat" : "chapters" };
  let hash = "";
  try { hash = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (hash) {
    if (chapterRef(hash)) { route.chapter = hash; route.view = "quiz"; }
    else if (findCourse(DATA, hash)) { route.course = hash; route.chapter = null; }
    else if (hash !== "admin") pendingHash = hash;
  }
  if (route.chapter && !chapterRef(route.chapter)) route.chapter = null;
  if (route.chapter) route.course = chapterRef(route.chapter).course.id;
  if (!findCourse(effective(), route.course)) route.course = (effective().courses[0] || {}).id || null;
  if (route.chapter && route.view === "quiz" && !findChapter(DATA, route.chapter)) route.view = "manage";
  bindChapter();
  adminMode = location.hash === "#admin";
  window.addEventListener("hashchange", () => {
    const a = location.hash === "#admin";
    if (a !== adminMode) {
      adminMode = a;
      if (!a && canEdit() && !OPS.length) OPS = cleanOps(lsJSON(DRAFT_KEY));
      if (!a) { loadUserData(); bindChapter(); }
      window.scrollTo(0, 0); renderAll();
    }
  });
  renderAll();
  if (TRACK_URL) refreshContent();
  if (!adminMode) trackVisit();
  verifyAccount();
  setInterval(tick, 1000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { flushTime(); saveProgress(); }
    else if (CHAT.timer) pollChat();
  });
  window.addEventListener("pagehide", () => { flushTime(); saveProgress(); });
}
init();
})();
</script>
