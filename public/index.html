{"id":"f1-11","t":"Logistics","q":"What is the goal of logistics according to the slides?","o":["A target level of customer service at the lowest possible cost","The highest possible service level, whatever the cost","Holding as much inventory as possible to avoid stockouts","Using as few suppliers as possible"],"d":"The goal of logistics is to achieve a target level of customer service at the lowest possible cost."},
{"id":"f1-12","t":"Logistics","q":"Which definition of logistics is credited to Donald Waters (Global Logistics, 2010)?","o":["The function responsible for moving materials through their supply chain","Managing the flow of items, information, cash and ideas by adding place, period and pattern values","The part of SCM that controls forward and reverse flows between origin and consumption","A network of organisations working together to improve material and information flows"],"d":"Donald Waters: logistics is the function responsible for moving materials through their supply chain. The 'place, period and pattern values' definition is from MIT's Center for Transportation & Logistics, and the forward/reverse flow definition is from CLM."},
{"id":"f1-13","t":"Importance of SCM","q":"According to the slides, which firms gain the most from successful SCM?","o":["Firms with large system inventories","Firms that rely on a single supplier","Small firms that hold no inventory","Firms that manage each function separately"],"d":"Firms with large system inventories gain the most from successful SCM. SCM reduces safety stocks and costs through coordinated planning and better information sharing, leading to lower purchasing and carrying costs, better quality, higher service levels, and higher sales and profits."},
{"id":"f1-14","t":"Economic utility","q":"A bakery turns flour, sugar and eggs into cakes its customers can eat. Which economic utility does this create?","o":["Form utility","Place utility","Time utility","Possession utility"],"d":"Form utility: a product is in a form that can be used by the customer and is of value to them. The four types of economic utility are possession, form, time and place."},
{"id":"f1-15","t":"Economic utility","q":"Moving products from points of lesser value to points of greater value creates:","o":["Place utility","Time utility","Form utility","Possession utility"],"d":"Place utility means having products available where customers need them; products are moved from points of lesser value to points of greater value."},
{"id":"f1-16","t":"Economic utility","q":"A retailer makes sure school uniforms arrive in the weeks just before the school year starts, when parents need them. This mainly creates:","o":["Time utility","Form utility","Possession utility","Place utility"],"d":"Time utility means having products available when customers need them. Place utility is about where they are available."},
{"id":"f1-17","t":"Economic utility","tf":true,"ans":false,"q":"The four types of economic utility are possession, form, time and price.","d":"The four types are possession, form, time and place. Price is not one of them."},
{"id":"f1-18","t":"Importance of SCM","tf":true,"ans":false,"q":"Logistics and SCM can be managed as isolated functions because they rarely cross borders.","d":"Logistics and SCM span across the globe and cannot be managed as an isolated function. They connect functions, divisions and business units within and across firms."},
{"id":"f1-19","t":"Evolution of SCM","tf":true,"ans":true,"q":"Historically, purchasing, production, inventory, transportation and sales were often managed separately.","d":"Companies did not always manage these activities in an integrated way. Historically they were often managed separately, which led to the integrated concept now called SCM."},
{"id":"f1-20","t":"Evolution of SCM","tf":true,"ans":true,"q":"Sustainability means meeting the needs of current supply chain members without hindering the ability to meet the needs of future generations.","d":"That is the slides' definition of sustainability, part of today's emphasis on the environmental and social impacts of supply chains."}
]},
{"id":"fin-ch2","label":"Chapter 2","name":"Purchasing and Procurement Management","questions":[
{"id":"f2-01","t":"Purchasing and procurement","q":"Procurement costs often range between what share of an organisation's revenues?","o":["60%–80%","20%–30%","40%–50%","85%–95%"],"d":"Procurement refers to raw materials, component parts and supplies bought from outside organisations to support operations. Procurement costs often range between 60% and 80% of an organisation's revenues."},
{"id":"f2-02","t":"Purchasing and procurement","q":"Which term is described as a relational exchange approach involving a limited number of suppliers?","o":["Supply management","Purchasing","Procurement","E-procurement"],"d":"Supply management is viewed as a relational exchange approach involving a limited number of suppliers. Purchasing is the act of obtaining goods and services in exchange for money or its equivalent."},
{"id":"f2-03","t":"Purchasing process","q":"In manual purchasing, which document becomes a binding contract once the supplier accepts it?","o":["The purchase order (PO)","The purchase requisition","The request for quotation (RFQ)","The material requisition"],"d":"The purchase order is the buyer's offer and becomes a binding contract when the supplier accepts it."},
{"id":"f2-04","t":"Purchasing process","q":"What is the correct order of the three manual purchasing steps?","o":["Purchase requisition → Request for quotation → Purchase order","Request for quotation → Purchase requisition → Purchase order","Purchase order → Request for quotation → Purchase requisition","Purchase requisition → Purchase order → Request for quotation"],"d":"Step 1: material/purchase requisition (product, quantity and due date). Step 2: the buyer identifies suppliers and issues a request for quotation. Step 3: the purchase order."},
{"id":"f2-05","t":"E-procurement","q":"In the e-procurement process, the buyer assigns qualified suppliers to bid when the purchase is over:","o":["$50,000","$5,000","$10,000","$100,000"],"d":"e-Procurement: the user enters a purchase request, the requisition is approved and sent to the buyer, the buyer assigns qualified suppliers to bid if the purchase is over $50,000, then reviews closed bids and selects a supplier."},
{"id":"f2-06","t":"E-procurement","q":"Which of these is NOT listed as an advantage of an e-procurement system?","o":["Higher inventory levels","Time savings","Accuracy","Track ability"],"d":"Advantages of e-procurement: time savings, cost savings, accuracy, real time, mobility, track ability, management, and benefits to the suppliers."},
{"id":"f2-07","t":"Make or buy","q":"A car maker buys the company that supplies its steel. This is:","o":["Backward integration","Forward integration","Outsourcing","Reverse marketing"],"d":"Backward integration means acquiring sources of supply. Forward integration means acquiring a customer's operations."},
{"id":"f2-08","t":"Make or buy","q":"A manufacturer buys the retail chain that sells its products. This is:","o":["Forward integration","Backward integration","Outsourcing","Global sourcing"],"d":"Forward integration refers to acquiring a customer's operations. Backward integration refers to acquiring sources of supply."},
{"id":"f2-09","t":"Make or buy","q":"Which of these is a reason for MAKING an item in-house rather than buying it?","o":["Protecting proprietary (exclusive) technology","The firm is at or near capacity","The firm lacks the necessary expertise","The item is a non-vital component a supplier makes more cheaply"],"d":"Reasons for making: protect proprietary technology, no competent supplier, better quality control, use existing idle capacity, control of logistics, lower cost. Insufficient capacity, lack of expertise and cost advantage are reasons for buying."},
{"id":"f2-10","t":"Make or buy","q":"A restaurant buys ready-made desserts because its kitchen is already working at full capacity. Which reason for buying is this?","o":["Insufficient capacity","Lack of expertise","Quality","Cost advantage"],"d":"Reasons for buying or outsourcing: cost advantage, insufficient capacity (the firm may be at or near capacity), lack of expertise, and quality."},
{"id":"f2-11","t":"Supplier selection","q":"Which of these is a reason favouring MORE than one supplier?","o":["Spreading the risk of supply interruption","Less quality variability","Transportation economies","The volume is too small to split"],"d":"Reasons for more than one supplier: need capacity, spread the risk of supply interruption, create competition, information, and dealing with special kinds of business. The other options are reasons favouring a single supplier."},
{"id":"f2-12","t":"Supplier selection","q":"Which of these is NOT listed as a supplier selection criterion?","o":["The size of the supplier's advertising budget","Willingness to share technologies and information","Order system and cycle time","Communication capability"],"d":"Supplier selection should use multiple criteria: product and process technologies, willingness to share technologies and information, quality, cost, reliability, order system and cycle time, capacity, communication capability, location and service."},
{"id":"f2-13","t":"Purchasing organisation","q":"Which of these is an advantage of DECENTRALISED purchasing?","o":["Closer knowledge of requirements","Concentrated (leveraged) purchase volume","Avoiding duplication","Lower transportation costs"],"d":"Decentralisation advantages: closer knowledge of requirements, local sourcing, less bureaucracy. Concentrated volume, avoiding duplication, specialisation, lower transport costs, no competition within units and a common supply base are advantages of centralisation."},
{"id":"f2-14","t":"Purchasing organisation","q":"How do the slides describe a hybrid purchasing organisation?","o":["Decentralised at the corporate level and centralised at the business unit level","Centralised at the corporate level and decentralised at the business unit level","Fully outsourced to a third-party provider","Run entirely through import brokers"],"d":"The slides describe a hybrid purchasing organisation as both decentralised at the corporate level and centralised at the business unit level."},
{"id":"f2-15","t":"Global sourcing","q":"Which intermediary in international purchasing buys and takes title to the goods?","o":["Import merchant","Import broker or sales agent","Trading company","Supplier development agent"],"d":"Import broker or sales agent: performs a service for a fee. Import merchant: buys and takes title to the goods. Trading company: imports and carries a wide variety of goods."},
{"id":"f2-16","t":"Supplier development","q":"Supplier development (reverse marketing) means:","o":["The purchaser takes the initiative, contacting suppliers and setting prices, terms and conditions","The supplier markets its products aggressively to the purchaser","The purchaser outsources all purchasing to a trading company","The purchaser and supplier merge through backward integration"],"d":"Reverse marketing is aggressive procurement involvement not typically part of supplier selection, such as the purchaser initiating contact with the supplier and establishing prices, terms and conditions."},
{"id":"f2-17","t":"Supplier selection","tf":true,"ans":true,"q":"The slides describe single sourcing as a risky proposition.","d":"Single sourcing is a risky proposition. Although trends favour fewer sources, the slides advise avoiding a single source."},
{"id":"f2-18","t":"Purchasing and procurement","tf":true,"ans":false,"q":"'Procurement' and 'purchasing' are never treated as the same thing.","d":"'Procurement' and 'purchasing' are sometimes viewed as synonymous terms."},
{"id":"f2-19","t":"Make or buy","tf":true,"ans":false,"q":"Outsourcing means buying materials and components from suppliers instead of making them in-house, and the trend has moved away from outsourcing.","d":"Outsourcing is buying materials and components from suppliers instead of making them in-house, and the trend has moved toward outsourcing. The make-or-buy decision is strategic."},
{"id":"f2-20","t":"Global sourcing","tf":true,"ans":true,"q":"Global sourcing requires additional skills and knowledge to deal with international suppliers, logistics, communication and the political environment.","d":"Global sourcing offers an opportunity to improve quality, cost and delivery performance, but requires additional skills and knowledge to deal with international suppliers, logistics, communication, the political environment and other issues."}
]},
{"id":"fin-ch3","label":"Chapter 3","name":"Demand and Inventory Management","questions":[
{"id":"f3-01","t":"Forecasting basics","q":"Which forecast use is a LONG-range plan?","o":["Facility location","Workforce levels","Purchasing","Budgeting"],"d":"Planning the system uses long-range plans: types of products and services, facility and equipment levels, and facility location. Planning the use of the system uses short- and medium-range plans: inventory, workforce levels, purchasing and budgeting."},
{"id":"f3-02","t":"Forecasting basics","q":"Which statement is a common feature of forecasts?","o":["Accuracy decreases as the time horizon increases","They are more accurate for individual items than for groups","They are perfect if enough data is used","They assume the future is unrelated to the past"],"d":"Common features: forecasts assume a causal system (past → future), are rarely perfect because of randomness, are more accurate for groups than individuals, and become less accurate as the time horizon increases."},
{"id":"f3-03","t":"Forecasting basics","q":"What is Step 2 of the forecasting process?","o":["Establish a time horizon","Determine the purpose of the forecast","Select a forecasting technique","Gather and analyse data"],"d":"The six steps: 1 determine the purpose, 2 establish a time horizon, 3 select a technique, 4 gather and analyse data, 5 make the forecast, 6 monitor the forecast."},
{"id":"f3-04","t":"Forecasting basics","q":"Which type of forecast uses explanatory variables to predict the future?","o":["Associative models","Time series","Judgmental forecasts","Naïve forecasts"],"d":"Judgmental forecasts use subjective inputs (qualitative). Time series use historical data assuming the future will be like the past (quantitative). Associative models use explanatory variables to predict the future."},
{"id":"f3-05","t":"Qualitative forecasting","q":"Which method surveys internal and external experts over several rounds, sending them a summary of responses each round?","o":["Delphi method","Jury of executive opinion","Sales force composite","Consumer survey"],"d":"Delphi method: experts are surveyed during several rounds; a summary of responses is sent to all experts, who can modify their answers in the next round. It suits high-risk technology forecasting, large expensive projects and major new product introductions."},
{"id":"f3-06","t":"Qualitative forecasting","q":"Which judgmental method has a tendency to UNDER-forecast?","o":["Sales force composite","Delphi method","Jury of executive opinion","Consumer survey"],"d":"Sales force composite is based on the sales force's knowledge of the market and estimates of customer needs, and it tends to under-forecast."},
{"id":"f3-07","t":"Qualitative forecasting","q":"Jury of executive opinion is described as good for:","o":["Long-range planning and new product introductions","High-risk technology forecasting and large, expensive projects","Short-term inventory control","Measuring forecast error"],"d":"Jury of executive opinion: senior executives collectively develop the forecast; good for long-range planning and new product introductions. The Delphi method is the one suited to high-risk technology and large, expensive projects."},
{"id":"f3-08","t":"Time series","q":"Wave-like variations in data lasting more than one year are called:","o":["Cycles","Seasonality","Trend","Irregular variations"],"d":"Time series components: trend (long-term movement), seasonality (short-term regular variations), irregular variations (unusual circumstances), random variations (chance), and cycles (wave-like variations lasting more than one year)."},
{"id":"f3-09","t":"Time series","q":"Sales drop sharply for two weeks because of a one-off strike at the port. In time series terms this is:","o":["An irregular variation","A random variation","Seasonality","A trend"],"d":"Irregular variations are caused by unusual circumstances, such as a strike. Random variations are caused by chance."},
{"id":"f3-10","t":"Forecast accuracy","q":"How is the forecast error for period t calculated?","o":["Actual demand minus the forecast (At − Ft)","The forecast minus actual demand (Ft − At)","The forecast divided by actual demand","Actual demand plus the forecast"],"d":"Forecast error is the difference between the actual quantity and the forecast: et = At − Ft."},
{"id":"f3-11","t":"Forecast accuracy","q":"Actual demand in a period is 120 units and the forecast was 100 units. What is the forecast error?","o":["+20 units","−20 units","220 units","0.2 units"],"d":"et = At − Ft = 120 − 100 = +20 units."},
{"id":"f3-12","t":"Forecast accuracy","q":"Which accuracy measure is analogous to variance and heavily penalises large forecast errors?","o":["Mean squared error (MSE)","Mean absolute deviation (MAD)","Mean absolute percentage error (MAPE)","Naïve forecast"],"d":"A MAD of 0 means the forecast exactly predicted demand. MAPE gives perspective on the true magnitude of the error. MSE is analogous to variance, and large errors are heavily penalised."},
{"id":"f3-13","t":"Inventory costs","q":"The costs of preparing and processing purchase orders and of receiving and inspecting items are:","o":["Acquisition costs","Carrying costs","Stockout costs","Shortage costs"],"d":"Acquisition costs arise during PO preparation and processing and during receiving and inspection. Carrying costs come from keeping stock in storage. Stockout (shortage) costs occur when an item is out of stock."},
{"id":"f3-14","t":"EOQ","q":"Using the slides' EOQ example (annual demand 2,000 units, order quantity 1,000 units, holding cost 2 per unit, ordering cost 3), what is the total annual cost?","o":["1,006","1,000","2,006","6"],"d":"Total annual cost = annual ordering cost + annual holding cost = (2,000 ÷ 1,000) × 3 + (1,000 ÷ 2) × 2 = 6 + 1,000 = 1,006."},
{"id":"f3-15","t":"ABC classification","q":"In ABC classification, A items are typically:","o":["About 20% of the items, accounting for about 80% of inventory value","About 50% of the items, accounting for about 5% of inventory value","About 30% of the items, accounting for about 15% of inventory value","About 80% of the items, accounting for about 20% of inventory value"],"d":"A items: about 20% of items and 80% of value (use the Q system). B items: an additional 30% of items and 15% of value (Q or P). C items: the remaining 50% of items and only 5% of value (P system)."},
{"id":"f3-16","t":"ABC classification","q":"Which review system do the slides recommend for C items?","o":["P system","Q system","Either Q or P","No review is needed"],"d":"A items use the Q system, B items use Q or P, and C items use the P system."},
{"id":"f3-17","t":"Forecasting basics","tf":true,"ans":true,"q":"Forecasts are more accurate for groups of items than for individual items.","d":"One of the common features of forecasts: they are more accurate for groups than for individuals."},
{"id":"f3-18","t":"Inventory costs","tf":true,"ans":false,"q":"Carrying costs are incurred when an item is out of stock.","d":"Carrying costs are incurred in maintaining a stock of goods in storage. Costs incurred when an item is out of stock are stockout (shortage) costs."},
{"id":"f3-19","t":"Forecasting basics","tf":true,"ans":false,"q":"Cloud-based forecasting is usually bought outright as a one-time purchase.","d":"Cloud-based forecasting is supplier-hosted or software-as-a-service (SaaS), provided on a subscription basis."},
{"id":"f3-20","t":"Time series","tf":true,"ans":true,"q":"Time series forecasts use historical data, assuming the future will be like the past.","d":"Time series forecasts are quantitative: they use historical data assuming the future will be like the past."}
]},
{"id":"fin-ch4","label":"Chapter 4","name":"Aggregate Planning","questions":[
{"id":"f4-01","t":"Matching supply and demand","q":"A car factory needs four tyres for every car it plans to build. In this factory, the demand for tyres is:","o":["Dependent demand","Independent demand","Seasonal demand","Final-product demand"],"d":"Dependent demand is the internal demand for parts based on the demand for the final product they are used in, e.g. subassemblies, components and raw materials. Independent demand is the demand for final products."},
{"id":"f4-02","t":"Matching supply and demand","q":"Independent demand is best described as:","o":["Demand for final products, affected by trends, seasonal patterns and market conditions","Internal demand for parts based on the final product","Demand for raw materials only","Demand that never changes over time"],"d":"Independent demand is the demand for final products and has a pattern affected by trends, seasonal patterns and general market conditions."},
{"id":"f4-03","t":"Operations planning","q":"Which planning level involves building facilities and buying major equipment?","o":["Long-range: the aggregate production plan (APP)","Intermediate: the master production schedule (MPS)","Short-range: material requirements planning (MRP)","Distribution requirement planning (DRP)"],"d":"Operations planning is hierarchical. Long-range: APP (facilities and major equipment). Intermediate: MPS (quantity and timing of end items). Short-range: MRP (components and parts to support the MPS)."},
{"id":"f4-04","t":"Operations planning","q":"Which planning range does the master production schedule (MPS) belong to?","o":["Intermediate","Long-range","Short-range","It is not part of operations planning"],"d":"Intermediate planning shows the quantity and timing of end items, i.e. the master production schedule."},
{"id":"f4-05","t":"MPS and BOM","q":"Which statement about the MPS planning horizon is correct?","o":["It is shorter than the APP's, but longer than the lead time to produce the item","It is longer than the APP's","It is shorter than the lead time to produce the item","It is always exactly one year"],"d":"The MPS is a detailed disaggregation of the APP. It is more detailed than the APP, easier to plan under stable demand, and its planning horizon is shorter than the APP's but longer than the production lead time."},
{"id":"f4-06","t":"MPS and BOM","q":"In a service business, the master production schedule may simply be:","o":["The appointment log or book","The bill of materials","The purchase order file","The ERP database"],"d":"For the service industry, the MPS may just be the appointment log or book, which balances capacity (such as skilled labour) with demand."},
{"id":"f4-07","t":"Operations planning","q":"Which system adds the business and sales plans to a closed-loop MRP system?","o":["Manufacturing resource planning (MRP-II)","Distribution requirement planning (DRP)","Collaborative planning, forecasting and replenishment (CPFR)","Legacy MRP"],"d":"Closed-loop MRP incorporates the APP, MPS, material requirements plan and capacity requirements plan. MRP-II incorporates the business and sales plans with the closed-loop MRP system."},
{"id":"f4-08","t":"Operations planning","q":"Distribution requirement planning (DRP) describes:","o":["Time-phased net requirements from warehouses and distribution centres","The parent-component relationships of a product","The long-range plan for facilities and equipment","The appointment schedule of a service firm"],"d":"DRP describes the time-phased net requirements from warehouses and distribution centres: customer demand minus any on-hand and in-transit inventories."},
{"id":"f4-09","t":"MPS and BOM","q":"Which bill of materials lets a firm forecast total demand for end products, and is also called a planning, pseudo, phantom or family BOM?","o":["Super bill of materials","Multilevel bill of materials","Indented bill of materials","Single-level bill of materials"],"d":"A super bill of materials (planning BOM, pseudo BOM, phantom BOM or family BOM) enables the firm to forecast the total demand for end products."},
{"id":"f4-10","t":"MPS and BOM","q":"In an indented (multilevel) bill of materials, what happens at each level of indentation?","o":["The level number increases by one","The level number decreases by one","The planning factor doubles","A new end item begins"],"d":"A multilevel BOM shows parent-component relationships and the units of components (the planning factor). It can be shown as an indented BOM, where the level number increases by one at each level of indentation."},
{"id":"f4-11","t":"MRP","q":"Which of these is NOT an input that MRP requires?","o":["Planned order releases","Independent demand information","Parent-component relationships from the bill of materials","Inventory status of the final product and all components"],"d":"MRP requires independent demand information, parent-component relationships from the BOM, and the inventory status of the final product and components. Planned order releases are the OUTPUT of the MRP system."},
{"id":"f4-12","t":"MRP","q":"Which is a disadvantage of MRP?","o":["It ignores capacity and shop floor conditions","It provides no planning information","It forces firms to change their business model to fit the software","It costs about $15 million to own"],"d":"MRP's advantage is that it provides planning information. Its disadvantages: loss of visibility (especially with a deep BOM), and it ignores capacity and shop floor conditions. Changing the business model and the $15 million cost are ERP disadvantages."},
{"id":"f4-13","t":"ERP","q":"Why were ERP systems developed to replace legacy MRP systems?","o":["Firms built multiplant international sites, and MRP could not handle subcontractors, currencies and languages","MRP systems were too cheap to be reliable","Firms stopped using bills of materials","Governments banned MRP systems"],"d":"By the end of the 20th century firms were building multiplant international sites and dealing with international subcontractors, currencies and languages. Existing MRP systems could not handle these tasks, so ERP was developed."},
{"id":"f4-14","t":"ERP","q":"How does ERP handle information?","o":["Entered once at the source and shared with all users through a centralised database","Entered separately by each department in its own system","Kept only on paper records","Shared only with suppliers, not employees"],"d":"ERP uses a centralised, shared database to tie the whole organisation together: information is entered once at the source and made available to all users."},
{"id":"f4-15","t":"ERP","q":"Which of these is a DISADVANTAGE of ERP?","o":["The firm must change its business processes to fit the ERP's built-in business model","It uses a single database and common software","It helps reduce the bullwhip effect","It tracks employees' time and performance"],"d":"ERP disadvantages: substantial capital investment (average total cost of ownership about $15 million), and software built around a specific business model, so the adopting firm must change its processes to fit it."},
{"id":"f4-16","t":"CPFR","q":"CPFR is a method of cooperation between suppliers and customers mainly to:","o":["Align forecasts, production and orders more accurately to reduce inventory","Replace the bill of materials","Choose a single supplier for every item","Track employees' working hours"],"d":"Collaborative Planning, Forecasting and Replenishment (CPFR) is a method of cooperation between suppliers and customers to align forecasts, production and orders more accurately to reduce the amount of inventory."},
{"id":"f4-17","t":"MRP","tf":true,"ans":false,"q":"Legacy MRP systems offer strong visibility across functional areas and good analytical capabilities.","d":"Legacy MRP systems (1960s–1980s) lasted beyond their intended life span, had limited communication between systems, restricted visibility across functional areas, and lacked analytical capabilities."},
{"id":"f4-18","t":"ERP","tf":true,"ans":true,"q":"PeopleSoft's first product, made in 1988, was a human resources application.","d":"PeopleSoft focused on client/server business applications; its first product in 1988 was an HR application, and it became a leader in the HR applications market."},
{"id":"f4-19","t":"ERP","tf":true,"ans":true,"q":"Oracle's strategy focuses on five principles: globalization, simplification, standardization, automation and innovation.","d":"Oracle, the world's leading supplier of information management software, bases its strategy on globalization, simplification, standardization, automation and innovation."},
{"id":"f4-20","t":"MPS and BOM","tf":true,"ans":false,"q":"The MPS is easier to plan when demand is unstable.","d":"The MPS is more detailed than the APP and easier to plan under stable demand."}
]},
{"id":"fin-ch5","label":"Chapter 5","name":"Warehousing","questions":[
{"id":"f5-01","t":"Role of warehousing","q":"Why has warehousing been called 'transportation at zero miles per hour'?","o":["Warehousing and transportation are substitutes for each other","Warehouses are always located next to highways","Products in a warehouse are always moving","Warehouses charge by the mile"],"d":"Warehousing stores products at and between points of origin and consumption. Warehousing and transportation are substitutes for each other, so warehousing has been called 'transportation at zero miles per hour'."},
{"id":"f5-02","t":"Role of warehousing","q":"What is the key reason for warehousing?","o":["Patterns of production and consumption do not coincide","Transportation is always more expensive than storage","Customers prefer to collect goods from warehouses","Governments require goods to be stored before sale"],"d":"The key reason for warehousing is that patterns of production and consumption do not coincide. Warehousing matches different rates or volumes of flow."},
{"id":"f5-03","t":"Regrouping","q":"A wholesaler receives full pallets of rice and splits them into smaller cartons for small shops. Which regrouping function is this?","o":["Allocating (bulk breaking)","Accumulating (bulk making)","Assorting","Sorting out"],"d":"Regrouping takes four forms. Accumulating (bulk making): bringing together similar stocks from different sources. Allocating (bulk breaking): breaking larger quantities into smaller ones. Assorting: building a variety of products for particular customers. Sorting out: separating products into grades and qualities."},
{"id":"f5-04","t":"Regrouping","q":"Separating products into the grades and qualities wanted by different target markets is called:","o":["Sorting out","Assorting","Accumulating","Allocating"],"d":"Sorting out means separating products into grades and qualities desired by different target markets. Assorting means building up a variety of different products for resale to particular customers."},
{"id":"f5-05","t":"Facility types","q":"Which type of facility mainly tries to maximise throughput?","o":["A distribution centre","A warehouse","A public warehouse","A private warehouse"],"d":"Warehouses emphasise storage and try to maximise use of storage space. Distribution centres emphasise rapid movement and try to maximise throughput: the amount of product entering and leaving a facility in a given time."},
{"id":"f5-06","t":"Facility types","q":"What distinguishes a cross-docking facility from a distribution centre?","o":["How long product stays in the facility: 24 hours or less for cross-docking","Cross-docking facilities store products for months","Only distribution centres use trucks","Cross-docking facilities are always publicly owned"],"d":"Cross-docking means receiving product and shipping it out the same day or overnight without putting it into storage. It differs from a distribution centre by the length of time product is in the facility (24 hours or less)."},
{"id":"f5-07","t":"Facility types","q":"Which design is recommended for a cross-docking facility?","o":["Minimal storage space and truck doors on two or more sides","Maximum storage space and a single loading door","High racking to use the full cubic capacity","No truck doors, using conveyors only"],"d":"Cross-dock facilities should be designed with a minimal amount of storage space and truck doors on two or more sides. Designs include 'H', 'I', 'T', 'U' and 'E' configurations."},
{"id":"f5-08","t":"Ownership","q":"Which type of warehousing is used most by retail chain stores?","o":["Private warehousing","Public warehousing","Contract warehousing","Multi-client warehousing"],"d":"Private warehousing is owned by the firm storing goods there. It generates high fixed costs and suits companies with large volumes; its largest users are retail chain stores."},
{"id":"f5-09","t":"Ownership","q":"Which of these is a drawback of PRIVATE warehousing?","o":["It is less attractive when interest rates are high","Lack of control by the user","Users must rent space month to month","It serves all legitimate users"],"d":"Private warehousing drawbacks: high fixed cost, the need for high and steady demand volumes, being less attractive when interest rates are high, and reduced flexibility. Lack of control is a drawback of public warehousing."},
{"id":"f5-10","t":"Ownership","q":"How does contract warehousing compare on cost?","o":["Less costly than private warehousing and more costly than public warehousing","More costly than private warehousing","Less costly than public warehousing","The same cost as public warehousing"],"d":"Contract (third-party or dedicated) warehousing is less costly than private warehousing and more costly than public warehousing, and offers more value-adding services than public warehousing."},
{"id":"f5-11","t":"Ownership","q":"Which type of warehousing is bought through contracts of at least one year and suits smaller organisations without enough volume for their own facility?","o":["Multi-client warehousing","Public warehousing","Private warehousing","Contract warehousing"],"d":"Multi-client warehousing mixes attributes of contract and public warehouses. Services are bought through minimum one-year contracts and suit smaller organisations that cannot build their own facilities or use one-client contract warehousing."},
{"id":"f5-12","t":"Ownership","q":"Compared with other types, multi-client warehousing services are:","o":["More differentiated than public, but less customised than contract","More customised than contract warehousing","Less differentiated than public warehousing","Identical to private warehousing"],"d":"Multi-client warehousing services are more differentiated than those in a public facility and less customised than those in a contract facility."},
{"id":"f5-13","t":"Design","q":"How should a facility with LOW rates of product turnover be laid out?","o":["To maximise use of the facility's cubic capacity","To speed the flow of product in and out","With truck doors on all four sides","With no storage space"],"d":"A facility with low turnover should maximise utilisation of its cubic capacity. A facility emphasising rapid movement should be configured to facilitate the flow of product into and out of it."},
{"id":"f5-14","t":"Design","q":"In a variable slot location system:","o":["Empty slots are assigned to incoming products based on space availability","Each SKU has one or more permanent slots","Products are never stored","Slots are assigned by product price"],"d":"In fixed slot locations each SKU has one or more permanent slots. In variable slot locations, empty slots are assigned to incoming products based on space availability."},
{"id":"f5-15","t":"Design","q":"According to the general rule of thumb, which is cheaper?","o":["Building up (vertical) rather than building out (horizontal)","Building out (horizontal) rather than building up (vertical)","Both cost exactly the same","Renting is always cheaper than building"],"d":"The general rule of thumb is that it is cheaper to build up than to build out."},
{"id":"f5-16","t":"Design","q":"Approximately what share of a facility's cubic capacity is actually occupied by product?","o":["About 10%","About 25%","About 50%","About 80%"],"d":"Only about 10 percent of a facility's cubic capacity is actually occupied by product. Space is also needed for washrooms, lunchrooms, offices, hazardous-item storage, supplies and more."},
{"id":"f5-17","t":"Ownership","tf":true,"ans":false,"q":"Public warehouses require a capital investment from the user.","d":"Public warehouses require no capital investment by the user, who rents space as needed, often month to month."},
{"id":"f5-18","t":"Operational issues","tf":true,"ans":true,"q":"The fatality (accident) rate in warehousing is higher than the average rate for all industries.","d":"Warehouses, distribution centres and cross-docking facilities can be dangerous workplaces; the warehousing fatality rate is higher than the average for all industries."},
{"id":"f5-19","t":"Ownership","tf":true,"ans":true,"q":"Contract warehousing is also called third-party (3PL) or dedicated warehousing, and the vendor and client share the risks.","d":"Contract warehousing is a long-term arrangement providing tailored services exclusively to one client, where the vendor and client share the risks."},
{"id":"f5-20","t":"Operational issues","tf":true,"ans":false,"q":"Warehouse productivity is measured as input divided by output.","d":"Productivity is a measure of output divided by input, e.g. cases, product lines or pallets shipped per person."}
]},
{"id":"fin-ch6","label":"Chapter 6","name":"Transportation and Distribution","questions":[
{"id":"f6-01","t":"Modes","q":"Which of these is NOT one of the five modes of transportation?","o":["Intermodal","Pipeline","Motor carrier (truck)","Water"],"d":"The five modes are air, motor carrier (truck), pipeline, rail and water. Intermodal transportation combines two or more modes; it is not a separate mode."},
{"id":"f6-02","t":"Modes","q":"Air freight is generally the fastest mode for shipments exceeding:","o":["600 miles","100 miles","300 miles","1,500 miles"],"d":"Air freight is generally the fastest mode for shipments exceeding 600 miles, but it is expensive and rates use dimensional weight."},
{"id":"f6-03","t":"Modes","q":"Why is air freight reliability described as problematic?","o":["Delays from weather and congestion with passenger flights (belly freight)","Aircraft can only carry liquids","Air freight has no fixed schedules","Air freight cannot be tracked"],"d":"Air freight reliability suffers from weather delays (fog, snow, thunderstorms) and congestion with air passenger transportation (belly freight)."},
{"id":"f6-04","t":"Modes","q":"Which shipment is BEST suited to air freight according to the slides?","o":["Cut flowers that are perishable and urgent","Crude oil","Bulk grain","Coal"],"d":"Air freight is best suited for high-value, lower-volume, urgent, perishable or time-specific deliveries. Cut flowers and nursery stock are listed examples."},
{"id":"f6-05","t":"Modes","q":"A less-than-truckload (LTL) shipment typically weighs between:","o":["150 and 10,000 pounds","10 and 150 pounds","10,000 and 50,000 pounds","Over 50,000 pounds"],"d":"LTL shipments are 150 to 10,000 pounds: too big to handle manually and too small to fill a truck. Truckload (TL) focuses on shipments over 10,000 pounds."},
{"id":"f6-06","t":"Modes","q":"In the LTL process, what happens right after local pick-up?","o":["The shipment is loaded aboard a line haul at the origin terminal","It is delivered to the consignee","It moves directly from shipper to consignee","It goes on a smaller truck for local delivery"],"d":"LTL process: local pick-up → origin terminal, loaded aboard line haul → line haul to a terminal near the destination → local delivery on smaller trucks → the consignee receives it."},
{"id":"f6-07","t":"Modes","q":"How do truckload (TL) shipments usually move?","o":["Directly from the shipper's location to the consignee's location","Through several terminals with many other shippers' goods","Only by rail","Only within one city"],"d":"TL shipments (over 10,000 lbs, close to a full trailer) tend to move directly from the shipper's location to the consignee's location."},
{"id":"f6-08","t":"Modes","q":"Which mode is the most reliable but tends to be the slowest?","o":["Pipeline","Water","Rail","Air"],"d":"Pipelines: the only mode without vehicles, one-way, the most reliable, the slowest, only for liquid, liquefiable or gaseous products, with high fixed costs but low cost per unit."},
{"id":"f6-09","t":"Modes","q":"How does rail compare with other modes on cost?","o":["Less expensive than air and motor, but more expensive than pipeline and water","The most expensive of all modes","The cheapest of all modes","More expensive than air"],"d":"Rail is neither the best nor the worst on any of the six attributes. It is less expensive than air and motor but more expensive than pipeline and water, and faster than pipeline and water but slower than air and truck."},
{"id":"f6-10","t":"Intermodal","q":"Intermodal transportation means:","o":["Moving a container between vehicles of different modes without reloading or disturbing the contents","Using only one mode for the whole journey","Moving passengers and freight together","Shipping goods without any containers"],"d":"Intermodal transportation uses a container or other equipment that can be transferred from one mode's vehicle to another's without the contents being reloaded or disturbed, e.g. piggyback transportation."},
{"id":"f6-11","t":"Intermodal","q":"Containers used in intermodal shipping are measured in:","o":["TEUs (twenty-foot equivalent units)","ULDs (unit load devices)","LTLs","Pounds only"],"d":"Containers are large reusable steel boxes, interchangeable among rail, truck and water carriers, and measured in TEUs. ULDs are airfreight containers designed for the aircraft fuselage."},
{"id":"f6-12","t":"Rates","q":"Transportation rates are based on which three factors?","o":["Product, weight and distance","Speed, fuel and season","Weight, insurance and taxes","Distance, driver and vehicle"],"d":"A rate is the price charged for freight transportation (a fare is for passengers). Weight × rate = transportation charge, and rates are based on product, weight and distance."},
{"id":"f6-13","t":"Carriers and documents","q":"A supermarket chain runs its own trucks to deliver to its stores. Which carrier classification is this?","o":["Private carrier","Common carrier","Contract carrier","Exempt carrier"],"d":"Common carriers serve the general public. Contract carriers serve customers on a contract basis. Exempt carriers are exempted from economic regulation by legislation. Private carriers are companies whose main business is not transportation and who provide their own transport."},
{"id":"f6-14","t":"Carriers and documents","q":"Which carrier offers specialised service on a contract basis, with no obligation to serve the general public?","o":["Contract carrier","Common carrier","Private carrier","Exempt carrier"],"d":"Contract carriers offer specialised service to customers on a contractual basis, with no obligation to serve the general public or to treat customers equally."},
{"id":"f6-15","t":"Carriers and documents","q":"Which transport document is used for AIR shipments?","o":["Air consignment note (airway bill)","Mate's receipt","Charter party","Multimodal bill of lading"],"d":"Sea/ocean: mate's receipt, charter party, maritime bill of lading. Land: railway consignment note, road waybill. Air: air consignment note or airway bill. Combination: combined transport document or multimodal bill of lading."},
{"id":"f6-16","t":"Distribution","q":"Which distribution channel has just one intermediary?","o":["Producer → retailer → consumer","Producer → wholesaler → retailer → consumer","Producer → consumer","Producer → wholesaler → consumer"],"d":"The first channel is the longest (producer, wholesaler, retailer, consumer). The second channel excludes the wholesaler, so it has just one intermediary (the retailer). The third is direct to consumer."},
{"id":"f6-17","t":"Distribution","tf":true,"ans":true,"q":"Reverse logistics is the process of recapturing the value of returned goods and bringing them back to the marketplace as soon as possible.","d":"Reverse logistics recaptures the value of returned goods; returned products may be disposed of, refurbished or resold. Forward logistics moves goods from the manufacturer to customers."},
{"id":"f6-18","t":"Modes","tf":true,"ans":false,"q":"Pipelines carry liquid, liquefiable or gaseous products and have low fixed costs.","d":"Pipelines carry only liquid, liquefiable or gaseous products. They have HIGH fixed costs but a relatively low cost per unit because of their large volumes."},
{"id":"f6-19","t":"Modes","tf":true,"ans":true,"q":"Water transport is relatively inexpensive, but it has slow average speeds and is somewhat unreliable.","d":"Water transport is relatively inexpensive, focuses on lower-value bulk commodities and carries greater volumes than rail or truck, but has slow average speeds and is somewhat unreliable."},
{"id":"f6-20","t":"Intermodal","tf":true,"ans":false,"q":"Airfreight containers (ULDs) are interchangeable with rail, truck and water carriers.","d":"Standard containers are interchangeable among rail, truck and water carriers. Airfreight containers (ULDs) are designed specifically for the aircraft fuselage."}
]},
{"id":"fin-ch7","label":"Chapter 7","name":"E-Logistics","questions":[
{"id":"f7-01","t":"E-logistics basics","q":"What is the ultimate objective of e-logistics?","o":["To deliver the right products in the right quantities at the right place and time to the right customer","To replace all warehouses with websites","To remove the need for transportation","To sell more products at a higher price"],"d":"The ultimate objective of e-logistics is to deliver the right products in the right quantities at the right place and time to the right customer."},
{"id":"f7-02","t":"E-logistics basics","q":"E-logistics is the use of web-based technologies to support which processes?","o":["Material acquisition, warehousing and transportation","Product design and advertising","Hiring and payroll","Only customer payments"],"d":"E-logistics uses web-based technologies to support material acquisition, warehousing and transportation, and lets distribution couple routing optimisation with inventory-tracking information."},
{"id":"f7-03","t":"E-logistics basics","q":"Which example of e-logistics is given on the slides?","o":["Internet-based freight auctions that enable spot buying of trucking capacity","Printing paper catalogues","Hiring more warehouse staff","Building larger trucks"],"d":"For example, Internet-based freight auctions enable spot buying of trucking capacity."},
{"id":"f7-04","t":"Technology","q":"What does ASN stand for in e-logistics technology?","o":["Advance ship notice","Automated shipping network","Advanced supplier negotiation","Average stock number"],"d":"E-logistics technologies include EDI among carriers, shippers and customers, barcoding and scanning, advance ship notices (ASNs), tracking systems, GPS and GIS, the Internet, ERP and more."},
{"id":"f7-05","t":"Technology","q":"Electronic data interchange (EDI) on the slides is exchanged among:","o":["Carriers, shippers and customers","Only a company's own departments","Governments and banks","Competitors in the same industry"],"d":"One listed e-logistics technology is electronic data interchange (EDI) among carriers, shippers and customers."},
{"id":"f7-06","t":"Technology","q":"What sets RFID apart according to the slides?","o":["It does not need a direct line of sight to read a tag, and tag information can be updated","It must be scanned in direct line of sight","Its tags can never be changed","It only works for whole pallets, not individual units"],"d":"Radio Frequency Identification (RFID) tracks individual units of goods, does not require a direct line of sight to read a tag, and the information on the tag is updatable."},
{"id":"f7-07","t":"Advantages","q":"E-procurement supports which key procurement processes?","o":["Requisitioning, sourcing, contracting, ordering and payment","Only payment","Advertising and promotion","Hiring and training"],"d":"E-procurement uses web-based technology to support requisitioning, sourcing, contracting, ordering and payment, using online catalogues, contracts, purchase orders and shipping notices."},
{"id":"f7-08","t":"Advantages","q":"Reducing paper-driven transactions through e-procurement is linked to what drop in net greenhouse gas production (Romm, 2000)?","o":["25%","5%","50%","75%"],"d":"Savings from e-procurement: ideally reducing all paper-driven transactions, linked to a 25% drop in net greenhouse gas production (Romm, 2000)."},
{"id":"f7-09","t":"Advantages","q":"How does e-logistics support 'postponement' in inventory and warehousing?","o":["Fast information means less inventory is needed (JIT)","Products are stored longer before sale","Orders are delayed until the end of the year","Warehouses are moved next to every customer"],"d":"Postponement: less inventory because of the quick speed of information (JIT). Warehousing can also be aggregated and centralised, so it does not need to be next to the customer."},
{"id":"f7-10","t":"Advantages","q":"Substituting durable goods with information improves efficiency and reduces:","o":["The bullwhip effect","The number of customers","Product quality","Delivery speed"],"d":"Information integration, substituting durable goods with information, gives better efficiency and less bullwhip effect."},
{"id":"f7-11","t":"B2C processes","q":"Which of these is NOT one of the B2C e-logistics processes on the slides?","o":["Product design","Insurance","Replenishment","Returns"],"d":"The seven B2C e-logistics processes: method of payment, check product availability, arrange shipments, insurance, replenishment, contact with customers, and returns."},
{"id":"f7-12","t":"B2C processes","q":"Which B2C process is described as the biggest activity (labour, energy, money) in e-logistics?","o":["Arranging shipments","Checking product availability","Contact with customers","Method of payment"],"d":"Arranging shipments: electronic shipping is quick, while physical products need the best shipping method for the service level. It is the biggest activity in labour, energy and money."},
{"id":"f7-13","t":"B2C processes","q":"In B2C payments, cash on delivery (COD) is paid:","o":["At the time of delivery","At the time of order","After the return period ends","Before the product is made"],"d":"Payment can be made at the time of order (e-payment such as PayPal, or credit card) or at the time of delivery (COD)."},
{"id":"f7-14","t":"B2C processes","q":"In replenishment, shipping materials, scanners, totes and carts count as:","o":["Non-product inventory","Product inventory","Returns","Insurance items"],"d":"Replenishment examines all physical inventory and reorders as needed: product (on shelves or material to make it) and non-product (shipping materials, machine parts, scanners, totes, carts)."},
{"id":"f7-15","t":"B2C processes","q":"Why should e-logistics keep customers informed with order, payment, shipping and tracking messages?","o":["Because back-door operations are invisible to the customer","Because customers must approve each warehouse task","Because the law requires a phone call for every order","Because it removes the need for insurance"],"d":"With an invisible process (back-door operations), the customer needs to be informed as much as possible: order confirmation, payment success, shipping confirmation, tracking and any problems."},
{"id":"f7-16","t":"Challenges","q":"Which of these is a listed challenge of e-logistics?","o":["E-commerce has higher return rates","Customers never return products","There are too few online stores","Payments cannot be made online"],"d":"Challenges: higher e-commerce return rates, a culture focused on sales not returns, unknown return volumes, lack of retailing experience, and many sources of returns. Responses include subcontracted return stores and third-party reverse logistics providers."},
{"id":"f7-17","t":"B2C processes","tf":true,"ans":true,"q":"For electronic payments, payment should be verified before the product is shipped.","d":"For electronic payments, a system of verification of payment is needed before shipping."},
{"id":"f7-18","t":"Advantages","tf":true,"ans":false,"q":"Internet technologies have only helped large corporations compete for market share.","d":"E-business technologies, particularly the Internet, let organisations of all sizes connect with partners and compete for market share, which before was only possible for large corporations."},
{"id":"f7-19","t":"Advantages","tf":true,"ans":true,"q":"Transportation costs may increase because of centralised warehousing.","d":"Centralising warehousing means less waste and energy for extra locations, but transportation costs may increase."},
{"id":"f7-20","t":"B2C processes","tf":true,"ans":false,"q":"If a product is out of stock, the customer should not be told until it ships.","d":"If possible, inform the customer about availability before the order is placed. If the product is out of stock or will take time to make, inform the customer of the delay."}
]},
{"id":"fin-ch8","label":"Chapter 8","name":"Recent Developments and Contemporary Issues in Supply Chains","questions":[
{"id":"f8-01","t":"Green supply chain","q":"Green supply chain management uses environmentally friendly inputs and turns them into outputs that can be:","o":["Reclaimed and re-used at the end of their life cycle","Sold only in local markets","Stored indefinitely","Disposed of more cheaply"],"d":"Green supply chain management is the process of using environmentally friendly inputs and transforming them into outputs that can be reclaimed and re-used at the end of their life cycle, creating a sustainable supply chain."},
{"id":"f8-02","t":"CRM and SCM","q":"Which statement correctly contrasts SCM and CRM?","o":["SCM coordinates the flow of work from vendors to retailers; CRM makes sure customers get support and services, including after sales","SCM handles after-sales service; CRM handles suppliers","Both manage only suppliers","CRM reduces inventory; SCM handles customer complaints"],"d":"SCM ensures the business has the materials, information and financial resources to produce on time, coordinating work from vendors to retailers. CRM staff interact with customers so they get support and services, including after sales."},
{"id":"f8-03","t":"7 Rs","q":"Which of these is NOT one of the 7 Rs of logistics?","o":["Right promotion","Right condition","Right customer","Right price"],"d":"The 7 Rs: right product, right quantity, right condition, right place, right time, right customer and right price."},
{"id":"f8-04","t":"7 Rs","q":"Making sure goods are properly packed and shipped so they reach the customer undamaged relates mainly to:","o":["Right condition","Right quantity","Right place","Right time"],"d":"Right condition: the product should reach the customer in good condition; procurement must ensure products are properly packed and shipped."},
{"id":"f8-05","t":"7 Rs","q":"Which R is described as determining the profit or loss a company makes?","o":["Right price","Right product","Right customer","Right quantity"],"d":"Right price: pricing is crucial because it determines the profit or loss. Managers analyse industry dynamics and keep a record of costs so goods are sold at the correct price."},
{"id":"f8-06","t":"Oman 2040","q":"The Oman Logistics Strategy 2040 aims for the logistics sector to become:","o":["The second largest contributor to GDP after hydrocarbons","The largest contributor to GDP","The third largest employer after tourism","Oman's only non-oil sector"],"d":"The Oman Logistics Strategy 2040 sets the aim for logistics to become the second largest contributor to GDP after hydrocarbons."},
{"id":"f8-07","t":"Oman 2040","q":"What was the initial target for the logistics sector's contribution to Oman's GDP by 2020?","o":["US$7.8 billion","US$2.1 billion","US$15 billion","US$28 billion"],"d":"The initial target was a US$7.8 billion contribution to GDP by 2020, shown by the ambition of Oman's vision for its ports."},
{"id":"f8-08","t":"Oman 2040","q":"Oman's 2040 initiative and its Tanfeedh programme cite tourism and logistics as key growth areas mainly to:","o":["Diversify the economy away from dependence on diminishing natural resources","Increase oil production","Reduce the number of ports","Replace the private sector"],"d":"Both cite tourism and logistics, among a handful of sectors, as key growth areas for diversifying the Sultanate's economy away from dependence on its diminishing natural resource reserves."},
{"id":"f8-09","t":"Trends and technology","q":"Which term means using high-level methods and tools to project future trends, events and behaviours from supply chain data?","o":["Advanced analytics","Blockchain","Supply Chain as a Service (SCaaS)","A circular supply chain"],"d":"Advanced analytics uses high-level methods and tools to project future trends, events and behaviours based on supply chain data. Supply chain analytics in general means examining raw supply chain data to reach conclusions or make predictions."},
{"id":"f8-10","t":"Trends and technology","q":"Which technology creates decentralised, distributed, tamper-proof and unchangeable digital records of transactions?","o":["Blockchain","Internet of Things (IoT)","Augmented reality","Autonomous robots"],"d":"Blockchains create decentralised, distributed and digital records of transactions that are anonymous, tamper-proof and unchangeable."},
{"id":"f8-11","t":"Trends and technology","q":"A company turns customer returns and waste into new or refurbished products. This is:","o":["A circular supply chain","Supply Chain as a Service","A green input policy only","Advanced analytics"],"d":"A circular supply chain reuses or repurposes waste and customer returns into new or refurbished products, aiming to minimise raw material use and discarded waste."},
{"id":"f8-12","t":"Trends and technology","q":"Supply Chain as a Service (SCaaS) means:","o":["Outsourcing portions of the supply chain process to a third party","Selling the supply chain to customers","Running the supply chain without any software","Replacing suppliers with robots"],"d":"SCaaS is a relatively new method in which portions of the supply chain process are outsourced to and supported by a third party. It can bring benefits but also significant challenges."},
{"id":"f8-13","t":"Trends and technology","q":"Attaching sensors to delivery vehicles to get live tracking updates is an example of:","o":["Internet of Things (IoT)","Blockchain","Virtual reality","Supply Chain as a Service"],"d":"IoT improves supply chain visibility in production and inventory management, and live tracking updates can be gathered by attaching sensors to shipping and delivery vehicles."},
{"id":"f8-14","t":"SC of the future","q":"The supply chain trend 'focused towards customers' includes a move from:","o":["Push by the firm to pull by the customer","Pull by the customer to push by the firm","Personalised to mass-produced products","Global to purely local logistics"],"d":"Trend (1), focused towards customers: a move from push (by the firm) to pull (by the customer), more personalised, with global coherence and reactivity."},
{"id":"f8-15","t":"SC of the future","q":"Under the 'partnership strategy' trend, which activities are outsourced as 'non-strategic'?","o":["Delivery, transport and storage","Brand and new product introduction","Core competencies","Customer focus"],"d":"Trend (3), partnership strategy: a move from a risk-reduction approach to a balanced relationship, focusing on core competencies, brand, customers and new products, and outsourcing non-strategic activities such as delivery, transport and storage."},
{"id":"f8-16","t":"SC of the future","q":"In the supply chain of the future, the change 'from inventory to information' leads to:","o":["Demand-based replenishment and quick response systems","SC partnerships","Focus on markets and creation of customer value","Integral management of materials and goods flow"],"d":"SC of the future: functions → processes (integral management of flows); profit → performance (key performance drivers); products → customers (markets and customer value); inventory → information (demand-based replenishment and quick response); transactions → relationships (SC partnerships)."},
{"id":"f8-17","t":"Trends and technology","tf":true,"ans":false,"q":"Autonomous technology in supply chains is limited to autonomous vehicles.","d":"The scope of autonomous technology is much wider than autonomous vehicles; for example, robots that move on their own in warehouse management systems."},
{"id":"f8-18","t":"Trends and technology","tf":true,"ans":true,"q":"IoT with 5G enables fast data signals and real-time information sharing in the supply chain.","d":"IoT with the help of 5G enables fast data signals and empowers sharing real-time information; a fast wireless network is becoming imperative in the supply chain."},
{"id":"f8-19","t":"SC of the future","tf":true,"ans":true,"q":"The change 'from transactions to relationships' leads to supply chain partnerships.","d":"In the SC of the future, moving from transactions to relationships leads to SC partnerships."},
{"id":"f8-20","t":"SC of the future","tf":true,"ans":false,"q":"The partnership strategy trend is a move from a balanced relationship toward a risk-reduction approach.","d":"It is the opposite: a move from a risk-reduction approach to a balanced relationship."}
]}
]},
{"id":"finance","name":"Finance","sub":"Interest, time value of money, loans, shares, mutual funds and Excel","chapters":[
{"id":"fn-ch1","label":"Chapter 1","name":"Introduction to Finance","questions":[
{"id":"fn1-01","t":"Meaning of finance","q":"How do the slides define finance?","o":["The art and science of managing money effectively and efficiently","The study of how prices are set in markets","Recording and reporting business transactions","The skill of borrowing money at the lowest rate"],"d":"Finance: the art and science of managing money effectively and efficiently. It covers all processes of raising, managing and spending money.","w":"It is an 'art' because it needs judgement about people, risk and timing, and a 'science' because it uses tools and techniques. Recording transactions is accounting, and price-setting is economics."},
{"id":"fn1-02","t":"Meaning of finance","q":"What is the core objective of finance?","o":["To create more wealth and use available financial resources efficiently","To avoid every possible risk","To borrow as much as possible","To keep all money in bank deposits"],"d":"Core objective of finance: to create more wealth and to utilise available financial resources efficiently.","w":"Sound financial management creates wealth and income opportunities. Avoiding all risk or keeping everything in banks would limit growth, and borrowing more is not a goal in itself."},
{"id":"fn1-03","t":"Meaning of finance","q":"The process of mobilising and channelling funds of people, businesses and government gave rise to:","o":["Financial intermediaries such as banks and financial institutions","Accounting standards","Behavioural finance","International finance"],"d":"Financial intermediaries: banks and financial institutions that help individuals and organisations achieve their financial goals by moving funds between them.","w":"Someone had to collect money from savers and pass it to people who need it. That role created banks and other financial institutions."},
{"id":"fn1-04","t":"Scope of finance","q":"Managing a family's income, savings, investments and retirement falls under:","o":["Personal finance","Business finance","Public finance","International finance"],"d":"Personal finance: managing individual finances for daily needs, savings, investments and retirement, including income, spending and contingency planning.","w":"The focus is one person or household. Business finance is about a company, public finance about government, and international finance about money flows between countries."},
{"id":"fn1-05","t":"Scope of finance","q":"Raising capital, acquiring assets, paying liabilities and maximising returns for investors is part of:","o":["Business (corporate) finance","Personal finance","Public finance","International finance"],"d":"Business (corporate) finance: managing a business's financial resources to achieve its short-, medium- and long-term goals.","w":"Raising capital and maximising returns for investors are company activities, so this is business finance."},
{"id":"fn1-06","t":"Scope of finance","q":"Studying exchange rates, foreign direct investment and money flows between countries is:","o":["International finance","Public finance","Business finance","Personal finance"],"d":"International finance: the relationship of money flows between countries, including exchange rates, foreign direct investment and inflation rates.","w":"It deals with more than one country. Its importance has grown because of globalisation."},
{"id":"fn1-07","t":"Scope of finance","q":"A government collecting taxes and spending them on services for citizens is an example of:","o":["Public finance","Business finance","International finance","Personal finance"],"d":"Public finance: the government's role in allocating resources, generating income and distributing it to citizens, while keeping the economy financially stable.","w":"The decision-maker is the government, and taxes are government income. That makes it public finance."},
{"id":"fn1-08","t":"Nature of finance","q":"Why is finance described as interdisciplinary?","o":["It draws on behavioural sciences, economics, accounting and decision sciences","It is taught only in business schools","It depends only on mathematics","It replaces economics and accounting"],"d":"Nature of finance: interdisciplinary. It uses behavioural sciences, economics, accounting and decision sciences.","w":"Financial decisions need knowledge of human behaviour, economic systems, accounting information and analytical tools, so finance borrows from all four fields."},
{"id":"fn1-09","t":"Nature of finance","q":"Which discipline helps finance understand how people's perception of risk and return shapes their investment decisions?","o":["Behavioural sciences","Accounting","Decision sciences","Economics"],"d":"Behavioural sciences: understanding human behaviour in investment and financing decisions, considering people's perception of risk and return.","w":"Perception and behaviour are about people, which is the focus of behavioural sciences."},
{"id":"fn1-10","t":"Nature of finance","q":"Techniques like scenario analysis, standard deviation and probability distributions come into finance from:","o":["Decision sciences","Behavioural sciences","Accounting","Public finance"],"d":"Decision sciences: analytical tools and techniques used for financial decision-making, to quantify relationships, risks and uncertainties.","w":"These are quantitative analytical techniques, which come from decision sciences."},
{"id":"fn1-11","t":"Nature of finance","q":"Which discipline provides information on financial performance and position, used to predict future financial needs?","o":["Accounting","Economics","Behavioural sciences","Decision sciences"],"d":"Accounting: provides information on financial performance and position, helps predict future financial requirements and supports investment decisions.","w":"Performance and position information comes from financial statements, which accounting prepares."},
{"id":"fn1-12","t":"Finance function","q":"What is the FIRST step in the finance process?","o":["Identifying fund requirements","Locating fund sources","Acquiring funds","Reviewing and controlling"],"d":"Finance process: 1 identify fund requirements, 2 locate fund sources, 3 acquire funds, 4 utilise funds, 5 review and control.","w":"You must first know how much money is needed and for how long. Otherwise you risk a shortage or excess funds."},
{"id":"fn1-13","t":"Finance function","q":"Obtaining funds on time and at the lowest possible cost is which step of the finance process?","o":["Acquiring funds","Identifying fund requirements","Utilising funds","Reviewing and controlling"],"d":"Acquiring funds: obtaining the funds in a timely manner and at the lowest cost possible.","w":"Inefficient handling at this step causes delays and higher interest costs, so timing and cost are its focus."},
{"id":"fn1-14","t":"Finance function","q":"How does a financial institution mainly earn its income?","o":["The difference between interest charged on loans and interest paid on deposits","Selling shares to the public","Collecting taxes","Setting the prices of securities"],"d":"Financial institution: an organisation whose commodity is money. It accepts deposits (paying interest) and lends money (charging interest).","w":"The bank charges more on loans than it pays on deposits. That interest difference, plus small fees for services, is its earnings."},
{"id":"fn1-15","t":"Finance function","q":"Which is a role of financial markets?","o":["Determining interest rates and securities prices","Accepting deposits and lending money","Collecting taxes for the government","Preparing financial statements"],"d":"Financial markets: platforms that let investors put money into businesses that need funds. They determine interest rates and securities prices.","w":"Accepting deposits and lending are activities of financial institutions, not markets."},
{"id":"fn1-16","t":"Finance function","q":"A stock exchange is described as:","o":["The place where shares are issued, bought and sold","A bank that lends to companies","A government body that sets taxes","A market for foreign currencies only"],"d":"Stock exchange: the place where shares are issued, bought and sold.","w":"Other markets exist for debt, bonds, mortgages, commodities and foreign exchange, but the stock exchange is the share market."},
{"id":"fn1-17","t":"Financial system","q":"A financial system is a tightly woven network of:","o":["Policy makers, financial institutions, financial markets and regulatory bodies","Banks and customers only","Accountants and auditors","Shareholders and directors"],"d":"Financial system: a network of policy makers, financial institutions, financial markets and regulatory bodies that provides financial services to individuals, corporations and government.","w":"All four parts work together to move money efficiently, which drives economic growth and stability."},
{"id":"fn1-18","t":"Financial system","q":"Giving underserved and low-income groups access to financial products at lower cost is which characteristic of an efficient financial system?","o":["Financial inclusion","Ease of operation","Promoting transparency","Ensuring stability"],"d":"Financial inclusion: providing access to financial products and services at a lower cost to a broader segment of the population.","w":"The key idea is reaching more people, including underserved groups. That is inclusion."},
{"id":"fn1-19","t":"Financial system","q":"Providing clear, accurate information about institutions, markets and products so people can make informed decisions is:","o":["Promoting transparency","Financial inclusion","Better risk management","Efficient allocation of resources"],"d":"Promote transparency: clear and accurate information about financial institutions, markets and products, so investors and borrowers can decide well.","w":"Clear information is what transparency means."},
{"id":"fn1-20","t":"Decisions in finance","q":"Deciding whether to pay profits to shareholders or keep them in the business is a:","o":["Dividend decision","Financing decision","Investing decision","Liquidity decision"],"d":"Dividend decision: whether to distribute profits to shareholders or retain them within the organisation.","w":"Paying or keeping profits is about dividends. Financing finds sources of funds, investing chooses assets, and liquidity is about converting investments into cash."},
{"id":"fn1-21","t":"Decisions in finance","q":"Deciding when and how to convert investments into cash is a:","o":["Liquidity decision","Dividend decision","Financing decision","Investing decision"],"d":"Liquidity decision: determining the timing and method for converting investments into cash.","w":"Liquidity means how easily something becomes cash, so this is a liquidity decision."},
{"id":"fn1-22","t":"Careers in finance","q":"Which finance professional buys and sells shares and securities on behalf of clients?","o":["Broker","Planner","Analyst","Consultant"],"d":"Brokers: facilitate buying and selling of shares and securities for clients (stock, commodity, derivatives, real estate and insurance brokers).","w":"Planners build financial plans, analysts evaluate investments and budgets, and consultants give tailored advice. Only brokers carry out the trades."},
{"id":"fn1-23","t":"Decisions in finance","tf":true,"ans":false,"q":"Financing decisions focus on choosing which assets to invest in.","d":"Financing decision: identifying current and potential sources of funds. Investing decision: choosing opportunities or assets to invest in.","w":"The statement mixes up the two. Choosing assets is an investing decision."},
{"id":"fn1-24","t":"Finance function","tf":true,"ans":true,"q":"Financial institutions pay interest on deposits and charge interest on loans.","d":"Financial institutions accept funds and lend them, paying interest to depositors and charging interest to borrowers.","w":"This is how they act as intermediaries and earn the difference."},
{"id":"fn1-25","t":"Finance function","tf":true,"ans":true,"q":"Accurately identifying fund requirements helps avoid both shortages and excess funds.","d":"Identifying fund requirements: determining the amount needed for immediate, short-, medium- or long-term needs.","w":"Too little money causes shortages; too much leaves funds idle. Accurate identification avoids both."},
{"id":"fn1-w1","t":"Meaning of finance","wr":true,"q":"Define finance and explain its core objective.","a":"Finance is the art and science of managing money effectively and efficiently. It covers all the processes of raising, managing and spending money.\nCore objective: to create more wealth and to utilise the available financial resources efficiently.\nTo achieve this, financial decisions need clarity on the risks and uncertainties involved and the use of different tools and techniques.","d":"Finance: the art and science of managing money effectively and efficiently.","w":"A full answer gives the definition, the core objective, and what decision-making needs (understanding risk and using tools)."},
{"id":"fn1-w2","t":"Scope of finance","wr":true,"q":"Explain the four areas in the scope of finance, with an example of each.","a":"1. Personal finance: managing an individual's money for daily needs, savings, investments and retirement. Example: a student saving part of a salary each month.\n2. Business (corporate) finance: managing a business's financial resources, such as raising capital, acquiring assets and paying liabilities. Example: a company issuing shares to build a factory.\n3. Public finance: the government allocating resources, generating income and distributing it to citizens while keeping the economy stable. Example: collecting taxes to fund hospitals.\n4. International finance: money flows between countries, including exchange rates, foreign direct investment and inflation. Example: an Omani firm investing in another GCC country.","d":"Scope of finance: personal, business (corporate), public and international finance.","w":"Each area is defined by who manages the money: an individual, a business, a government, or flows between countries."},
{"id":"fn1-w3","t":"Nature of finance","wr":true,"q":"Explain why finance is called interdisciplinary.","a":"Finance draws on four disciplines:\n1. Behavioural sciences: understanding human behaviour and perception of risk and return in investment and financing decisions.\n2. Economics: micro and macro concepts and policies, the effect of financial decisions on economic systems, currency values and monetary policy.\n3. Accounting: information on financial performance and position, used to manage current finances and predict future needs.\n4. Decision sciences: analytical tools such as scenario analysis, standard deviation and probability distributions to quantify risk and uncertainty.","d":"Interdisciplinary: finance combines ideas and tools from several fields of study.","w":"Name all four disciplines and say what each one contributes."},
{"id":"fn1-w4","t":"Finance function","wr":true,"q":"List and explain the five steps of the finance process.","a":"1. Identifying fund requirements: work out how much is needed for immediate, short-, medium- or long-term needs, to avoid shortage or excess.\n2. Locating fund sources: find potential sources, from savings to borrowing.\n3. Acquiring funds: obtain the funds on time and at the lowest possible cost.\n4. Utilising funds: use the funds as planned and avoid wasting money.\n5. Reviewing and controlling: regularly monitor and adjust fund management for recurring or deferred needs.","d":"Finance process: identify requirements, locate sources, acquire funds, utilise funds, review and control.","w":"The steps follow a logical order: you cannot locate sources before knowing the requirement, or review before using the funds."},
{"id":"fn1-w5","t":"Financial system","wr":true,"q":"State the characteristics of an efficient financial system.","a":"1. Efficient and effective allocation of resources: invested funds earn appropriate returns and wealth is distributed fairly.\n2. Ease of operation: people and businesses can carry out transactions easily.\n3. Promotes transparency: clear, accurate information about institutions, markets and products.\n4. Better risk management: tools to manage and reduce financial risks.\n5. Financial inclusion: access to financial products at lower cost for a broader population, including underserved groups.\n6. Ensures stability: preventive measures that manage risk and prevent disruption or crisis.","d":"Financial system: a network of policy makers, institutions, markets and regulators that helps individuals, corporations and governments manage funds.","w":"Six characteristics are listed on the slides; each should be named and briefly explained."},
