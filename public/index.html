{"id":"mg4-11","t":"Levels of culture","q":"The visible, tangible aspects of organisational culture are called:","o":["Artifacts","Values","Assumptions","Premises"],"d":"Levels of culture: artifacts (visible), values (shared principles and goals), assumptions (beliefs about human nature and reality).","w":"Artifacts are what you can see and touch."},
{"id":"mg4-12","t":"Levels of culture","q":"Celebrating National Day, a company picnic or a retirement party are examples of:","o":["Rites and rituals","Terminal values","Common assumptions","Instrumental values"],"d":"Rites and rituals (artifacts): recurring activities used at special times to influence members' behaviour and understanding.","w":"These are visible, repeated events, so they are artifacts."},
{"id":"mg4-13","t":"Levels of culture","q":"Organisational heroes, role models and leadership styles that employees like to copy are examples of:","o":["Observable artifacts","Terminal values","Common assumptions","Planning premises"],"d":"Observable artifacts: symbols of culture in the physical and social work environment.","w":"They are visible and accessible, and employees copy their behaviour."},
{"id":"mg4-14","t":"Levels of culture","q":"Freedom, happiness and equality are examples of:","o":["Terminal values","Instrumental values","Artifacts","Rites and rituals"],"d":"Terminal values: the end state of existence an organization would like to achieve.","w":"They describe goals (end states), not behaviours."},
{"id":"mg4-15","t":"Levels of culture","q":"Being hardworking, responsible and supportive are examples of:","o":["Instrumental values","Terminal values","Artifacts","Assumptions"],"d":"Instrumental values: preferable modes of behaviour that help achieve the terminal values.","w":"They describe how people behave to reach the end goals."},
{"id":"mg4-16","t":"Levels of culture","q":"At the PDO Fahud camp, workers see safety as a fundamental, taken-for-granted expectation. This illustrates:","o":["Common assumptions","Rites and rituals","Terminal values","Organisational heroes"],"d":"Common assumptions: deeply shared, often unnoticed beliefs that shape behaviour and decision-making.","w":"The safety expectation is taken for granted, which is the mark of an assumption."},
{"id":"mg4-17","t":"Cultural change","q":"Organisational culture change is:","o":["The intentional modification of shared beliefs, values and norms to align with the vision and strategy","Changing the company's logo only","Replacing all employees","Removing all rules"],"d":"Cultural change: intentionally modifying shared beliefs, values and norms to align internal culture with the vision and strategic goals.","w":"It is planned and aims at better performance and success."},
{"id":"mg4-18","t":"Cultural change","q":"What is the FIRST step in achieving cultural change?","o":["Assess and understand the current culture","Define the desired future state","Develop a comprehensive change plan","Implement and reinforce the change"],"d":"Steps for cultural change: I assess the current culture, II define the desired future state, III develop a change plan, IV implement and reinforce.","w":"You need to know the starting point before planning where to go."},
{"id":"mg4-19","t":"Cultural change","q":"Conducting surveys, focus groups or interviews about current values and behaviours belongs to which step?","o":["Step I: assess and understand the current culture","Step II: define the desired future state","Step III: develop a change plan","Step IV: implement and reinforce"],"d":"Step I: gauge employee perceptions and analyse leadership practices, hiring and performance systems.","w":"Surveys and interviews measure the current culture."},
{"id":"mg4-20","t":"Cultural change","q":"Identifying stakeholders and champion leaders, designing communication strategies and creating a roadmap with milestones is:","o":["Step III: develop a comprehensive change plan","Step I: assess the current culture","Step II: define the desired future state","Step IV: implement and reinforce"],"d":"Step III: translate the vision into a practical, coordinated strategy.","w":"A roadmap and communication strategy are planning tools."},
{"id":"mg4-21","t":"Cultural change","q":"Providing training, rewarding people who show the new values and monitoring progress belongs to:","o":["Step IV: implement and reinforce the change","Step I: assess the current culture","Step II: define the desired future state","Step III: develop a change plan"],"d":"Step IV: implement and reinforce to embed the new culture in daily operations.","w":"Training, rewards and monitoring make the change last."},
{"id":"mg4-22","t":"Personal skills","q":"Paying close attention to colleagues, asking clarifying questions and acknowledging their views is:","o":["Active listening","Emotional intelligence","Continuous learning","Adaptability"],"d":"Active listening and communication: pay attention, ask clarifying questions, acknowledge perspectives, and communicate clearly.","w":"These behaviours describe how a good listener acts."},
{"id":"mg4-23","t":"Personal skills","q":"Understanding your own emotions and others', managing reactions and acting with empathy is:","o":["Emotional intelligence","Active listening","Teamwork","Continuous learning"],"d":"Emotional intelligence: understand and manage emotions and navigate relationships with empathy and tact.","w":"Managing emotions is the key idea."},
{"id":"mg4-24","t":"Personal skills","q":"Adjusting your communication, dress code and demeanour to the organization's norms is:","o":["Openness and adaptability","Professionalism only","Continuous learning","Teamwork"],"d":"Openness and adaptability: be open to new ideas and adapt behaviour to different situations and norms.","w":"Changing your behaviour to fit the situation is adapting."},
{"id":"mg4-25","t":"Characteristics","tf":true,"ans":false,"q":"Organisational culture is inborn.","d":"Organisational culture is not inborn; it is invented and developed over time.","w":"Culture is learned and passed on to new members."},
{"id":"mg4-26","t":"Functions of culture","tf":true,"ans":false,"q":"Organisational culture is fully visible to everyone.","d":"Culture is not fully visible but felt; its less visible parts reflect values shared by members.","w":"Artifacts are visible, but values and assumptions are mostly hidden."},
{"id":"mg4-27","t":"Levels of culture","tf":true,"ans":true,"q":"Instrumental values are behaviours that help achieve terminal values.","d":"Instrumental values: preferable modes of behaviour that help achieve terminal (end-state) values.","w":"Hard work (instrumental) can lead to fairness or success (terminal)."},
{"id":"mg4-28","t":"Levels of culture","tf":true,"ans":true,"q":"Common assumptions are often taken for granted and can go unnoticed.","d":"Common assumptions: underlying beliefs so ingrained they often go unnoticed, yet they shape norms and expectations.","w":"That is why they are the deepest level of culture."},
{"id":"mg4-29","t":"Functions of culture","tf":true,"ans":true,"q":"Culture defines the boundary between one organization and others.","d":"Boundary function: culture distinguishes members from non-members and guides their attitudes and behaviour.","w":"The slides' MCQ says this conveys a sense of identity for the organization."},
{"id":"mg4-30","t":"Personal skills","tf":true,"ans":false,"q":"Fitting into an organization means giving up your own individuality.","d":"Fitting in means adapting to the organization's culture while maintaining your own individuality.","w":"You adapt your behaviour, but you remain yourself."},
{"id":"mg4-w1","t":"Meaning of culture","wr":true,"q":"Define organisational culture and list its main characteristics.","a":"Edgar Schein: a pattern of basic assumptions invented, discovered or developed by a group as it learns to cope with external adaptation and internal integration, which has worked well enough to be taught to new members as the correct way to perceive, think and feel.\nWagner III and Hollenbeck: the shared attitudes and perceptions in an organization based on fundamental norms and values that help members understand it.\nCharacteristics:\n- Not inborn; developed over time.\n- Enables employees to perform within a framework.\n- Shaped by internal and external factors.\n- Promotes equality, work culture and professionalism.\n- Promotes formal communication, productivity and job satisfaction.\n- Promotes standardization that reduces role conflicts.\n- Encourages risk-sharing and novel ideas.","d":"Organisational culture: shared assumptions, attitudes and values that guide how members perceive, think and behave.","w":"Give at least one definition with its author, then list several characteristics."},
{"id":"mg4-w2","t":"Functions of culture","wr":true,"q":"Explain the functions of organisational culture with an example of each.","a":"1. Gives members an organisational identity: a sense of togetherness (Starbucks).\n2. Facilitates collective commitment and shared culture (Zappos: autonomy and hiring for cultural fit).\n3. Promotes systems stability: lasting cooperation and standards (Google: collaboration and '20% time').\n4. Shapes behaviour by helping members make sense of their surroundings (Oman Air: hospitality, diversity and safety).\n5. Provides a boundary between organizations and acts as a control mechanism (Bank Muscat's core values).\n6. Helps members stick to conformity and the expected mode of behaviour (Apple's culture of secrecy).","d":"Functions of culture: what culture does for an organization and its members.","w":"The slides pair each function with a company example; use them to support your answer."},
{"id":"mg4-w3","t":"Levels of culture","wr":true,"q":"Explain the three levels of organisational culture.","a":"1. Observable artifacts: visible, tangible symbols of culture, e.g. organisational heroes and role models, leadership styles, work ethics, and rites and rituals (National Day celebrations, company picnics, retirement parties).\n2. Shared values: principles, standards and goals linked with work: terminal values (end states such as freedom, happiness, equality) and instrumental values (behaviours such as hard work and responsibility).\n3. Common assumptions: deeply shared, often unnoticed beliefs about human nature and reality that shape behaviour (e.g. safety as a taken-for-granted priority at PDO Fahud camp).","d":"Levels of culture: artifacts, values and assumptions, from most visible to least visible.","w":"Move from what you can see (artifacts) to what people believe without noticing (assumptions)."},
{"id":"mg4-w4","t":"Levels of culture","wr":true,"q":"Explain the difference between terminal and instrumental values, with examples.","a":"Terminal values:\n- Reflect the end state of existence; what the organization would like to achieve.\n- Examples: freedom, happiness, equality or fairness.\nInstrumental values:\n- The preferable modes of behaviour; the employee behaviours that help achieve the terminal values.\n- Examples: being hardworking, responsible, helping and supportive.\nLink: instrumental values are the means; terminal values are the ends.","d":"Shared values: principles, standards and goals linked with work.","w":"Think of terminal values as the destination and instrumental values as how you travel there."},
{"id":"mg4-w5","t":"Cultural change","wr":true,"q":"Explain the four steps for creating cultural change in an organization.","a":"Step I, assess and understand the current culture: surveys, focus groups and interviews; analyse leadership, hiring and performance systems.\nStep II, define the desired future state: a clear vision and values, translated into specific, actionable behaviours.\nStep III, develop a comprehensive change plan: identify stakeholders and champion leaders, design communication strategies, and create a roadmap with milestones and responsibilities.\nStep IV, implement and reinforce the change: training and resources, recognise and reward people who show the new values, monitor progress and adapt.","d":"Cultural change: the intentional modification of shared beliefs, values and norms to align with the vision and strategy.","w":"The steps move from where we are, to where we want to be, to how we get there, to making it last."},
{"id":"mg4-w6","t":"Personal skills","wr":true,"q":"Explain the personal skills that help you fit into an organisation's culture.","a":"1. Active listening and communication: pay attention, ask clarifying questions, and communicate clearly and concisely for the audience.\n2. Openness and adaptability: accept new ideas and adapt communication, dress and demeanour to the organization's norms.\n3. Teamwork and collaboration: be a team player and build strong relationships.\n4. Professionalism and emotional intelligence: dress appropriately, be punctual, act ethically, and manage emotions with empathy.\n5. Continuous learning: seek new skills and stay informed about industry trends.","d":"Learning to fit in: adapting to an organisation's culture while keeping your individuality.","w":"Five skill areas are listed on the slides; explain each briefly."}
]},
{"id":"mg-ch5","label":"Chapter 5","name":"Leadership","questions":[
{"id":"mg5-01","t":"Meaning","q":"Leadership is:","o":["A process of influencing people to achieve intended goals in a given situation","The power to punish employees","A job title given by the board","The process of recording transactions"],"d":"Leadership: a process of influencing (guiding, inspiring, motivating) people to achieve intended goals in a given situation.","w":"Leadership is about influence, not just authority or titles."},
{"id":"mg5-02","t":"Characteristics","q":"Which is a general characteristic of leadership?","o":["It is situational","It exists only in formal organizations","It needs no followers","It is a one-time event"],"d":"General characteristics: a personal quality, a process of influencing, regulates behaviour, leader-follower relationship, continuous and situational.","w":"Leadership needs followers, is continuous, and exists in informal groups too."},
{"id":"mg5-03","t":"Leaders vs managers","q":"According to Bennis and Nanus:","o":["Managers do things right, and leaders do the right thing","Leaders do things right, and managers do the right thing","Managers and leaders are exactly the same","Leaders never make decisions"],"d":"Bennis and Nanus: 'Managers do things right and leaders do the right thing.'","w":"Managers focus on efficient execution; leaders focus on direction."},
{"id":"mg5-04","t":"Leaders vs managers","q":"Which statement is correct?","o":["All managers are leaders, but all leaders are not managers","All leaders are managers, but not all managers are leaders","Leadership is the whole of management","Managers exist in unorganized groups"],"d":"Leadership is part of management, not the whole of it. Leaders also exist in informal groups.","w":"A manager must lead, but a leader of an informal group need not be a manager."},
{"id":"mg5-05","t":"Leaders vs managers","q":"Where does a LEADER's authority come from?","o":["Their skill, knowledge and abilities","Only their position in the hierarchy","The organisation chart","A legal contract"],"d":"A manager's authority stems from a positional role, delegated from the top. A leader earns authority through skill, knowledge and abilities.","w":"Positional authority describes managers."},
{"id":"mg5-06","t":"Factors of leadership","q":"Which factor of leadership requires judging the best course of action and style for the circumstances?","o":["Situation","Followers","Communication","Leader"],"d":"Factors of leadership: followers, leader, communication and situation.","w":"The situation factor means the right style depends on circumstances."},
{"id":"mg5-07","t":"Factors of leadership","q":"A leader 'setting the example' through two-way verbal and non-verbal messages relates to which factor?","o":["Communication","Followers","Situation","Power"],"d":"Communication: leading through two-way verbal and non-verbal communication; through their own behaviour a leader sets the example.","w":"Setting the example is a form of communication by action."},
{"id":"mg5-08","t":"Principles","q":"Giving team members responsibility and decision-making power to build ownership is which principle of leadership?","o":["Empowerment","Adaptability","Clear vision","Continuous learning"],"d":"Principles of leadership: clear vision and direction, empowerment, communication, adaptability, continuous learning.","w":"Handing over responsibility and decisions is empowerment."},
{"id":"mg5-09","t":"Power","q":"Sundar Pichai leads Google's direction in AI and cloud computing through his knowledge of technology. Which type of power is this?","o":["Expert and informational power","Reward and coercive power","Legitimate power","Referent power"],"d":"Expert and informational power: influence based on skills, knowledge and information (French and Raven).","w":"His influence comes from his knowledge, which is expert power."},
{"id":"mg5-10","t":"Power","q":"Julie Sweet of Accenture uses promotions and raises, and also performance management to ensure accountability. Which type of power is this?","o":["Reward and coercive power","Expert power","Referent power","Legitimate power only"],"d":"Reward and coercive power: the ability to reward or punish to gain compliance.","w":"Promotions are rewards; performance consequences are coercion."},
{"id":"mg5-11","t":"Power","q":"Power accepted by all as correct and without dispute, as in the armed forces or police, is:","o":["Legitimate power","Referent power","Expert power","Coercive power"],"d":"Legitimate power: formal authority accepted as correct (e.g. a CEO such as Elon Musk directing Tesla's operations).","w":"It comes from a recognised formal position."},
{"id":"mg5-12","t":"Power","q":"David Beckham influences people to buy Adidas products through his image and appeal. Which type of power is this?","o":["Referent power","Legitimate power","Expert power","Reward power"],"d":"Referent power: people identify with the leader, as with sports or film personalities.","w":"Fans want to be like him, which is referent power."},
{"id":"mg5-13","t":"Traits","q":"Taking ownership of the outcome of a decision, whether positive or negative, is the trait of:","o":["Accountability","Decisiveness","Optimism","Innovation"],"d":"Leadership traits: integrity, confidence, communication skills, optimism, empathy, passion, innovation, decisiveness, accountability, emotional intelligence.","w":"Owning the results is accountability; making timely decisions is decisiveness."},
{"id":"mg5-14","t":"Traits","q":"Making the correct decision at the right time is the trait of:","o":["Decisiveness","Empathy","Passion","Integrity"],"d":"Decisiveness: making correct decisions at the right time.","w":"Timing and correctness of decisions define decisiveness."},
{"id":"mg5-15","t":"Approaches","q":"The approach that looks for physical, mental or personality traits effective leaders possess is the:","o":["Trait approach","Situational approach","Functional approach","Relational approach"],"d":"Trait approach: identifies traits (physical, social background, intelligence, personality, task-related and social skills) that effective leaders have.","w":"The name says it: it focuses on traits."},
{"id":"mg5-16","t":"Approaches","q":"Hersey and Blanchard's situational leadership theory describes four actions:","o":["Directing, coaching, supporting and delegating","Planning, organizing, staffing and controlling","Autocratic, democratic, laissez-faire and transactional","Expert, reward, legitimate and referent"],"d":"Hersey and Blanchard: supportive and directive behaviour combined into directing, coaching, supporting and delegating, based on followers' needs.","w":"The other options are management functions, styles and types of power."},
{"id":"mg5-17","t":"Approaches","q":"Fiedler's contingency theory says leaders are typically:","o":["Task-oriented or relationship-oriented, and must adapt strategies when situations change","Born with every leadership trait","Always democratic","Unable to adapt at all"],"d":"Fiedler: leaders do not change their style; when situations change they adapt their strategies. Leaders are either task-oriented or relationship-oriented.","w":"Task-oriented leaders focus on goals; relationship-oriented leaders on trust and respect."},
{"id":"mg5-18","t":"Approaches","q":"On Blake and Mouton's Managerial Grid, high concern for task and high concern for relationships is:","o":["Team management","Country club","Authority-compliance","Impoverished"],"d":"Managerial Grid: impoverished (low, low), authority-compliance (high task, low relational), country club (low task, high relational), team (high, high), middle-of-the-road (moderate, moderate).","w":"High on both dimensions is the team style."},
{"id":"mg5-19","t":"Approaches","q":"On the Managerial Grid, low concern for task and high concern for relationships is:","o":["Country club","Team","Impoverished","Middle-of-the-road"],"d":"Country club: low task, high relational.","w":"Relationships are prioritised over getting the task done."},
{"id":"mg5-20","t":"Approaches","q":"Chester Barnard's 'Functions of the Executive' belongs to which approach to leadership?","o":["Functional approach","Trait approach","Relational approach","Transformational approach"],"d":"Functional approach: a leader looks, acts and communicates like a leader. Barnard's functions: formulate purposes and objectives, secure services from members, maintain a communication system.","w":"Barnard describes the functions a leader performs."},
{"id":"mg5-21","t":"Styles","q":"A leader who uses a 'follow me' approach, centralises authority and allows limited participation uses which style?","o":["Autocratic","Democratic","Laissez-faire","Transformational"],"d":"Autocratic (authoritative) style: leader-centred, centralised authority and decisions, limited participation; may use coercive measures.","w":"'Follow me' and centralised decisions mark the autocratic style."},
{"id":"mg5-22","t":"Styles","q":"A leader who frequently consults subordinates and allows substantial participation in decisions uses which style?","o":["Democratic (participative)","Autocratic","Laissez-faire","Transactional"],"d":"Democratic style: substantial participation, consultation, freedom to communicate, cooperative spirit and development of subordinates.","w":"Participation is the key feature."},
{"id":"mg5-23","t":"Styles","q":"A passive leader with a 'let them do' attitude, who works best when team members are competent, uses which style?","o":["Laissez-faire (delegative)","Autocratic","Democratic","Transactional"],"d":"Laissez-faire style: delegates initiative, avoids micromanaging, depends on employees for goals and decisions.","w":"It succeeds only when team members are competent and responsible."},
{"id":"mg5-24","t":"Styles","q":"A leader focused on change, the future and developing each follower's potential uses which style?","o":["Transformational","Transactional","Autocratic","Laissez-faire"],"d":"Transformational style: focus on change, the future and people.","w":"Transactional leaders rely on rewards and punishments instead."},
{"id":"mg5-25","t":"Leaders vs managers","tf":true,"ans":false,"q":"Leadership is the whole of management.","d":"Leadership is part of management, not the whole of it; a leader is mainly related to the directing function.","w":"Management also includes planning, organizing, staffing and controlling."},
{"id":"mg5-26","t":"Leaders vs managers","tf":true,"ans":true,"q":"A leader need not be a manager.","d":"A leader may lead an informal group and need not be a manager; leadership is a narrower term.","w":"Leadership exists in unorganised groups too."},
{"id":"mg5-27","t":"Power","tf":true,"ans":true,"q":"Legitimate power is accepted by all as correct and without dispute, as in the armed forces or police.","d":"Legitimate power: formal authority accepted without dispute.","w":"This is the slides' own example of legitimate power."},
{"id":"mg5-28","t":"Approaches","tf":true,"ans":false,"q":"Authority-compliance on the Managerial Grid means low concern for task and high concern for relationships.","d":"Authority-compliance: HIGH task, LOW relational. Country club is low task, high relational.","w":"The statement reverses the two dimensions."},
{"id":"mg5-29","t":"Styles","tf":true,"ans":true,"q":"Transactional leadership is often called managerial leadership and relies on rewards and punishments.","d":"Transactional leadership: managerial leadership; 'give and take'; emphasises structure, routines and procedures.","w":"Burns contrasted it with transformational leadership."},
{"id":"mg5-30","t":"Styles","tf":true,"ans":false,"q":"Being an authoritarian leader is effective when the team is experienced, knowledgeable and skilled.","d":"The autocratic style limits participation and centralises decisions.","w":"With an experienced, skilled team, autocratic leadership is ineffective; it wastes the team's knowledge (slides' MCQ)."},
{"id":"mg5-w1","t":"Leaders vs managers","wr":true,"q":"Define leadership and distinguish between leaders and managers.","a":"Leadership: a process of influencing (guiding, inspiring, motivating) people to achieve intended goals in a given situation.\nDifferences:\n1. Management is a broader term; leadership is narrower and part of management.\n2. A manager fits in an organised structure; a leader may also lead an informal group.\n3. A manager performs all management functions; a leader mainly performs directing (influencing people to achieve goals voluntarily).\n4. A manager's authority comes from position (delegated from the top); a leader earns authority through skill, knowledge and abilities.\n5. A successful manager must be a good leader, but a leader need not be a manager.\n'Managers do things right and leaders do the right thing' (Bennis and Nanus).","d":"Leadership: influencing people to achieve goals in a given situation.","w":"Start with the definition, then compare the two on scope, setting, functions and source of authority."},
{"id":"mg5-w2","t":"Factors of leadership","wr":true,"q":"Explain the four factors of leadership.","a":"1. Followers: leadership needs followers, so the leader must understand their needs, emotions and motivation.\n2. Leader: brings members together, gives them a purpose and inspires them to work for it.\n3. Communication: two-way verbal and non-verbal communication; the leader sets the example through their own behaviour.\n4. Situation: the leader uses judgement to choose the best course of action and style for each situation.","d":"Factors of leadership: followers, leader, communication and situation.","w":"All four interact: the right style depends on the followers and the situation."},
{"id":"mg5-w3","t":"Power","wr":true,"q":"Explain French and Raven's types of leadership power, with an example of each.","a":"1. Expert and informational power: influence from skills, knowledge and information (e.g. Sundar Pichai's technology expertise at Google; technicians and computer staff).\n2. Reward and coercive power: the ability to reward or punish to gain compliance (e.g. Julie Sweet at Accenture using promotions and performance management).\n3. Legitimate power: formal authority accepted as correct without dispute (e.g. armed forces, police, or Elon Musk as CEO of Tesla).\n4. Referent power: people identify with the leader (e.g. David Beckham influencing buyers of Adidas products).","d":"Leadership power: the bases from which a leader influences others (French and Raven, 1959).","w":"Each type differs by its source: knowledge, rewards/punishment, position or personal appeal."},
{"id":"mg5-w4","t":"Styles","wr":true,"q":"Explain five leadership styles.","a":"1. Autocratic (authoritative): 'follow me' approach; centralised authority and decisions; limited participation; may use coercion.\n2. Democratic (participative): substantial participation; frequent consultation; cooperative spirit; develops subordinates.\n3. Laissez-faire (delegative): 'let them do'; passive leader; delegates decisions; works if the team is competent and responsible.\n4. Transactional: 'managerial leadership'; relies on rewards and punishments; emphasises structure and routines; incentives must match company goals.\n5. Transformational: focus on change, the future and people; inspires followers and develops their strengths.","d":"Leadership style: the way a leader directs, involves and motivates people.","w":"Compare the styles by how much participation the leader allows and how they motivate followers."},
{"id":"mg5-w5","t":"Approaches","wr":true,"q":"Explain the five types of leadership on Blake and Mouton's Managerial Grid.","a":"The grid crosses concern for task with concern for relationships:\n1. Impoverished: low task, low relational.\n2. Authority-compliance: high task, low relational.\n3. Country club: low task, high relational.\n4. Team: high task, high relational.\n5. Middle-of-the-road: moderate task, moderate relational.\nIt belongs to the relational approach, which sees leadership as building and maintaining relationships with followers.","d":"Managerial Grid (Robert Blake and Jane Mouton): leadership types based on task and relationship orientation.","w":"Place each type by its two scores: task and relationships."},
{"id":"mg5-w6","t":"Approaches","wr":true,"q":"Compare transactional and transformational leadership (James MacGregor Burns).","a":"Transactional leadership:\n- Leaders promise rewards or punishments to gain support (e.g. promotions and pay raises for meeting goals).\n- Often called managerial leadership; 'give and take'; follows routines and procedures.\n- Can give diminishing returns if employees only work for the reward.\nTransformational leadership:\n- The leader uses communication to raise followers' morale, motivation and performance.\n- Focus on change, the future and people; develops each follower's potential.","d":"Burns compared the traditional transactional model with transformational leadership.","w":"Transactional leaders exchange rewards for effort; transformational leaders inspire people to go beyond the exchange."}
]},
{"id":"mg-ch6","label":"Chapter 6","name":"Employee Motivation","questions":[
{"id":"mg6-01","t":"Meaning","q":"To motivate means to:","o":["Incite, creating a desire or willingness to work","Punish poor performance","Pay the lowest possible wage","Measure actual performance"],"d":"Motivation: to incite; to create a desire to do something or a willingness to work in the way we want.","w":"Motivation is about willingness, which is distinct from the capacity to work."},
{"id":"mg6-02","t":"Meaning","q":"Stephen P. Robbins defines motivation as the process that accounts for an individual's:","o":["Intensity, direction and persistence of effort toward attaining a goal","Salary, bonus and benefits","Skills, knowledge and education","Age, gender and experience"],"d":"Motivation (Robbins): the process that accounts for an individual's intensity, direction and persistence of effort toward a goal.","w":"These three words are also the three elements of motivation."},
{"id":"mg6-03","t":"Elements","q":"Which of these is NOT one of the three elements of motivation?","o":["Capacity","Direction","Intensity","Persistence"],"d":"Elements of motivation: direction, intensity and persistence.","w":"Capacity to work is different from motivation."},
{"id":"mg6-04","t":"Elements","q":"How hard a person tries is the element of:","o":["Intensity","Direction","Persistence","Hygiene"],"d":"Intensity: how hard a person tries; the strength of effort.","w":"Direction is the target, persistence is how long effort lasts."},
{"id":"mg6-05","t":"Elements","q":"What a person wants to achieve, the target they try to 'hit', is the element of:","o":["Direction","Intensity","Persistence","Esteem"],"d":"Direction: what a person wants to achieve or intends to do.","w":"Doing well on a test is the slides' example of direction."},
{"id":"mg6-06","t":"Elements","q":"A man keeps searching for a solution no matter how many times he fails. This shows:","o":["Persistence","Direction","Intensity","Self-esteem"],"d":"Persistence: how long a person can maintain effort until the goal is achieved.","w":"Continuing after repeated failure is the slides' example of persistence."},
{"id":"mg6-07","t":"Objectives","q":"Motivation ensures organisational stability by reducing:","o":["Employee turnover and absenteeism","Productivity","Quality of work","Sense of belonging"],"d":"Objectives of motivation: higher productivity, better quality, urgency, goal-directed behaviour, friendly culture, and stability through lower turnover and absenteeism.","w":"Motivated employees stay and come to work."},
{"id":"mg6-08","t":"Maslow","q":"What is the correct order of Maslow's hierarchy, from lowest to highest?","o":["Physiological, safety, belongingness, self-esteem, self-actualisation","Safety, physiological, self-esteem, belongingness, self-actualisation","Self-actualisation, self-esteem, belongingness, safety, physiological","Physiological, belongingness, safety, self-actualisation, self-esteem"],"d":"Maslow's need hierarchy: five levels of needs, starting with basic survival needs.","w":"Basic survival comes first; self-actualisation is the highest need."},
{"id":"mg6-09","t":"Maslow","q":"Fair wages, water, food and rest breaks at work meet which needs?","o":["Physiological needs","Safety needs","Esteem needs","Self-actualisation needs"],"d":"Physiological needs: basic survival needs such as food, water, air, clothing and shelter.","w":"Wages and basic amenities let employees meet survival needs."},
{"id":"mg6-10","t":"Maslow","q":"Job security, health benefits, safety measures and clear policies meet which needs?","o":["Safety needs","Physiological needs","Belongingness needs","Esteem needs"],"d":"Safety needs: protection from economic and physical dangers, including job security, continuity, order and predictability.","w":"Security and predictability are safety needs."},
{"id":"mg6-11","t":"Maslow","q":"A work culture that helps employees identify with the organization and feel accepted meets which needs?","o":["Belongingness and love (social) needs","Esteem needs","Safety needs","Physiological needs"],"d":"Social needs: affiliation, love, affection, belongingness, acceptance and friendship.","w":"Identifying with the group is about belonging."},
{"id":"mg6-12","t":"Maslow","q":"Challenging assignments, recognition, feedback and participation in decision-making meet which needs?","o":["Esteem needs","Safety needs","Social needs","Physiological needs"],"d":"Esteem needs: the desire to be accepted, valued, respected and admired by others.","w":"Recognition and respect satisfy esteem."},
{"id":"mg6-13","t":"Maslow","q":"An environment that fosters creativity and growth meets which needs?","o":["Self-actualisation needs","Safety needs","Social needs","Physiological needs"],"d":"Self-actualisation: the desire to become what one is capable of becoming, using talents and potential.","w":"Creativity and growth help people reach their full potential."},
{"id":"mg6-14","t":"Taylor","q":"F.W. Taylor is known as the father of:","o":["Scientific management","Human relations","The hierarchy of needs","Theory X and Theory Y"],"d":"Taylor: father of scientific management, with four principles.","w":"Maslow developed the hierarchy and McGregor Theories X and Y."},
{"id":"mg6-15","t":"Taylor","q":"Taylor's theory of motivation is also known as:","o":["The money as a motivator theory","The two-factor theory","The hierarchy of needs","Theory Y"],"d":"Taylor argued money is the main force that motivates employees.","w":"His aim was to improve economic efficiency, especially labour productivity."},
{"id":"mg6-16","t":"Taylor","q":"Which is one of Taylor's four principles of scientific management?","o":["Science, not rule of thumb","Discord, not harmony","Individualism, not cooperation","Rule of thumb, not science"],"d":"Taylor's principles: science not rule of thumb; harmony not discord; cooperation not individualism; development of each person to greatest efficiency.","w":"The distractors reverse his principles."},
{"id":"mg6-17","t":"Herzberg","q":"Herzberg's two-factor theory was based on which research method?","o":["The critical incident method","Laboratory experiments on animals","Financial ratio analysis","Time-and-motion studies only"],"d":"Herzberg (1959) used critical incidents: asking when people felt particularly good or bad about their job.","w":"Good feelings were linked to job content; bad feelings to job context."},
{"id":"mg6-18","t":"Herzberg","q":"Which of these is a MOTIVATION factor in Herzberg's theory?","o":["Recognition","Salary","Working conditions","Company policy"],"d":"Motivators (job content): recognition, advancement, responsibility, achievement, growth, the work itself.","w":"Salary, working conditions and policy are hygiene factors."},
{"id":"mg6-19","t":"Herzberg","q":"Which of these is a HYGIENE (maintenance) factor in Herzberg's theory?","o":["Job security","Achievement","Advancement","Responsibility"],"d":"Hygiene factors (job context): company policy, technical supervision, interpersonal relations, salary, job security, personal life, working conditions, status.","w":"Achievement, advancement and responsibility are motivators."},
{"id":"mg6-20","t":"Herzberg","q":"Under Herzberg's theory, job satisfaction is most likely to improve when which of these is improved?","o":["Opportunities for responsibility","Working conditions","Base salary","Co-worker relationships"],"d":"Motivators improve satisfaction; hygiene factors only prevent dissatisfaction.","w":"Responsibility is a motivator; the others are hygiene factors (slides' MCQ)."},
{"id":"mg6-21","t":"Theory X and Y","q":"According to McGregor, Theory X employees:","o":["Dislike work, avoid responsibility and must be coerced","Like work and seek responsibility","Are highly creative","Direct themselves toward targets"],"d":"Theory X: a negative view; employees are lazy, dislike work and responsibility, and are motivated mainly by money and fear about job security.","w":"The other options describe Theory Y."},
{"id":"mg6-22","t":"Theory X and Y","q":"Theory Y employees are motivated mainly by:","o":["The desire to realise their own potential","Fear of losing their job","Money only","Coercion and threats"],"d":"Theory Y: a positive view; employees like work, seek responsibility, use self-direction and are creative.","w":"Under the right conditions they want to develop themselves."},
{"id":"mg6-23","t":"Theory X and Y","q":"Which statement about creativity is correct in McGregor's theory?","o":["Theory X employees have less creativity; Theory Y employees are highly creative","Both are highly creative","Theory X employees are more creative","Neither shows any creativity"],"d":"Comparison of Theory X and Y: attitude, direction, responsibility, motivation and creativity.","w":"Creativity is low for Theory X and high for Theory Y."},
{"id":"mg6-24","t":"Theories","q":"A CONTENT theory of motivation is most likely to focus on:","o":["Individual needs","Organisational justice","Expectancies about work outcomes","Instrumentalities"],"d":"Content theories (e.g. Maslow, Herzberg) explain WHAT motivates people: their needs.","w":"Expectancies are the focus of process theories (slides' MCQ)."},
{"id":"mg6-25","t":"Meaning","tf":true,"ans":false,"q":"Motivation is the same as the capacity to work.","d":"Motivation creates the willingness to work, which is distinct from the capacity to work.","w":"Someone can be able to do a job but not want to."},
{"id":"mg6-26","t":"Herzberg","tf":true,"ans":true,"q":"Hygiene factors are found in the job context.","d":"Hygiene factors relate to the job context (peripheral aspects); motivators relate to job content.","w":"Herzberg found bad feelings were linked to the job context."},
{"id":"mg6-27","t":"Taylor","tf":true,"ans":false,"q":"According to Taylor, there are many right ways to do each job.","d":"Taylor believed there is only one right way to do each job, and employees are motivated by coercion or money.","w":"Scientific management looks for the one best way."},
{"id":"mg6-28","t":"Maslow","tf":true,"ans":true,"q":"Self-actualisation is the highest level in Maslow's hierarchy of needs.","d":"Maslow's highest need: self-actualisation, becoming what one is capable of becoming.","w":"It sits at the top of the pyramid."},
{"id":"mg6-29","t":"Theory X and Y","tf":true,"ans":true,"q":"Theory Y employees will seek and accept responsibility under the right conditions.","d":"Theory Y: employees seek and accept responsibility, under the right conditions.","w":"Theory X employees avoid responsibility."},
{"id":"mg6-30","t":"Objectives","tf":true,"ans":true,"q":"Motivation helps promote a friendly work culture, morale and a sense of belonging.","d":"Objectives of motivation include a friendly work culture, higher morale, responsibility, belongingness and teamwork.","w":"Motivated employees identify more with the organization."},
{"id":"mg6-w1","t":"Elements","wr":true,"q":"Define motivation and explain its three elements.","a":"Motivation: a force that gives rise to behaviour; creating a desire or willingness to work in the way we want (distinct from the capacity to work).\nRobbins: the process that accounts for an individual's intensity, direction and persistence of effort toward attaining a goal.\nElements:\n1. Direction: what a person wants to achieve; the target (e.g. doing well on a test).\n2. Intensity: how hard a person tries.\n3. Persistence: how long a person maintains effort until the goal is achieved (e.g. continuing to look for a solution after many failures).","d":"Motivation: the process accounting for intensity, direction and persistence of effort toward a goal.","w":"Give the definition, then explain each element with an example."},
{"id":"mg6-w2","t":"Objectives","wr":true,"q":"Explain why motivation is important for organizations.","a":"Motivated employees contribute to:\n1. Higher productivity: they produce more for a given level of resources.\n2. Better quality of work, with less wastage.\n3. A greater sense of urgency: things happen quicker when needed.\n4. Realising organisational objectives through goal-directed behaviour.\n5. A friendly work culture, higher morale, responsibility, belongingness, teamwork and participative decision-making.\n6. Organisational stability by reducing employee turnover and absenteeism.","d":"Objectives of motivation: the benefits motivated employees bring to the organization.","w":"Each objective links motivation to a measurable organisational benefit."},
{"id":"mg6-w3","t":"Maslow","wr":true,"q":"Explain Maslow's hierarchy of needs and how organizations can meet each need.","a":"1. Physiological needs: food, water, air, clothing, shelter. Met by fair wages and basic amenities (water, food, rest breaks).\n2. Safety needs: protection from economic and physical dangers, job security and predictability. Met by safety measures, health benefits, job security and clear policies.\n3. Belongingness and love (social) needs: affiliation, acceptance and friendship. Met by a work culture that helps employees identify with the organization.\n4. Self-esteem needs: being valued, respected and admired. Met by challenging work, feedback, recognition, empowerment and participation in decisions.\n5. Self-actualisation needs: becoming what one is capable of. Met by an environment that fosters creativity and growth.","d":"Maslow's need hierarchy: motivation arises from five levels of needs, from basic to higher-order.","w":"Name each need in order, then give the organisational action that meets it."},
{"id":"mg6-w4","t":"Herzberg","wr":true,"q":"Explain Herzberg's two-factor (motivation-hygiene) theory.","a":"Herzberg (1959) used the critical incident method, asking when people felt particularly good or bad about their job.\n- Good feelings were linked to job content (motivators): recognition, advancement, responsibility, achievement, possibility of growth, the work itself.\n- Bad feelings were linked to job context (hygiene or maintenance factors): company policy and administration, technical supervision, interpersonal relations, salary, job security, personal life, working conditions, status.\nImproving motivators increases satisfaction; improving hygiene factors prevents dissatisfaction.","d":"Two-factor theory: motivators (job content) and hygiene factors (job context).","w":"The key point is that satisfaction and dissatisfaction come from different sets of factors."},
{"id":"mg6-w5","t":"Theory X and Y","wr":true,"q":"Compare McGregor's Theory X and Theory Y employees.","a":"Attitude: X dislike work and avoid it; Y want to work and enjoy it under the right conditions.\nDirection: X must be forced or coerced; Y direct themselves toward accepted targets.\nResponsibility: X avoid responsibility and prefer to be directed; Y seek and accept responsibility.\nMotivation: X are motivated mainly by money and fears about job security; Y by the desire to realise their own potential.\nCreativity: X have less creativity; Y are highly creative.","d":"Theory X: a negative view of employees. Theory Y: a positive view.","w":"Compare the two on the same five points from the slides' table."},
{"id":"mg6-w6","t":"Taylor","wr":true,"q":"Explain Frederick Taylor's theory of motivation and his principles of scientific management.","a":"Taylor is known as the father of scientific management. His four principles:\n1. Science, not rule of thumb.\n2. Harmony, not discord.\n3. Cooperation, not individualism.\n4. Development of each person to their greatest efficiency.\nHis motivation theory is the 'money as a motivator' theory: money is the main force that motivates employees. Its main objective is improving economic efficiency, especially labour productivity. He believed there is only one right way to do each job, and employees are motivated by coercion (threat of firing) or money.","d":"Scientific management: applying scientific methods to find the most efficient way of working.","w":"Link his principles to his belief that money is the main motivator."}
]},
{"id":"mg-ch7","label":"Chapter 7","name":"Communication in Organizations","questions":[
{"id":"mg7-01","t":"Concept","q":"Communication is described as:","o":["A two-way process involving a sender and a receiver","A one-way process from manager to employee","Only written messages","A process that needs no receiver"],"d":"Communication: a two-way, dynamic process with a sender and a receiver; every communication carries a message.","w":"The slides' MCQ also gives 'two-way process' as the answer."},
{"id":"mg7-02","t":"Concept","q":"Robbins says organisational communication involves exchanging and understanding information to promote:","o":["Coordination, decision-making and relationships","Only sales and profits","Secrecy between departments","Individual competition"],"d":"Organisational communication (Robbins, 2014): the exchange and understanding of information within an organization.","w":"Its purpose is coordination, better decisions and relationships."},
{"id":"mg7-03","t":"Process","q":"In the communication process, which step comes right after idea generation?","o":["Encoding the message","Decoding the message","Providing feedback","Receiving the message"],"d":"Steps: idea generation → encoding → choosing the channel → transmission → receiving → decoding → feedback, while addressing noise.","w":"After forming the idea, the sender must put it into words or symbols."},
{"id":"mg7-04","t":"Elements","q":"Converting the sender's thoughts into words, pictures, gestures or symbols is:","o":["Encoding","Decoding","Feedback","Noise"],"d":"Encoding: converting messages into communication symbols the receiver can understand.","w":"Decoding is the receiver translating those symbols back into meaning."},
{"id":"mg7-05","t":"Elements","q":"The receiver interpreting and understanding the encoded message is:","o":["Decoding","Encoding","Transmission","Media"],"d":"Decoding: translating the encoded message into a language the receiver understands.","w":"The slides' MCQ calls it the 're-translation of signals into ideas'."},
{"id":"mg7-06","t":"Elements","q":"The path or channel through which a message is sent, such as email, telephone or face-to-face, is the:","o":["Media","Noise","Feedback","Encoding"],"d":"Media: the path, channel or medium that carries the encoded message.","w":"Media is the carrier of the message."},
{"id":"mg7-07","t":"Elements","q":"The receiver's reaction sent back to the sender, showing the message was received and understood, is:","o":["Feedback","Noise","Encoding","Media"],"d":"Feedback: the reversal of communication; the receiver expresses a reaction to the sender.","w":"Feedback completes the communication loop."},
{"id":"mg7-08","t":"Elements","q":"A poor internet connection, an inattentive receiver and faulty decoding are examples of:","o":["Noise","Feedback","Media","Encoding"],"d":"Noise: any obstruction or hindrance in the communication process, affecting sender, message, media or receiver.","w":"Anything that distorts the message is noise."},
{"id":"mg7-09","t":"Categories","q":"Gestures, facial expressions, glances and smiles are:","o":["Non-verbal communication","Verbal communication","Written communication","Visual communication"],"d":"Non-verbal communication: communication without words, often called body language.","w":"No words are used, so it is non-verbal."},
{"id":"mg7-10","t":"Categories","q":"Signs, typography, graphic design, illustrations and animation are:","o":["Visual communication","Verbal communication","Non-verbal communication","Oral communication"],"d":"Visual communication: using visual elements to convey ideas and information.","w":"These are designed images, not body language."},
{"id":"mg7-11","t":"Categories","q":"According to the slides, written communication is:","o":["More formal but less efficient than oral communication, and useful for legal documents","Less formal than oral communication","Always faster than speaking","Only used for body language"],"d":"Written communication: typically more formal but less efficient than oral; useful for legal documents; e.g. emails and text messages.","w":"Its formality suits records and legal matters."},
{"id":"mg7-12","t":"Business communication","q":"A manager giving instructions to subordinates is:","o":["Downward communication","Upward communication","Horizontal communication","Diagonal communication"],"d":"Downward communication: from superiors to subordinates. Upward: from subordinates to superiors.","w":"The message flows down the hierarchy."},
{"id":"mg7-13","t":"Business communication","q":"A field salesperson communicating directly with the Vice President of HR is:","o":["Diagonal communication","Horizontal communication","Downward communication","External communication"],"d":"Diagonal communication: cuts across hierarchical barriers between different levels and departments.","w":"The slides use exactly this example for diagonal communication."},
{"id":"mg7-14","t":"Business communication","q":"Communication between people working at the same level in an organization is:","o":["Horizontal communication","Upward communication","Diagonal communication","Downward communication"],"d":"Horizontal communication: between persons at the same level.","w":"Neither person is above the other."},
{"id":"mg7-15","t":"Business communication","q":"Communication between an organization and others outside it is:","o":["External communication","Internal communication","Informal communication","Horizontal communication"],"d":"External communication: between the organization and outsiders. Internal: within the organization.","w":"The other party is outside the organization."},
{"id":"mg7-16","t":"Barriers","q":"Low self-confidence, lack of enthusiasm and a mismatch between verbal and non-verbal messages are:","o":["Sender-centric barriers","Receiver-centric barriers","External barriers","Organisational barriers"],"d":"Sender-centric barriers: resistance to change, low confidence, lack of motivation, poor communication skills, verbal/non-verbal mismatch, insufficient training.","w":"These problems start with the person sending the message."},
{"id":"mg7-17","t":"Barriers","q":"Selective perception, prejudice and lack of interest in the topic are:","o":["Receiver-centric barriers","Sender-centric barriers","External barriers","Organisational barriers"],"d":"Receiver-centric barriers: selective perception, unwillingness to change, lack of interest, prejudice and beliefs, personal values, here-and-now factors.","w":"These problems are in the person receiving the message."},
{"id":"mg7-18","t":"Barriers","q":"Venue noise, room temperature, poor timing and technological issues are:","o":["External barriers","Organisational barriers","Sender-centric barriers","Receiver-centric barriers"],"d":"External barriers: environment, limited time or poor timing, technological issues, attitudes of customers, suppliers and competitors.","w":"These come from the surroundings, not the people or the organization's structure."},
{"id":"mg7-19","t":"Barriers","q":"Silos created by functional specialization, rigid policies and a lack of suggestion boxes or meetings are:","o":["Organisational barriers","External barriers","Sender-centric barriers","Receiver-centric barriers"],"d":"Organisational barriers: functional specialization, rigid policies and rules, lack of communication facilities.","w":"They come from how the organization is structured and run."},
{"id":"mg7-20","t":"Overcoming barriers","q":"A manager who stresses punctuality and always arrives on time, setting a clear standard, uses which method?","o":["Communication through actions","Judicious use of the grapevine","Employee orientation","Using proper language"],"d":"Communication through actions: actions speak louder than words; consistency builds trust.","w":"The manager's behaviour reinforces the message."},
{"id":"mg7-21","t":"Overcoming barriers","q":"Avoiding technical terms, words with more than one meaning and difficult symbols is:","o":["Using proper language","Empathetic listening","Employee orientation","Improving interpersonal relations"],"d":"Using proper language: simple, meaningful language to avoid semantic distortion.","w":"Clear words prevent misunderstanding."},
{"id":"mg7-22","t":"Overcoming barriers","q":"Managers using the grapevine without ignoring official channels is:","o":["Judicious use of the grapevine","Communication through actions","Employee orientation","Giving feedback"],"d":"Judicious use of the grapevine: informal channels can help, but official channels must not be ignored.","w":"The grapevine should support, not replace, formal communication."},
{"id":"mg7-23","t":"Effective communication","q":"Which of these is NOT one of the 7Cs of effective communication?","o":["Be creative","Be concise","Be courteous","Be coherent"],"d":"7Cs: be clear, concise, concrete, correct, coherent, complete and courteous.","w":"Creativity is useful, but it is not one of the 7Cs."},
{"id":"mg7-24","t":"Effective communication","q":"Which is a way to communicate effectively, according to the slides?","o":["Adapting your communication style to the listeners","Speaking without checking understanding","Ignoring non-verbal messages","Avoiding feedback"],"d":"How to communicate effectively: active listening, giving and receiving constructive feedback, adapting style to listeners, volume and clarity, understanding non-verbal messages.","w":"The other options are habits that block effective communication."},
{"id":"mg7-25","t":"Concept","tf":true,"ans":false,"q":"Communication is a one-way process.","d":"Communication is a two-way process involving a sender and a receiver.","w":"Feedback from the receiver makes it two-way."},
{"id":"mg7-26","t":"Business communication","tf":true,"ans":true,"q":"Upward communication flows from subordinates to superiors.","d":"Upward communication: subordinates to superiors. Downward: superiors to subordinates.","w":"The message moves up the hierarchy."},
{"id":"mg7-27","t":"Business communication","tf":true,"ans":true,"q":"Informal communication takes place within the formal organization, between its members.","d":"Informal communication: takes place within the formal organization between members; formal communication is official.","w":"It happens alongside official channels, e.g. the grapevine."},
{"id":"mg7-28","t":"Elements","tf":true,"ans":false,"q":"Noise can affect only the receiver.","d":"Noise: a hindrance that may affect the sender, message, media or receiver.","w":"Noise can enter at any point in the process."},
{"id":"mg7-29","t":"Elements","tf":true,"ans":true,"q":"Feedback is important because communication is a two-way process.","d":"Feedback ensures the receiver has received and understood the message.","w":"Without feedback the sender cannot know whether the message was understood."},
{"id":"mg7-30","t":"Effective communication","tf":true,"ans":true,"q":"Effective communication helps mitigate and control conflicts within the organization.","d":"Importance of effective communication: bridges stakeholders, builds relationships, expresses thoughts and goals, improves interactions, controls conflict.","w":"Clear communication prevents misunderstandings that cause conflict."},
{"id":"mg7-w1","t":"Process","wr":true,"q":"Describe the steps in the communication process.","a":"1. Idea generation: the sender identifies the need to communicate and forms the idea.\n2. Encoding: the sender translates the idea into a suitable form (words, symbols).\n3. Choosing the channel: the sender selects the most effective medium.\n4. Transmission: the sender delivers the message through the channel.\n5. Receiving: the receiver gets the message.\n6. Decoding: the receiver interprets and tries to understand it.\n7. Feedback: the receiver responds, completing the loop.\n8. Addressing noise: both parties reduce disruptions for clarity.","d":"Communication process: the sequence of steps by which a message moves from sender to receiver and back.","w":"The process is a loop: feedback returns to the sender."},
{"id":"mg7-w2","t":"Elements","wr":true,"q":"Explain the eight elements of the communication process.","a":"1. Sender: initiates communication using effective verbal and non-verbal techniques.\n2. Message: ideas, feelings, suggestions or orders, oral or written; should be clear.\n3. Encoding: converting the message into symbols (words, pictures, gestures).\n4. Media: the channel carrying the message (face to face, phone, letter, email, internet).\n5. Decoding: translating the symbols into meaning the receiver understands.\n6. Receiver: the recipient (a person, a machine or an audience).\n7. Feedback: the receiver's reaction; confirms understanding.\n8. Noise: any hindrance affecting sender, message, media or receiver (e.g. poor connection, inattentive receiver).","d":"Elements of communication: the parts that make up the communication process.","w":"Define each element briefly and give an example where possible."},
{"id":"mg7-w3","t":"Categories","wr":true,"q":"Explain the four categories of communication.","a":"1. Verbal communication: using words and language, oral or written (speaking, listening, reading, writing).\n2. Written communication: more formal but less efficient than oral; useful for legal documents; e.g. emails and text messages.\n3. Non-verbal communication: without words; body language such as gestures, facial expressions, glances, smiles.\n4. Visual communication: using visual elements such as signs, typography, graphic design, illustration, advertising and animation.","d":"Categories of communication: verbal, written, non-verbal and visual.","w":"Each category differs by the means used to carry the message."},
{"id":"mg7-w4","t":"Business communication","wr":true,"q":"Explain the types of business communication.","a":"- Internal: information flow within the organization.\n- External: between the organization and outsiders.\n- Formal: official communication.\n- Informal: within the formal organization between members (e.g. grapevine).\n- Downward: superiors to subordinates.\n- Upward: subordinates to superiors.\n- Horizontal: between people at the same level.\n- Diagonal: across hierarchical levels and departments (e.g. a field salesperson to the VP of HR).","d":"Business communication: the flow of information within and outside an organization.","w":"Group the types in pairs (internal/external, formal/informal) and by direction of flow."},
{"id":"mg7-w5","t":"Barriers","wr":true,"q":"Explain the four types of communication barriers with examples.","a":"1. Sender-centric: resistance to change, low self-confidence, lack of enthusiasm, poor communication skills, verbal/non-verbal mismatch, insufficient feedback and training.\n2. Receiver-centric: selective perception, unwillingness to change, lack of interest, prejudice and beliefs, personal values, here-and-now factors.\n3. External: environment (venue, noise, temperature), limited or poor timing, technological issues, attitudes of customers, suppliers and competitors.\n4. Organisational: functional specialization creating silos, rigid policies and rules, lack of communication facilities (meetings, suggestion boxes, open-door systems).","d":"Communication barriers: obstacles faced when trying to communicate effectively.","w":"Classify each barrier by where it comes from: sender, receiver, surroundings or organization."},
{"id":"mg7-w6","t":"Overcoming barriers","wr":true,"q":"Explain how managers can overcome communication barriers, and list the 7Cs of effective communication.","a":"Methods:\n1. Employee orientation on objectives, policies, procedures and authority relations.\n2. Improving interpersonal relations: respect subordinates to build trust.\n3. Empathetic listening: let subordinates express feelings.\n4. Using proper language: simple words; avoid technical terms.\n5. Communication through actions: act consistently with your words.\n6. Judicious use of the grapevine alongside official channels.\n7. Giving and using feedback.\n7Cs: be clear, concise, concrete, correct, coherent, complete and courteous.","d":"Personal effectiveness in communication: conveying messages clearly, listening actively and adapting styles for mutual understanding.","w":"Match each method to the barrier it removes, then add the 7Cs as personal guidelines."}
]}
]}
]}</script>

<script id="page-js">
(() => {
"use strict";

// Exact publish skeleton, so a save from this page produces the same document shape the Artifact tool publishes.
const SKELETON = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
const PREAMBLE = [
  '<title>UTAS Course Quizzes</title>',
  '<link rel="preconnect" href="https://fonts.googleapis.com">',
  '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
  '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&display=swap">'
].join("\n");
const CSS_TEXT = document.getElementById("page-css").textContent;
const JS_TEXT = document.getElementById("page-js").textContent;

const DEFAULT_TOPIC = "My questions";
const LETTERS = ["A", "B", "C", "D"];
const PROGRESS_KEY = "quizhub-progress-v1";
const RESULTS_KEY = "quizhub-results-v1";
const ROUTE_KEY = "quizhub-route-v1";
const DRAFT_KEY = "quizhub-draft-v1";
const LOCAL_DATA_KEY = "quizhub-local-data-v1";
const OLD_PROGRESS_KEY = "tourism-ch1-progress-v2";
const WRITTEN_KEY = "quizhub-written-v1";
const LOCAL_ONLY_CODES = ["not_writer", "not_granted", "not_declared", "consent_required", "capability_disabled", "capability_removed"];
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const phoneMQ = window.matchMedia("(max-width: 600px)");
// Tracking: paste the Google Apps Script web app URL between the quotes to turn on student tracking.
const TRACK_URL = "https://script.google.com/macros/s/AKfycbzMBSOn-ZsLvhNwdPRyb1XV_xB_Abj7RBkh_681fWaHqfXapPv-87Ugnle9r4APBsxSfw/exec";

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const lsJSON = k => { try { const r = lsGet(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } };
const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
const str = v => (typeof v === "string" ? v : "");
const clone = o => JSON.parse(JSON.stringify(o));

function validQuestion(q) {
  if (!isObj(q) || typeof q.id !== "string" || typeof q.q !== "string" || !q.q.trim()) return false;
  if (q.wr) return typeof q.a === "string" && !!q.a.trim();
  if (q.tf) return typeof q.ans === "boolean";
  return Array.isArray(q.o) && q.o.length >= 2 && q.o.length <= 4 && q.o.every(s => typeof s === "string" && s);
}
function parseData(raw) {
  const courses = (isObj(raw) && Array.isArray(raw.courses) ? raw.courses : [])
    .filter(c => isObj(c) && typeof c.id === "string" && typeof c.name === "string")
    .map(c => ({
      id: c.id, name: c.name, sub: str(c.sub),
      chapters: (Array.isArray(c.chapters) ? c.chapters : [])
        .filter(ch => isObj(ch) && typeof ch.id === "string" && typeof ch.name === "string")
        .map(ch => ({
          id: ch.id, label: str(ch.label), name: ch.name,
          questions: (Array.isArray(ch.questions) ? ch.questions : []).filter(validQuestion)
        }))
    }));
  return { courses };
}

let BASE = { courses: [] };   // questions built into the page
try { BASE = parseData(JSON.parse(document.getElementById("bank").textContent)); } catch (e) {}
const REMOTE_KEY = "quizhub-remote-ops-v1";
let REMOTE_OPS = [];          // chapters and questions the owner added or deleted on the site
let SHARED = BASE;            // BASE with REMOTE_OPS applied: what every visitor sees
let pendingHash = "";
const localSaved = lsJSON(LOCAL_DATA_KEY);
let usingLocal = isObj(localSaved) && isObj(localSaved.data) && Array.isArray(localSaved.data.courses);
let DATA = usingLocal ? parseData(localSaved.data) : SHARED;

let OPS = [];       // unsaved changes: addQ, delQ, addCh, delCh
let PROG = {};      // quiz progress per chapter id
let RESULTS = {};   // last full-quiz score per chapter id
let route = { course: null, chapter: null, view: "quiz", tab: "chapters" };
let CH = null;      // the saved chapter being viewed
let byId = new Map();
let S = null;       // quiz progress for CH
let W = null;       // written practice progress for CH
let WPROG = {};     // written practice progress per chapter id
let saving = false;
let barMsg = "", barTimer = null;
let restartArmed = false, discardArmed = false, delChArmed = false;
let filterText = "", lastTopic = "";
let root, topEl, app;

const artifactP = (window.claude && typeof window.claude.use === "function")
  ? Promise.resolve(window.claude.use("artifact")).catch(() => null)
  : Promise.resolve(null);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
// Time in minutes and seconds, e.g. "4m 05s".
const fmtDur = secs => { secs = Math.max(0, Math.round(Number(secs) || 0)); return Math.floor(secs / 60) + "m " + pad(secs % 60) + "s"; };
const topicOf = q => q.t || DEFAULT_TOPIC;
const topicList = qs => qs.reduce((a, q) => (a.includes(topicOf(q)) ? a : a.concat(topicOf(q))), []);
const correctOf = q => (q.wr ? q.a : q.tf ? (q.ans ? "True" : "False") : q.o[0]);
const correct = id => correctOf(byId.get(id));
const isRight = id => S.answers[id] === correct(id);
const quizQs = ch => (ch ? ch.questions.filter(q => !q.wr) : []);
const writtenQs = ch => (ch ? ch.questions.filter(q => q.wr) : []);
const numOf = id => quizQs(CH).findIndex(q => q.id === id) + 1;
const wNumOf = id => writtenQs(CH).findIndex(q => q.id === id) + 1;
const allIds = () => quizQs(CH).map(q => q.id);
const allWIds = () => writtenQs(CH).map(q => q.id);
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const makeOpts = q => (q.tf ? ["True", "False"] : shuffle(q.o));

/* ---------- Courses, chapters and unsaved changes ---------- */
const findCourse = (data, id) => data.courses.find(c => c.id === id) || null;
function findChapter(data, id) {
  for (const c of data.courses) { const ch = c.chapters.find(x => x.id === id); if (ch) return { course: c, chapter: ch }; }
  return null;
}
const hasQuestion = (data, qid) => data.courses.some(c => c.chapters.some(ch => ch.questions.some(q => q.id === qid)));
function applyOp(d, o) {
  if (o.op === "addCh") { const c = findCourse(d, o.course); if (c && !findChapter(d, o.ch.id)) c.chapters.push(clone(o.ch)); }
  else if (o.op === "delCh") d.courses.forEach(c => { c.chapters = c.chapters.filter(ch => ch.id !== o.ch); });
  else if (o.op === "addQ") { const f = findChapter(d, o.ch); if (f && !f.chapter.questions.some(q => q.id === o.q.id)) f.chapter.questions.push(clone(o.q)); }
  else if (o.op === "delQ") { const f = findChapter(d, o.ch); if (f) f.chapter.questions = f.chapter.questions.filter(q => q.id !== o.id); }
}
function applyOps(data, ops) {
  const d = clone(data);
  ops.forEach(o => applyOp(d, o));
  return d;
}
const effective = () => applyOps(DATA, OPS);
const chapterRef = id => findChapter(effective(), id) || findChapter(DATA, id);
const isNewChapter = id => OPS.some(o => o.op === "addCh" && o.ch.id === id);
const isDeletingChapter = id => OPS.some(o => o.op === "delCh" && o.ch === id);
// Drop draft changes that no longer apply (already saved, or their target is gone).
function cleanOps(raw) {
  const out = [];
  (Array.isArray(raw) ? raw : []).forEach(o => {
    if (!isObj(o)) return;
    if (o.op === "addCh") {
      if (isObj(o.ch) && typeof o.ch.id === "string" && typeof o.ch.name === "string" && findCourse(DATA, o.course) && !findChapter(DATA, o.ch.id))
        out.push({ op: "addCh", course: o.course, ch: { id: o.ch.id, label: str(o.ch.label), name: o.ch.name, questions: [] } });
    } else if (o.op === "delCh") {
      if (findChapter(DATA, o.ch)) out.push({ op: "delCh", ch: o.ch });
    } else if (o.op === "addQ") {
      const target = findChapter(DATA, o.ch) || out.some(x => x.op === "addCh" && x.ch.id === o.ch);
      if (validQuestion(o.q) && !hasQuestion(DATA, o.q.id) && target) out.push({ op: "addQ", ch: o.ch, q: o.q });
    } else if (o.op === "delQ") {
      const f = findChapter(DATA, o.ch);
      if (f && f.chapter.questions.some(q => q.id === o.id)) out.push({ op: "delQ", ch: o.ch, id: o.id });
    }
  });
  return out;
}
// Keep only well-formed shared edits that still fit the built-in questions, in order.
function cleanRemote(raw) {
  const d = clone(BASE), out = [];
  (Array.isArray(raw) ? raw : []).forEach(o => {
    if (!isObj(o)) return;
    let op = null;
    if (o.op === "addCh" && isObj(o.ch) && typeof o.ch.id === "string" && typeof o.ch.name === "string" && findCourse(d, o.course) && !findChapter(d, o.ch.id))
      op = { op: "addCh", course: o.course, ch: { id: o.ch.id, label: str(o.ch.label), name: o.ch.name, questions: [] } };
    else if (o.op === "delCh" && findChapter(d, o.ch)) op = { op: "delCh", ch: o.ch };
    else if (o.op === "addQ" && validQuestion(o.q) && findChapter(d, o.ch) && !hasQuestion(d, o.q.id)) op = { op: "addQ", ch: o.ch, q: o.q };
    else if (o.op === "delQ" && typeof o.id === "string" && findChapter(d, o.ch)) op = { op: "delQ", ch: o.ch, id: o.id };
    if (op) { out.push(op); applyOp(d, op); }
  });
  return { ops: out, data: d };
}
function setRemote(ops) {
  const r = cleanRemote(ops);
  REMOTE_OPS = r.ops;
  SHARED = r.data;
  if (REMOTE_OPS.length) lsSet(REMOTE_KEY, JSON.stringify(REMOTE_OPS)); else lsDel(REMOTE_KEY);
}
// Load the owner's latest saved edits so every visitor sees the same chapters and questions.
async function refreshContent() {
  let d;
  try { d = await adminPost({ action: "content" }); } catch (e) { return; }
  if (!d || !d.ok || !Array.isArray(d.ops)) return;
  const before = JSON.stringify(REMOTE_OPS);
  setRemote(d.ops);
  if (JSON.stringify(REMOTE_OPS) !== before && !usingLocal && !saving) applyData(SHARED, false);
  if (pendingHash && !route.chapter && !adminMode && chapterRef(pendingHash)) openChapter(pendingHash);
  pendingHash = "";
}
// Only the site owner, signed in on the Admin page in this tab, can add or delete chapters and questions.
const canEdit = () => !!(TRACK_URL && ADMIN.key);
const saveDraft = () => { if (canEdit()) (OPS.length ? lsSet(DRAFT_KEY, JSON.stringify(OPS)) : lsDel(DRAFT_KEY)); };

/* ---------- Quiz rounds ---------- */
function makeRound(ids, label, shuffleOrder) {
  const order = shuffleOrder ? shuffle(ids) : ids.slice();
  const opts = {};
  order.forEach(id => { opts[id] = makeOpts(byId.get(id)); });
  return { order, idx: 0, answers: {}, opts, phase: "quiz", label };
}
function newRound(ids, label, o = {}) {
  S = ids.length ? makeRound(ids, label, o.shuffle) : null;
  restartArmed = false;
  renderAll();
  if (o.focus) { scrollToApp(); focusQuestion(); }
}
// Keep saved progress in step with the chapter's current questions.
function reconcileRound() {
  if (!S || !Array.isArray(S.order) || !isObj(S.answers) || !isObj(S.opts)) { S = null; return; }
  const curId = S.order[S.idx];
  S.order = S.order.filter(id => typeof id === "string" && byId.has(id));
  if (!S.order.length) { S = null; return; }
  S.order.forEach(id => {
    const q = byId.get(id), o = S.opts[id];
    if (!Array.isArray(o) || !o.includes(correctOf(q)) || o.length !== (q.tf ? 2 : q.o.length)) {
      S.opts[id] = makeOpts(q); delete S.answers[id];
    }
  });
  let i = S.order.indexOf(curId);
  if (i < 0) i = S.order.findIndex(id => S.answers[id] === undefined);
  if (i < 0) { S.phase = "results"; i = S.order.length - 1; }
  else if (S.phase === "results" && S.order.some(id => S.answers[id] === undefined)) S.phase = "quiz";
  if (S.phase !== "quiz" && S.phase !== "results") S.phase = "quiz";
  S.idx = i;
  if (typeof S.label !== "string") S.label = "Full quiz";
}
function bindChapter() {
  const f = route.chapter ? findChapter(DATA, route.chapter) : null;
  CH = f ? f.chapter : null;
  byId = new Map((CH ? CH.questions : []).map(q => [q.id, q]));
  S = CH && isObj(PROG[CH.id]) ? PROG[CH.id] : null;
  W = CH && isObj(WPROG[CH.id]) ? WPROG[CH.id] : null;
  if (!CH) return;
  reconcileRound();
  if (!S && allIds().length) S = makeRound(allIds(), "Full quiz", false);
  reconcileWritten();
}
const newWritten = ids => ({ order: ids.slice(), idx: 0, marks: {}, shown: {}, notes: {}, phase: "write" });
// Keep saved written practice in step with the chapter's current written questions.
function reconcileWritten() {
  const ids = allWIds();
  if (!ids.length) { W = null; return; }
  if (!W || !Array.isArray(W.order) || !isObj(W.marks) || !isObj(W.notes) || !isObj(W.shown)) W = null;
  if (W) {
    const cur = W.order[W.idx];
    W.order = W.order.filter(id => ids.includes(id));
    if (!W.order.length) W = null;
    else {
      let i = W.order.indexOf(cur);
      if (i < 0) i = W.order.findIndex(id => W.marks[id] === undefined);
      if (i < 0) { W.phase = "results"; i = W.order.length - 1; }
      else if (W.phase === "results" && W.order.some(id => W.marks[id] === undefined)) W.phase = "write";
      if (W.phase !== "write" && W.phase !== "results") W.phase = "write";
      W.idx = i;
    }
  }
  if (!W) W = newWritten(ids);
}
function saveProgress() {
  if (CH) {
    if (S) PROG[CH.id] = S; else delete PROG[CH.id];
    if (W) WPROG[CH.id] = W; else delete WPROG[CH.id];
  }
  userSet(PROGRESS_KEY, JSON.stringify(PROG));
  userSet(WRITTEN_KEY, JSON.stringify(WPROG));
}
function pruneStored() {
  Object.keys(PROG).forEach(id => { if (!findChapter(DATA, id)) delete PROG[id]; });
  Object.keys(RESULTS).forEach(id => { if (!findChapter(DATA, id)) delete RESULTS[id]; });
  Object.keys(WPROG).forEach(id => { if (!findChapter(DATA, id)) delete WPROG[id]; });
  userSet(WRITTEN_KEY, JSON.stringify(WPROG));
  userSet(PROGRESS_KEY, JSON.stringify(PROG));
  userSet(RESULTS_KEY, JSON.stringify(RESULTS));
}
// Remember the score of a finished full-length round for the chapter card.
function recordResult() {
  if (!CH || !S || S.phase !== "results" || S.order.length !== allIds().length) return;
  const got = S.order.filter(isRight).length;
  RESULTS[CH.id] = { pct: Math.round(got / S.order.length * 100), got, n: S.order.length, at: Date.now(), secs: Math.round((S.ms || 0) / 1000) };
  userSet(RESULTS_KEY, JSON.stringify(RESULTS));
}

/* ---------- Saving ---------- */
function dataJSON(d) {
  const head = (o, key) => JSON.stringify(o).slice(0, -1) + ',"' + key + '":[';
  return '{"courses":[\n' + d.courses.map(c =>
    head({ id: c.id, name: c.name, sub: c.sub }, "chapters") + "\n" +
    c.chapters.map(ch =>
      head({ id: ch.id, label: ch.label, name: ch.name }, "questions") + "\n" +
      ch.questions.map(q => JSON.stringify(q)).join(",\n") + "\n]}"
    ).join(",\n") + "\n]}"
  ).join(",\n") + "\n]}";
}
function buildDocument(data) {
  const json = dataJSON(data).replace(/</g, "\\u003c");
  return SKELETON + "\n" + PREAMBLE + '\n<style id="page-css">' + CSS_TEXT + "</style>\n\n" +
    '<div id="root" class="wrap"></div>\n\n' +
    '<script type="application/json" id="bank">' + json + "<\/script>\n\n" +
    '<script id="page-js">' + JS_TEXT + "<\/script>\n\n</body></html>";
}
function applyData(newData, clearOps) {
  DATA = newData;
  OPS = clearOps ? [] : cleanOps(OPS);
  saveDraft();
  pruneStored();
  if (route.chapter && !chapterRef(route.chapter)) { route.chapter = null; route.view = "quiz"; }
  if (!findCourse(effective(), route.course)) route.course = (effective().courses[0] || {}).id || null;
  bindChapter();
  renderAll();
}
function commitLocal(newData, msg) {
  lsSet(LOCAL_DATA_KEY, JSON.stringify({ data: newData, savedAt: Date.now() }));
  usingLocal = true;
  saving = false;
  applyData(newData, true);
  setBarMsg(msg);
}
async function saveChanges() {
  if (saving || !OPS.length || !canEdit()) return;
  const ops = OPS.slice();
  saving = true; discardArmed = false;
  setBarMsg("Saving your changes for everyone…", false);
  try {
    const d = await adminPost({ action: "saveContent", key: ADMIN.key, ops });
    if (!d || !d.ok) throw new Error((d && d.error) || "error");
    setRemote(REMOTE_OPS.concat(ops));
    saving = false;
    if (usingLocal) { lsDel(LOCAL_DATA_KEY); usingLocal = false; }
    applyData(SHARED, true);
    setBarMsg("Saved. Everyone who opens the site now sees your changes.");
  } catch (err) {
    saving = false;
    if (err && err.message === "wrong password") {
      ADMIN.key = ""; ADMIN.rows = null; ssDel("quizhub-admin-key");
